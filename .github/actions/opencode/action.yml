name: "Run opencode"
description: "Install the pinned, checksummed opencode CLI and run it (replaces the flaky composite action, see PR #23)"

inputs:
  model:
    description: "Model to use"
    required: true
  share:
    description: "Share the opencode session"
    required: false
    default: "false"
  prompt:
    description: "Custom prompt (optional; defaults per event type)"
    required: false
  agent:
    description: "Agent to use (optional)"
    required: false
  variant:
    description: "Model variant (optional)"
    required: false
  mentions:
    description: "Trigger phrases (optional; defaults to /opencode,/oc)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Cache opencode
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.opencode/bin
        key: opencode-${{ runner.os }}-${{ runner.arch }}-v1.18.25

    - name: Install opencode v1.18.25
      # Pin: bump version in this step AND the cache key above, and refresh the
      # sha256. linux-x64 artifact only — fails loudly if runs-on changes arch.
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/oc.tar.gz" \
          https://github.com/anomalyco/opencode/releases/download/v1.18.25/opencode-linux-x64.tar.gz
        echo "58a3729a6f3432dd6d2917fcc4a949788891a035818646ad480e12c947f56e78  $RUNNER_TEMP/oc.tar.gz" | sha256sum -c -
        mkdir -p "$HOME/.opencode/bin"
        tar -xzf "$RUNNER_TEMP/oc.tar.gz" -C "$HOME/.opencode/bin"

    - name: Run opencode
      # Absolute path: the pin must not be bypassable via PATH order.
      shell: bash
      run: |
        "$HOME/.opencode/bin/opencode" github run
      env:
        MODEL: ${{ inputs.model }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        AGENT: ${{ inputs.agent }}
        VARIANT: ${{ inputs.variant }}
        MENTIONS: ${{ inputs.mentions }}
