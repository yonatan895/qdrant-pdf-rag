name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: refuse committed PDFs
        run: |
          if git ls-files | grep -Ei '\.(pdf|pdx|idx)$'; then
            echo "PDFs/Adobe catalogs must not be in git" >&2
            exit 1
          fi
      - run: pip install -e ".[dev]"
      - run: pytest -q
