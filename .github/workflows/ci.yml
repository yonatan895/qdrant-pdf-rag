name: ci
on:
  pull_request:
  schedule:
    - cron: "11 4 * * *" # nightly on main, UTC, off the hour (replaces the push run)
  workflow_dispatch:

permissions:
  contents: read

# PR runs: one per ref, superseded runs cancelled. Schedule and dispatch runs on
# main share one group (`ci-main`) that never cancels a running job: one main
# run in flight, the newest pending one wins, so they queue behind PR feedback.
# A dispatch on another branch gets its own per-ref group.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'ci-main' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lanes: ${{ steps.profile.outputs.lanes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # The selector runs repository code: pin its interpreter, never the image's python3 (#1118).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - id: profile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXECUTION_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/review_tooling.py profile --base "$BASE_SHA" --head "$EXECUTION_SHA"
          --out "$RUNNER_TEMP/dispatch-manifest.json" --github-output "$GITHUB_OUTPUT"

  # Deterministic lint and typechecking gate (#370): runs in parallel with test,
  # ensuring code hygiene, formatting, and typing without relying solely on the reviewer.
  lint:
    needs: select
    if: contains(fromJSON(needs.select.outputs.lanes), 'lint_and_types')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - run: python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse .tools/python-wheels/dev --connected --download-workers 8
        timeout-minutes: 4
      - name: Run lint and types with execution evidence
        run: |
          python scripts/ci_evidence.py --lane lint_and_types --job-name lint --output "$RUNNER_TEMP/evidence-lint" -- bash -e -c '
            ruff check src tests scripts/eval_retrieval.py scripts/review_tooling.py scripts/ci_evidence.py scripts/acceptance_evidence.py scripts/devkit_key.py scripts/devkit/isolation_proof.py scripts/devkit/issue_snapshot.py scripts/extension_surface.py scripts/gitlab_lanes.py scripts/release_archive.py scripts/gap/ci_status.py
            mypy src
            mypy --follow-imports=silent scripts/eval_retrieval.py scripts/review_tooling.py scripts/ci_evidence.py scripts/acceptance_evidence.py scripts/devkit_key.py scripts/devkit/isolation_proof.py scripts/devkit/issue_snapshot.py scripts/extension_surface.py scripts/gitlab_lanes.py scripts/release_archive.py scripts/gap/ci_status.py
          '
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-lint-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-lint
          if-no-files-found: error

  # Unit gate: hygiene (no PDFs in git) + hermetic pytest. The simulation
  # tier is deselected via pyproject addopts, so this job never needs docker.
  unit:
    needs: select
    if: contains(fromJSON(needs.select.outputs.lanes), 'unit_tests')
    name: unit (${{ matrix.shard }}/8)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TASK_CONTRACTS_REQUIRE_RUNNER: "1"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0; Python packages use the target hash lock below
        with:
          python-version: "3.14.8"
      - name: refuse committed PDFs
        run: |
          if git ls-files | grep -Ei '\.(pdf|pdx|idx)$'; then
            echo "PDFs/Adobe catalogs must not be in git" >&2
            exit 1
          fi
      - run: python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse .tools/python-wheels/dev --connected --download-workers 8
        timeout-minutes: 4
      - name: Install pinned Task runner for required contract tests
        run: sh scripts/tools/install-task.sh
      - name: Install checksum-pinned Helm for deployment render tests
        run: |
          sh scripts/tools/install-helm.sh
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Verify prepared unit prerequisites before collection
        run: python scripts/agent_doctor.py --python "$(command -v python)"
      - name: Run unit shard
        run: >-
          python scripts/ci_evidence.py --lane unit_tests --job-name 'unit (${{ matrix.shard }}/8)'
          --output "$RUNNER_TEMP/evidence-unit-${{ matrix.shard }}" --junit "$RUNNER_TEMP/unit-${{ matrix.shard }}.xml"
          --unit-shard=${{ matrix.shard }} --unit-shards=8 --unit-durations tests/unit-durations.json
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-unit-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-unit-${{ matrix.shard }}
          if-no-files-found: error

  # Preserve the existing required status name; a failed, cancelled or skipped
  # shard must not turn into a successful aggregate.
  test:
    needs: [select, unit]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require all eight unit shards
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          UNIT_REQUIRED: ${{ contains(fromJSON(needs.select.outputs.lanes || '[]'), 'unit_tests') }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          test "$SELECT_RESULT" = success
          if test "$UNIT_REQUIRED" = true; then
            test "$UNIT_RESULT" = success
          fi

  hazards:
    needs: select
    if: contains(fromJSON(needs.select.outputs.lanes), 'hazards')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - run: python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse .tools/python-wheels/dev --connected --download-workers 8
        timeout-minutes: 4
      - run: sh scripts/tools/install-task.sh
      - run: sh scripts/tools/install-helm.sh
      - name: Execute critical historical mutations
        run: >-
          python scripts/ci_evidence.py --lane hazards --job-name hazards
          --output "$RUNNER_TEMP/evidence-hazards" --result-json "$RUNNER_TEMP/critical-hazards/report.json" --
          sh scripts/tools/run-task.sh qa:hazards PY="$(command -v python)" OUT="$RUNNER_TEMP/critical-hazards" WORKERS=4
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-hazards-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-hazards
          if-no-files-found: error
      - name: Retain exact candidate and behavioral evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: critical-hazards
          path: ${{ runner.temp }}/critical-hazards
          if-no-files-found: error

  # Simulation tier (marker 'integration', excluding the load tier):
  # real PDFs -> real ingest -> a real Qdrant server (the images.txt pin,
  # auto-started docker container) -> agent endpoints over the real app.
  # The model is the deterministic mock. BM25 weights are fetched and
  # verified against the in-repo sha256 manifest so the vLLM-shaped
  # prod-embed variant runs instead of skipping. The job is fail-closed:
  # missing docker, a skip, or zero passes must fail, not go green.
  # The load tier (tests/test_load_tier.py) runs only in its own lane
  # (`sh scripts/tools/run-task.sh qa:load`, .github/workflows/load.yml),
  # so its absolute concurrency contracts are asserted exactly once.
  # GitHub-only: air-gap GitLab runners cannot pull Docker Hub (AGENTS.md).
  sim:
    needs: select
    if: contains(fromJSON(needs.select.outputs.lanes), 'simulation')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0; Python packages use the target hash lock below
        with:
          python-version: "3.14.8"
      - name: docker must be present (the tier skips without it — skip is failure here)
        run: docker version
      - run: python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse .tools/python-wheels/dev --connected --download-workers 8
        timeout-minutes: 4
      - name: Prepare approved Qdrant image explicitly
        run: python scripts/qdrant_pin.py --prepare
      # tests/test_openwebui_proxy_nginx.py starts it with --pull=never and fails when it is missing (#1118 A5).
      - name: Prepare the pinned allow-list proxy image explicitly (images.txt nginx-unprivileged digest)
        run: |
          row=$(awk '$1 ~ /^docker\.io\/nginxinc\/nginx-unprivileged:/ {print $1 " " $2; exit}' images.txt)
          ref=${row%% *}; digest=${row#* }
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "no nginx-unprivileged digest in images.txt" >&2; exit 1 ;; esac
          docker pull -q "${ref%:*}@$digest"
      - run: sh scripts/tools/install-task.sh
      - run: sh scripts/tools/install-helm.sh
      - run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: fetch + verify BM25 weights (vLLM-shaped embed variant)
        run: |
          python scripts/fetch_bm25_weights.py --out "$RUNNER_TEMP/bm25" \
            --verify-manifest bm25-weights.sha256
          echo "SIM_BM25_CACHE_DIR=$RUNNER_TEMP/bm25" >> "$GITHUB_ENV"
      - name: Verify prepared simulation inputs before collection
        run: python scripts/agent_doctor.py --profile sim --python "$(command -v python)"
      - name: run the simulation tier (fail closed — no skips, at least one pass)
        run: |
          set -o pipefail
          python scripts/ci_evidence.py --lane simulation --job-name sim --output "$RUNNER_TEMP/evidence-sim" --junit "$RUNNER_TEMP/sim.xml" -- \
            python scripts/sim_parallel.py --shards 3 --junit "$RUNNER_TEMP/sim.xml" -- \
            python -m pytest -m integration --ignore=tests/test_load_tier.py --ignore=tests/test_ha_cluster.py -v -rs 2>&1 | tee sim-output.txt
          if grep -qE '[1-9][0-9]* skipped' sim-output.txt; then
            echo "simulation tests were skipped — coverage must not silently vanish" >&2
            exit 1
          fi
          grep -qE '[1-9][0-9]* passed' sim-output.txt || {
            echo "no simulation tests passed — the tier did not run" >&2
            exit 1
          }
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-sim-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-sim
          if-no-files-found: error

  # Retrieval evaluation gate: runs in hash mode against scripts/qdrant_sim.py
  # using an original synthetic corpus generated at runtime (CPU-only).
  # Compares against evals/baseline.json and posts a delta table comment on PRs.
  gate-l1:
    needs: select
    if: contains(fromJSON(needs.select.outputs.lanes), 'gate_l1')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - name: docker must be present for qdrant_sim
        run: docker version
      - run: python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse .tools/python-wheels/dev --connected --download-workers 8
        timeout-minutes: 4
      - name: Prepare approved Qdrant image explicitly
        run: python scripts/qdrant_pin.py --prepare
      - name: run L1 retrieval gate
        run: |
          python scripts/ci_evidence.py --lane gate_l1 --job-name gate-l1 --output "$RUNNER_TEMP/evidence-gate-l1" --result-json eval-report.json -- \
            python scripts/gate_l1.py \
            --out eval-report.json \
            --summary eval-summary.md \
            --delta eval-delta.md
      - name: post PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('eval-delta.md') != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('eval-delta.md', 'utf8');
            const pr = context.payload.pull_request;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const attribution = `Historical L1 report; not merge approval.\n\nHead: ${pr.head.sha}\nBase: ${pr.base.sha}\nExecution: ${context.sha}\nJob: gate-l1\nRun: ${runUrl}`;
            // Append an attributable run record. Never locate or replace another
            // author's comment using a freely copyable marker.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- gate-l1-report -->\n${attribution}\n\n${body}`,
            });
      - name: upload eval artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: gate-l1-artifacts
          path: |
            eval-report.json
            eval-summary.md
            eval-delta.md
          if-no-files-found: ignore
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-gate-l1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-gate-l1
          if-no-files-found: error

  eval-retrieval:
    needs: select
    if: contains(fromJSON(needs.select.outputs.lanes), 'eval_retrieval')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - name: docker must be present for qdrant_sim
        run: docker version
      - run: python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse .tools/python-wheels/dev --connected --download-workers 8
        timeout-minutes: 4
      - name: Prepare approved Qdrant image explicitly
        run: python scripts/qdrant_pin.py --prepare
      - name: run L1 retrieval eval with native evidence
        run: |
          python scripts/ci_evidence.py --lane eval_retrieval --job-name eval-retrieval --output "$RUNNER_TEMP/evidence-eval-retrieval" --result-json eval-report.json -- \
            python scripts/gate_l1.py \
            --out eval-report.json \
            --summary eval-summary.md \
            --delta eval-delta.md
      - name: upload eval artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: eval-retrieval-artifacts
          path: |
            eval-report.json
            eval-summary.md
            eval-delta.md
          if-no-files-found: ignore
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-eval-retrieval-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-eval-retrieval
          if-no-files-found: error

  # Runner-image canary (#1118, decision D1). Every other job pins ubuntu-26.04;
  # this one alone follows ubuntu-latest, so the next image move shows up here
  # before the pin moves. Non-blocking: continue-on-error, no evidence artifact,
  # not an acceptance producer. `runner-canary` must never be a required check.
  runner-canary:
    needs: select
    if: contains(fromJSON(needs.select.outputs.lanes), 'unit_tests')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TASK_CONTRACTS_REQUIRE_RUNNER: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Report the image ubuntu-latest resolves to
        run: |
          echo "ubuntu-latest is ${ImageOS:-unknown} ${ImageVersion:-unknown}; pinned jobs use ubuntu26"
          echo "- runner canary image: \`${ImageOS:-unknown} ${ImageVersion:-unknown}\` (pinned: ubuntu26)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${ImageOS:-}" != ubuntu26 ]; then
            echo "::warning title=Runner image moved::ubuntu-latest is ${ImageOS:-unknown}, not the pinned ubuntu-26.04. Read this job's smoke result before moving the pin."
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - run: python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse .tools/python-wheels/dev --connected --download-workers 8
        timeout-minutes: 4
      - run: sh scripts/tools/install-task.sh
      - run: |
          sh scripts/tools/install-helm.sh
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - run: python scripts/agent_doctor.py --python "$(command -v python)"
      - name: Unit smoke on the moving image (one fast shard, no evidence)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p anyio.pytest_plugin -p tests.ci_shard
          --unit-shard=2 --unit-shards=8 --unit-durations=tests/unit-durations.json
