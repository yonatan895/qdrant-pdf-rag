name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # Unit gate: hygiene (no PDFs in git) + hermetic pytest. The simulation
  # tier is deselected via pyproject addopts, so this job never needs docker.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (the pin does not cover pip installs below — they resolve from PyPI at run time)
        with:
          python-version: "3.14"
      - name: refuse committed PDFs
        run: |
          if git ls-files | grep -Ei '\.(pdf|pdx|idx)$'; then
            echo "PDFs/Adobe catalogs must not be in git" >&2
            exit 1
          fi
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Simulation tier (tests/test_integration_sim.py, marker 'integration'):
  # real PDFs -> real ingest -> a real Qdrant server (the images.txt pin,
  # auto-started docker container) -> agent endpoints over the real app.
  # The model is the deterministic mock. BM25 weights are fetched and
  # verified against the in-repo sha256 manifest so the vLLM-shaped
  # prod-embed variant runs instead of skipping. The job is fail-closed:
  # missing docker, a skip, or zero passes must fail, not go green.
  # GitHub-only: air-gap GitLab runners cannot pull Docker Hub (AGENTS.md).
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (the pin does not cover pip installs / model fetch below — resolved from PyPI/HF at run time)
        with:
          python-version: "3.14"
      - name: docker must be present (the tier skips without it — skip is failure here)
        run: docker version
      - run: pip install -e ".[dev]"
      - name: fetch + verify BM25 weights (vLLM-shaped embed variant)
        run: |
          python scripts/fetch_bm25_weights.py --out "$RUNNER_TEMP/bm25" \
            --verify-manifest bm25-weights.sha256
          echo "SIM_BM25_CACHE_DIR=$RUNNER_TEMP/bm25" >> "$GITHUB_ENV"
      - name: run the simulation tier (fail closed — no skips, at least one pass)
        run: |
          set -o pipefail
          pytest -m integration -v -rs 2>&1 | tee sim-output.txt
          if grep -qE '[1-9][0-9]* skipped' sim-output.txt; then
            echo "simulation tests were skipped — coverage must not silently vanish" >&2
            exit 1
          fi
          grep -qE '[1-9][0-9]* passed' sim-output.txt || {
            echo "no simulation tests passed — the tier did not run" >&2
            exit 1
          }

  # Retrieval evaluation gate: runs in hash mode against scripts/qdrant_sim.py
  # using an original synthetic corpus generated at runtime (CPU-only).
  # Compares against evals/baseline.json and posts a delta table comment on PRs.
  gate-l1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: docker must be present for qdrant_sim
        run: docker version
      - run: pip install -c requirements.lock.txt -e ".[dev]"
      - name: run L1 retrieval gate
        run: |
          python scripts/gate_l1.py \
            --out eval-report.json \
            --summary eval-summary.md \
            --delta eval-delta.md
      - name: post PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('eval-delta.md') != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('eval-delta.md', 'utf8');
            const header = '<!-- gate-l1-report -->';
            const commentBody = `${header}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const botComment = comments.find(c => c.body.includes(header));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
      - name: upload eval artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: gate-l1-artifacts
          path: |
            eval-report.json
            eval-summary.md
            eval-delta.md
          if-no-files-found: ignore
