name: opencode

# Disabled: opencode out of quota. Preserved for workflow_dispatch or future re-enablement.
on:
  workflow_dispatch:

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event.comment.user.type != 'Bot' &&
        (
          contains(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, '/opencode')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD" != "$REPO" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  opencode:
    needs: gate
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: opencode-comment-${{ github.event.comment.id || github.run_id }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Install steps are deliberately duplicated per job, not a local
      # composite action: opencode may move the working tree mid-run (it
      # checks out refs to diff), and local actions re-resolve action.yml
      # from disk in their post phase — run 33203843046 died exactly there.
      # Plain workflow steps have no post resolution, so the agent cannot
      # break them. CLI pinned to release v1.18.25, sha256-verified; bump
      # deliberately in BOTH jobs.
      - name: Cache opencode
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-v1.18.25

      - name: Install opencode v1.18.25
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/oc.tar.gz" \
            https://github.com/anomalyco/opencode/releases/download/v1.18.25/opencode-linux-x64.tar.gz
          echo "58a3729a6f3432dd6d2917fcc4a949788891a035818646ad480e12c947f56e78  $RUNNER_TEMP/oc.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$RUNNER_TEMP/oc.tar.gz" -C "$HOME/.opencode/bin"

      - name: Run opencode
        # Absolute path: the pin must not be bypassable via PATH order.
        run: '"$HOME/.opencode/bin/opencode" github run'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode-go/hy4-preview
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"

  review:
    needs: gate
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Observed reviews: 1.5-7.5 min, with variance up to ~2x. 20 min bounds a
    # stuck run without clipping a normal review.
    timeout-minutes: 20
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Review latency: most of the wall clock is model turns. Give the
      # reviewer working pytest/mypy/ruff up front so it does not spend a
      # turn (plus ~30s of venv + pip install) bootstrapping them every run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Preinstall dev tools for the reviewer
        run: pip install -e ".[dev]"

      # See the comment on the /oc job: inlined on purpose, not a composite.
      - name: Cache opencode
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-v1.18.25

      - name: Install opencode v1.18.25
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/oc.tar.gz" \
            https://github.com/anomalyco/opencode/releases/download/v1.18.25/opencode-linux-x64.tar.gz
          echo "58a3729a6f3432dd6d2917fcc4a949788891a035818646ad480e12c947f56e78  $RUNNER_TEMP/oc.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$RUNNER_TEMP/oc.tar.gz" -C "$HOME/.opencode/bin"

      - name: Run opencode review
        run: '"$HOME/.opencode/bin/opencode" github run'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode-go/hy4-preview
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"
          PROMPT: |
            Review this pull request against AGENTS.md, the linked issue, and THIS DIFF only.

            Severity (strict):
            - Block only: correctness bugs, security/secret leaks, layering violations,
              or a claim in the PR that is false in the code.
            - Should-fix: missing tests for new error paths, small behavior deltas.
            - Nit: style, docs, private-API tests, optional hardening. Nits never block.

            Re-review rules (if this PR already has your comments):
            - First verify each prior BLOCKER is fixed or explicitly declined.
            - Then look only for regressions introduced by the new commits.
            - Do NOT invent a stricter citation/error/timeout contract than the
              linked issue stated. If a hole remains, classify it Should-fix unless
              it is a real production bug in the claimed behavior.
            - A stale PR body is a nit. Ask for an update; do not request changes
              for documentation lag.
            - If prior blockers are gone and no new blocker exists: APPROVE.

            Scope:
            - One pass. pytest/mypy/ruff are already installed
              (`python3 -m pytest`, `python3 -m mypy src`,
              `python3 -m ruff check src tests`). Never venv or pip install.
            - Cap: at most 3 blockers, 5 should-fix, 5 nits.
            - Post exactly one review. Verdict must be Approve, Comment, or
              Request changes. Request changes only if a blocker remains.
