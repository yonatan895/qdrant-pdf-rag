name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"
      - ".agents/**"
      - "vendor/**"

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD" != "$REPO" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  opencode:
    needs: gate
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: opencode-comment-${{ github.event.comment.id || github.run_id }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: ./.github/actions/opencode
        with:
          model: opencode-go/hy4-preview
          share: "false"
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  review:
    needs: gate
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode review
        uses: ./.github/actions/opencode
        with:
          model: opencode-go/hy4-preview
          share: "false"
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
