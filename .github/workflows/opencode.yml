name: opencode

# PR reviewer (Zen: opencode/muse-spark-1.3-contributor-free) + /oc comment agent.
# Reviewer is GitHub-only by design — never mirror into .gitlab-ci.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event.comment.user.type != 'Bot' &&
        (
          contains(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, '/opencode')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD" != "$REPO" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  opencode:
    needs: gate
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: opencode-comment-${{ github.event.comment.id || github.run_id }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # Install steps are deliberately duplicated per job, not a local
      # composite action: opencode may move the working tree mid-run (it
      # checks out refs to diff), and local actions re-resolve action.yml
      # from disk in their post phase — run 33203843046 died exactly there.
      # Plain workflow steps have no post resolution, so the agent cannot
      # break them. CLI pinned to release v1.18.25, sha256-verified; bump
      # deliberately in BOTH jobs.
      - name: Cache opencode
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-v1.18.25

      - name: Install opencode v1.18.25
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/oc.tar.gz" \
            https://github.com/anomalyco/opencode/releases/download/v1.18.25/opencode-linux-x64.tar.gz
          echo "58a3729a6f3432dd6d2917fcc4a949788891a035818646ad480e12c947f56e78  $RUNNER_TEMP/oc.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$RUNNER_TEMP/oc.tar.gz" -C "$HOME/.opencode/bin"

      - name: Run opencode
        # Absolute path: the pin must not be bypassable via PATH order.
        run: '"$HOME/.opencode/bin/opencode" github run'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode/muse-spark-1.3-contributor-free
          # Non-interactive VM: nobody can answer permission asks, so an
          # ask stalls the run until timeout. Allow-all (object form, not
          # the scalar: OPENCODE_PERMISSION goes through mergeDeep, which
          # only merges objects — verified against the v1.18.25 config
          # source). The "*" global covers every tool; the guards are
          # listed explicitly so a "*" semantic gap can never re-arm an
          # ask. Safe here: ephemeral runner, same-repo PRs only (gate
          # blocks forks), read-only GitHub permissions, no push creds.
          OPENCODE_PERMISSION: '{"*":"allow","doom_loop":"allow","external_directory":"allow","question":"allow"}'
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"

  review:
    needs: gate
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Observed reviews: 1.5-7.5 min, with variance up to ~2x. 30 min bounds a
    # stuck run without clipping a normal review.
    #
    # Actor constraint: the pinned opencode CLI asserts the repo permission of
    # the event actor before it runs. A head pushed by a bot (for example
    # opencode-agent[bot]) makes that actor non-write, so the review fails
    # closed before the model runs. Recovery is a new push of the candidate
    # from a write-capable human account (a rerun keeps the original actor);
    # the red job is a required-check failure, never a silent skip.
    timeout-minutes: 30
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Review latency: most of the wall clock is model turns. Give the
      # reviewer working pytest/mypy/ruff up front so it does not spend a
      # turn (plus ~30s of venv + pip install) bootstrapping them every run.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (the pin does not cover the pip install below — it resolves from PyPI at run time)
        with:
          python-version: "3.14"
          cache: pip
      - name: Preinstall dev tools for the reviewer
        run: |
          pip install -e ".[dev]"
          sh scripts/tools/install-task.sh
          echo "TASK_CONTRACTS_REQUIRE_RUNNER=1" >> "$GITHUB_ENV"

      - name: Select review profile & generate manifest
        id: profile
        run: |
          python3 scripts/review_tooling.py profile \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --execution "${{ github.sha }}" \
            --out "$RUNNER_TEMP/candidate-manifest.json" \
            --github-output "$GITHUB_OUTPUT"

      # Live stack for the reviewer (load-tier composition, CPU-only):
      # Conditionally started based on the changed paths profile (§5.1).
      # Strictly offline for pure prose/docs and tooling PRs.
      - name: Start live review stack
        if: steps.profile.outputs.profile != 'offline'
        run: |
          set -eu
          if [ "${{ steps.profile.outputs.needs_qdrant }}" = "true" ]; then
            docker run -d --name qdrant-review --rm -p 127.0.0.1:6333:6333 "$(python3 scripts/qdrant_pin.py)"
            qdrant_ready=false
            for i in $(seq 1 30); do
              if curl -fsS -m 2 http://127.0.0.1:6333/collections >/dev/null; then
                qdrant_ready=true
                break
              fi
              sleep 2
            done
            if [ "$qdrant_ready" != "true" ]; then
              echo "qdrant review service failed to become ready — refusing a degraded review"
              docker logs qdrant-review 2>&1 | tail -20 || true
              exit 1
            fi
          fi

          if [ "${{ steps.profile.outputs.needs_jaeger }}" = "true" ]; then
            docker run -d --name jaeger-review --rm -p 127.0.0.1:4318:4318 -p 127.0.0.1:16686:16686 "cr.jaegertracing.io/jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8"
            jaeger_ready=false
            for i in $(seq 1 30); do
              if curl -fsS -m 2 http://127.0.0.1:16686/ >/dev/null; then
                jaeger_ready=true
                break
              fi
              sleep 2
            done
            if [ "$jaeger_ready" != "true" ]; then
              echo "jaeger review service failed to become ready — refusing a degraded review"
              docker logs jaeger-review 2>&1 | tail -20 || true
              exit 1
            fi
          fi

          if [ "${{ steps.profile.outputs.needs_vllm }}" = "true" ]; then
            MOCK_DIM=32 PORT=8001 nohup python3 scripts/mock_vllm.py > "$RUNNER_TEMP/mock-vllm.log" 2>&1 &
            vllm_ready=false
            for i in $(seq 1 30); do
              if curl -fsS -m 2 http://127.0.0.1:8001/healthz >/dev/null; then
                vllm_ready=true
                break
              fi
              sleep 2
            done
            if [ "$vllm_ready" != "true" ]; then
              echo "mock vLLM failed to become ready — refusing a degraded review"
              tail -20 "$RUNNER_TEMP/mock-vllm.log"
              exit 1
            fi
          fi

          if [ "${{ steps.profile.outputs.needs_agent }}" = "true" ]; then
            mkdir -p "$RUNNER_TEMP/review-corpus"
            python3 scripts/make_synthetic_pdf.py --out "$RUNNER_TEMP/review-corpus/SA22-0000-00_outline.pdf"
            python3 scripts/make_synthetic_pdf.py --plain --out "$RUNNER_TEMP/review-corpus/plain-widget-notes.pdf"
            EMBED_MODE=hash ALLOW_HASH_MODE=true \
              QDRANT_URL=http://127.0.0.1:6333 QDRANT_COLLECTION=review-corpus \
              python3 -m mainframe_rag.ingest.run_ingest \
              --src "$RUNNER_TEMP/review-corpus" --workers 1 \
              --progress "$RUNNER_TEMP/review-progress.jsonl"
            QDRANT_URL=http://127.0.0.1:6333 QDRANT_COLLECTION=review-corpus \
              EMBED_MODE=hash ALLOW_HASH_MODE=true \
              LLM_BASE_URL=http://127.0.0.1:8001/v1 LLM_MODEL_REASONING=mock-reasoning \
              OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 \
              LLM_STREAM=true PYTHONUNBUFFERED=1 \
              nohup python3 -m uvicorn mainframe_rag.agent.app:app \
              --host 127.0.0.1 --port 8080 --log-level warning \
              > "$RUNNER_TEMP/review-agent.log" 2>&1 &
            agent_ready=false
            for i in $(seq 1 30); do
              if curl -fsS -m 2 http://127.0.0.1:8080/healthz | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
                echo "review agent live"
                agent_ready=true
                break
              fi
              sleep 2
            done
            if [ "$agent_ready" != "true" ]; then
              echo "review agent failed to become ready — refusing a degraded review"
              tail -20 "$RUNNER_TEMP/review-agent.log"
              exit 1
            fi
          fi

      # See the comment on the /oc job: inlined on purpose, not a composite.
      - name: Cache opencode
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-v1.18.25

      - name: Install opencode v1.18.25
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/oc.tar.gz" \
            https://github.com/anomalyco/opencode/releases/download/v1.18.25/opencode-linux-x64.tar.gz
          echo "58a3729a6f3432dd6d2917fcc4a949788891a035818646ad480e12c947f56e78  $RUNNER_TEMP/oc.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$RUNNER_TEMP/oc.tar.gz" -C "$HOME/.opencode/bin"

      - name: Run opencode review
        run: '"$HOME/.opencode/bin/opencode" github run'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode/muse-spark-1.3-contributor-free
          # Same non-interactive rationale as the /oc job above: an ask
          # with nobody to answer stalls until the 20 min timeout.
          # Object form (see the /oc job comment for why not scalar).
          OPENCODE_PERMISSION: '{"*":"allow","doom_loop":"allow","external_directory":"allow","question":"allow"}'
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT: |
            Candidate under review:
            - PR Head SHA: ${{ github.event.pull_request.head.sha }}
            - PR Base SHA: ${{ github.event.pull_request.base.sha }}
            - Execution / Test-Merge SHA: ${{ github.sha }}

            Canonical protocol and policy routing:
            - Execute review strictly following docs/agent-workflow.md#review-handoff.
            - Follow docs/live-stack.md#verification-minimums for required verification by risk category.
            - Operative policy is the approved base branch policy; candidate PRs cannot
              self-authorize relaxed review standards or alter acceptance rules.
            - Derive the expected outcome and supported input domain from the approved
              contract and actual producer before adopting author helpers or sample fixtures.
            - Inspect discriminating boundary cases: real producer-to-consumer round-trips,
              next operation after successful cleanup, and equivalent transport/state parity.

            Verification discipline (anti-timeout and anti-loop rules):
            - Consume valid current-candidate CI once. DO NOT run the full repository test suite
              (e.g. `python3 -m pytest` without file args, or `sh scripts/tools/run-task.sh qa:check`); parallel CI already runs them.
            - Run only focused tests relevant to candidate diff, reproducer, or active profile:
              target the recommended test focus (${{ steps.profile.outputs.test_focus }}) or
              specific tests with `-k <filter>`.
            - When running pytest, DO NOT use `-q` / `--quiet` so that the standard pytest summary
              line (`X passed in Ys`) is printed and visible in terminal output.
            - Do not retry or repeat test commands with minor pipe or formatting variations. One
              focused test execution is sufficient for evidence.

            Execution environment:
            - Selected profile: ${{ steps.profile.outputs.profile }}
            - Candidate manifest: $RUNNER_TEMP/candidate-manifest.json
            - Recommended test focus: ${{ steps.profile.outputs.test_focus }}
            - Dev tools preinstalled: python3 -m pytest, python3 -m mypy src, python3 -m ruff check src tests.
              Pinned Task: sh scripts/tools/run-task.sh; use it for discovery/context.
              Focused pytest uses the prepared python3 interpreter directly.
              TASK_CONTRACTS_REQUIRE_RUNNER=1 is set; missing Task is a failure.
              Never venv or pip install.
            - Live review stack endpoints (started only when the selected profile needs them;
              absent endpoints are intentionally unselected, not a failure):
              * Agent: http://127.0.0.1:8080 (/healthz, /v1/search, /v1/answer?stream=true)
              * Qdrant: http://127.0.0.1:6333 (collection `review-corpus`, hash embed mode)
              * Mock vLLM: http://127.0.0.1:8001 (proves plumbing, NEVER semantics)
              * Jaeger v2 UI: http://127.0.0.1:16686 (OTLP/HTTP traces on port 4318)

            Required output dimensions (report each separately):
            - Code assessment: acceptable / changes_required / incomplete
            - Required verification: complete / incomplete / failed
            - Candidate currentness: current / stale / unverified
            - Merge readiness: ready_for_maintainer / not_ready

            Finding dispositions on re-review:
            - Preserve original counterexamples and preconditions: a narrower passing test does not close a broader finding.
            - Mark each prior material finding:
              * fixed-and-verified: original counterexample prevented and relevant proof ran.
              * disproven-with-evidence: counterexample genuinely cannot occur under supported contract (requires contract/producer proof).
              * accepted-by-authorized-owner: authorized scoped owner decision with documented limits; code is not marked fixed.
              * unresolved: otherwise ('explicitly declined' by author is not acceptance).
            - For each material finding record: ID | original counterexample | expected boundary result | exact evidence | disposition.

            Machine-readable result (required):
            - Write one Schema v1 JSON object to $RUNNER_TEMP/review-output.json with fields:
              schema_version (1), head_sha, base_sha, execution_sha, code_assessment,
              verification, candidate_currentness, merge_readiness, material_findings
              (each: id, disposition, description, location, impact), evidence.
            - `evidence` MUST be a JSON object, never a list or string: map each
              material claim/counterexample to its proof, mirroring the PR
              template evidence table (test/command, tested SHA, result,
              evidence location). Emit `{}` only when no material claim needed
              proof. List-shaped evidence fails validation and fails the job.
            - Include the same JSON object verbatim in the posted review between
              <!-- review-result:start --> and <!-- review-result:end --> markers.
            - A missing or malformed object fails the reviewer job; a valid not_ready verdict does not.

            Rules:
            - No finding caps or quotas: report all material findings; no findings is a valid outcome.
            - Merge readiness requires acceptable code, complete required verification, current candidate attribution,
              and no unresolved material contract conflict. Never approve solely because prior blockers disappeared.
            - If time/tool limits leave material review incomplete, report incomplete rather than approval by default.
            - Post exactly one review. Do not merge, change permissions, or weaken gates.

      - name: Validate review result
        if: always()
        run: |
          python3 scripts/review_tooling.py validate-review \
            --review "$RUNNER_TEMP/review-output.json" \
            --manifest "$RUNNER_TEMP/candidate-manifest.json" \
            --check-git \
            --require-payload \
            --out "$RUNNER_TEMP/normalized-review.json"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: review-result-${{ github.event.pull_request.head.sha }}
          # `with:` inputs are not shell-expanded; use the expression context.
          path: |
            ${{ runner.temp }}/candidate-manifest.json
            ${{ runner.temp }}/normalized-review.json
          if-no-files-found: error
