name: opencode

# PR reviewer (Zen: opencode/muse-spark-1.3-contributor-free) + /oc comment agent.
# Reviewer is GitHub-only by design — never mirror into .gitlab-ci.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event.comment.user.type != 'Bot' &&
        (
          contains(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, '/opencode')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD" != "$REPO" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  opencode:
    needs: gate
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: opencode-comment-${{ github.event.comment.id || github.run_id }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # Install steps are deliberately duplicated per job, not a local
      # composite action: opencode may move the working tree mid-run (it
      # checks out refs to diff), and local actions re-resolve action.yml
      # from disk in their post phase — run 33203843046 died exactly there.
      # Plain workflow steps have no post resolution, so the agent cannot
      # break them. CLI pinned to release v1.18.25, sha256-verified; bump
      # deliberately in BOTH jobs.
      - name: Cache opencode
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-v1.18.25

      - name: Install opencode v1.18.25
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/oc.tar.gz" \
            https://github.com/anomalyco/opencode/releases/download/v1.18.25/opencode-linux-x64.tar.gz
          echo "58a3729a6f3432dd6d2917fcc4a949788891a035818646ad480e12c947f56e78  $RUNNER_TEMP/oc.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$RUNNER_TEMP/oc.tar.gz" -C "$HOME/.opencode/bin"

      - name: Run opencode
        # Absolute path: the pin must not be bypassable via PATH order.
        run: '"$HOME/.opencode/bin/opencode" github run'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode/muse-spark-1.3-contributor-free
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"

  review:
    needs: gate
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Observed reviews: 1.5-7.5 min, with variance up to ~2x. 20 min bounds a
    # stuck run without clipping a normal review.
    timeout-minutes: 20
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # Review latency: most of the wall clock is model turns. Give the
      # reviewer working pytest/mypy/ruff up front so it does not spend a
      # turn (plus ~30s of venv + pip install) bootstrapping them every run.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (the pin does not cover the pip install below — it resolves from PyPI at run time)
        with:
          python-version: "3.14"
          cache: pip
      - name: Preinstall dev tools for the reviewer
        run: pip install -e ".[dev]"

      # Live stack for the reviewer (load-tier composition, CPU-only):
      # docker Qdrant (images.txt pin via qdrant_pin.py) + stdlib mock
      # vLLM (embed + reasoning stand-in) + two synthetic PDFs ingested
      # in hash mode + real uvicorn agent. No GPU needed. Fail-closed:
      # a dead stack fails the job before the review runs — a reviewer
      # without the stack would silently do a weaker review. The mock
      # proves plumbing (shapes, citations, traps, SSE), never semantics
      # (see docs/eval.md §9); the PROMPT below says so.
      - name: Start live review stack
        run: |
          set -eu
          docker run -d --name qdrant-review --rm -p 127.0.0.1:6333:6333 "$(python3 scripts/qdrant_pin.py)"
          for i in $(seq 1 30); do
            if curl -s -m 2 http://127.0.0.1:6333/collections >/dev/null; then
              break
            fi
            sleep 2
          done
          MOCK_DIM=32 PORT=8001 nohup python3 scripts/mock_vllm.py > "$RUNNER_TEMP/mock-vllm.log" 2>&1 &
          mkdir -p "$RUNNER_TEMP/review-corpus"
          python3 scripts/make_synthetic_pdf.py --out "$RUNNER_TEMP/review-corpus/SA22-0000-00_outline.pdf"
          python3 scripts/make_synthetic_pdf.py --plain --out "$RUNNER_TEMP/review-corpus/plain-widget-notes.pdf"
          EMBED_MODE=hash ALLOW_HASH_MODE=true \
            QDRANT_URL=http://127.0.0.1:6333 QDRANT_COLLECTION=review-corpus \
            python3 -m mainframe_rag.ingest.run_ingest \
            --src "$RUNNER_TEMP/review-corpus" --workers 1 \
            --progress "$RUNNER_TEMP/review-progress.jsonl"
          QDRANT_URL=http://127.0.0.1:6333 QDRANT_COLLECTION=review-corpus \
            EMBED_MODE=hash ALLOW_HASH_MODE=true \
            LLM_BASE_URL=http://127.0.0.1:8001/v1 LLM_MODEL_REASONING=mock-reasoning \
            LLM_STREAM=true PYTHONUNBUFFERED=1 \
            nohup python3 -m uvicorn mainframe_rag.agent.app:app \
            --host 127.0.0.1 --port 8080 --log-level warning \
            > "$RUNNER_TEMP/review-agent.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -m 2 http://127.0.0.1:8080/healthz | grep -q '"qdrant":true'; then
              echo "review stack live"
              exit 0
            fi
            sleep 2
          done
          echo "review stack failed to become ready"
          tail -20 "$RUNNER_TEMP/review-agent.log"
          exit 1

      # See the comment on the /oc job: inlined on purpose, not a composite.
      - name: Cache opencode
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-v1.18.25

      - name: Install opencode v1.18.25
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/oc.tar.gz" \
            https://github.com/anomalyco/opencode/releases/download/v1.18.25/opencode-linux-x64.tar.gz
          echo "58a3729a6f3432dd6d2917fcc4a949788891a035818646ad480e12c947f56e78  $RUNNER_TEMP/oc.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$RUNNER_TEMP/oc.tar.gz" -C "$HOME/.opencode/bin"

      - name: Run opencode review
        run: '"$HOME/.opencode/bin/opencode" github run'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode/muse-spark-1.3-contributor-free
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"
          PROMPT: |
            Review this pull request against AGENTS.md, the linked issue, and THIS DIFF only.

            Severity (strict):
            - Block only: correctness bugs, security/secret leaks, layering violations,
              or a claim in the PR that is false in the code.
            - Should-fix: missing tests for new error paths, small behavior deltas.
            - Nit: style, docs, private-API tests, optional hardening. Nits never block.

            Re-review rules (if this PR already has your comments):
            - First verify each prior BLOCKER is fixed or explicitly declined.
            - Then look only for regressions introduced by the new commits.
            - Do NOT invent a stricter citation/error/timeout contract than the
              linked issue stated. If a hole remains, classify it Should-fix unless
              it is a real production bug in the claimed behavior.
            - A stale PR body is a nit. Ask for an update; do not request changes
              for documentation lag.
            - If prior blockers are gone and no new blocker exists: APPROVE.

            Scope:
            - One pass. pytest/mypy/ruff are already installed
              (`python3 -m pytest`, `python3 -m mypy src`,
              `python3 -m ruff check src tests`). Never venv or pip install.
            - Cap: at most 3 blockers, 5 should-fix, 5 nits.
            - Post exactly one review. Verdict must be Approve, Comment, or
              Request changes. Request changes only if a blocker remains.

            Live stack (already running — use it, do NOT rebuild it):
            - Agent: http://127.0.0.1:8080 (`/healthz`, `/v1/search`,
              `/v1/answer` with `?stream=true`).
            - Qdrant: http://127.0.0.1:6333, collection `review-corpus`
              (two synthetic PDFs, hash embed mode).
            - A stdlib mock stands in for embed + reasoning: it proves
              plumbing, NEVER semantics. Valid live: legit query grounds
              ≥1 cite, overlong → 422 fixed envelope, SSE ends with
              exactly one `final`, search hit shapes. NOT valid live:
              trap refusal (the mock echoes hit-1 by construction instead
              of refusing — cover the trap path via unit tests in
              tests/test_screen.py) and any recall/quality judgment
              (docs/eval.md §9).
