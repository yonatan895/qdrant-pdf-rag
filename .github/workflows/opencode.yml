name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"
      - ".agents/**"
      - "vendor/**"

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD" != "$REPO" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  opencode:
    needs: gate
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: opencode-comment-${{ github.event.comment.id || github.run_id }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install opencode
        # CLI pinned to release v1.18.25; bump deliberately. Inlined from the
        # composite action because its "Get opencode version" step does an
        # unauthenticated api.github.com lookup that rate-limits on shared
        # runners and kills the job (run 33200772808). A pinned --version
        # resolves straight from the release CDN and pins the binary too.
        run: |
          curl -fsSL --retry 3 https://opencode.ai/install | bash -s -- --version 1.18.25

      - name: Add opencode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run opencode
        run: opencode github run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode-go/hy4-preview
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"

  review:
    needs: gate
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install opencode
        # CLI pinned to release v1.18.25; bump deliberately (see comment on the /oc job)
        run: |
          curl -fsSL --retry 3 https://opencode.ai/install | bash -s -- --version 1.18.25

      - name: Add opencode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run opencode review
        run: opencode github run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode-go/hy4-preview
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"
