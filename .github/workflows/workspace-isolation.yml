# Workspace isolation proof on real NetworkPolicies (#1118 PR-3c, ADR-0009 section 2).
# Not an acceptance producer (scripts/acceptance.py PRODUCERS).
#
#   kind-workspace-isolation  renders deploy/workspace/*.template.yaml with the pinned
#             oc (scripts/tools/oc-pin.txt), applies them to a throwaway Kind cluster
#             whose default CNI (kindnetd) enforces NetworkPolicy, and runs
#             scripts/devkit/isolation_proof.py --probe. The proof must say "proven";
#             with one CI egress policy deleted, and with an extra CI allow policy,
#             it must fail on both its static check and its live probe; restored, it
#             must say "proven" again. Lane and owner doc: scripts/ci/workspace_isolation_kind.sh,
#             docs/deploy.md#workspace-isolation-proof.
#
# Runs when the proof, the templates, the contract or the lane change; nightly on main
# with the other Kind lanes; and on dispatch.
name: workspace-isolation

on:
  pull_request:
    paths:
      - scripts/devkit/isolation_proof.py
      - deploy/workspace/**
      - scripts/ci/workspace_isolation_kind.sh
      - scripts/tools/oc-pin.txt
      - images.txt
      - .github/workflows/workspace-isolation.yml
  workflow_dispatch:
  schedule:
    - cron: '47 2 * * *'

permissions:
  contents: read

concurrency:
  group: workspace-isolation-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kind-workspace-isolation:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      # The proof is Python 3.14 standard library: pin the interpreter, never the image's python3.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"

      - name: Install pinned kubectl (CI patch --local)
        run: |
          export PATH="/usr/local/bin:$PATH"
          KUBECTL_VERSION=v1.33.12
          # sha256 recorded in-repo (AGENTS.md §6): dl.k8s.io checksum file.
          KUBECTL_SHA256=fe80ae4133b44fa2077db4af144e80765eb1b3b2eede55fbff6933c4374d8c6e
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          /usr/local/bin/kubectl version --client=true

      - name: Install pinned kind (ephemeral air-gap-like cluster)
        run: |
          export PATH="/usr/local/bin:$PATH"
          KIND_VERSION=v0.32.0
          # sha256 recorded in-repo (AGENTS.md §6): kind-linux-amd64 release asset digest.
          KIND_SHA256=50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kind /usr/local/bin/kind
          /usr/local/bin/kind version

      - name: Install the pinned oc (scripts/tools/oc-pin.txt)
        run: |
          set -eu
          PIN=scripts/tools/oc-pin.txt
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/oc.tgz" "$(sed -n 's/^origin: *//p' "$PIN")"
          printf '%s  %s\n' "$(sed -n 's/^sha256: *//p' "$PIN")" "$RUNNER_TEMP/oc.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oc-bin"
          tar -xzf "$RUNNER_TEMP/oc.tgz" -C "$RUNNER_TEMP/oc-bin" oc
          printf '%s  %s\n' "$(sed -n 's/^binary-sha256: *//p' "$PIN")" "$RUNNER_TEMP/oc-bin/oc" | sha256sum -c -
          "$RUNNER_TEMP/oc-bin/oc" version --client

      - name: Isolation proof on Kind (proven, two negative controls, proven again)
        env:
          ISO_STATE: ${{ runner.temp }}/isolation
          KIND_BIN: /usr/local/bin/kind
          KUBECTL: /usr/local/bin/kubectl
          OC: ${{ runner.temp }}/oc-bin/oc
        run: |
          export PATH="/usr/local/bin:$PATH"
          PYTHON="$(command -v python3)" sh scripts/ci/workspace_isolation_kind.sh

      # Records hold verbs, resources, object names, addresses and outcomes only (the
      # proof's record contract); rendered files hold parameters, never Secret values.
      - name: Upload the proof records
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: workspace-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/isolation/records
            ${{ runner.temp }}/isolation/logs
          retention-days: 7
