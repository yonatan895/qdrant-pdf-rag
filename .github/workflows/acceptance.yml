name: candidate-acceptance
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
    branches: [main]
  workflow_run:
    workflows: [agent-context, ci, e2e, load, ha, agent-probes, Verifier update decision]
    types: [requested, in_progress, completed]
  push:
    branches: [main]
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Evidence for one head SHA is evaluated in order; unrelated candidates,
  # main pushes and the periodic sweep no longer queue behind each other.
  group: >-
    current-candidate-acceptance${{
    (github.event_name == 'pull_request_target' && format('-{0}', github.event.pull_request.head.sha))
    || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    && format('-{0}', github.event.workflow_run.head_sha)) || '' }}
  cancel-in-progress: false
jobs:
  advisory:
    if: github.ref == 'refs/heads/main' && (vars.ACCEPTANCE_APP_ENABLED != 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    steps:
      - name: Check out approved default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.8'
      - name: Recompute all open candidates from native API evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_REPOSITORY: ${{ github.repository }}
          # Candidate events name only a commit; the script re-reads everything
          # else from the API. Other triggers reconcile all open candidates.
          ACCEPTANCE_HEAD_SHA: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.sha) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_sha) || '' }}
        run: |
          if [ -n "$ACCEPTANCE_HEAD_SHA" ]; then selection="--head-sha $ACCEPTANCE_HEAD_SHA"; else selection=--all-open; fi
          python -m scripts.acceptance --repository "$ACCEPTANCE_REPOSITORY" $selection --publish > "$RUNNER_TEMP/acceptance.json"
      - name: Retain acceptance report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: acceptance-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance.json
          if-no-files-found: error
  trusted-app:
    if: github.ref == 'refs/heads/main' && (vars.ACCEPTANCE_APP_ENABLED == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: acceptance-publisher
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - name: Check out approved default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.8'
      - name: Create repository-scoped publisher token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ACCEPTANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ACCEPTANCE_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Recompute all open candidates from native API evidence
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACCEPTANCE_REPOSITORY: ${{ github.repository }}
          # Candidate events name only a commit; the script re-reads everything
          # else from the API. Other triggers reconcile all open candidates.
          ACCEPTANCE_HEAD_SHA: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.sha) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_sha) || '' }}
        run: |
          if [ -n "$ACCEPTANCE_HEAD_SHA" ]; then selection="--head-sha $ACCEPTANCE_HEAD_SHA"; else selection=--all-open; fi
          python -m scripts.acceptance --repository "$ACCEPTANCE_REPOSITORY" $selection --publish > "$RUNNER_TEMP/acceptance.json"
      - name: Retain acceptance report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: acceptance-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance.json
          if-no-files-found: error
