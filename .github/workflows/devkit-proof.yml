# Dev kit transport proofs (#1118, ADR-0009 §8, D-6). Not an acceptance producer
# (scripts/acceptance.py PRODUCERS) and never touches the real devkit package.
#
#   linux     packs a small synthetic kit with the real scripts/devkit/pack.sh (the
#             pin is rewritten in the runner's checkout only, never pushed), pushes
#             it with the kit's Linux oras to a TLS+auth registry:2 and reads the
#             digest back, then runs the kit's install.sh against the same registry
#   windows   runs the runbook's PowerShell blocks literally in Windows PowerShell
#             5.1 from the kit's own devkit-windows.md: Get-FileHash and the anchor,
#             oras.exe push to the scratch GHCR package with readback, the pinned
#             oc.exe render through the PowerShell pipe compared with the Linux
#             render, and the bytes a PowerShell pipe hands `oc exec -i`. `oc` is a
#             PowerShell function standing in for the cluster; `oc process` runs
#             the real oc.exe
#   session   feeds those piped bytes to the real mfr-session-login on Linux
name: devkit-proof

on:
  pull_request:
    paths:
      - scripts/devkit/**
      - scripts/airgap/image_manifest.py
      - scripts/tools/oras-pin.txt
      - scripts/tools/oras-windows-pin.txt
      - docs/runbooks/devkit-windows.md
      - deploy/workspace/bastion.template.yaml
      - images/devkit/bin/**
      - .github/workflows/devkit-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devkit-proof-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
  # The Windows build of the scripts/tools/oc-pin.txt version, from the same
  # release sha256sum.txt that pin verifies (openshift-client-windows-4.20.42.zip).
  OC_WINDOWS_ZIP: https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/4.20.42/openshift-client-windows-4.20.42.zip
  OC_WINDOWS_ZIP_SHA256: a0abb6b3acee6d189a60a53d4d6186262dd61d8ff9860b5dc7940cb84e581c7e
  OC_WINDOWS_BINARY_SHA256: c130a758d94142459cf97a2434447bd3e6438dc0a0579c25f61e0f99f7ea8353

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - name: Pack a synthetic kit with the real pack.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          OUT="$RUNNER_TEMP/proof"
          mkdir -p "$OUT/kit"
          # A small deterministic one-layer image as an OCI layout directory.
          python - "$RUNNER_TEMP/layout" > "$RUNNER_TEMP/digest" <<'PY'
          import gzip, hashlib, io, json, sys, tarfile
          from pathlib import Path
          root = Path(sys.argv[1]); blobs = root / "blobs/sha256"; blobs.mkdir(parents=True)
          def put(data, media):
              digest = hashlib.sha256(data).hexdigest(); (blobs / digest).write_bytes(data)
              return {"mediaType": media, "digest": "sha256:" + digest, "size": len(data)}
          raw = io.BytesIO()
          with tarfile.open(fileobj=raw, mode="w", format=tarfile.PAX_FORMAT) as tar:
              data = b"devkit transport proof\n"; info = tarfile.TarInfo("opt/devkit/proof.txt"); info.size = len(data)
              tar.addfile(info, io.BytesIO(data))
          layer = raw.getvalue()
          config = json.dumps({"architecture": "amd64", "os": "linux", "rootfs": {"type": "layers",
                               "diff_ids": ["sha256:" + hashlib.sha256(layer).hexdigest()]}}).encode()
          manifest = json.dumps({"schemaVersion": 2, "mediaType": "application/vnd.oci.image.manifest.v1+json",
                                 "config": put(config, "application/vnd.oci.image.config.v1+json"),
                                 "layers": [put(gzip.compress(layer, mtime=0), "application/vnd.oci.image.layer.v1.tar+gzip")]},
                                separators=(",", ":")).encode()
          entry = put(manifest, "application/vnd.oci.image.manifest.v1+json")
          (root / "index.json").write_text(json.dumps({"schemaVersion": 2, "manifests": [entry]}))
          (root / "oci-layout").write_text('{"imageLayoutVersion":"1.0.0"}')
          print(entry["digest"])
          PY
          DIGEST="$(cat "$RUNNER_TEMP/digest")"
          # Runner-local pin for the synthetic image; this commit is never pushed.
          sed -i "s/^digest: .*/digest: $DIGEST/" scripts/tools/devkit-pin.txt
          git -c user.name=devkit-proof -c user.email=devkit-proof@invalid commit -q -m "devkit-proof: synthetic pin" scripts/tools/devkit-pin.txt
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/signing.key"
          umask 022
          openssl pkey -in "$RUNNER_TEMP/signing.key" -pubout -out "$OUT/release-signing.pub"
          SNEAKERNET_SIGNING_KEY="$RUNNER_TEMP/signing.key" sh scripts/devkit/pack.sh --reuse-image "$RUNNER_TEMP/layout" | tee "$RUNNER_TEMP/pack.log"
          sed -n 's/^Trust anchor (publish on GitHub, carry separately): //p' "$RUNNER_TEMP/pack.log" > "$OUT/anchor.txt"
          KIT="$(ls -d dist/mfr-devkit-*)"
          mv "$KIT" "$OUT/kit/"
          KIT="$OUT/kit/$(basename "$KIT")"
          [ "$(awk '$1 == "image_digest:" {print $2}' "$KIT/MANIFEST.txt")" = "$DIGEST" ]
          echo "KIT=$KIT" >> "$GITHUB_ENV"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "KEY=$(awk '$1 == "key:" {print $2}' "$KIT/MANIFEST.txt")" >> "$GITHUB_ENV"
      - name: Push with the kit's oras to a TLS+auth registry:2 and read the digest back
        run: |
          set -eu
          TLS="$RUNNER_TEMP/tls"
          mkdir -p "$TLS/certs"
          cd "$TLS"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 1 -subj /CN=devkit-proof-ca 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout tls.key -out tls.csr -subj /CN=devkit-registry 2>/dev/null
          printf 'subjectAltName=DNS:devkit-registry\n' > ext
          openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out tls.crt -days 1 -extfile ext 2>/dev/null
          cp ca.crt certs/ca.crt
          (umask 077; openssl rand -hex 24 > password)
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2-utils skopeo >/dev/null
          htpasswd -iBc htpasswd proof < password
          echo '127.0.0.1 devkit-registry' | sudo tee -a /etc/hosts >/dev/null
          docker run -d --name devkit-registry -p 127.0.0.1:5000:5000 \
            -v "$TLS/tls.crt:/tls/tls.crt:ro" -v "$TLS/tls.key:/tls/tls.key:ro" -v "$TLS/htpasswd:/auth/htpasswd:ro" \
            -e REGISTRY_HTTP_TLS_CERTIFICATE=/tls/tls.crt -e REGISTRY_HTTP_TLS_KEY=/tls/tls.key \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=proof -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            "$REGISTRY_IMAGE" >/dev/null
          for attempt in $(seq 1 20); do
            [ "$(curl -sS --cacert ca.crt -o /dev/null -w '%{http_code}' https://devkit-registry:5000/v2/ || true)" = 401 ] && break
            [ "$attempt" != 20 ] || exit 1
            sleep 1
          done
          SESSION="$RUNNER_TEMP/session"
          mkdir -p "$SESSION/private"
          chmod 0700 "$SESSION/private"
          printf '{"auths":{"devkit-registry:5000":{"auth":"%s"}}}\n' "$(printf 'proof:%s' "$(cat password)" | base64 -w0)" > "$SESSION/private/auth.json"
          REPO=devkit-registry:5000/mf/qdrant-pdf-rag-devkit
          cd "$KIT"
          ./oras cp --from-oci-layout "image@$DIGEST" "$REPO:$KEY" --to-registry-config "$SESSION/private/auth.json" --to-ca-file "$TLS/ca.crt" --no-tty
          READBACK="$(./oras resolve --registry-config "$SESSION/private/auth.json" --ca-file "$TLS/ca.crt" "$REPO:$KEY")"
          echo "oras push $DIGEST, registry readback $READBACK"
          [ "$READBACK" = "$DIGEST" ]
          # The kit's own installer over the same registry: signature, inventory,
          # skopeo copy, readback by digest and by tag. A second run must pass too.
          for run in 1 2; do
            MFR_SESSION_DIR="$SESSION" SNEAKERNET_TRUSTED_PUB="$RUNNER_TEMP/proof/release-signing.pub" \
              sh "$KIT/install.sh" --registry "$REPO" --registry-ca-dir "$TLS/certs"
          done
      - name: Render the bastion with the pinned Linux oc
        run: |
          set -eu
          PIN=scripts/tools/oc-pin.txt
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/oc.tgz" "$(sed -n 's/^origin: *//p' "$PIN")"
          printf '%s  %s\n' "$(sed -n 's/^sha256: *//p' "$PIN")" "$RUNNER_TEMP/oc.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oc.tgz" -C "$RUNNER_TEMP" oc
          printf '%s  %s\n' "$(sed -n 's/^binary-sha256: *//p' "$PIN")" "$RUNNER_TEMP/oc" | sha256sum -c -
          cat > "$RUNNER_TEMP/proof/bastion.env" <<EOF
          PROD_NAMESPACE=rag-prod
          DEVKIT_REPOSITORY=quay.example/mf/qdrant-pdf-rag-devkit
          DEVKIT_DIGEST=$DIGEST
          PULL_SECRET=builder-quay-mf-dev
          STORAGE_CLASS=ocs-block
          API_SERVER_CIDRS=[{"ipBlock":{"cidr":"10.0.0.10/32"}}]
          REGISTRY_CIDRS=[{"ipBlock":{"cidr":"10.0.1.0/24"}}]
          GITLAB_CIDRS=[{"ipBlock":{"cidr":"10.0.2.5/32"}}]
          EOF
          "$RUNNER_TEMP/oc" process --local -f "$KIT/bastion.template.yaml" --param-file "$RUNNER_TEMP/proof/bastion.env" > "$RUNNER_TEMP/proof/linux-render.json"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: devkit-proof-kit
          path: ${{ runner.temp }}/proof
          retention-days: 3

  windows:
    needs: linux
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: devkit-proof-kit
          path: ${{ runner.temp }}/proof
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - name: Fetch the pinned oc.exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'oc.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $env:OC_WINDOWS_ZIP -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash -ne $env:OC_WINDOWS_ZIP_SHA256) { throw 'oc.exe archive differs from its pin' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'oc')
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:RUNNER_TEMP 'oc\oc.exe')).Hash -ne $env:OC_WINDOWS_BINARY_SHA256) { throw 'oc.exe differs from its pin' }
      - name: Run the runbook blocks literally in Windows PowerShell 5.1
        shell: powershell
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          SCRATCH_OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "not Windows PowerShell 5.1: $($PSVersionTable.PSVersion)" }
          "Windows PowerShell $($PSVersionTable.PSVersion); `$OutputEncoding $($OutputEncoding.WebName); console output $([Console]::OutputEncoding.WebName)"
          $Proof = Join-Path $env:RUNNER_TEMP 'proof'
          $KitDir = (Get-ChildItem -LiteralPath (Join-Path $Proof 'kit') -Directory | Select-Object -First 1).FullName
          $OcExe = Join-Path $env:RUNNER_TEMP 'oc\oc.exe'
          $Out = Join-Path $env:RUNNER_TEMP 'runbook-out'
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          $Dump = Join-Path $env:RUNNER_TEMP 'dump_stdin.py'
          [IO.File]::WriteAllText($Dump, "import sys`nopen(sys.argv[1], 'wb').write(sys.stdin.buffer.read())`n")
          $Log = Join-Path $Out 'oc-calls.log'

          # The blocks, read from the runbook copy inside the kit.
          $md = [IO.File]::ReadAllText((Join-Path $KitDir 'devkit-windows.md'))
          $blocks = @{}
          foreach ($m in [regex]::Matches($md, '(?s)<!-- devkit-runbook: ([a-z0-9 ]+) -->\r?\n```powershell\r?\n(.*?)\r?\n```')) { $blocks[$m.Groups[1].Value] = $m.Groups[2].Value }
          foreach ($name in 'values', 'step 1', 'step 2', 'step 3', 'step 4', 'step 5', 'fallback') { if (-not $blocks.ContainsKey($name)) { throw "runbook block missing: $name" } }

          # CI values for the runbook's variables; the same names, no others.
          $Kit          = $KitDir
          $Anchor       = (Get-Content -LiteralPath (Join-Path $Proof 'anchor.txt') -TotalCount 1).Trim()
          $TrustedPub   = Join-Path $Proof 'release-signing.pub'
          $Registry     = "ghcr.io/$($env:SCRATCH_OWNER.ToLowerInvariant())/qdrant-pdf-rag-devkit-scratch"
          $Robot        = 'ci-robot'
          $ParamFile    = Join-Path $env:RUNNER_TEMP 'bastion.env'
          $RegistryAuth = "$env:TEMP\mfr-devkit-registry-auth.json"
          $OrasCaFile   = ''
          $InstallArgs  = @()
          $runbookNames = [regex]::Matches($blocks['values'], '(?m)^\$(\w+)\s*=') | ForEach-Object { $_.Groups[1].Value } | Sort-Object
          $ciNames = 'Kit', 'Anchor', 'TrustedPub', 'Registry', 'Robot', 'ParamFile', 'RegistryAuth', 'OrasCaFile', 'InstallArgs' | Sort-Object
          if (($runbookNames -join ',') -ne ($ciNames -join ',')) { throw "the runbook values block names $($runbookNames -join ',')" }
          if ($Registry -notmatch '/qdrant-pdf-rag-devkit-scratch$') { throw 'the proof pushes only to the scratch package' }

          # `oc` stand-in. Piped input goes to a native process, so the bytes it
          # records are exactly what PowerShell 5.1 hands `oc exec -i`.
          $env:CI_AUTH_B64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(
              '{"auths":{"ghcr.io":{"auth":"' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:GHCR_USER):$($env:GHCR_TOKEN)")) + '"}}}'))
          # A native `oc` for the fallback's `cmd /c` streaming: cmd.exe cannot see the
          # PowerShell function, so this records the argv and the redirected stdin bytes.
          $NativeBin = Join-Path $env:RUNNER_TEMP 'native-oc'
          New-Item -ItemType Directory -Force -Path $NativeBin | Out-Null
          [IO.File]::WriteAllText((Join-Path $NativeBin 'oc_record.py'), @'
          import os, sys
          from pathlib import Path
          args = sys.argv[1:]
          out = Path(os.environ['CI_FALLBACK_OUT'])
          out.mkdir(parents=True, exist_ok=True)
          with open(out / 'argv.log', 'a', encoding='utf-8') as log:
              log.write(' '.join(args) + '\n')
          targets = [a[len('of=/tmp/kit/'):] for a in args if a.startswith('of=/tmp/kit/')]
          if targets:
              if os.environ.get('CI_FAIL_DD'):
                  sys.exit(1)
              path = out / 'streamed' / targets[0]
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(sys.stdin.buffer.read())
          '@)
          [IO.File]::WriteAllText((Join-Path $NativeBin 'oc.cmd'), "@`"$((Get-Command python).Source)`" `"%~dp0oc_record.py`" %*`r`n")
          $env:PATH = "$NativeBin;$env:PATH"
          $env:CI_FALLBACK_OUT = Join-Path $Out 'fallback'
          $global:CiPushPod = $false
          function oc {
              $a = $args
              $in = @($input)
              Add-Content -LiteralPath $Log -Value ('oc ' + ($a -join ' '))
              $global:LASTEXITCODE = 0
              if ($a[0] -eq 'process') { & $OcExe @a; return }
              # The fallback's pod: `run` fails while one exists, as AlreadyExists does.
              if ($a[0] -eq 'run') { if ($global:CiPushPod) { $global:LASTEXITCODE = 1 } else { $global:CiPushPod = $true }; return }
              if ($a[0] -eq 'delete') { $global:CiPushPod = $false; return }
              if ($a[0] -eq 'exec' -and ($a -contains 'resolve')) { $env:CI_DIGEST; return }
              if ($a[0] -eq 'get') { & python -c "import os;print(os.environ['CI_AUTH_B64'])"; return }
              if ($a[0] -eq 'whoami') { & python -c "print('sha256~' + 'Q' * 43)"; return }
              if ($a[0] -eq 'apply') { $in | & python $Dump (Join-Path $Out 'apply-stdin.bin'); return }
              if ($a[0] -eq 'exec' -and ($a -contains 'mfr-session-login')) {
                  $kind = 'token'; if ($a -contains '--registry') { $kind = 'registry' }
                  $in | & python $Dump (Join-Path $Out "session-$kind.bin"); return
              }
          }
          function Invoke-Step($name) { "== runbook $name"; Invoke-Expression $blocks[$name] }
          function Assert-Stop($name, $pattern) {
              try { Invoke-Expression $blocks[$name]; $ok = $true } catch { $ok = $false; $message = $_.Exception.Message }
              if ($ok -or $message -notmatch $pattern) { throw "$name did not stop with '$pattern' (got '$message')" }
              "== runbook $name refused as expected: $message"
          }

          # Step 1, then the anchor negative control.
          Invoke-Step 'step 1'
          $realAnchor = $Anchor; $Anchor = '0000000000000000'
          Assert-Stop 'step 1' '^STOP: the kit fingerprint does not match the anchor'
          $Anchor = $realAnchor

          # Step 2: oras.exe pushes to the scratch package and reads the digest back.
          Invoke-Step 'step 2'
          if (Test-Path -LiteralPath $RegistryAuth) { throw 'step 2 left the registry credential on disk' }

          # Step 3: UTF-16 and BOM parameter files are refused, by the step and by oc.exe itself.
          $lines = Get-Content -LiteralPath (Join-Path $Proof 'bastion.env')
          $lines | Out-File -LiteralPath $ParamFile
          Assert-Stop 'step 3' '^STOP: the parameter file is UTF-16 or starts with a BOM'
          # Windows PowerShell 5.1 turns redirected native stderr into errors; collect it instead.
          $ErrorActionPreference = 'Continue'
          $refusal = & $OcExe process --local -f (Join-Path $Kit 'bastion.template.yaml') --param-file $ParamFile 2>&1 | Out-String
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($code -eq 0) { throw 'oc.exe accepted a UTF-16 parameter file' }
          "oc.exe refuses the UTF-16 parameter file Out-File writes (exit $code): $($refusal.Trim())"
          [IO.File]::WriteAllText($ParamFile, ([char]0xFEFF + ($lines -join "`r`n") + "`r`n"), (New-Object Text.UTF8Encoding $false))
          Assert-Stop 'step 3' '^STOP: the parameter file is UTF-16 or starts with a BOM'
          [IO.File]::WriteAllLines($ParamFile, [string[]]$lines)
          Invoke-Step 'step 3'

          # Steps 4 and 5 against the stand-in; step 5 pipes a fake credential.
          Invoke-Step 'step 4'
          $env:CI_AUTH_B64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('{"auths":{"quay.example":{"auth":"ZmFrZTpmYWtl"}}}'))
          Invoke-Step 'step 5'
          Get-Content -LiteralPath $Log
          $name = Split-Path -Leaf $Kit
          foreach ($want in "oc cp $name mfr-bastion:/work/kits/$name", 'oc cp release-signing.pub mfr-bastion:/work/trust/release-signing.pub') {
              if (-not (Select-String -LiteralPath $Log -SimpleMatch $want -Quiet)) { throw "step 4 did not run: $want" }
          }

          # The fallback: a stream failure stops and deletes the pod; a pod left by an
          # earlier attempt is removed first; a rerun after success converges; and the
          # bytes cmd.exe redirected into `oc exec -i` equal the kit files.
          $PreviousAgentImage = 'quay.example/mf/qdrant-pdf-rag-agent@sha256:' + ('a' * 64)
          $env:CI_DIGEST = ((Select-String -LiteralPath (Join-Path $Kit 'MANIFEST.txt') -Pattern '^image_digest: ').Line -split ' ')[1]
          $env:CI_FAIL_DD = '1'
          Assert-Stop 'fallback' '^STOP: streaming oras into the pod failed'
          if ($global:CiPushPod) { throw 'a failed fallback left the push pod running' }
          Remove-Item Env:\CI_FAIL_DD
          $global:CiPushPod = $true
          Invoke-Step 'fallback'
          if ($global:CiPushPod) { throw 'the fallback left the push pod running' }
          Invoke-Step 'fallback'
          if (-not (Select-String -LiteralPath (Join-Path $env:CI_FALLBACK_OUT 'argv.log') -SimpleMatch 'exec -i mfr-devkit-push -- dd of=/tmp/kit/oras bs=1M status=none' -Quiet)) { throw 'cmd.exe passed another argv to oc' }
          & python -c "import sys; from pathlib import Path; out, kit = Path(sys.argv[1]) / 'streamed', Path(sys.argv[2]); names = sorted(p.relative_to(out).as_posix() for p in out.rglob('*') if p.is_file()); want = sorted(['oras', 'SHA256SUMS'] + [p.relative_to(kit).as_posix() for p in (kit / 'image').rglob('*') if p.is_file()]); assert names == want, (names, want); assert all((out / n).read_bytes() == (kit / n).read_bytes() for n in names); print('fallback: cmd.exe redirection delivered', len(names), 'kit files byte-for-byte')" $env:CI_FALLBACK_OUT $Kit
          if ($LASTEXITCODE -ne 0) { throw 'the fallback streamed bytes differ from the kit' }

          # What `oc apply -f -` received through the pipe equals the Linux render.
          & python -c "import json,sys; a=open(sys.argv[1],'rb').read(); b=open(sys.argv[2],'rb').read(); assert json.loads(a)==json.loads(b), 'renders differ'; print('render: Windows pipe equals the Linux render as JSON; bytes equal:', a==b, '; Windows CRLF lines:', a.count(b'\r\n'))" (Join-Path $Out 'apply-stdin.bin') (Join-Path $Proof 'linux-render.json')
          if ($LASTEXITCODE -ne 0) { throw 'the Windows render differs from the Linux render' }
          Copy-Item -LiteralPath (Join-Path $Proof 'linux-render.json') -Destination $Out
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: devkit-proof-runbook-out
          path: ${{ runner.temp }}/runbook-out
          retention-days: 3

  session:
    needs: windows
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: devkit-proof-runbook-out
          path: ${{ runner.temp }}/out
      - name: Feed the PowerShell-piped bytes to the real mfr-session-login
        run: |
          set -eu
          OUT="$RUNNER_TEMP/out"
          od -c "$OUT/session-token.bin" | tail -3
          SESSION=/dev/shm/mfr-devkit-proof
          mkdir -p "$SESSION"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/ca.key" -out "$RUNNER_TEMP/ca.crt" -days 1 -subj /CN=proof 2>/dev/null
          MFR_SESSION_DIR="$SESSION" MFR_NAMESPACE=rag-prod MFR_KUBE_CA="$RUNNER_TEMP/ca.crt" \
            python images/devkit/bin/mfr-session-login < "$OUT/session-token.bin"
          MFR_SESSION_DIR="$SESSION" python images/devkit/bin/mfr-session-login --registry < "$OUT/session-registry.bin"
          python - "$SESSION/private" <<'PY'
          import json, sys
          from pathlib import Path
          private = Path(sys.argv[1])
          token = json.loads((private / "kubeconfig").read_text())["users"][0]["user"]["token"]
          assert token == "sha256~" + "Q" * 43, "the token arrived altered"
          auth = json.loads((private / "auth.json").read_text())
          assert auth == {"auths": {"quay.example": {"auth": "ZmFrZTpmYWtl"}}}, "the registry auth arrived altered"
          print("mfr-session-login accepted both PowerShell-piped credentials unchanged")
          PY
          rm -rf "$SESSION"
