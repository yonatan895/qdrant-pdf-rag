name: Verifier update decision
run-name: 'Verifier PR ${{ inputs.pr }}: ${{ inputs.decision }}'
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number whose exact verifier changes you have reviewed'
        required: true
        type: string
      decision:
        description: 'Trust these exact verifier bytes, or revoke prior trust (not a merge approval)'
        required: true
        type: choice
        options: [approve, revoke]
permissions:
  contents: read
  pull-requests: read
jobs:
  record-decision:
    if: github.ref == 'refs/heads/main' && github.actor == 'yonatan895' && github.triggering_actor == 'yonatan895'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Record exact candidate and verifier hashes using approved code
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_PR: ${{ inputs.pr }}
          VERIFIER_DECISION: ${{ inputs.decision }}
        run: >-
          python -m scripts.verifier_approval --pr "$VERIFIER_PR" --decision "$VERIFIER_DECISION"
          --output "$RUNNER_TEMP/evidence.json"
      - name: Retain maintainer decision
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: verifier-decision-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
