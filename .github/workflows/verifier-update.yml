name: Verifier update decision
run-name: >-
  ${{ github.event_name == 'issue_comment'
  && ((github.event.issue.pull_request && github.event.action == 'created'
  && github.event.comment.user.login == 'yonatan895' && startsWith(github.event.comment.body, '/verifier '))
  && format('{0} PR {1}: {2}', contains(github.event.comment.body, ' catalogue-anchors') && 'Catalogue anchors' || 'Verifier',
  github.event.issue.number, startsWith(github.event.comment.body, '/verifier revoke') && 'revoke' || 'approve')
  || 'Verifier comment ignored')
  || format('{0} PR {1}: {2}', inputs.kind == 'catalogue-anchors' && 'Catalogue anchors' || 'Verifier', inputs.pr, inputs.decision) }}
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number whose exact verifier changes you have reviewed'
        required: true
        type: string
      decision:
        description: 'Trust these exact verifier bytes, or revoke prior trust (not a merge approval)'
        required: true
        type: choice
        options: [approve, revoke]
      kind:
        description: 'Implementation bytes, or only catalogue before/after anchors with every obligation retained'
        required: true
        default: implementation
        type: choice
        options: [implementation, catalogue-anchors]
  # Fallback-equivalent PR comment path: "/verifier approve <head-sha> [kind]" or
  # "/verifier revoke [kind]". issue_comment always runs this file from main.
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
jobs:
  # Exactly one job: scripts/verifier_approval.py accepts a run with one successful
  # record-decision job and nothing else. Comment feedback lives in verifier-feedback.yml.
  record-decision:
    if: >-
      github.ref == 'refs/heads/main' && github.actor == 'yonatan895' && github.triggering_actor == 'yonatan895'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issue_comment' && github.event.action == 'created'
      && github.event.issue.pull_request && github.event.comment.user.login == 'yonatan895'
      && github.event.comment.author_association == 'OWNER'
      && startsWith(github.event.comment.body, '/verifier ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.dispatch.outputs.kind || steps.comment.outputs.kind }}
      decision: ${{ steps.comment.outputs.decision }}
      head_sha: ${{ steps.comment.outputs.head_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Record exact candidate and verifier hashes using approved code
        if: github.event_name == 'workflow_dispatch'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_PR: ${{ inputs.pr }}
          VERIFIER_DECISION: ${{ inputs.decision }}
          VERIFIER_KIND: ${{ inputs.kind || 'implementation' }}
        run: >-
          python -m scripts.verifier_approval --pr "$VERIFIER_PR" --decision "$VERIFIER_DECISION"
          --kind "$VERIFIER_KIND"
          --output "$RUNNER_TEMP/evidence.json"
      - name: Record the maintainer PR comment decision using approved code
        if: github.event_name == 'issue_comment'
        id: comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.verifier_approval --from-comment-event --output "$RUNNER_TEMP/evidence.json"
      - name: Retain maintainer decision
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ (steps.dispatch.outputs.kind || steps.comment.outputs.kind) == 'catalogue-anchors' && 'catalogue-anchor-decision' || 'verifier-decision' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
