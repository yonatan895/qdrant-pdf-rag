name: bench
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"
      - ".agents/**"
      - "vendor/**"
  schedule:
    - cron: "37 3 * * *" # nightly, off the hour
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Re-record the baseline instead of checking against it (re-baselining still lands as a dedicated PR)"
        type: boolean
        default: false
      repeats:
        description: "Record path only: measurement passes aggregated to the noise floor (min latency/footprint, max errors)"
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (the pin does not cover pip installs below — they resolve from PyPI at run time)
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - name: run benchmark (real ingest + Qdrant + agent; mock LLM)
        run: |
          ARGS="--collection bench --out bench-results.json --summary bench-summary.md"
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            python scripts/benchmark.py $ARGS --update-baseline bench-baseline.json \
              --repeats "${{ inputs.repeats || '3' }}"
          else
            python scripts/benchmark.py $ARGS --check benchmarks/baseline.json
          fi
      - name: append summary to the job summary
        if: always() && hashFiles('bench-summary.md') != ''
        run: cat bench-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (no runtime-fetched binaries in this job — nothing for the pin to miss)
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            bench-results.json
            bench-summary.md
            bench-baseline.json
