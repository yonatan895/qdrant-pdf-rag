# Executed console browser contracts (#372, #789): the shipped console.js and
# templates in a real headless Chrome against the real FastAPI console routes
# with a scripted LLM. Path-allowlisted to the console surface; other paths run
# nothing. Chrome for Testing and chromedriver are pinned by version and
# archive digest; bump both together in a dedicated change. Any skipped test
# fails the job: a skip is not a pass. Air-gapped GitLab has no browser lane.
name: browser

on:
  pull_request:
    paths:
      - src/mainframe_rag/webui/**
      - tests/console_browser_contracts.py
      - tests/helpers_console_browser.py
      - requirements*.txt
      - locks/**
      - .github/workflows/browser.yml
  schedule:
    - cron: "51 2 * * *" # nightly on main, UTC, off the hour (replaces the path-filtered push run)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CFT_VERSION: "155.0.8059.84"
      CFT_CHROME_SHA256: cf0f049892dea22e6a6db26d47ed0d7776b7158edcbec4634086633df8bafcbc
      CFT_DRIVER_SHA256: 4fe2433044363e5233d642e70fa50278b471bda08032d922402c8bd7c6d743fd
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0; Python packages use the target hash lock below
        with:
          python-version: "3.14"
      - name: Restore verified wheelhouse (exact lock key; acquisition still re-verifies every digest)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/python-wheels/dev
          key: wheelhouse-dev-${{ runner.os }}-${{ hashFiles('requirements.dev.lock.txt', 'locks/cp314-linux-x86_64.json') }}
      - run: python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse .tools/python-wheels/dev --connected --download-workers 8
      - name: Install pinned Chrome for Testing and chromedriver
        run: |
          base="https://storage.googleapis.com/chrome-for-testing-public/$CFT_VERSION/linux64"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o chrome-linux64.zip "$base/chrome-linux64.zip"
          curl -fsSL --retry 3 -o chromedriver-linux64.zip "$base/chromedriver-linux64.zip"
          printf '%s  %s\n' "$CFT_CHROME_SHA256" chrome-linux64.zip "$CFT_DRIVER_SHA256" chromedriver-linux64.zip | sha256sum -c -
          unzip -q chrome-linux64.zip
          unzip -q chromedriver-linux64.zip
          echo "CONSOLE_BROWSER_CHROME=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "CONSOLE_BROWSER_CHROMEDRIVER=$RUNNER_TEMP/chromedriver-linux64/chromedriver" >> "$GITHUB_ENV"
      - name: Run browser contracts
        run: python -m pytest -m browser -p no:cacheprovider --junitxml "$RUNNER_TEMP/browser.xml" tests/console_browser_contracts.py
      - name: Refuse skipped or xfailed contracts
        run: python scripts/check_junit_clean.py "$RUNNER_TEMP/browser.xml"
