name: agent-probes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: agent-probes-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.profile.outputs.required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: profile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXECUTION_SHA: ${{ github.sha }}
        run: |
          python3 scripts/review_tooling.py profile --base "$BASE_SHA" --head "$EXECUTION_SHA" --out "$RUNNER_TEMP/probe-manifest.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'probe-manifest.json').read_text())
          own_inputs = {'tests/live_agent_probes.py', '.github/workflows/agent-probes.yml',
                        'scripts/acceptance_evidence.py', 'scripts/check_live.py', 'tests/test_load_tier.py'}
          required = 'agent_probes' in manifest['required_lanes'] or bool(own_inputs.intersection(manifest['changed_paths']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('required=' + str(required).lower() + '\n')
          PY
  agent-probes:
    needs: select
    if: needs.select.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLOW_HASH_MODE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse .tools/python-wheels/dev --connected
      - name: Explicitly prepare pinned service images
        run: |
          python scripts/qdrant_pin.py --prepare
          python - <<'PY'
          import subprocess
          from pathlib import Path
          line = next(line for line in Path('images.txt').read_text().splitlines()
                      if line.startswith('cr.jaegertracing.io/jaegertracing/jaeger:'))
          tag, digest = line.split()[:2]
          subprocess.run(['docker', 'pull', tag.rsplit(':', 1)[0] + '@' + digest], check=True)
          PY
      - run: sh scripts/tools/install-task.sh
      - run: sh scripts/tools/install-helm.sh
      - run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Verify prepared prerequisites
        run: python scripts/agent_doctor.py --profile load --python "$(command -v python)"
      - name: Run real HTTP probes with native evidence
        run: >-
          python scripts/ci_evidence.py --lane agent_probes --job-name agent-probes
          --output "$RUNNER_TEMP/evidence-agent-probes" --junit "$RUNNER_TEMP/agent-probes.xml" --
          python -m pytest -m integration tests/live_agent_probes.py -v
          --junitxml="$RUNNER_TEMP/agent-probes.xml"
      - name: Retain native probe evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-agent-probes-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-agent-probes
          if-no-files-found: error
