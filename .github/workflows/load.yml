name: load
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lanes: ${{ steps.profile.outputs.lanes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: profile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXECUTION_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/review_tooling.py profile --base "$BASE_SHA" --head "$EXECUTION_SHA"
          --out "$RUNNER_TEMP/dispatch-manifest.json" --github-output "$GITHUB_OUTPUT"

  # Load tier (tests/test_load_tier.py, `sh scripts/tools/run-task.sh qa:load`): the same
  # composition developers run locally — real PDFs -> real hash-mode ingest
  # into docker Qdrant (images.txt pin) -> real uvicorn agent plus the
  # deterministic mock LLM over loopback. Asserts absolute contracts under
  # concurrency (zero errors, SSE integrity, citation parity, Server-Timing
  # presence, fixed error shapes); never cross-environment comparisons.
  # Hash mode needs no model weights, so unlike the sim job there is no
  # BM25 fetch. Fail-closed like sim: missing docker, a skip, or zero
  # passes must fail, not go green.
  # GitHub-only: air-gap GitLab runners cannot pull Docker Hub (AGENTS.md).
  load:
    needs: select
    if: contains(fromJSON(needs.select.outputs.lanes), 'load')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0; Python packages use the target hash lock below
        with:
          python-version: "3.14"
      - name: Install pinned Task runner
        run: |
          sh scripts/tools/install-task.sh
      - name: docker must be present (the tier raises without it — no docker must fail here)
        run: docker version
      # Explicit preparation (verification never installs): the tier runs
      # on the explicitly prepared .venv/bin/python.
      - run: sh scripts/tools/run-task.sh dev:setup
      - run: sh scripts/tools/install-helm.sh
      - run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Prepare approved Qdrant image explicitly
        run: python scripts/qdrant_pin.py --prepare
      - name: run the load tier (fail closed — no skips, at least one pass)
        run: |
          set -o pipefail
          export PYTEST_ADDOPTS="--junitxml=$RUNNER_TEMP/load.xml"
          .venv/bin/python scripts/ci_evidence.py --lane load --job-name load --output "$RUNNER_TEMP/evidence-load" --junit "$RUNNER_TEMP/load.xml" -- \
            sh scripts/tools/run-task.sh qa:load 2>&1 | tee load-output.txt
          if grep -qE '[1-9][0-9]* skipped' load-output.txt; then
            echo "load tests were skipped — coverage must not silently vanish" >&2
            exit 1
          fi
          grep -qE '[1-9][0-9]* passed' load-output.txt || {
            echo "no load tests passed — the tier did not run" >&2
            exit 1
          }
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-load-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-load
          if-no-files-found: error
