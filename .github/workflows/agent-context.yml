name: agent-context
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - '**/AGENTS.override.md'
      - '**/CLAUDE.md'
      - '**/GEMINI.md'
      - '**/CONTEXT.md'
      - 'ROADMAP.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/agent-context.yml'
      - '.github/workflows/opencode.yml'
      - 'scripts/check_agent_context.py'
      - 'scripts/agent_doctor.py'
      - 'scripts/qdrant_pin.py'
      - 'tests/test_agent_context.py'
      - 'tests/test_agent_doctor.py'
      - 'Makefile'
      - '!.agents/**'
      - '!vendor/**'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - '**/AGENTS.override.md'
      - '**/CLAUDE.md'
      - '**/GEMINI.md'
      - '**/CONTEXT.md'
      - 'ROADMAP.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/agent-context.yml'
      - '.github/workflows/opencode.yml'
      - 'scripts/check_agent_context.py'
      - 'scripts/agent_doctor.py'
      - 'scripts/qdrant_pin.py'
      - 'tests/test_agent_context.py'
      - 'tests/test_agent_doctor.py'
      - 'Makefile'
      - '!.agents/**'
      - '!vendor/**'
permissions:
  contents: read

concurrency:
  group: agent-context-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      SHARE: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Existing setup pin; Python is selected by minor version, not a runtime digest.
      # Setup may download that interpreter; the checker/tests install no project dependencies.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: make check-context PY=python
      - run: python -m unittest tests.test_agent_context tests.test_agent_doctor
