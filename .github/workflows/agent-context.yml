name: agent-context
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: agent-context-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    env:
      SHARE: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      # Existing setup pin; Python is selected by minor version, not a runtime digest.
      # Setup may download that interpreter; the checker/tests install no project dependencies.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install pinned Task runner
        run: |
          sh scripts/tools/install-task.sh
      - run: sh scripts/tools/run-task.sh qa:context PY=python
      - name: Run dependency-free context tests with execution evidence
        env:
          TASK_CONTRACTS_REQUIRE_RUNNER: '1'
        run: >-
          python scripts/ci_evidence.py --lane context_check --job-name check-context
          --output "$RUNNER_TEMP/evidence-context"
          --unittest tests.test_agent_context tests.test_agent_doctor tests.test_taskfile_contracts
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-context-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-context
          if-no-files-found: error
