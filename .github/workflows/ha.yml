name: ha
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ha-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lanes: ${{ steps.profile.outputs.lanes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: profile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXECUTION_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/review_tooling.py profile --base "$BASE_SHA" --head "$EXECUTION_SHA"
          --out "$RUNNER_TEMP/dispatch-manifest.json" --github-output "$GITHUB_OUTPUT"

  # Multi-peer placement/fault lane (tests/test_ha_cluster.py, `sh scripts/tools/run-task.sh qa:ha`):
  # starts the pinned Qdrant image (images.txt) as a real three-peer cluster
  # with separate storage and the checked-in production tuple (6 shards /
  # RF 3 / W 2), then asserts actual per-shard placement, refusal of a
  # false-HA RF1 corpus+control pair, degraded reads and healthy rejoin
  # after stopping one peer, and exact point identity through survivors.
  # Fail-closed like sim/load: missing docker, a skip, or zero passes must
  # fail, not go green. Three containers on one runner prove distributed
  # software behavior only — never independent-worker or site tolerance.
  # Path-filtered (unrelated changes must not pay for the lane) and
  # GitHub-only: air-gap GitLab runners cannot pull Docker Hub.
  ha:
    needs: select
    if: contains(fromJSON(needs.select.outputs.lanes), 'ha')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0; Python packages use the target hash lock below
        with:
          python-version: "3.14"
      - name: Install pinned Task runner
        run: |
          sh scripts/tools/install-task.sh
      - name: docker must be present (the lane raises without it — no docker must fail here)
        run: docker version
      # Explicit preparation (verification never installs): the lane runs on
      # the explicitly prepared .venv/bin/python.
      - run: sh scripts/tools/run-task.sh dev:setup
      - run: sh scripts/tools/install-helm.sh
      - run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Prepare approved Qdrant image explicitly
        run: python scripts/qdrant_pin.py --prepare
      - name: run the three-peer HA lane (fail closed — no skips, at least one pass)
        run: |
          set -o pipefail
          export PYTEST_ADDOPTS="--junitxml=$RUNNER_TEMP/ha.xml"
          .venv/bin/python scripts/ci_evidence.py --lane ha --job-name ha --output "$RUNNER_TEMP/evidence-ha" --junit "$RUNNER_TEMP/ha.xml" -- \
            sh scripts/tools/run-task.sh qa:ha 2>&1 | tee ha-output.txt
          if grep -qE '[1-9][0-9]* skipped' ha-output.txt; then
            echo "HA tests were skipped — coverage must not silently vanish" >&2
            exit 1
          fi
          grep -qE '[1-9][0-9]* passed' ha-output.txt || {
            echo "no HA tests passed — the lane did not run" >&2
            exit 1
          }
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-ha-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-ha
          if-no-files-found: error
