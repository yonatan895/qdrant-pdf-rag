# Connected-path E2E (issue #8): build the real Containerfiles, push to GHCR on
# main, and smoke-test synthetic demo PDFs against a lab OpenShift namespace.
# Synthetic PDFs only — generated in-cluster by the ingest Job. Never upload
# them as artifacts, never commit them (hygiene job enforces that).
#
# Image scheme (single source of truth, issue #8):
#   ghcr.io/<owner-lowercase>/qdrant-pdf-rag-{ingest,agent}:<shortsha>
# built via `docker tag` from the Makefile's local tags, pushed on
# main/dispatch, and applied via the kustomize `ghcr.io/OWNER` sed.
#
# Prereqs (README "Connected E2E"): GHCR packages public (anonymous pull from
# the lab cluster), OPENSHIFT_SERVER/OPENSHIFT_TOKEN secrets. curlimages/curl
# is pulled from Docker Hub — allowed on the connected lab cluster only.
#
# Air-gapped GitLab deliberately has no equivalent of this workflow: no GHCR,
# no lab cluster from the air-gap (see .gitlab-ci.yml comment).
name: e2e

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  INGEST_IMAGE_LOCAL: mainframe-rag/ingest
  AGENT_IMAGE_LOCAL: mainframe-rag/agent

jobs:
  # ---------------------------------------------------------------- build
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.refs.outputs.sha }}
      ingest_image: ${{ steps.refs.outputs.ingest }}
      agent_image: ${{ steps.refs.outputs.agent }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pin does not cover runtime-fetched oc/skopeo below)

      # cp314 wheels require a 3.14 interpreter for the wheelhouse build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build wheelhouse + BM25 weights + images (same Containerfiles as air-gap)
        run: |
          PYBIN="$(command -v python3.14 || command -v python)"
          echo "Using python: $PYBIN"
          make wheelhouse bm25-weights PY="$PYBIN"
          make build-images IMAGE_TAG="$GITHUB_SHA"

      - id: refs
        run: |
          SHA="$GITHUB_SHA"
          # Issue #8 scheme: ghcr.io/<owner-lowercase>/qdrant-pdf-rag-<name>:<sha>.
          # This exact string is used for docker tag, docker push, and the
          # kustomize sed — keep them identical.
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ingest=ghcr.io/${OWNER_LC}/qdrant-pdf-rag-ingest:$SHA" >> "$GITHUB_OUTPUT"
          echo "agent=ghcr.io/${OWNER_LC}/qdrant-pdf-rag-agent:$SHA" >> "$GITHUB_OUTPUT"

      # Retag local build outputs to the GHCR refs BEFORE pushing. PRs: build
      # without push (no GHCR write from forks). main/dispatch: tag + push.
      - name: Push to GHCR
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.refs.outputs.sha }}
          INGEST_IMAGE: ${{ steps.refs.outputs.ingest }}
          AGENT_IMAGE: ${{ steps.refs.outputs.agent }}
        run: |
          docker tag "${INGEST_IMAGE_LOCAL}:${SHA}" "$INGEST_IMAGE"
          docker tag "${AGENT_IMAGE_LOCAL}:${SHA}" "$AGENT_IMAGE"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$INGEST_IMAGE"
          docker push "$AGENT_IMAGE"

  # ---------------------------------------------------- sneakernet packaging
  # Automates the sneakernet release factory (issue #15): packages the bundle
  # and all 4 pinned images on every merge to main (or manual dispatch),
  # generating the transfer certificate and uploading the tarball + digests as
  # a downloadable workflow artifact.
  airgap-package:
    needs: [build]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: airgap-pack
        env:
          IMAGE_SHA: ${{ needs.build.outputs.sha }}
          # Production trust comes from the SNEAKERNET_SIGNING_KEY secret
          # (PEM private key; pubkey ceremony in docs/install_and_ops.md).
          # Until a maintainer stores it, pack with an ephemeral throwaway
          # key so the sign/verify plumbing still executes end to end.
          SNEAKERNET_SIGNING_KEY: ${{ secrets.SNEAKERNET_SIGNING_KEY }}
        run: |
          if [ -z "$SNEAKERNET_SIGNING_KEY" ]; then
            echo "::warning::SNEAKERNET_SIGNING_KEY secret unset — packing with an ephemeral throwaway key (plumbing only, no trust; MANIFEST records signed: ephemeral)"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/signing.key"
            export SNEAKERNET_SIGNING_KEY="$RUNNER_TEMP/signing.key"
          else
            printf '%s' "$SNEAKERNET_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
            openssl pkey -in "$RUNNER_TEMP/signing.key" -noout || {
              echo "::error::SNEAKERNET_SIGNING_KEY is not a valid PEM private key (store real newlines, not backslash-escaped ones)"
              exit 1
            }
            export SNEAKERNET_SIGNING_KEY="$RUNNER_TEMP/signing.key"
            export SNEAKERNET_KEY_TRUSTED=true
          fi
          make airgap-pack
          ls -la dist/
          cat dist/MANIFEST.txt
          cat dist/PACKING_RECORD.txt

      - name: Upload sneakernet bundle artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sneakernet-bundle-${{ needs.build.outputs.sha }}
          path: |
            dist/qdrant-pdf-rag-*.tar
            dist/qdrant-pdf-rag-*.tar.sha256
            dist/PACKING_RECORD.txt
            dist/MANIFEST.txt
          retention-days: 90

  # --------------------------- air-gap handoff acceptance (black box)
  # Consumes the sneakernet tarball EXACTLY like a bastion operator: fresh
  # empty dir, digest verify BEFORE unpack, bootstrap.sh, then the operator
  # runbook from the bootstrapped clone (validate + full pipeline dry-run).
  # This is the only job that traverses pack -> tarball -> bootstrap.sh ->
  # ARTDIR/MANIFEST discovery; airgap-rehearsal reuses the pack checkout's
  # dist/ and never exercises this handoff. No secrets, no cluster.
  airgap-acceptance:
    needs: [build, airgap-package]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - name: Install helm (vendored-chart deploy)
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Install pinned kubectl (kustomize render + patch --local)
        run: |
          KUBECTL_VERSION=v1.31.2
          # sha256 recorded in-repo (AGENTS.md §6): dl.k8s.io checksum file.
          KUBECTL_SHA256=399e9d1995da80b64d2ef3606c1a239018660d8b35209fba3f7b0bc11c631c68
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Download sneakernet bundle (this is what the operator receives)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (verified via API: v4 tag; fetches nothing at runtime — artifact bytes only)
        with:
          name: sneakernet-bundle-${{ env.SHA }}
          path: gapbox/

      - name: Black-box handoff (verify, unpack, bootstrap, runbook)
        env:
          IMAGE_SHA: ${{ env.SHA }}
        run: |
          cd gapbox
          sha256sum -c "qdrant-pdf-rag-${SHA}.tar.sha256"
          tar xf "qdrant-pdf-rag-${SHA}.tar"
          AIRGAP_WORKSPACE=qdrant-pdf-rag sh bootstrap.sh
          # The bootstrapped layout must satisfy ARTDIR discovery on its own.
          test -f qdrant-pdf-rag/dist/SHA256SUMS
          (cd qdrant-pdf-rag/dist && sha256sum -c SHA256SUMS)
          test -f qdrant-pdf-rag/dist/sbom.json
          test -f qdrant-pdf-rag/dist/SHA256SUMS.sig
          test -f qdrant-pdf-rag/dist/sneakernet-signing.pub
          test "$(git -C qdrant-pdf-rag rev-parse HEAD)" = "$SHA"
          test "$(awk '/^sha: /{print $2}' qdrant-pdf-rag/dist/MANIFEST.txt)" = "$SHA"
          cd qdrant-pdf-rag
          # Operator-equivalent airgap.env edits (dry-run stand-ins, never prod).
          sed -i \
            -e 's|^INTERNAL_REGISTRY=.*|INTERNAL_REGISTRY=ghcr.io/acceptance-standin|' \
            -e 's|^NAMESPACE=.*|NAMESPACE=acceptance|' \
            -e 's|^STORAGE_CLASS=.*|STORAGE_CLASS=standard|' \
            -e 's|^IMAGE_SHA=.*|IMAGE_SHA='"$SHA"'|' \
            -e 's|^EMBED_MODEL=.*|EMBED_MODEL=embed-from-airgap-env|' \
            -e 's|^DENSE_DIM=.*|DENSE_DIM=768|' \
            -e 's|^VLLM_BASE_URL=.*|VLLM_BASE_URL=http://vllm:8000|' \
            -e 's|^CORPUS_PVC=.*|CORPUS_PVC=corpus|' \
            airgap.env
          AIRGAP_DRYRUN=1 make airgap-validate
          make airgap-dryrun
          test -f dist/agent-rendered.yaml
          test -f dist/ingest-rendered.yaml
          grep -q "ghcr.io/acceptance-standin/qdrant-pdf-rag-agent:${SHA}" dist/agent-rendered.yaml
          grep -q "imagePullSecrets: \[\]" dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/ingest-rendered.yaml
          # Second PULL_SECRET branch: a wired secret reaches the manifests.
          sed -i 's|^PULL_SECRET=.*|PULL_SECRET=acceptance-pull|' airgap.env
          AIRGAP_DRYRUN=1 make airgap-deploy
          grep -q "name: acceptance-pull" dist/agent-rendered.yaml

  # --------------------------------------- kind full-live handoff rehearsal
  # The layout-faithful tier: consumes the sneakernet tarball in a fresh
  # empty dir (verify, unpack, bootstrap.sh) and runs the REAL operator
  # runbook — live validate, live pipeline (load, deploy, ingest, smoke) —
  # against an ephemeral Kind cluster with a local HTTP registry. No lab
  # secrets (GITHUB_TOKEN is automatic and only mints the GHCR pull secret
  # for the wired-PULL_SECRET branch); the tarball artifact plus public pins
  # are the only other inputs. airgap-acceptance proves the handoff
  # statically (dry-run);
  # this job proves the deployment comes up from a bootstrapped clone.
  # CI-only sizing (single replica, Gi sizes): a CI runner cannot schedule
  # the 3x16Gi prod Qdrant (proven: Insufficient memory on one node), so the
  # documented local-testing overrides apply; git prod values are untouched.
  kind-live-rehearsal:
    needs: [build, airgap-package]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - name: Install helm (vendored-chart deploy)
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Install pinned kubectl (kustomize render + patch --local)
        run: |
          KUBECTL_VERSION=v1.31.2
          # sha256 recorded in-repo (AGENTS.md §6): dl.k8s.io checksum file.
          KUBECTL_SHA256=399e9d1995da80b64d2ef3606c1a239018660d8b35209fba3f7b0bc11c631c68
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Install skopeo (pack/load)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Install pinned kind (ephemeral air-gap-like cluster)
        run: |
          KIND_VERSION=v0.33.0
          # sha256 recorded in-repo (AGENTS.md §6): kind-linux-amd64 release asset digest.
          KIND_SHA256=aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          curl -fsSL -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Download sneakernet bundle (this is what the operator receives)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (verified via API: v4 tag; fetches nothing at runtime — artifact bytes only)
        with:
          name: sneakernet-bundle-${{ env.SHA }}
          path: gapbox/

      - name: Start local registry + Kind (containerd mirror, digest-pinned node)
        run: |
          # CI-only scaffolding (same class as the curlimages/curl probe in
          # openshift-e2e): an ephemeral localhost HTTP registry; prod uses
          # the operator's INTERNAL_REGISTRY with TLS. Digest verified by
          # local pull (distribution registry 2.8.3).
          docker run -d --restart=always --name kind-registry -p 5000:5000 registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          cat > "$RUNNER_TEMP/kind-config.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
          containerdConfigPatches:
            - |-
              [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
                endpoint = ["http://kind-registry:5000"]
          EOF
          # Digest-pinned node image (kind upstream insists on @sha256 for reproducibility).
          kind create cluster --name gapbox --config "$RUNNER_TEMP/kind-config.yaml" \
            --image "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
          docker network connect kind kind-registry || true
          kubectl cluster-info

      - name: Install pinned local-path provisioner (explicit StorageClass)
        run: |
          # Pinned manifest (rancher local-path-provisioner v0.0.37): same
          # namespace/deployment names as kind's built-in provisioner, so
          # this upgrades it in place and adds the `local-path`
          # StorageClass — no duplicate provisioner, no ambient defaults.
          kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
          kubectl -n local-path-storage rollout status deploy/local-path-provisioner --timeout=180s
          kubectl get storageclass local-path

      - name: Black-box handoff (verify, unpack, bootstrap)
        env:
          IMAGE_SHA: ${{ env.SHA }}
        run: |
          cd gapbox
          sha256sum -c "qdrant-pdf-rag-${SHA}.tar.sha256"
          tar xf "qdrant-pdf-rag-${SHA}.tar"
          AIRGAP_WORKSPACE=qdrant-pdf-rag sh bootstrap.sh
          test -f qdrant-pdf-rag/dist/SHA256SUMS
          (cd qdrant-pdf-rag/dist && sha256sum -c SHA256SUMS)
          test -f qdrant-pdf-rag/dist/sbom.json
          test -f qdrant-pdf-rag/dist/SHA256SUMS.sig
          test -f qdrant-pdf-rag/dist/sneakernet-signing.pub
          test "$(git -C qdrant-pdf-rag rev-parse HEAD)" = "$SHA"
          test "$(awk '/^sha: /{print $2}' qdrant-pdf-rag/dist/MANIFEST.txt)" = "$SHA"

      - name: Operator airgap.env (Kind stand-ins, never prod values)
        env:
          IMAGE_SHA: ${{ env.SHA }}
        run: |
          cd gapbox/qdrant-pdf-rag
          NS="rag-kind-$(echo "$SHA" | cut -c1-12)"
          echo "NS=$NS" >> "$GITHUB_ENV"
          sed -i \
            -e 's|^INTERNAL_REGISTRY=.*|INTERNAL_REGISTRY=localhost:5000|' \
            -e "s|^NAMESPACE=.*|NAMESPACE=$NS|" \
            -e 's|^STORAGE_CLASS=.*|STORAGE_CLASS=local-path|' \
            -e 's|^IMAGE_SHA=.*|IMAGE_SHA='"$SHA"'|' \
            -e 's|^EMBED_MODEL=.*|EMBED_MODEL=mock-embed|' \
            -e 's|^DENSE_DIM=.*|DENSE_DIM=64|' \
            -e 's|^VLLM_BASE_URL=.*|VLLM_BASE_URL=http://vllm-mock:8000|' \
            -e 's|^CORPUS_PVC=.*|CORPUS_PVC=corpus|' \
            -e 's|^# INSECURE_REGISTRY=false.*|INSECURE_REGISTRY=true|' \
            airgap.env
          grep -E "^(INTERNAL_REGISTRY|NAMESPACE|STORAGE_CLASS|IMAGE_SHA|EMBED_MODEL|DENSE_DIM|VLLM_BASE_URL|CORPUS_PVC|INSECURE_REGISTRY)" airgap.env

      - name: Write Kind-scale Qdrant overrides (runner quota only; git prod values untouched)
        run: |
          cat > "$RUNNER_TEMP/qdrant-kind-scale.yaml" <<'EOF'
          # Rehearsal-only: a CI runner cannot schedule the 3x16Gi prod
          # Qdrant (Insufficient memory on one node — proven locally).
          replicaCount: 1
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          EOF
          echo "QDRANT_EXTRA_VALUES=$RUNNER_TEMP/qdrant-kind-scale.yaml" >> "$GITHUB_ENV"

      - name: Write Kind-scale ingest patch (same quota; prod Job asks 4cpu/8Gi)
        run: |
          cat > "$RUNNER_TEMP/ingest-kind-scale.json" <<'EOF'
          {"spec":{"template":{"spec":{"containers":[{"name":"ingest","resources":{"requests":{"cpu":"250m","memory":"512Mi"},"limits":{"cpu":"1","memory":"1Gi"}}}]}}}}
          EOF
          echo "INGEST_EXTRA_PATCH=$RUNNER_TEMP/ingest-kind-scale.json" >> "$GITHUB_ENV"

      - name: airgap-load (fill the Kind registry BEFORE any pod pulls it)
        run: |
          cd gapbox/qdrant-pdf-rag
          make airgap-load

      - name: Deploy mock vLLM (deterministic embeddings stand-in)
        run: |
          cd gapbox/qdrant-pdf-rag
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NS" create configmap mock-vllm --from-file=mock_vllm.py=scripts/mock_vllm.py
          kubectl apply -n "$NS" -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vllm-mock
            labels: {app: vllm-mock}
          spec:
            replicas: 1
            selector: {matchLabels: {app: vllm-mock}}
            template:
              metadata: {labels: {app: vllm-mock}}
              spec:
                containers:
                  - name: mock
                    # Tarball-faithful: loaded from the bundle, like the
                    # corpus-gen image below — never a GHCR pull.
                    image: localhost:5000/qdrant-pdf-rag-ingest:${SHA}
                    command: ["python3", "/cm/mock_vllm.py"]
                    env:
                      - {name: MOCK_DIM, value: "64"}
                      - {name: PORT, value: "8000"}
                    ports: [{containerPort: 8000}]
                    readinessProbe:
                      httpGet: {path: /healthz, port: 8000}
                      initialDelaySeconds: 2
                    resources:
                      requests: {cpu: "50m", memory: 128Mi}
                      limits: {cpu: "500m", memory: 256Mi}
                    volumeMounts: [{name: mock, mountPath: /cm}]
                volumes:
                  - name: mock
                    configMap: {name: mock-vllm}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: vllm-mock
          spec:
            selector: {app: vllm-mock}
            ports: [{port: 8000, targetPort: 8000}]
          EOF
          kubectl -n "$NS" rollout status deploy/vllm-mock --timeout=180s

      - name: Create GHCR pull secret (wired PULL_SECRET branch, live)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd gapbox/qdrant-pdf-rag
          kubectl -n "$NS" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GITHUB_TOKEN"
          sed -i 's|^PULL_SECRET=.*|PULL_SECRET=ghcr-pull|' airgap.env
          grep -q "^PULL_SECRET=ghcr-pull" airgap.env

      - name: airgap-validate LIVE (cluster, StorageClass, MANIFEST match)
        run: |
          cd gapbox/qdrant-pdf-rag
          make airgap-validate

      - name: Generate corpus PVC + demo PDFs (operator-supplied corpus step)
        run: |
          cd gapbox/qdrant-pdf-rag
          kubectl -n "$NS" apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata: {name: corpus}
          spec:
            accessModes: ["ReadWriteOnce"]
            resources: {requests: {storage: 1Gi}}
            storageClassName: local-path
          ---
          apiVersion: batch/v1
          kind: Job
          metadata: {name: corpus-gen}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: gen
                    # Tarball-faithful: this image came out of the sneakernet
                    # bundle via airgap-load, not from GHCR.
                    image: localhost:5000/qdrant-pdf-rag-ingest:${SHA}
                    command: ["/bin/sh", "-ec"]
                    args:
                      - |
                        python3 /app/scripts/make_synthetic_pdf.py --out /corpus/SA22-0000-00_outline.pdf
                        python3 /app/scripts/make_synthetic_pdf.py --plain --out /corpus/plain-widget-notes.pdf
                        ls -la /corpus
                    volumeMounts: [{name: corpus, mountPath: /corpus}]
                volumes:
                  - name: corpus
                    persistentVolumeClaim: {claimName: corpus}
          EOF
          kubectl -n "$NS" wait --for=condition=complete job/corpus-gen --timeout=300s

      - name: airgap-pipeline LIVE (deploy, ingest, smoke; registry pre-loaded)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          QDRANT_STORAGE_SIZE: 1Gi
          INGEST_WORK_SIZE: 2Gi
          INGEST_TIMEOUT: "900"
        run: |
          cd gapbox/qdrant-pdf-rag
          # Images are already in the Kind registry from the airgap-load
          # step above (mock and corpus-gen pods pulled them); skip the
          # second push — same flag an operator re-running pipeline uses.
          sh scripts/airgap/pipeline.sh --skip-load

      - name: Expected-substring acceptance
        run: |
          cd gapbox/qdrant-pdf-rag
          NS="$(grep '^NAMESPACE=' airgap.env | cut -d= -f2)"
          kubectl -n "$NS" exec deploy/rag-agent -- \
            python3 /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "IEA500I operator message" --expect "IEA500I"
          kubectl -n "$NS" exec deploy/rag-agent -- \
            python3 /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "torque the widget screws" --expect "torque"

      - name: Failure diagnostics (pods, events, logs)
        if: failure()
        run: |
          NS="$(grep '^NAMESPACE=' gapbox/qdrant-pdf-rag/airgap.env | cut -d= -f2)"
          kubectl -n "$NS" get pods,pvc,svc,jobs -o wide || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n "$NS" logs statefulset/qdrant --all-containers --tail=50 || true
          kubectl -n "$NS" logs deploy/rag-agent --all-containers --tail=100 || true
          kubectl -n "$NS" logs job/ingest --tail=100 || true

      - name: Delete Kind cluster (ephemeral, always)
        if: always()
        run: |
          kind delete cluster --name gapbox || true
          docker rm -f kind-registry || true

  # ------------------------------------------------- secret gate (fork-safe)
  e2e-secrets-check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          if [ -n "$SERVER" ] && [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "OPENSHIFT_SERVER / OPENSHIFT_TOKEN not set; e2e will be skipped."
          fi

  # ---------------------------------------------------------- lab OpenShift
  openshift-e2e:
    needs: [build, e2e-secrets-check]
    if: >-
      needs.e2e-secrets-check.outputs.ok == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pin does not cover runtime-fetched oc/skopeo below)

      - name: Install helm + oc
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@144527c7d98999f2652264c048c7a9bd103f8a82 # v1 (the installer fetches oc at run time — supply-chain surface, see AGENTS.md §6)
        with:
          oc: "4"

      - name: Log in to lab OpenShift
        run: oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true

      - name: Create ephemeral namespace
        run: |
          NS="rag-ci-${SHA}"
          echo "NS=$NS" >> "$GITHUB_ENV"
          oc new-project "$NS"
          oc label namespace "$NS" app.kubernetes.io/managed-by=e2e-workflow ephemeral=true

      - name: Deploy Qdrant (CI overlay — 1 replica, 1Gi, unprivileged, ClusterIP)
        run: |
          helm upgrade -i qdrant charts/qdrant-*.tgz -n "$NS" -f overlays/ci/values.yaml
          kubectl -n "$NS" rollout status statefulset/qdrant --timeout=300s

      - name: Wait for Qdrant readyz
        run: |
          for i in $(seq 1 30); do
            if kubectl -n "$NS" run readycheck-"$i" --image=curlimages/curl --restart=Never \
                 --command -- curl -sf http://qdrant:6333/readyz; then
              break
            fi
            kubectl -n "$NS" delete pod readycheck-"$i" --ignore-not-found
            [ "$i" = 30 ] && exit 1
            sleep 10
          done

      # GHCR packages must be PUBLIC (repo Settings -> Packages) so the lab
      # cluster can pull anonymously; alternatively create an imagePullSecret
      # from a fine-grained PAT with oc create secret (token never in git).
      - name: Apply agent + ingest Job (kustomize overlay, sha-tagged GHCR images)
        env:
          KUSTOMIZE_OWNER_PLACEHOLDER: ghcr.io/OWNER
          KUSTOMIZE_TAG_PLACEHOLDER: ":ci"
          KUSTOMIZE_NS_PLACEHOLDER: "namespace: rag-ci"
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')"
          kubectl kustomize deploy/kustomize/overlays/ci \
            | sed -e "s|$KUSTOMIZE_OWNER_PLACEHOLDER|ghcr.io/${OWNER_LC}|g" \
                  -e "s|$KUSTOMIZE_TAG_PLACEHOLDER|:${SHA}|g" \
                  -e "s|$KUSTOMIZE_NS_PLACEHOLDER|namespace: rag-ci-${SHA}|g" \
            | kubectl apply -f -

      - name: Wait for ingest Job (generates demo PDFs, ingests with EMBED_MODE=hash)
        run: |
          if ! kubectl -n "$NS" wait --for=condition=complete job/ingest --timeout=600s; then
            echo "::error::ingest Job failed"
            kubectl -n "$NS" logs job/ingest --tail=200 || true
            kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -30 || true
            exit 1
          fi

      - name: Wait for agent readiness
        run: kubectl -n "$NS" rollout status deploy/rag-agent --timeout=300s

      # Smoke 1: outline PDF — message id found (hybrid search, hash embeddings).
      - name: Smoke — IEA500I from outline demo PDF
        run: |
          kubectl -n "$NS" exec deploy/rag-agent -- \
            python /app/scripts/smoke_search.py \
              --url http://rag-agent:8080 --query "IEA500I operator message" --expect "IEA500I"

      # Smoke 2: plain generic PDF — lexical hit for widget/torque prose.
      - name: Smoke — torque/widget text from plain demo PDF
        run: |
          kubectl -n "$NS" exec deploy/rag-agent -- \
            python /app/scripts/smoke_search.py \
              --url http://rag-agent:8080 --query "torque the widget screws" --expect "torque"

      - name: Failure diagnostics (pods, events, logs)
        if: failure()
        run: |
          kubectl -n "$NS" get pods,pvc,svc,jobs -o wide || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n "$NS" describe statefulset/qdrant deploy/rag-agent 2>/dev/null | tail -60 || true
          kubectl -n "$NS" logs statefulset/qdrant --all-containers --tail=50 || true
          kubectl -n "$NS" logs deploy/rag-agent --all-containers --tail=100 || true
          kubectl -n "$NS" logs job/ingest --tail=100 || true

      - name: Delete ephemeral namespace
        if: always()
        run: |
          oc delete project "$NS" --wait=false --ignore-not-found || \
            kubectl delete namespace "$NS" --ignore-not-found --wait=false || true

  # --------------------------------- air-gap config dry-run (no cluster, no secrets)
  # Runs the REAL airgap scripts with AIRGAP_DRYRUN=1 on every PR: renders the
  # PROD agent + ingest manifests, enforces the placeholder fail-close, the
  # SHA rules, both PULL_SECRET branches, and the size-knob flow. Proves the
  # deployment CONFIG with zero secrets and zero cluster; the live rehearsal
  # (below, secrets-gated) proves the deployment comes up. A true in-runner
  # OpenShift is not feasible (CRC needs KVM; microshift-aio abandoned 2022),
  # so this is the PR-level gate for the air-gap path.
  airgap-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install helm (vendored-chart deploy)
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Install pinned kubectl (kustomize render + patch --local)
        run: |
          KUBECTL_VERSION=v1.31.2
          # sha256 recorded in-repo (AGENTS.md §6): dl.k8s.io checksum file.
          KUBECTL_SHA256=399e9d1995da80b64d2ef3606c1a239018660d8b35209fba3f7b0bc11c631c68
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: airgap-deploy dry-run (prod render, fail-closed placeholders, knobs)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          VLLM_BASE_URL: http://vllm:8000
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          make airgap-deploy
          test -f dist/agent-rendered.yaml
          grep -q "ghcr.io/dryrun-standin/qdrant-pdf-rag-agent:${SHA}" dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/agent-rendered.yaml

      - name: airgap-deploy dry-run with PULL_SECRET + extra values
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          VLLM_BASE_URL: http://vllm:8000
          PULL_SECRET: ci-pull
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          printf 'resources:\n  requests: {cpu: "100m", memory: 256Mi}\n' > "$RUNNER_TEMP/vals.yaml"
          export QDRANT_EXTRA_VALUES="$RUNNER_TEMP/vals.yaml"
          out="$(make airgap-deploy)"
          echo "$out" | grep -q "persistence.size=1Gi"
          echo "$out" | grep -q "imagePullSecrets\[0\].name=ci-pull"
          grep -q "name: ci-pull" dist/agent-rendered.yaml

      - name: airgap-deploy dry-run fails closed on a bad extra-values file
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          VLLM_BASE_URL: http://vllm:8000
          QDRANT_EXTRA_VALUES: /nonexistent/vals.yaml
        run: |
          if make airgap-deploy 2>err.log; then
            echo "::error::deploy.sh did not fail on a missing QDRANT_EXTRA_VALUES file"
            exit 1
          fi
          grep -q "QDRANT_EXTRA_VALUES file not found" err.log

      - name: airgap-deploy dry-run with tracing enabled (Jaeger render, issue #83)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          VLLM_BASE_URL: http://vllm:8000
          OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          make airgap-deploy
          test -f dist/jaeger-rendered.yaml
          grep -q "ghcr.io/dryrun-standin/jaegertracing/jaeger:v2.20.0" dist/jaeger-rendered.yaml
          grep -q "storageClassName: standard" dist/jaeger-rendered.yaml
          grep -q 'value: http://jaeger:4318' dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/jaeger-rendered.yaml

      - name: airgap-ingest dry-run (prod ingest render + patch knob)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          CORPUS_PVC: corpus
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          VLLM_BASE_URL: http://vllm:8000
          INGEST_WORK_SIZE: 2Gi
        run: |
          cat > "$RUNNER_TEMP/ingest-patch.json" <<'EOF'
          {"spec":{"template":{"spec":{"containers":[{"name":"ingest","resources":{"requests":{"cpu":"250m","memory":"512Mi"},"limits":{"cpu":"1","memory":"1Gi"}}}]}}}}
          EOF
          export INGEST_EXTRA_PATCH="$RUNNER_TEMP/ingest-patch.json"
          make airgap-ingest
          test -f dist/ingest-rendered.yaml
          grep -q "ghcr.io/dryrun-standin/qdrant-pdf-rag-ingest:${SHA}" dist/ingest-rendered.yaml
          grep -q "cpu: 250m" dist/ingest-rendered.yaml   # INGEST_EXTRA_PATCH applied
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/ingest-rendered.yaml

      - name: make airgap-dryrun (full pipeline dry-run incl. validate/load/smoke)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          VLLM_BASE_URL: http://vllm:8000
          CORPUS_PVC: corpus
        run: |
          make airgap-dryrun
          test -f dist/agent-rendered.yaml
          test -f dist/ingest-rendered.yaml

  # ---------------------------------------------- air-gap runbook rehearsal
  # Rehearses the OPERATOR RUNBOOK (issue #15) against the lab OpenShift, so
  # CI-green proves the air-gap deployment path works at the packed SHA:
  #   airgap-pack -> airgap-load (INTERNAL_REGISTRY stand-in: GHCR)
  #   -> airgap-deploy (PROD kustomize overlay + prod Helm values)
  #   -> airgap-ingest (corpus PVC) -> airgap-smoke.
  # CI-only stand-ins, never in git prod values (see the size knobs in
  # scripts/airgap/deploy.sh + ingest.sh):
  #   - GHCR plays INTERNAL_REGISTRY (node-side HTTP registry config is a
  #     cluster-admin operation the lab does not grant).
  #   - scripts/mock_vllm.py plays the owning team's vLLM endpoint: same API
  #     shape, deterministic vectors — the airgap scripts refuse
  #     EMBED_MODE=hash, so the prod embed path stays honest.
  #   - QDRANT_STORAGE_SIZE / QDRANT_EXTRA_VALUES / INGEST_WORK_SIZE /
  #     INGEST_EXTRA_PATCH shrink PVCs and resources for lab quota.
  #   - PULL_SECRET (ghcr-pull) is wired into deploy/ingest: load pushes the
  #     qdrant image to a fresh (private) GHCR package, so anonymous pull
  #     would ImagePullBackoff.
  airgap-rehearsal:
    needs: [build, e2e-secrets-check]
    if: >-
      needs.e2e-secrets-check.outputs.ok == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      SHA: ${{ needs.build.outputs.sha }}
      AGENT_IMAGE: ${{ needs.build.outputs.agent_image }}
      INGEST_IMAGE: ${{ needs.build.outputs.ingest_image }}
    steps:
      # Full history: airgap-pack bundles the repo with `git bundle create
      # ... HEAD --all`, and a --depth 1 clone produces a bundle whose clone
      # fails to traverse parents — CI would certify an unclonable artifact.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pin does not cover runtime-fetched oc/skopeo below)
        with:
          fetch-depth: 0

      - name: Install helm, oc, skopeo
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
      - uses: redhat-actions/openshift-tools-installer@144527c7d98999f2652264c048c7a9bd103f8a82 # v1 (the installer fetches oc at run time — supply-chain surface, see AGENTS.md §6)
        with:
          oc: "4"
      - name: Install skopeo (pack/load)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Log in to lab OpenShift
        run: oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true

      - name: Create ephemeral namespace
        run: |
          NS="rag-gap-${SHA}"
          echo "NS=$NS" >> "$GITHUB_ENV"
          oc new-project "$NS"
          oc label namespace "$NS" app.kubernetes.io/managed-by=e2e-workflow ephemeral=true

      - name: Create GHCR pull secret (rehearsal loads private packages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl -n "$NS" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GITHUB_TOKEN"
          echo "PULL_SECRET=ghcr-pull" >> "$GITHUB_ENV"

      # The mock ships as a ConfigMap: scripts/mock_vllm.py is excluded from
      # the images (.dockerignore) so a CI-only HTTP server never ships in a
      # prod image.
      - name: Deploy mock vLLM (deterministic embeddings stand-in)
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')"
          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_ENV"
          kubectl -n "$NS" create configmap mock-vllm --from-file=mock_vllm.py=scripts/mock_vllm.py
          kubectl apply -n "$NS" -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vllm-mock
            labels: {app: vllm-mock}
          spec:
            replicas: 1
            selector: {matchLabels: {app: vllm-mock}}
            template:
              metadata: {labels: {app: vllm-mock}}
              spec:
                containers:
                  - name: mock
                    image: ${AGENT_IMAGE}
                    command: ["python3", "/cm/mock_vllm.py"]
                    env:
                      - {name: MOCK_DIM, value: "64"}
                      - {name: PORT, value: "8000"}
                    ports: [{containerPort: 8000}]
                    readinessProbe:
                      httpGet: {path: /healthz, port: 8000}
                      initialDelaySeconds: 2
                    resources:
                      requests: {cpu: "50m", memory: 128Mi}
                      limits: {cpu: "500m", memory: 256Mi}
                    volumeMounts: [{name: mock, mountPath: /cm}]
                volumes:
                  - name: mock
                    configMap: {name: mock-vllm}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: vllm-mock
          spec:
            selector: {app: vllm-mock}
            ports: [{port: 8000, targetPort: 8000}]
          EOF
          kubectl -n "$NS" rollout status deploy/vllm-mock --timeout=180s

      - name: Detect default StorageClass
        run: |
          SC="$(oc get sc -o jsonpath='{range .items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")]}{.metadata.name}{end}')"
          [ -n "$SC" ] || { echo "::error::no default StorageClass on the lab cluster"; exit 1; }
          echo "SC=$SC" >> "$GITHUB_ENV"

      - name: Write CI-scale Qdrant overrides (lab quota only; git prod values untouched)
        run: |
          cat > "$RUNNER_TEMP/qdrant-ci-scale.yaml" <<'EOF'
          # Rehearsal-only: prod values.yaml keeps 4cpu/16Gi requests; the lab
          # namespace quota cannot fit 3 replicas at prod size.
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          EOF
          echo "QDRANT_EXTRA_VALUES=$RUNNER_TEMP/qdrant-ci-scale.yaml" >> "$GITHUB_ENV"

      - name: Write CI-scale ingest patch (same quota; prod Job asks 4cpu/8Gi)
        run: |
          cat > "$RUNNER_TEMP/ingest-ci-scale.json" <<'EOF'
          {"spec":{"template":{"spec":{"containers":[{"name":"ingest","resources":{"requests":{"cpu":"250m","memory":"512Mi"},"limits":{"cpu":"1","memory":"1Gi"}}}]}}}}
          EOF
          echo "INGEST_EXTRA_PATCH=$RUNNER_TEMP/ingest-ci-scale.json" >> "$GITHUB_ENV"

      - name: airgap-pack (real sneakernet bundle at this SHA)
        env:
          IMAGE_SHA: ${{ env.SHA }}
        run: |
          make airgap-pack
          ls -la dist/
          cat dist/MANIFEST.txt
          # Rehearse the runbook's first operator step: the bundle must clone.
          rm -rf "$RUNNER_TEMP/bundle-clone"
          git clone --quiet dist/repo.bundle "$RUNNER_TEMP/bundle-clone"
          git -C "$RUNNER_TEMP/bundle-clone" log --oneline -1

      - name: airgap-load (GHCR stands in for INTERNAL_REGISTRY)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INTERNAL_REGISTRY="ghcr.io/${OWNER_LC}"
          echo "${GITHUB_TOKEN}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          export INTERNAL_REGISTRY
          make airgap-load

      - name: airgap-deploy (PROD overlays, helm-knobbed sizes, fail-closed checks)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          EMBED_MODEL: mock-embed
          DENSE_DIM: "64"
          VLLM_BASE_URL: http://vllm-mock:8000
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export INTERNAL_REGISTRY="ghcr.io/${OWNER_LC}"
          export NAMESPACE="$NS"
          export STORAGE_CLASS="$SC"
          make airgap-deploy

      - name: Generate corpus PVC + demo PDFs (operator-supplied corpus step)
        env:
          STORAGE_CLASS: ${{ env.SC }}
        run: |
          kubectl -n "$NS" apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata: {name: corpus}
          spec:
            accessModes: ["ReadWriteOnce"]
            resources: {requests: {storage: 1Gi}}
            storageClassName: ${STORAGE_CLASS}
          ---
          apiVersion: batch/v1
          kind: Job
          metadata: {name: corpus-gen}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: gen
                    image: ${INGEST_IMAGE}
                    command: ["/bin/sh", "-ec"]
                    args:
                      - |
                        python3 /app/scripts/make_synthetic_pdf.py --out /corpus/SA22-0000-00_outline.pdf
                        python3 /app/scripts/make_synthetic_pdf.py --plain --out /corpus/plain-widget-notes.pdf
                        ls -la /corpus
                    volumeMounts: [{name: corpus, mountPath: /corpus}]
                volumes:
                  - name: corpus
                    persistentVolumeClaim: {claimName: corpus}
          EOF
          kubectl -n "$NS" wait --for=condition=complete job/corpus-gen --timeout=300s

      - name: airgap-ingest (PROD ingest Job, corpus PVC, vLLM-shaped endpoint)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          CORPUS_PVC: corpus
          EMBED_MODEL: mock-embed
          DENSE_DIM: "64"
          VLLM_BASE_URL: http://vllm-mock:8000
          INGEST_WORK_SIZE: 2Gi
          INGEST_TIMEOUT: "900"
        run: |
          export INTERNAL_REGISTRY="ghcr.io/${OWNER_LC}"
          export NAMESPACE="$NS"
          export STORAGE_CLASS="$SC"
          make airgap-ingest

      - name: airgap-smoke (operator smoke + expected-substring checks)
        run: |
          NAMESPACE="$NS" QUERY="IEA500I operator message" make airgap-smoke
          kubectl -n "$NS" exec deploy/rag-agent -- \
            python /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "IEA500I operator message" --expect "IEA500I"
          kubectl -n "$NS" exec deploy/rag-agent -- \
            python /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "torque the widget screws" --expect "torque"

      - name: Delete ephemeral namespace
        if: always()
        run: |
          oc delete project "$NS" --wait=false --ignore-not-found || \
            kubectl delete namespace "$NS" --ignore-not-found --wait=false || true
