# Connected-path E2E (issue #8): build the real Containerfiles, push to GHCR on
# main, and smoke-test synthetic demo PDFs against a lab OpenShift namespace.
# Synthetic PDFs only — generated in-cluster by the ingest Job. Never upload
# them as artifacts, never commit them (hygiene job enforces that).
#
# Image scheme (single source of truth, issue #8):
#   ghcr.io/<owner-lowercase>/qdrant-pdf-rag-{ingest,agent}:<full-git-sha>
# built via `docker tag` from the artifact task local tags, pushed on
# main/dispatch, and applied via the kustomize `ghcr.io/OWNER` sed.
#
# Prereqs (README "Connected E2E"): GHCR packages public (anonymous pull from
# the lab cluster), OPENSHIFT_SERVER/OPENSHIFT_TOKEN secrets. curlimages/curl
# is pulled from Docker Hub — allowed on the connected lab cluster only.
#
# Air-gapped GitLab deliberately has no equivalent of this workflow: no GHCR,
# no lab cluster from the air-gap (see .gitlab-ci.yml comment).
name: e2e

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: e2e-${{ github.ref || github.run_id }}
  cancel-in-progress: false

env:
  INGEST_IMAGE_LOCAL: mainframe-rag/ingest
  AGENT_IMAGE_LOCAL: mainframe-rag/agent

jobs:
  # ---------------------------------------------------------------- build
  build:
    concurrency:
      group: build-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.refs.outputs.sha }}
      ingest_image: ${{ steps.refs.outputs.ingest }}
      agent_image: ${{ steps.refs.outputs.agent }}
    env:
      SHARE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pin does not cover runtime-fetched oc/skopeo below)

      # cp314 wheels require a 3.14 interpreter for the wheelhouse build.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0; runtime Python download remains upstream
        with:
          python-version: "3.14"

      - name: Install pinned Task runner
        run: |
          sh scripts/tools/install-task.sh

      - name: Build wheelhouse + BM25 weights + images (same Containerfiles as air-gap)
        run: |
          export PATH="/usr/local/bin:$PATH"
          PYBIN="$(command -v python3.14 || command -v python)"
          echo "Using python: $PYBIN"
          # Explicit preparation using the selected interpreter; verification
          # never installs dependencies.
          sh scripts/tools/run-task.sh dev:setup PY="$PYBIN"
          sh scripts/tools/run-task.sh artifacts:wheelhouse artifacts:bm25 PY="$PYBIN"
          sh scripts/tools/run-task.sh artifacts:images IMAGE_TAG="$GITHUB_SHA"

      - id: refs
        run: |
          export PATH="/usr/local/bin:$PATH"
          SHA="$GITHUB_SHA"
          # Issue #8 scheme: ghcr.io/<owner-lowercase>/qdrant-pdf-rag-<name>:<sha>.
          # This exact string is used for docker tag, docker push, and the
          # kustomize sed — keep them identical.
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ingest=ghcr.io/${OWNER_LC}/qdrant-pdf-rag-ingest:$SHA" >> "$GITHUB_OUTPUT"
          echo "agent=ghcr.io/${OWNER_LC}/qdrant-pdf-rag-agent:$SHA" >> "$GITHUB_OUTPUT"

      # Retag local build outputs to the GHCR refs BEFORE pushing. PRs: build
      # without push (no GHCR write from forks). main/dispatch: tag + push.
      - name: Push to GHCR
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.refs.outputs.sha }}
          INGEST_IMAGE: ${{ steps.refs.outputs.ingest }}
          AGENT_IMAGE: ${{ steps.refs.outputs.agent }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          docker tag "${INGEST_IMAGE_LOCAL}:${SHA}" "$INGEST_IMAGE"
          docker tag "${AGENT_IMAGE_LOCAL}:${SHA}" "$AGENT_IMAGE"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$INGEST_IMAGE"
          docker push "$AGENT_IMAGE"

  # ---------------------------------------------------- sneakernet packaging
  # Automates the sneakernet release factory (issue #15): packages the bundle
  # and all recorded-digest pinned images (including the authenticated Red Hat
  # oauth-proxy sidecar) on every merge to main (or manual dispatch),
  # generating the transfer certificate and uploading the tarball + digests as
  # a downloadable workflow artifact.
  airgap-package:
    concurrency:
      group: airgap-package-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    needs: [build]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHARE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pinned Task runner
        run: |
          sh scripts/tools/install-task.sh

      - name: Install skopeo
        run: |
          export PATH="/usr/local/bin:$PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Log in to Red Hat registry
        env:
          REDHAT_REGISTRY_USER: ${{ secrets.REDHAT_REGISTRY_USER }}
          REDHAT_REGISTRY_PASSWORD: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REDHAT_REGISTRY_USER" ] || [ -z "$REDHAT_REGISTRY_PASSWORD" ]; then
            echo "::error::REDHAT_REGISTRY_USER and REDHAT_REGISTRY_PASSWORD are required to package the pinned OAuth image"
            exit 1
          fi
          printf '%s' "$REDHAT_REGISTRY_PASSWORD" | skopeo login registry.redhat.io \
            --username "$REDHAT_REGISTRY_USER" --password-stdin

      - name: airgap-pack
        env:
          IMAGE_SHA: ${{ needs.build.outputs.sha }}
          # Production trust comes from the SNEAKERNET_SIGNING_KEY secret
          # (PEM private key; pubkey ceremony in docs/install_and_ops.md).
          # Until a maintainer stores it, pack with an ephemeral throwaway
          # key so the sign/verify plumbing still executes end to end.
          SNEAKERNET_SIGNING_KEY: ${{ secrets.SNEAKERNET_SIGNING_KEY }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          if [ -z "$SNEAKERNET_SIGNING_KEY" ]; then
            echo "::warning::SNEAKERNET_SIGNING_KEY secret unset — packing with an ephemeral throwaway key (plumbing only, no trust; MANIFEST records signed: ephemeral)"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/signing.key"
            export SNEAKERNET_SIGNING_KEY="$RUNNER_TEMP/signing.key"
          else
            printf '%s' "$SNEAKERNET_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
            openssl pkey -in "$RUNNER_TEMP/signing.key" -noout || {
              echo "::error::SNEAKERNET_SIGNING_KEY is not a valid PEM private key (store real newlines, not backslash-escaped ones)"
              exit 1
            }
            export SNEAKERNET_SIGNING_KEY="$RUNNER_TEMP/signing.key"
            export SNEAKERNET_KEY_TRUSTED=true
          fi
          sh scripts/tools/run-task.sh airgap:pack
          ls -la dist/
          cat dist/MANIFEST.txt
          cat dist/PACKING_RECORD.txt

      - name: Upload sneakernet bundle artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sneakernet-bundle-${{ needs.build.outputs.sha }}
          path: |
            dist/qdrant-pdf-rag-*.tar
            dist/qdrant-pdf-rag-*.tar.sha256
            dist/PACKING_RECORD.txt
            dist/MANIFEST.txt
          retention-days: 90

  # --------------------------- air-gap handoff acceptance (black box)
  # Consumes the sneakernet tarball EXACTLY like a bastion operator: fresh
  # empty dir, digest verify BEFORE unpack, bootstrap.sh, then the operator
  # runbook from the bootstrapped clone (validate + full pipeline dry-run).
  # Every acceptance lane traverses pack -> tarball -> bootstrap.sh ->
  # ARTDIR/MANIFEST discovery independently. This lane needs no cluster.
  airgap-acceptance:
    concurrency:
      group: airgap-acceptance-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    needs: [build, airgap-package]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHARE: "false"
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - name: Install checksum-pinned Helm
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-unpack"
          tar xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/helm-unpack" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/helm-unpack/linux-amd64/helm" /usr/local/bin/helm
          /usr/local/bin/helm version --short

      - name: Install pinned kubectl (kustomize render + patch --local)
        run: |
          export PATH="/usr/local/bin:$PATH"
          KUBECTL_VERSION=v1.37.0
          # sha256 recorded in-repo (AGENTS.md §6): dl.k8s.io checksum file.
          KUBECTL_SHA256=6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          /usr/local/bin/kubectl version --client=true

      - name: Download sneakernet bundle (this is what the operator receives)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (verified via API: v4 tag; fetches nothing at runtime — artifact bytes only)
        with:
          name: sneakernet-bundle-${{ env.SHA }}
          path: gapbox/

      - name: Black-box handoff (verify, unpack, bootstrap, runbook)
        env:
          IMAGE_SHA: ${{ env.SHA }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox
          sha256sum -c "qdrant-pdf-rag-${SHA}.tar.sha256"
          tar xf "qdrant-pdf-rag-${SHA}.tar"
          AIRGAP_WORKSPACE=qdrant-pdf-rag sh bootstrap.sh
          # The bootstrapped layout must satisfy ARTDIR discovery on its own.
          test -f qdrant-pdf-rag/dist/SHA256SUMS
          (cd qdrant-pdf-rag/dist && sha256sum -c SHA256SUMS)
          test -f qdrant-pdf-rag/dist/sbom.json
          test -f qdrant-pdf-rag/dist/SHA256SUMS.sig
          test -f qdrant-pdf-rag/dist/sneakernet-signing.pub
          test -f qdrant-pdf-rag/dist/task_linux_amd64.tar.gz
          test -f qdrant-pdf-rag/dist/task-pin.txt
          test -f qdrant-pdf-rag/dist/task-LICENSE
          grep -q "^task_version: " qdrant-pdf-rag/dist/MANIFEST.txt
          grep -q "go-task/task" qdrant-pdf-rag/dist/sbom.json
          test "$(git -C qdrant-pdf-rag rev-parse HEAD)" = "$SHA"
          test "$(awk '/^sha: /{print $2}' qdrant-pdf-rag/dist/MANIFEST.txt)" = "$SHA"
          cd qdrant-pdf-rag
          # Operator-equivalent airgap.env edits (dry-run stand-ins, never prod).
          sed -i \
            -e 's|^INTERNAL_REGISTRY=.*|INTERNAL_REGISTRY=ghcr.io/acceptance-standin|' \
            -e 's|^NAMESPACE=.*|NAMESPACE=acceptance|' \
            -e 's|^STORAGE_CLASS=.*|STORAGE_CLASS=standard|' \
            -e 's|^IMAGE_SHA=.*|IMAGE_SHA='"$SHA"'|' \
            -e 's|^EMBED_MODEL=.*|EMBED_MODEL=embed-from-airgap-env|' \
            -e 's|^EMBED_MODEL_REVISION=.*|EMBED_MODEL_REVISION=acceptance-rev-1|' \
            -e 's|^DENSE_DIM=.*|DENSE_DIM=768|' \
            -e 's|^VLLM_BASE_URL=.*|VLLM_BASE_URL=http://vllm:8000|' \
            -e 's|^CORPUS_PVC=.*|CORPUS_PVC=corpus|' \
            airgap.env
          AIRGAP_DRYRUN=1 sh scripts/tools/run-task.sh airgap:validate
          # Render the operator's standin values explicitly: `airgap:dryrun`
          # carries its own fixed test parameters by contract,
          # so it cannot render this airgap.env — pass the same standins as
          # environment (explicit env wins over the file since #152).
          AIRGAP_DRYRUN=1 IMAGE_SHA="$SHA" \
            INTERNAL_REGISTRY=ghcr.io/acceptance-standin NAMESPACE=acceptance \
            STORAGE_CLASS=standard EMBED_MODEL=embed-from-airgap-env DENSE_DIM=768 \
            EMBED_MODEL_REVISION=acceptance-rev-1 \
            VLLM_BASE_URL=http://vllm:8000 CORPUS_PVC=corpus \
            sh scripts/airgap/pipeline.sh --dry-run
          test -f dist/agent-rendered.yaml
          test -f dist/ingest-rendered.yaml
          grep -q "ghcr.io/acceptance-standin/qdrant-pdf-rag-agent:${SHA}" dist/agent-rendered.yaml
          grep -q "imagePullSecrets: \[\]" dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/ingest-rendered.yaml
          # Second PULL_SECRET branch: a wired secret reaches the manifests.
          sed -i 's|^PULL_SECRET=.*|PULL_SECRET=acceptance-pull|' airgap.env
          AIRGAP_DRYRUN=1 sh scripts/tools/run-task.sh airgap:deploy
          grep -q "name: acceptance-pull" dist/agent-rendered.yaml

  # --------------------------------------- kind full-live handoff rehearsal
  # The layout-faithful tier: consumes the sneakernet tarball in a fresh
  # empty dir (verify, unpack, bootstrap.sh) and runs the REAL operator
  # runbook — live validate, live pipeline (load, deploy, ingest, smoke) —
  # against an ephemeral Kind cluster with an authenticated TLS registry.
  # Ephemeral credentials and a private CA exercise loader/node trust and
  # the wired PULL_SECRET branch; no lab credentials are required. airgap-acceptance proves the handoff
  # statically (dry-run);
  # this job proves the deployment comes up from a bootstrapped clone.
  # CI-only sizing (single replica, Gi sizes): a CI runner cannot schedule
  # the 3x16Gi prod Qdrant (proven: Insufficient memory on one node), so the
  # documented local-testing overrides apply; git prod values are untouched.
  kind-live-rehearsal:
    needs: [build, airgap-package]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: kind-${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [pipeline, gateway-faults, lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    concurrency:
      group: kind-${{ matrix.lane }}-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    env:
      SHARE: "false"
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - name: Record runner capacity
        run: |
          export PATH="/usr/local/bin:$PATH"
          mkdir -p diagnostics
          { nproc; free -h; df -h; } > diagnostics/runner-capacity.txt
      - name: Install checksum-pinned Helm
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-unpack"
          tar xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/helm-unpack" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/helm-unpack/linux-amd64/helm" /usr/local/bin/helm
          /usr/local/bin/helm version --short

      - name: Install pinned kubectl (kustomize render + patch --local)
        run: |
          export PATH="/usr/local/bin:$PATH"
          KUBECTL_VERSION=v1.37.0
          # sha256 recorded in-repo (AGENTS.md §6): dl.k8s.io checksum file.
          KUBECTL_SHA256=6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          /usr/local/bin/kubectl version --client=true

      - name: Install skopeo (pack/load)
        run: |
          export PATH="/usr/local/bin:$PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Install pinned kind (ephemeral air-gap-like cluster)
        run: |
          export PATH="/usr/local/bin:$PATH"
          KIND_VERSION=v0.33.0
          # sha256 recorded in-repo (AGENTS.md §6): kind-linux-amd64 release asset digest.
          KIND_SHA256=aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          curl -fsSL -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kind /usr/local/bin/kind
          /usr/local/bin/kind version

      - name: Download sneakernet bundle (this is what the operator receives)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (verified via API: v4 tag; fetches nothing at runtime — artifact bytes only)
        with:
          name: sneakernet-bundle-${{ env.SHA }}
          path: gapbox/

      - name: Black-box handoff (verify, unpack, bootstrap)
        env:
          IMAGE_SHA: ${{ env.SHA }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox
          sha256sum -c "qdrant-pdf-rag-${SHA}.tar.sha256"
          tar xf "qdrant-pdf-rag-${SHA}.tar"
          AIRGAP_WORKSPACE=qdrant-pdf-rag sh bootstrap.sh
          test -f qdrant-pdf-rag/dist/SHA256SUMS
          (cd qdrant-pdf-rag/dist && sha256sum -c SHA256SUMS)
          test -f qdrant-pdf-rag/dist/sbom.json
          test -f qdrant-pdf-rag/dist/SHA256SUMS.sig
          test -f qdrant-pdf-rag/dist/sneakernet-signing.pub
          test -f qdrant-pdf-rag/dist/task_linux_amd64.tar.gz
          test -f qdrant-pdf-rag/dist/task-pin.txt
          test -f qdrant-pdf-rag/dist/task-LICENSE
          grep -q "^task_version: " qdrant-pdf-rag/dist/MANIFEST.txt
          grep -q "go-task/task" qdrant-pdf-rag/dist/sbom.json
          test "$(git -C qdrant-pdf-rag rev-parse HEAD)" = "$SHA"
          test "$(awk '/^sha: /{print $2}' qdrant-pdf-rag/dist/MANIFEST.txt)" = "$SHA"

      - name: Start authenticated TLS registry + Kind
        run: |
          export PATH="/usr/local/bin:$PATH"
          TLS_DIR="$RUNNER_TEMP/registry-tls"
          sh gapbox/qdrant-pdf-rag/scripts/ci/create_test_tls.sh "$TLS_DIR" kind-registry
          # Keep credentials out of arguments, logs and retained diagnostics.
          umask 077
          openssl rand -hex 24 > "$TLS_DIR/password"
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2-utils
          htpasswd -iBc "$TLS_DIR/htpasswd" rehearsal < "$TLS_DIR/password"
          echo '127.0.0.1 kind-registry' | sudo tee -a /etc/hosts >/dev/null
          sudo cp "$TLS_DIR/ca.crt" /usr/local/share/ca-certificates/rehearsal-registry.crt
          sudo update-ca-certificates
          mkdir -p "$TLS_DIR/node-trust/kind-registry:5000"
          cp "$TLS_DIR/ca.crt" "$TLS_DIR/node-trust/kind-registry:5000/ca.crt"
          cat > "$TLS_DIR/node-trust/kind-registry:5000/hosts.toml" <<'EOF'
          server = "https://kind-registry:5000"
          [host."https://kind-registry:5000"]
            capabilities = ["pull", "resolve"]
            ca = "/etc/containerd/certs.d/kind-registry:5000/ca.crt"
          EOF
          docker run -d --restart=always --name kind-registry -p 127.0.0.1:5000:5000 \
            -v "$TLS_DIR/tls.crt:/tls/tls.crt:ro" -v "$TLS_DIR/tls.key:/tls/tls.key:ro" \
            -v "$TLS_DIR/htpasswd:/auth/htpasswd:ro" \
            -e REGISTRY_HTTP_TLS_CERTIFICATE=/tls/tls.crt -e REGISTRY_HTTP_TLS_KEY=/tls/tls.key \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=rehearsal \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for attempt in $(seq 1 20); do
            status="$(curl -sS --cacert "$TLS_DIR/ca.crt" -o /dev/null -w '%{http_code}' https://kind-registry:5000/v2/ || true)"
            [ "$status" = 401 ] && break
            [ "$attempt" != 20 ] || exit 1
            sleep 1
          done
          skopeo login --authfile "$TLS_DIR/registry-auth.json" --username rehearsal \
            --password-stdin kind-registry:5000 < "$TLS_DIR/password"
          echo "REGISTRY_AUTH_FILE=$TLS_DIR/registry-auth.json" >> "$GITHUB_ENV"
          python3 - "$RUNNER_TEMP/kind-config.yaml" "$TLS_DIR/node-trust" "${{ matrix.lane }}" <<'PY_KIND'
          import json, sys
          from pathlib import Path
          roles = ['control-plane'] + (['worker'] * 3 if sys.argv[3] == 'lifecycle' else [])
          config = {'kind': 'Cluster', 'apiVersion': 'kind.x-k8s.io/v1alpha4',
                    'nodes': [{'role': role, 'extraMounts': [{'hostPath': sys.argv[2],
                              'containerPath': '/etc/containerd/certs.d', 'readOnly': True}]} for role in roles]}
          Path(sys.argv[1]).write_text(json.dumps(config))
          PY_KIND
          /usr/local/bin/kind create cluster --name gapbox --config "$RUNNER_TEMP/kind-config.yaml" \
            --image "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
          docker network connect kind kind-registry
          /usr/local/bin/kubectl cluster-info

      - name: Install pinned local-path provisioner (explicit StorageClass)
        run: |
          export PATH="/usr/local/bin:$PATH"
          # Pinned manifest (rancher local-path-provisioner v0.0.37): same
          # namespace/deployment names as kind's built-in provisioner, so
          # this upgrades it in place and adds the `local-path`
          # StorageClass — no duplicate provisioner, no ambient defaults.
          curl -fsSL -o "$RUNNER_TEMP/local-path.yaml" https://raw.githubusercontent.com/rancher/local-path-provisioner/49b2be8e26d6d34c9afaa21fa33108d2e82f8955/deploy/local-path-storage.yaml
          echo "9781b39c24f3f651bd6d6e41b561e04e4904bbdb6d4f8c7a6009df3a702dcd65  $RUNNER_TEMP/local-path.yaml" | sha256sum -c -
          /usr/local/bin/kubectl apply -f "$RUNNER_TEMP/local-path.yaml"
          /usr/local/bin/kubectl -n local-path-storage rollout status deploy/local-path-provisioner --timeout=180s
          /usr/local/bin/kubectl get storageclass local-path

      - name: Operator airgap.env (Kind stand-ins, never prod values)
        env:
          IMAGE_SHA: ${{ env.SHA }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          NS="rag-kind-$(echo "$SHA" | cut -c1-12)"
          echo "NS=$NS" >> "$GITHUB_ENV"
          sed -i \
            -e 's|^INTERNAL_REGISTRY=.*|INTERNAL_REGISTRY=kind-registry:5000|' \
            -e "s|^NAMESPACE=.*|NAMESPACE=$NS|" \
            -e 's|^STORAGE_CLASS=.*|STORAGE_CLASS=local-path|' \
            -e 's|^IMAGE_SHA=.*|IMAGE_SHA='"$SHA"'|' \
            -e 's|^EMBED_MODEL=.*|EMBED_MODEL=mock-embed|' \
            -e 's|^EMBED_MODEL_REVISION=.*|EMBED_MODEL_REVISION=mock-embed@ci|' \
            -e 's|^DENSE_DIM=.*|DENSE_DIM=1024|' \
            -e 's|^VLLM_BASE_URL=.*|VLLM_BASE_URL=https://test-gateway:4000|' \
            -e 's|^CORPUS_PVC=.*|CORPUS_PVC=corpus|' \
            -e 's|^QDRANT_SHARD_NUMBER=.*|QDRANT_SHARD_NUMBER=1|' \
            -e 's|^QDRANT_REPLICATION_FACTOR=.*|QDRANT_REPLICATION_FACTOR=1|' \
            -e 's|^QDRANT_WRITE_CONSISTENCY_FACTOR=.*|QDRANT_WRITE_CONSISTENCY_FACTOR=1|' \
            airgap.env
          cat >> airgap.env <<'EOF'
          EMBED_BASE_URL=https://test-gateway:4000/v1
          LLM_BASE_URL=https://test-gateway:4000/v1
          LLM_MODEL_REASONING=mock-reasoning
          RERANK_ENABLED=false
          GATEWAY_API_KEY_SECRET=test-gateway-keys
          GATEWAY_CA_CONFIGMAP=test-gateway-ca
          EOF
          grep -E "^(INTERNAL_REGISTRY|NAMESPACE|STORAGE_CLASS|IMAGE_SHA|EMBED_MODEL|EMBED_MODEL_REVISION|DENSE_DIM|VLLM_BASE_URL|CORPUS_PVC|INSECURE_REGISTRY)" airgap.env

      - name: Write Kind-scale Qdrant overrides (runner quota only; git prod values untouched)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cat > "$RUNNER_TEMP/qdrant-kind-scale.yaml" <<'EOF'
          # Rehearsal-only: a CI runner cannot schedule the 3x16Gi prod
          # Qdrant (Insufficient memory on one node — proven locally).
          replicaCount: 1
          # Kind has no SCC to supply a volume group for the init emptyDir.
          podSecurityContext: {fsGroup: 3000}
          resources:
            requests: {cpu: "200m", memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          EOF
          echo "QDRANT_EXTRA_VALUES=$RUNNER_TEMP/qdrant-kind-scale.yaml" >> "$GITHUB_ENV"

      - name: Write Kind-scale ingest patch (same quota; prod Job asks 4cpu/8Gi)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cat > "$RUNNER_TEMP/ingest-kind-scale.json" <<'EOF'
          {"spec":{"template":{"spec":{"containers":[{"name":"ingest","resources":{"requests":{"cpu":"250m","memory":"512Mi"},"limits":{"cpu":"1","memory":"1Gi"}}}]}}}}
          EOF
          echo "INGEST_EXTRA_PATCH=$RUNNER_TEMP/ingest-kind-scale.json" >> "$GITHUB_ENV"

      - name: airgap-load (fill the Kind registry BEFORE any pod pulls it)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          sh scripts/tools/run-task.sh airgap:load

      - name: Create registry pull secret before the first node pull
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kubectl create namespace "$NS"
          /usr/local/bin/kubectl -n "$NS" create secret generic rehearsal-pull \
            --type=kubernetes.io/dockerconfigjson \
            --from-file=.dockerconfigjson="$REGISTRY_AUTH_FILE"
          /usr/local/bin/kubectl -n "$NS" patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"rehearsal-pull"}]}'
          sed -i 's|^PULL_SECRET=.*|PULL_SECRET=rehearsal-pull|' gapbox/qdrant-pdf-rag/airgap.env

      - name: Deploy mock vLLM (deterministic embeddings stand-in)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          /usr/local/bin/kubectl create namespace "$NS" --dry-run=client -o yaml | /usr/local/bin/kubectl apply -f -
          /usr/local/bin/kubectl -n "$NS" create configmap mock-vllm --from-file=mock_vllm.py=scripts/mock_vllm.py
          /usr/local/bin/kubectl apply -n "$NS" -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vllm-mock
            labels: {app: vllm-mock}
          spec:
            replicas: 1
            # A fault transition must retire the previous computation state.
            strategy: {type: Recreate}
            selector: {matchLabels: {app: vllm-mock}}
            template:
              metadata: {labels: {app: vllm-mock}}
              spec:
                containers:
                  - name: mock
                    # Tarball-faithful: loaded from the bundle, like the
                    # corpus-gen image below — never a GHCR pull.
                    image: kind-registry:5000/qdrant-pdf-rag-ingest:${SHA}
                    command: ["python3", "/cm/mock_vllm.py"]
                    env:
                      - {name: MOCK_DIM, value: "1024"}
                      - {name: PORT, value: "8000"}
                    ports: [{containerPort: 8000}]
                    readinessProbe:
                      httpGet: {path: /healthz, port: 8000}
                      initialDelaySeconds: 2
                    resources:
                      requests: {cpu: "50m", memory: 128Mi}
                      limits: {cpu: "500m", memory: 256Mi}
                    volumeMounts: [{name: mock, mountPath: /cm}]
                volumes:
                  - name: mock
                    configMap: {name: mock-vllm}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: vllm-mock
          spec:
            selector: {app: vllm-mock}
            ports: [{port: 8000, targetPort: 8000}]
          EOF
          /usr/local/bin/kubectl -n "$NS" rollout status deploy/vllm-mock --timeout=180s

      - name: Real test gateway and database (mock computation only)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          sh scripts/ci/deploy_test_gateway.sh "$NS"

      - name: airgap-validate LIVE (cluster, StorageClass, MANIFEST match)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          sh scripts/tools/run-task.sh airgap:validate

      - name: Generate corpus PVC + demo PDFs (operator-supplied corpus step)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          /usr/local/bin/kubectl -n "$NS" apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata: {name: corpus}
          spec:
            accessModes: ["ReadWriteOnce"]
            resources: {requests: {storage: 1Gi}}
            storageClassName: local-path
          ---
          apiVersion: batch/v1
          kind: Job
          metadata: {name: corpus-gen}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: gen
                    # Tarball-faithful: this image came out of the sneakernet
                    # bundle via airgap-load, not from GHCR.
                    image: kind-registry:5000/qdrant-pdf-rag-ingest:${SHA}
                    command: ["/bin/sh", "-ec"]
                    args:
                      - |
                        python3 /app/scripts/make_synthetic_pdf.py --out /corpus/SA22-0000-00_outline.pdf
                        python3 /app/scripts/make_synthetic_pdf.py --plain --out /corpus/plain-widget-notes.pdf
                        ls -la /corpus
                    volumeMounts: [{name: corpus, mountPath: /corpus}]
                volumes:
                  - name: corpus
                    persistentVolumeClaim: {claimName: corpus}
          EOF
          /usr/local/bin/kubectl -n "$NS" wait --for=condition=complete job/corpus-gen --timeout=300s

      - name: airgap-pipeline LIVE (deploy, ingest, smoke; registry pre-loaded)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          QDRANT_STORAGE_SIZE: 1Gi
          INGEST_WORK_SIZE: 2Gi
          INGEST_TIMEOUT: "900"
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          # Images are already in the Kind registry from the airgap-load
          # step above (mock and corpus-gen pods pulled them); skip the
          # second push — same flag an operator re-running pipeline uses.
          sh scripts/airgap/pipeline.sh --skip-load

      - name: Require reasoning and complete streams from the application pod
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python3 /app/scripts/probe_gateway.py --require-reasoning --stream

      - name: Cited answers, follow-up chat and every application stream
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kubectl -n "$NS" exec -i deploy/rag-agent -- python3 - \
            < gapbox/qdrant-pdf-rag/scripts/ci/application_contracts.py

      - name: Expected-substring acceptance
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          NS="$(grep '^NAMESPACE=' airgap.env | cut -d= -f2)"
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python3 /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "IEA500I operator message" --expect "IEA500I"
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python3 /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "torque the widget screws" --expect "torque"

      - name: Gateway fault contracts
        if: matrix.lane == 'gateway-faults'
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          sh scripts/ci/gateway_faults.sh "$NS"

      - name: Three-worker lifecycle and repeated pipeline
        if: matrix.lane == 'lifecycle'
        env:
          QDRANT_STORAGE_SIZE: 1Gi
          INGEST_WORK_SIZE: 2Gi
          INGEST_TIMEOUT: "900"
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          test "$(/usr/local/bin/kubectl get nodes -l '!node-role.kubernetes.io/control-plane' --no-headers | wc -l)" -eq 3
          sh scripts/ci/check_lifecycle.sh "$NS"
          sh scripts/airgap/pipeline.sh --skip-load

      - name: Failure diagnostics (pods, events, logs)
        if: failure()
        run: |
          export PATH="/usr/local/bin:$PATH"
          NS="$(grep '^NAMESPACE=' gapbox/qdrant-pdf-rag/airgap.env | cut -d= -f2)"
          /usr/local/bin/kubectl -n "$NS" get pods,pvc,svc,jobs -o wide || true
          /usr/local/bin/kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -40 || true
          /usr/local/bin/kubectl -n "$NS" logs statefulset/qdrant --all-containers --tail=50 || true
          /usr/local/bin/kubectl -n "$NS" logs deploy/rag-agent --all-containers --tail=100 || true
          /usr/local/bin/kubectl -n "$NS" logs job/ingest --tail=100 || true

      - name: Retain sanitized cluster diagnostics
        if: always()
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kubectl get nodes -o wide > diagnostics/nodes.txt 2>&1 || true
          /usr/local/bin/kubectl -n "$NS" get pods,pvc,svc,jobs -o wide > diagnostics/workloads.txt 2>&1 || true
          /usr/local/bin/kubectl -n "$NS" get events --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
          test ! -f gapbox/qdrant-pdf-rag/dist/MANIFEST.txt || cp gapbox/qdrant-pdf-rag/dist/MANIFEST.txt diagnostics/
          test ! -f "gapbox/qdrant-pdf-rag-${SHA}.tar.sha256" || cp "gapbox/qdrant-pdf-rag-${SHA}.tar.sha256" diagnostics/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; artifact upload only
        if: always()
        with:
          name: kind-${{ matrix.lane }}-evidence-${{ env.SHA }}
          path: diagnostics/
          retention-days: 30

      - name: Delete Kind cluster (ephemeral, always)
        if: always()
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kind delete cluster --name gapbox || true
          docker rm -f kind-registry || true

  # ------------------------------------------------- secret gate (fork-safe)
  e2e-secrets-check:
    concurrency:
      group: e2e-secrets-check-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    env:
      SHARE: "false"
    steps:
      - id: check
        env:
          SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          if [ -n "$SERVER" ] && [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "OPENSHIFT_SERVER / OPENSHIFT_TOKEN not set; e2e will be skipped."
          fi

  # ---------------------------------------------------------- lab OpenShift
  openshift-e2e:
    concurrency:
      group: openshift-e2e-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    needs: [build, e2e-secrets-check]
    if: >-
      needs.e2e-secrets-check.outputs.ok == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHARE: "false"
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pin does not cover runtime-fetched oc/skopeo below)

      - name: Install checksum-pinned Helm
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-unpack"
          tar xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/helm-unpack" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/helm-unpack/linux-amd64/helm" /usr/local/bin/helm
          /usr/local/bin/helm version --short
      - name: Install checksum-pinned OpenShift client
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/oc.tgz" https://mirror.openshift.com/pub/openshift-v4/clients/ocp/4.22.7/openshift-client-linux.tar.gz
          echo "3d02d45ae5037a723afbbdda1063c08d4788a9b9ace6c6f44aa329764ee648a1  $RUNNER_TEMP/oc.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oc-unpack"
          tar xzf "$RUNNER_TEMP/oc.tgz" -C "$RUNNER_TEMP/oc-unpack" oc kubectl
          sudo install -m 0755 "$RUNNER_TEMP/oc-unpack/oc" /usr/local/bin/oc
          sudo install -m 0755 "$RUNNER_TEMP/oc-unpack/kubectl" /usr/local/bin/kubectl
          /usr/local/bin/oc version --client=true

      - name: Log in to lab OpenShift
        run: /usr/local/bin/oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true

      - name: Create ephemeral namespace
        run: |
          export PATH="/usr/local/bin:$PATH"
          NS="rag-ci-${SHA}"
          echo "NS=$NS" >> "$GITHUB_ENV"
          /usr/local/bin/oc new-project "$NS"
          /usr/local/bin/oc label namespace "$NS" app.kubernetes.io/managed-by=e2e-workflow ephemeral=true

      - name: Deploy Qdrant (CI overlay — 1 replica, 1Gi, unprivileged, ClusterIP)
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/helm upgrade -i qdrant charts/qdrant-*.tgz -n "$NS" -f overlays/ci/values.yaml
          /usr/local/bin/kubectl -n "$NS" rollout status statefulset/qdrant --timeout=300s

      - name: Wait for Qdrant readyz
        run: |
          export PATH="/usr/local/bin:$PATH"
          for i in $(seq 1 30); do
            if /usr/local/bin/kubectl -n "$NS" run readycheck-"$i" --image=curlimages/curl --restart=Never \
                 --command -- curl -sf http://qdrant:6333/readyz; then
              break
            fi
            /usr/local/bin/kubectl -n "$NS" delete pod readycheck-"$i" --ignore-not-found
            [ "$i" = 30 ] && exit 1
            sleep 10
          done

      # GHCR packages must be PUBLIC (repo Settings -> Packages) so the lab
      # cluster can pull anonymously; alternatively create an imagePullSecret
      # from a fine-grained PAT with oc create secret (token never in git).
      - name: Apply agent + ingest Job (kustomize overlay, sha-tagged GHCR images)
        env:
          KUSTOMIZE_OWNER_PLACEHOLDER: ghcr.io/OWNER
          KUSTOMIZE_TAG_PLACEHOLDER: ":ci"
          KUSTOMIZE_NS_PLACEHOLDER: "namespace: rag-ci"
        run: |
          export PATH="/usr/local/bin:$PATH"
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')"
          /usr/local/bin/kubectl kustomize deploy/kustomize/overlays/ci \
            | sed -e "s|$KUSTOMIZE_OWNER_PLACEHOLDER|ghcr.io/${OWNER_LC}|g" \
                  -e "s|$KUSTOMIZE_TAG_PLACEHOLDER|:${SHA}|g" \
                  -e "s|$KUSTOMIZE_NS_PLACEHOLDER|namespace: rag-ci-${SHA}|g" \
            | /usr/local/bin/kubectl apply -f -

      - name: Wait for ingest Job (generates demo PDFs, ingests with EMBED_MODE=hash)
        run: |
          export PATH="/usr/local/bin:$PATH"
          if ! /usr/local/bin/kubectl -n "$NS" wait --for=condition=complete job/ingest --timeout=600s; then
            echo "::error::ingest Job failed"
            /usr/local/bin/kubectl -n "$NS" logs job/ingest --tail=200 || true
            /usr/local/bin/kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -30 || true
            exit 1
          fi

      - name: Wait for agent readiness
        run: /usr/local/bin/kubectl -n "$NS" rollout status deploy/rag-agent --timeout=300s

      # Smoke 1: outline PDF — message id found (hybrid search, hash embeddings).
      - name: Smoke — IEA500I from outline demo PDF
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python /app/scripts/smoke_search.py \
              --url http://rag-agent:8080 --query "IEA500I operator message" --expect "IEA500I"

      # Smoke 2: plain generic PDF — lexical hit for widget/torque prose.
      - name: Smoke — torque/widget text from plain demo PDF
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python /app/scripts/smoke_search.py \
              --url http://rag-agent:8080 --query "torque the widget screws" --expect "torque"

      - name: Failure diagnostics (pods, events, logs)
        if: failure()
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kubectl -n "$NS" get pods,pvc,svc,jobs -o wide || true
          /usr/local/bin/kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -40 || true
          /usr/local/bin/kubectl -n "$NS" describe statefulset/qdrant deploy/rag-agent 2>/dev/null | tail -60 || true
          /usr/local/bin/kubectl -n "$NS" logs statefulset/qdrant --all-containers --tail=50 || true
          /usr/local/bin/kubectl -n "$NS" logs deploy/rag-agent --all-containers --tail=100 || true
          /usr/local/bin/kubectl -n "$NS" logs job/ingest --tail=100 || true

      - name: Delete ephemeral namespace
        if: always()
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/oc delete project "$NS" --wait=false --ignore-not-found || \
            /usr/local/bin/kubectl delete namespace "$NS" --ignore-not-found --wait=false || true

  # --------------------------------- air-gap config dry-run (no cluster, no secrets)
  # Runs the REAL airgap scripts with AIRGAP_DRYRUN=1 on every PR: renders the
  # PROD agent + ingest manifests, enforces the placeholder fail-close, the
  # SHA rules, both PULL_SECRET branches, and the size-knob flow. Proves the
  # deployment CONFIG with zero secrets and zero cluster; the live rehearsal
  # (below, secrets-gated) proves the deployment comes up. A true in-runner
  # OpenShift is not feasible (CRC needs KVM; microshift-aio abandoned 2022),
  # so this is the PR-level gate for the air-gap path.
  airgap-dryrun:
    concurrency:
      group: airgap-dryrun-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHARE: "false"
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install checksum-pinned Helm
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-unpack"
          tar xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/helm-unpack" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/helm-unpack/linux-amd64/helm" /usr/local/bin/helm
          /usr/local/bin/helm version --short

      - name: Install pinned kubectl (kustomize render + patch --local)
        run: |
          export PATH="/usr/local/bin:$PATH"
          KUBECTL_VERSION=v1.37.0
          # sha256 recorded in-repo (AGENTS.md §6): dl.k8s.io checksum file.
          KUBECTL_SHA256=6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          /usr/local/bin/kubectl version --client=true

      - name: Install pinned Task runner
        run: |
          sh scripts/tools/install-task.sh

      - name: airgap-deploy dry-run (prod render, fail-closed placeholders, knobs)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          VLLM_BASE_URL: http://vllm:8000
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          sh scripts/tools/run-task.sh airgap:deploy
          test -f dist/agent-rendered.yaml
          grep -q "ghcr.io/dryrun-standin/qdrant-pdf-rag-agent:${SHA}" dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/agent-rendered.yaml
          # Tracing defaults ON: an unset endpoint resolves to the in-cluster
          # Jaeger (issue #83), so the default deploy renders it too.
          test -f dist/jaeger-rendered.yaml
          grep -q 'value: http://jaeger:4318' dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/jaeger-rendered.yaml

      - name: airgap-deploy dry-run with PULL_SECRET + extra values
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          VLLM_BASE_URL: http://vllm:8000
          PULL_SECRET: ci-pull
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          printf 'resources:\n  requests: {cpu: "100m", memory: 256Mi}\n' > "$RUNNER_TEMP/vals.yaml"
          export QDRANT_EXTRA_VALUES="$RUNNER_TEMP/vals.yaml"
          out="$(sh scripts/tools/run-task.sh airgap:deploy)"
          echo "$out" | grep -q "persistence.size=1Gi"
          echo "$out" | grep -q "imagePullSecrets\[0\].name=ci-pull"
          grep -q "name: ci-pull" dist/agent-rendered.yaml

      - name: airgap-deploy dry-run fails closed on a bad extra-values file
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          VLLM_BASE_URL: http://vllm:8000
          QDRANT_EXTRA_VALUES: /nonexistent/vals.yaml
        run: |
          export PATH="/usr/local/bin:$PATH"
          if sh scripts/tools/run-task.sh airgap:deploy 2>err.log; then
            echo "::error::deploy.sh did not fail on a missing QDRANT_EXTRA_VALUES file"
            exit 1
          fi
          grep -q "QDRANT_EXTRA_VALUES file not found" err.log

      - name: airgap-deploy dry-run with tracing enabled (Jaeger render, issue #83)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          VLLM_BASE_URL: http://vllm:8000
          OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          sh scripts/tools/run-task.sh airgap:deploy
          test -f dist/jaeger-rendered.yaml
          grep -q "ghcr.io/dryrun-standin/jaegertracing/jaeger:v2.20.0" dist/jaeger-rendered.yaml
          grep -q "storageClassName: standard" dist/jaeger-rendered.yaml
          grep -q 'value: http://jaeger:4318' dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/jaeger-rendered.yaml

      - name: airgap-deploy dry-run with metrics enabled (ServiceMonitor render, issue #187)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          VLLM_BASE_URL: http://vllm:8000
          METRICS_ENABLED: "true"
          OTEL_EXPORTER_OTLP_ENDPOINT: off
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          # Hermetic w.r.t. sibling dry-run steps sharing this workspace, and
          # focused: tracing defaults ON (asserted by the prod-render step), so
          # this step uses the off sentinel — metrics-on does not depend on
          # tracing and must not drag Jaeger along.
          rm -f dist/jaeger-rendered.yaml
          sh scripts/tools/run-task.sh airgap:deploy
          test -f dist/servicemonitor-rendered.yaml
          grep -q "kind: ServiceMonitor" dist/servicemonitor-rendered.yaml
          grep -q "path: /metrics" dist/servicemonitor-rendered.yaml
          grep -q "namespace: airgap-dryrun" dist/servicemonitor-rendered.yaml
          grep -A1 'name: METRICS_ENABLED' dist/agent-rendered.yaml | grep -q 'value: "true"'
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/servicemonitor-rendered.yaml
          test ! -f dist/jaeger-rendered.yaml

      - name: airgap-ingest dry-run (prod ingest render + patch knob)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          CORPUS_PVC: corpus
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          VLLM_BASE_URL: http://vllm:8000
          INGEST_WORK_SIZE: 2Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          cat > "$RUNNER_TEMP/ingest-patch.json" <<'EOF'
          {"spec":{"template":{"spec":{"containers":[{"name":"ingest","resources":{"requests":{"cpu":"250m","memory":"512Mi"},"limits":{"cpu":"1","memory":"1Gi"}}}]}}}}
          EOF
          export INGEST_EXTRA_PATCH="$RUNNER_TEMP/ingest-patch.json"
          sh scripts/tools/run-task.sh airgap:ingest
          test -f dist/ingest-rendered.yaml
          grep -q "ghcr.io/dryrun-standin/qdrant-pdf-rag-ingest:${SHA}" dist/ingest-rendered.yaml
          grep -q "cpu: 250m" dist/ingest-rendered.yaml   # INGEST_EXTRA_PATCH applied
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/ingest-rendered.yaml

      - name: Task airgap:dryrun (full pipeline dry-run incl. validate/load/smoke)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          VLLM_BASE_URL: http://vllm:8000
          CORPUS_PVC: corpus
        run: |
          export PATH="/usr/local/bin:$PATH"
          sh scripts/tools/run-task.sh airgap:dryrun
          test -f dist/agent-rendered.yaml
          test -f dist/ingest-rendered.yaml

  # ---------------------------------------------- air-gap runbook rehearsal
  # Rehearses the OPERATOR RUNBOOK (issue #15) against the lab OpenShift, so
  # CI-green proves the air-gap deployment path works at the packed SHA:
  #   airgap-pack -> airgap-load (INTERNAL_REGISTRY stand-in: GHCR)
  #   -> airgap-deploy (PROD kustomize overlay + prod Helm values)
  #   -> airgap-ingest (corpus PVC) -> airgap-smoke.
  # CI-only stand-ins, never in git prod values (see the size knobs in
  # scripts/airgap/deploy.sh + ingest.sh):
  #   - GHCR plays INTERNAL_REGISTRY (node-side HTTP registry config is a
  #     cluster-admin operation the lab does not grant).
  #   - scripts/mock_vllm.py plays the owning team's vLLM endpoint: same API
  #     shape, deterministic vectors — the airgap scripts refuse
  #     EMBED_MODE=hash, so the prod embed path stays honest.
  #   - QDRANT_STORAGE_SIZE / QDRANT_EXTRA_VALUES / INGEST_WORK_SIZE /
  #     INGEST_EXTRA_PATCH shrink PVCs and resources for lab quota.
  #   - PULL_SECRET (ghcr-pull) is wired into deploy/ingest: load pushes the
  #     qdrant image to a fresh (private) GHCR package, so anonymous pull
  #     would ImagePullBackoff.
  airgap-rehearsal:
    concurrency:
      group: airgap-rehearsal-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    needs: [build, airgap-package, e2e-secrets-check]
    if: >-
      needs.e2e-secrets-check.outputs.ok == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHARE: "false"
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      SHA: ${{ needs.build.outputs.sha }}
      AGENT_IMAGE: ${{ needs.build.outputs.agent_image }}
      INGEST_IMAGE: ${{ needs.build.outputs.ingest_image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0; artifact bytes only
        with:
          name: sneakernet-bundle-${{ env.SHA }}
          path: gapbox/
      - name: Fresh published-bundle bootstrap
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox
          sha256sum -c "qdrant-pdf-rag-${SHA}.tar.sha256"
          tar xf "qdrant-pdf-rag-${SHA}.tar"
          AIRGAP_WORKSPACE=qdrant-pdf-rag sh bootstrap.sh
          test "$(git -C qdrant-pdf-rag rev-parse HEAD)" = "$SHA"
          echo "BUNDLE_CHECKOUT=$GITHUB_WORKSPACE/gapbox/qdrant-pdf-rag" >> "$GITHUB_ENV"

      - name: Install checksum-pinned Helm
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-unpack"
          tar xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/helm-unpack" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/helm-unpack/linux-amd64/helm" /usr/local/bin/helm
          /usr/local/bin/helm version --short
      - name: Install checksum-pinned OpenShift client
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/oc.tgz" https://mirror.openshift.com/pub/openshift-v4/clients/ocp/4.22.7/openshift-client-linux.tar.gz
          echo "3d02d45ae5037a723afbbdda1063c08d4788a9b9ace6c6f44aa329764ee648a1  $RUNNER_TEMP/oc.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oc-unpack"
          tar xzf "$RUNNER_TEMP/oc.tgz" -C "$RUNNER_TEMP/oc-unpack" oc kubectl
          sudo install -m 0755 "$RUNNER_TEMP/oc-unpack/oc" /usr/local/bin/oc
          sudo install -m 0755 "$RUNNER_TEMP/oc-unpack/kubectl" /usr/local/bin/kubectl
          /usr/local/bin/oc version --client=true
      - name: Install skopeo (pack/load)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Log in to lab OpenShift
        run: /usr/local/bin/oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true

      - name: Create ephemeral namespace
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          NS="rag-gap-${SHA}"
          echo "NS=$NS" >> "$GITHUB_ENV"
          /usr/local/bin/oc new-project "$NS"
          /usr/local/bin/oc label namespace "$NS" app.kubernetes.io/managed-by=e2e-workflow ephemeral=true

      - name: Create GHCR pull secret (rehearsal loads private packages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          /usr/local/bin/kubectl -n "$NS" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GITHUB_TOKEN"
          echo "PULL_SECRET=ghcr-pull" >> "$GITHUB_ENV"

      # The mock ships as a ConfigMap: scripts/mock_vllm.py is excluded from
      # the images (.dockerignore) so a CI-only HTTP server never ships in a
      # prod image.
      - name: Deploy mock vLLM (deterministic embeddings stand-in)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')"
          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_ENV"
          /usr/local/bin/kubectl -n "$NS" create configmap mock-vllm --from-file=mock_vllm.py=scripts/mock_vllm.py
          /usr/local/bin/kubectl apply -n "$NS" -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vllm-mock
            labels: {app: vllm-mock}
          spec:
            replicas: 1
            selector: {matchLabels: {app: vllm-mock}}
            template:
              metadata: {labels: {app: vllm-mock}}
              spec:
                containers:
                  - name: mock
                    image: ${AGENT_IMAGE}
                    command: ["python3", "/cm/mock_vllm.py"]
                    env:
                      - {name: MOCK_DIM, value: "1024"}
                      - {name: PORT, value: "8000"}
                    ports: [{containerPort: 8000}]
                    readinessProbe:
                      httpGet: {path: /healthz, port: 8000}
                      initialDelaySeconds: 2
                    resources:
                      requests: {cpu: "50m", memory: 128Mi}
                      limits: {cpu: "500m", memory: 256Mi}
                    volumeMounts: [{name: mock, mountPath: /cm}]
                volumes:
                  - name: mock
                    configMap: {name: mock-vllm}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: vllm-mock
          spec:
            selector: {app: vllm-mock}
            ports: [{port: 8000, targetPort: 8000}]
          EOF
          /usr/local/bin/kubectl -n "$NS" rollout status deploy/vllm-mock --timeout=180s

      - name: Detect default StorageClass
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          SC="$(/usr/local/bin/oc get sc -o jsonpath='{range .items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")]}{.metadata.name}{end}')"
          [ -n "$SC" ] || { echo "::error::no default StorageClass on the lab cluster"; exit 1; }
          echo "SC=$SC" >> "$GITHUB_ENV"

      - name: Write CI-scale Qdrant overrides (lab quota only; git prod values untouched)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          cat > "$RUNNER_TEMP/qdrant-ci-scale.yaml" <<'EOF'
          # Rehearsal-only: prod values.yaml keeps 4cpu/16Gi requests; the lab
          # namespace quota cannot fit 3 replicas at prod size.
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          EOF
          echo "QDRANT_EXTRA_VALUES=$RUNNER_TEMP/qdrant-ci-scale.yaml" >> "$GITHUB_ENV"

      - name: Write CI-scale ingest patch (same quota; prod Job asks 4cpu/8Gi)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          cat > "$RUNNER_TEMP/ingest-ci-scale.json" <<'EOF'
          {"spec":{"template":{"spec":{"containers":[{"name":"ingest","resources":{"requests":{"cpu":"250m","memory":"512Mi"},"limits":{"cpu":"1","memory":"1Gi"}}}]}}}}
          EOF
          echo "INGEST_EXTRA_PATCH=$RUNNER_TEMP/ingest-ci-scale.json" >> "$GITHUB_ENV"

      - name: airgap-load (GHCR stands in for INTERNAL_REGISTRY)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          INTERNAL_REGISTRY="ghcr.io/${OWNER_LC}"
          echo "${GITHUB_TOKEN}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          export INTERNAL_REGISTRY
          sh scripts/tools/run-task.sh airgap:load

      - name: airgap-deploy (PROD overlays, helm-knobbed sizes, fail-closed checks)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          EMBED_MODEL: mock-embed
          DENSE_DIM: "1024"
          EMBED_MODEL_REVISION: mock-embed@ci
          VLLM_BASE_URL: http://vllm-mock:8000
          LLM_BASE_URL: http://vllm-mock:8000/v1
          LLM_MODEL_REASONING: mock-reasoning
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          export INTERNAL_REGISTRY="ghcr.io/${OWNER_LC}"
          export NAMESPACE="$NS"
          export STORAGE_CLASS="$SC"
          sh scripts/tools/run-task.sh airgap:deploy

      - name: Generate corpus PVC + demo PDFs (operator-supplied corpus step)
        env:
          STORAGE_CLASS: ${{ env.SC }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          /usr/local/bin/kubectl -n "$NS" apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata: {name: corpus}
          spec:
            accessModes: ["ReadWriteOnce"]
            resources: {requests: {storage: 1Gi}}
            storageClassName: ${STORAGE_CLASS}
          ---
          apiVersion: batch/v1
          kind: Job
          metadata: {name: corpus-gen}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: gen
                    image: ${INGEST_IMAGE}
                    command: ["/bin/sh", "-ec"]
                    args:
                      - |
                        python3 /app/scripts/make_synthetic_pdf.py --out /corpus/SA22-0000-00_outline.pdf
                        python3 /app/scripts/make_synthetic_pdf.py --plain --out /corpus/plain-widget-notes.pdf
                        ls -la /corpus
                    volumeMounts: [{name: corpus, mountPath: /corpus}]
                volumes:
                  - name: corpus
                    persistentVolumeClaim: {claimName: corpus}
          EOF
          /usr/local/bin/kubectl -n "$NS" wait --for=condition=complete job/corpus-gen --timeout=300s

      - name: airgap-ingest (PROD ingest Job, corpus PVC, vLLM-shaped endpoint)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          CORPUS_PVC: corpus
          EMBED_MODEL: mock-embed
          DENSE_DIM: "1024"
          EMBED_MODEL_REVISION: mock-embed@ci
          VLLM_BASE_URL: http://vllm-mock:8000
          LLM_BASE_URL: http://vllm-mock:8000/v1
          LLM_MODEL_REASONING: mock-reasoning
          INGEST_WORK_SIZE: 2Gi
          INGEST_TIMEOUT: "900"
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          export INTERNAL_REGISTRY="ghcr.io/${OWNER_LC}"
          export NAMESPACE="$NS"
          export STORAGE_CLASS="$SC"
          sh scripts/tools/run-task.sh airgap:ingest

      - name: airgap-smoke (operator smoke + expected-substring checks)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          NAMESPACE="$NS" QUERY="IEA500I operator message" sh scripts/tools/run-task.sh airgap:smoke
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "IEA500I operator message" --expect "IEA500I"
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "torque the widget screws" --expect "torque"

      - name: Delete ephemeral namespace
        if: always()
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          /usr/local/bin/oc delete project "$NS" --wait=false --ignore-not-found || \
            /usr/local/bin/kubectl delete namespace "$NS" --ignore-not-found --wait=false || true
