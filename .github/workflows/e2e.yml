# Connected-path E2E (issue #8): build the real Containerfiles, push to GHCR on
# main, and smoke-test synthetic demo PDFs against a lab OpenShift namespace.
# Synthetic PDFs only — generated in-cluster by the ingest Job. Never upload
# them as artifacts, never commit them (hygiene job enforces that).
#
# Image scheme (single source of truth, issue #8):
#   ghcr.io/<owner-lowercase>/qdrant-pdf-rag-{ingest,agent}:<full-git-sha>
# built via `docker tag` from the artifact task local tags, pushed on
# main/dispatch, and consumed by the chart through generated operator values.
#
# Prereqs (README "Connected E2E"): GHCR packages public (anonymous pull from
# the lab cluster), OPENSHIFT_SERVER/OPENSHIFT_TOKEN secrets. curlimages/curl
# is pulled from Docker Hub — allowed on the connected lab cluster only.
#
# Air-gapped GitLab deliberately has no equivalent of this workflow: no GHCR,
# no lab cluster from the air-gap (see .gitlab-ci.yml comment).
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Heavy lanes (sneakernet bundle, bundle acceptance, 12 Kind lanes, rehearsal)
  # run nightly on main HEAD instead of on every merge. Off the hour, UTC.
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: e2e-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  INGEST_IMAGE_LOCAL: mainframe-rag/ingest
  AGENT_IMAGE_LOCAL: mainframe-rag/agent

jobs:
  select:
    env:
      SHARE: "false"
    concurrency:
      group: select-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lanes: ${{ steps.profile.outputs.lanes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: profile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXECUTION_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/review_tooling.py profile --base "$BASE_SHA" --head "$EXECUTION_SHA"
          --out "$RUNNER_TEMP/dispatch-manifest.json" --github-output "$GITHUB_OUTPUT"

  build-inputs:
    needs: select
    if: contains(fromJSON(needs.select.outputs.lanes), 'packaging')
    concurrency:
      group: build-inputs-${{ matrix.artifact }}-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        artifact: [wheelhouse, bm25-weights]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHARE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Acquire verified runtime wheels
        if: matrix.artifact == 'wheelhouse'
        run: python scripts/dependency_lock.py prepare --profile runtime --directory bundles/wheelhouse --download-workers 8
      - name: Install pinned Task runner
        if: matrix.artifact == 'bm25-weights'
        run: sh scripts/tools/install-task.sh
      - name: Prepare verified BM25 weights
        if: matrix.artifact == 'bm25-weights'
        run: |
          python scripts/prepare_python.py --venv .venv --wheelhouse .tools/python-wheels/dev --connected --download-workers 8
          sh scripts/tools/run-task.sh artifacts:bm25
        timeout-minutes: 10
      - name: Retain verified build input bytes
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: build-${{ matrix.artifact }}-${{ github.sha }}
          overwrite: true
          path: bundles/${{ matrix.artifact }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0

  images:
    needs: [select, build-inputs]
    if: contains(fromJSON(needs.select.outputs.lanes), 'packaging')
    strategy:
      fail-fast: false
      matrix:
        role: [ingest, agent]
    concurrency:
      group: image-${{ matrix.role }}-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHARE: "false"
      IMAGE_ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: sh scripts/tools/install-task.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-wheelhouse-${{ github.sha }}
          path: bundles/wheelhouse
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-bm25-weights-${{ github.sha }}
          path: bundles/bm25-weights
      - name: Verify transferred bytes and build one image
        run: >-
          sh scripts/tools/run-task.sh artifacts:image
          ROLE="$IMAGE_ROLE" IMAGE_NAME="mainframe-rag/$IMAGE_ROLE"
          IMAGE_TAG="$GITHUB_SHA" PY="$(command -v python)"

      - name: Push to GHCR
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_LC="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')"
          IMAGE="ghcr.io/${OWNER_LC}/qdrant-pdf-rag-${IMAGE_ROLE}:$GITHUB_SHA"
          docker tag "mainframe-rag/${IMAGE_ROLE}:$GITHUB_SHA" "$IMAGE"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"

  # Open WebUI image contracts (#1074, #1083): tests/openwebui_image_contracts.py runs the chart's
  # ca-trust init script and the pinned get_user_role inside the pinned upstream Open WebUI image.
  # Not a unit test (unit runners lack the image), so a skip fails the job. Triggers: dispatch,
  # nightly and push to main, like the heavy lanes; not pull_request, because a job cannot be
  # path-filtered and the upstream image pull is large (browser.yml's per-path PR filter does not
  # transfer to a job inside this workflow).
  openwebui-image-contracts:
    if: github.event_name != 'pull_request'
    concurrency:
      group: openwebui-image-contracts-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse .tools/python-wheels/dev --connected --download-workers 8
        timeout-minutes: 4
      - name: Pull the pinned upstream Open WebUI image by digest (images.txt)
        run: |
          row=$(awk '$1 ~ /^ghcr\.io\/open-webui\/open-webui:/ {print $1 " " $2; exit}' images.txt)
          ref=${row%% *}; digest=${row#* }
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "no upstream Open WebUI digest in images.txt" >&2; exit 1 ;; esac
          docker pull -q "${ref%:*}@$digest"
      - name: Run the image contracts
        run: python -m pytest -p no:cacheprovider --junitxml "$RUNNER_TEMP/openwebui-image.xml" tests/openwebui_image_contracts.py
      - name: Refuse skipped or xfailed contracts
        run: python scripts/check_junit_clean.py "$RUNNER_TEMP/openwebui-image.xml"

  # Derived Open WebUI image (ADR-0008, #1070/#1074): the unmodified upstream slim
  # release plus one ownership layer (images/openwebui/Containerfile), no build
  # contexts. Dispatch and nightly only, never pull_request. Pushed with the commit
  # SHA tag; the fixed version tag is created once and never moved. The manifest
  # digest goes to the job summary so a dedicated pin PR can record it in
  # images.txt (this job never edits it).
  image-openwebui:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    concurrency:
      group: image-openwebui-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and push the derived image (commit-SHA tag; the version tag is set once, never moved)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_LC="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')"
          IMAGE="ghcr.io/${OWNER_LC}/qdrant-pdf-rag-openwebui"
          VERSION_TAG=v0.12.3-slim
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Rebuilds of the same Containerfile aim at the same digest: the timestamp is the commit time
          # of the Containerfile and BuildKit rewrites layer timestamps to it.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- images/openwebui/Containerfile)"
          export SOURCE_DATE_EPOCH
          docker buildx create --name owui --driver docker-container --use >/dev/null
          build() {
            docker buildx build --builder owui -f images/openwebui/Containerfile --provenance=false --sbom=false \
              --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" --output "$1,rewrite-timestamp=true" images/openwebui
          }
          build "type=image,name=$IMAGE:$GITHUB_SHA,push=true"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "$DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "no manifest digest" >&2; exit 1 ;; esac
          # The fixed version tag is set only when it does not exist yet. An existing tag is left alone
          # whatever it points at (a moving fixed tag is a supply-chain trap); the maintainer decides.
          if docker buildx imagetools inspect "$IMAGE:$VERSION_TAG" >/dev/null 2>&1; then
            EXISTING="$(docker buildx imagetools inspect "$IMAGE:$VERSION_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            TAGSTATE="left alone: $VERSION_TAG exists at $EXISTING"
            [ "$EXISTING" = "$DIGEST" ] && TAGSTATE="left alone: $VERSION_TAG already points at this digest"
          else
            docker buildx imagetools create -t "$IMAGE:$VERSION_TAG" "$IMAGE@$DIGEST"
            TAGSTATE="set: $VERSION_TAG did not exist"
          fi
          # Reproducibility probe: a second build of the same inputs must give the same manifest digest.
          REPRO="no (digest differs on rebuild)"
          build "type=oci,dest=$RUNNER_TEMP/owui-rebuild.tar"
          REBUILT="$(tar -xOf "$RUNNER_TEMP/owui-rebuild.tar" index.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["manifests"][0]["digest"])')"
          [ "$REBUILT" = "$DIGEST" ] && REPRO="yes"
          {
            echo "### Open WebUI derived image"
            echo ""
            echo "- pushed tag: \`$IMAGE:$GITHUB_SHA\`"
            echo "- manifest digest (for the images.txt pin PR): \`$DIGEST\`"
            echo "- fixed version tag: $TAGSTATE"
            echo "- SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH, rebuild reproduces the digest: $REPRO (rebuild digest \`$REBUILT\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [select, build-inputs, images]
    if: always() && contains(fromJSON(needs.select.outputs.lanes || '[]'), 'packaging')
    concurrency:
      group: build-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.refs.outputs.sha }}
      ingest_image: ${{ steps.refs.outputs.ingest }}
      agent_image: ${{ steps.refs.outputs.agent }}
    env:
      SHARE: "false"
    steps:
      - name: Require all prepared inputs and both images
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          INPUTS_RESULT: ${{ needs.build-inputs.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          test "$SELECT_RESULT" = success
          test "$INPUTS_RESULT" = success
          test "$IMAGES_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - name: Record packaging checkout identity
        run: python3 scripts/ci_evidence.py --lane packaging --job-name build --output "$RUNNER_TEMP/evidence-build" --identity-only
      - name: Retain native execution evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-build-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-build
          if-no-files-found: error
      - id: refs
        run: |
          OWNER_LC="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "ingest=ghcr.io/${OWNER_LC}/qdrant-pdf-rag-ingest:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "agent=ghcr.io/${OWNER_LC}/qdrant-pdf-rag-agent:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------- sneakernet packaging
  # Automates the sneakernet release factory (issue #15): packages the bundle
  # and all recorded-digest pinned images (including the authenticated Red Hat
  # oauth-proxy sidecar) on every merge to main (or manual dispatch),
  # generating the transfer certificate and uploading the tarball + digests as
  # a downloadable workflow artifact.
  airgap-package:
    concurrency:
      group: airgap-package-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    needs: [build]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # #1000: the signing key is an environment secret of `release-signing`
    # (deployment branches: main only, required reviewers; docs/deploy.md).
    # Any other ref, and the nightly schedule (#1051: no approval prompt, packs
    # with an ephemeral key), lands in the secret-free `branch-unsigned`
    # environment. Only a manual dispatch on main signs.
    environment: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'release-signing' || 'branch-unsigned' }}
    env:
      SHARE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pinned Task runner
        run: |
          sh scripts/tools/install-task.sh

      - name: Install skopeo
        run: |
          export PATH="/usr/local/bin:$PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Log in to Red Hat registry
        env:
          REDHAT_REGISTRY_USER: ${{ secrets.REDHAT_REGISTRY_USER }}
          REDHAT_REGISTRY_PASSWORD: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REDHAT_REGISTRY_USER" ] || [ -z "$REDHAT_REGISTRY_PASSWORD" ]; then
            echo "::error::REDHAT_REGISTRY_USER and REDHAT_REGISTRY_PASSWORD are required to package the pinned OAuth image"
            exit 1
          fi
          printf '%s' "$REDHAT_REGISTRY_PASSWORD" | skopeo login registry.redhat.io \
            --username "$REDHAT_REGISTRY_USER" --password-stdin

      - name: airgap-pack
        env:
          IMAGE_SHA: ${{ needs.build.outputs.sha }}
          # Production trust comes from the SNEAKERNET_SIGNING_KEY secret
          # (PEM private key; pubkey ceremony in docs/install_and_ops.md).
          # Until a maintainer stores it, pack with an ephemeral throwaway
          # key so the sign/verify plumbing still executes end to end.
          # Only a workflow_dispatch on main resolves the secret; elsewhere
          # (including the nightly schedule) it is empty.
          SNEAKERNET_SIGNING_KEY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.SNEAKERNET_SIGNING_KEY || '' }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          if [ -z "$SNEAKERNET_SIGNING_KEY" ]; then
            echo "::warning::SNEAKERNET_SIGNING_KEY secret unset — packing with an ephemeral throwaway key (plumbing only, no trust; MANIFEST records signed: ephemeral)"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/signing.key"
            export SNEAKERNET_SIGNING_KEY="$RUNNER_TEMP/signing.key"
          else
            printf '%s' "$SNEAKERNET_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
            openssl pkey -in "$RUNNER_TEMP/signing.key" -noout || {
              echo "::error::SNEAKERNET_SIGNING_KEY is not a valid PEM private key (store real newlines, not backslash-escaped ones)"
              exit 1
            }
            export SNEAKERNET_SIGNING_KEY="$RUNNER_TEMP/signing.key"
            # Trust is claimed only for a manual dispatch on main.
            if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              export SNEAKERNET_KEY_TRUSTED=true
            fi
          fi
          sh scripts/tools/run-task.sh airgap:pack
          ls -la dist/
          cat dist/MANIFEST.txt
          cat dist/PACKING_RECORD.txt

      - name: Upload sneakernet bundle artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sneakernet-bundle-${{ needs.build.outputs.sha }}
          path: |
            dist/qdrant-pdf-rag-*.tar
            dist/qdrant-pdf-rag-*.tar.sha256
            dist/PACKING_RECORD.txt
            dist/MANIFEST.txt
          compression-level: 0
          retention-days: 90

  # --------------------------- air-gap handoff acceptance (black box)
  # Consumes the sneakernet tarball EXACTLY like a bastion operator: fresh
  # empty dir, digest verify BEFORE unpack, bootstrap.sh, then the operator
  # runbook from the bootstrapped clone (validate + full pipeline dry-run).
  # Every acceptance lane traverses pack -> tarball -> bootstrap.sh ->
  # ARTDIR/MANIFEST discovery independently. This lane needs no cluster.
  airgap-acceptance:
    concurrency:
      group: airgap-acceptance-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    needs: [build, airgap-package]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Open WebUI is default-on (ADR-0008) and fails closed without site inputs; this job
      # does not deploy it (the kind `openwebui` lane does, via scripts/openwebui/acceptance.sh).
      OPENWEBUI_ENABLED: "false"
      SHARE: "false"
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - name: Install checksum-pinned Helm
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-unpack"
          tar xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/helm-unpack" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/helm-unpack/linux-amd64/helm" /usr/local/bin/helm
          /usr/local/bin/helm version --short

      - name: Install pinned kubectl (CI patch --local)
        run: |
          export PATH="/usr/local/bin:$PATH"
          KUBECTL_VERSION=v1.33.12
          # sha256 recorded in-repo (AGENTS.md §6): dl.k8s.io checksum file.
          KUBECTL_SHA256=fe80ae4133b44fa2077db4af144e80765eb1b3b2eede55fbff6933c4374d8c6e
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          /usr/local/bin/kubectl version --client=true

      - name: Download sneakernet bundle (this is what the operator receives)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (verified via API: v4 tag; fetches nothing at runtime — artifact bytes only)
        with:
          name: sneakernet-bundle-${{ env.SHA }}
          path: gapbox/

      - name: Black-box handoff (verify, unpack, bootstrap, runbook)
        env:
          IMAGE_SHA: ${{ env.SHA }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox
          sha256sum -c "qdrant-pdf-rag-${SHA}.tar.sha256"
          tar xf "qdrant-pdf-rag-${SHA}.tar"
          AIRGAP_WORKSPACE=qdrant-pdf-rag sh bootstrap.sh
          # The bootstrapped layout must satisfy ARTDIR discovery on its own.
          test -f qdrant-pdf-rag/dist/SHA256SUMS
          (cd qdrant-pdf-rag/dist && sha256sum -c SHA256SUMS)
          test -f qdrant-pdf-rag/dist/sbom.json
          test -f qdrant-pdf-rag/dist/SHA256SUMS.sig
          test -f qdrant-pdf-rag/dist/sneakernet-signing.pub
          test -f qdrant-pdf-rag/dist/task_linux_amd64.tar.gz
          test -f qdrant-pdf-rag/dist/task-pin.txt
          test -f qdrant-pdf-rag/dist/task-LICENSE
          test -s qdrant-pdf-rag/dist/THIRD-PARTY-NOTICES.txt
          grep -q "^task_version: " qdrant-pdf-rag/dist/MANIFEST.txt
          grep -q "go-task/task" qdrant-pdf-rag/dist/sbom.json
          test "$(git -C qdrant-pdf-rag rev-parse HEAD)" = "$SHA"
          test "$(awk '/^sha: /{print $2}' qdrant-pdf-rag/dist/MANIFEST.txt)" = "$SHA"
          cd qdrant-pdf-rag
          # Operator-equivalent airgap.env edits (dry-run stand-ins, never prod).
          sed -i \
            -e 's|^INTERNAL_REGISTRY=.*|INTERNAL_REGISTRY=ghcr.io/acceptance-standin|' \
            -e 's|^NAMESPACE=.*|NAMESPACE=acceptance|' \
            -e 's|^STORAGE_CLASS=.*|STORAGE_CLASS=standard|' \
            -e 's|^IMAGE_SHA=.*|IMAGE_SHA='"$SHA"'|' \
            -e 's|^EMBED_MODEL=.*|EMBED_MODEL=embed-from-airgap-env|' \
            -e 's|^EMBED_MODEL_REVISION=.*|EMBED_MODEL_REVISION=acceptance-rev-1|' \
            -e 's|^DENSE_DIM=.*|DENSE_DIM=768|' \
            -e 's|^GATEWAY_BASE_URL=.*|GATEWAY_BASE_URL=http://gateway:4000/v1|' \
            -e 's|^LLM_MODEL_REASONING=.*|LLM_MODEL_REASONING=code|' \
            -e 's|^CORPUS_PVC=.*|CORPUS_PVC=corpus|' \
            airgap.env
          AIRGAP_DRYRUN=1 sh scripts/tools/run-task.sh airgap:validate
          # Render the operator's standin values explicitly: `airgap:dryrun`
          # carries its own fixed test parameters by contract,
          # so it cannot render this airgap.env — pass the same standins as
          # environment (explicit env wins over the file since #152).
          AIRGAP_DRYRUN=1 IMAGE_SHA="$SHA" \
            INTERNAL_REGISTRY=ghcr.io/acceptance-standin NAMESPACE=acceptance \
            STORAGE_CLASS=standard EMBED_MODEL=embed-from-airgap-env DENSE_DIM=768 \
            EMBED_MODEL_REVISION=acceptance-rev-1 \
            GATEWAY_BASE_URL=http://gateway:4000/v1 \
            LLM_MODEL_REASONING=code CORPUS_PVC=corpus \
            sh scripts/airgap/pipeline.sh --dry-run
          test -f dist/agent-rendered.yaml
          test -f dist/ingest-rendered.yaml
          grep -q "ghcr.io/acceptance-standin/qdrant-pdf-rag-agent:${SHA}" dist/agent-rendered.yaml
          grep -q "imagePullSecrets: \[\]" dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/ingest-rendered.yaml
          # Second PULL_SECRET branch: a wired secret reaches the manifests.
          sed -i \
            -e 's|^PULL_SECRET=.*|PULL_SECRET=acceptance-pull|' \
            -e 's|^GATEWAY_BASE_URL=.*|GATEWAY_BASE_URL=|' \
            -e 's|^EMBED_BASE_URL=.*|EMBED_BASE_URL=http://vllm:8000/v1|' \
            -e 's|^LLM_MODEL_REASONING=.*|LLM_MODEL_REASONING=|' airgap.env
          AIRGAP_DRYRUN=1 sh scripts/tools/run-task.sh airgap:pipeline
          grep -q "name: acceptance-pull" dist/agent-rendered.yaml

  # --------------------------------------- kind full-live handoff rehearsal
  # The layout-faithful tier: consumes the sneakernet tarball in a fresh
  # empty dir (verify, unpack, bootstrap.sh) and runs the REAL operator
  # runbook — live validate, live pipeline (load, deploy, ingest, smoke) —
  # against an ephemeral Kind cluster with an authenticated TLS registry.
  # Ephemeral credentials and a private CA exercise loader/node trust and
  # the wired PULL_SECRET branch; no lab credentials are required. airgap-acceptance proves the handoff
  # statically (dry-run);
  # this job proves the deployment comes up from a bootstrapped clone.
  # CI-only sizing (single replica, Gi sizes): a CI runner cannot schedule
  # the 3x16Gi prod Qdrant (proven: Insufficient memory on one node), so the
  # documented local-testing overrides apply; git prod values are untouched.
  # Issue #809: public egress is blocked at the packet filter before the bundle
  # is bootstrapped (scripts/ci/egress_gate.sh); bootstrap, image import, deploy,
  # the A/repeat/B/failed-B/rollback chart sequence (lifecycle-chart lane) and the
  # next ordinary deploy all run behind it. Contract: docs/deploy.md.
  kind-live-rehearsal:
    needs: [build, airgap-package]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    name: kind-${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [pipeline, gateway-chat-upstream, gateway-chat-malformed, gateway-chat-truncated, gateway-embed-upstream, gateway-embed-malformed, gateway-embed-dimension, gateway-auth, lifecycle-chart, lifecycle, shared-gateway, rerank, observability, openwebui]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    concurrency:
      group: kind-${{ matrix.lane }}-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    env:
      # Open WebUI is default-on (ADR-0008) and fails closed without site inputs; this job
      # does not deploy it (the kind `openwebui` lane does, via scripts/openwebui/acceptance.sh).
      OPENWEBUI_ENABLED: "false"
      SHARE: "false"
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - name: Record runner capacity
        run: |
          export PATH="/usr/local/bin:$PATH"
          mkdir -p diagnostics
          { nproc; free -h; df -h; } > diagnostics/runner-capacity.txt
      - name: Install checksum-pinned Helm
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-unpack"
          tar xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/helm-unpack" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/helm-unpack/linux-amd64/helm" /usr/local/bin/helm
          /usr/local/bin/helm version --short

      - name: Install pinned kubectl (CI patch --local)
        run: |
          export PATH="/usr/local/bin:$PATH"
          KUBECTL_VERSION=v1.33.12
          # sha256 recorded in-repo (AGENTS.md §6): dl.k8s.io checksum file.
          KUBECTL_SHA256=fe80ae4133b44fa2077db4af144e80765eb1b3b2eede55fbff6933c4374d8c6e
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          /usr/local/bin/kubectl version --client=true

      - name: Install skopeo (pack/load)
        run: |
          export PATH="/usr/local/bin:$PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Install pinned kind (ephemeral air-gap-like cluster)
        run: |
          export PATH="/usr/local/bin:$PATH"
          KIND_VERSION=v0.32.0
          # sha256 recorded in-repo (AGENTS.md §6): kind-linux-amd64 release asset digest.
          KIND_SHA256=50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
          curl -fsSL -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kind /usr/local/bin/kind
          /usr/local/bin/kind version

      - name: Download sneakernet bundle (this is what the operator receives)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (verified via API: v4 tag; fetches nothing at runtime — artifact bytes only)
        with:
          name: sneakernet-bundle-${{ env.SHA }}
          path: gapbox/

      # Rehearsal infrastructure only (test TLS, registry/gateway stand-ins, the
      # egress gate and probe): none of this is shipped to the operator, whose
      # workspace comes solely from the bundle, bootstrapped behind the boundary.
      - name: Check out rehearsal infrastructure scripts (CI helpers, not the operator workspace)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: rehearsal-infra
          fetch-depth: 1
          persist-credentials: false

      - name: Start authenticated TLS registry + Kind
        run: |
          export PATH="/usr/local/bin:$PATH"
          TLS_DIR="$RUNNER_TEMP/registry-tls"
          sh rehearsal-infra/scripts/ci/create_test_tls.sh "$TLS_DIR" kind-registry
          # Keep credentials out of arguments, logs and retained diagnostics.
          umask 077
          openssl rand -hex 24 > "$TLS_DIR/password"
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2-utils
          htpasswd -iBc "$TLS_DIR/htpasswd" rehearsal < "$TLS_DIR/password"
          echo '127.0.0.1 kind-registry' | sudo tee -a /etc/hosts >/dev/null
          sudo cp "$TLS_DIR/ca.crt" /usr/local/share/ca-certificates/rehearsal-registry.crt
          sudo update-ca-certificates
          mkdir -p "$TLS_DIR/node-trust/kind-registry:5000"
          cp "$TLS_DIR/ca.crt" "$TLS_DIR/node-trust/kind-registry:5000/ca.crt"
          cat > "$TLS_DIR/node-trust/kind-registry:5000/hosts.toml" <<'EOF'
          server = "https://kind-registry:5000"
          [host."https://kind-registry:5000"]
            capabilities = ["pull", "resolve"]
            ca = "/etc/containerd/certs.d/kind-registry:5000/ca.crt"
          EOF
          docker run -d --restart=always --name kind-registry -p 127.0.0.1:5000:5000 \
            -v "$TLS_DIR/tls.crt:/tls/tls.crt:ro" -v "$TLS_DIR/tls.key:/tls/tls.key:ro" \
            -v "$TLS_DIR/htpasswd:/auth/htpasswd:ro" \
            -e REGISTRY_HTTP_TLS_CERTIFICATE=/tls/tls.crt -e REGISTRY_HTTP_TLS_KEY=/tls/tls.key \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=rehearsal \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for attempt in $(seq 1 20); do
            status="$(curl -sS --cacert "$TLS_DIR/ca.crt" -o /dev/null -w '%{http_code}' https://kind-registry:5000/v2/ || true)"
            [ "$status" = 401 ] && break
            [ "$attempt" != 20 ] || exit 1
            sleep 1
          done
          skopeo login --authfile "$TLS_DIR/registry-auth.json" --username rehearsal \
            --password-stdin kind-registry:5000 < "$TLS_DIR/password"
          echo "REGISTRY_AUTH_FILE=$TLS_DIR/registry-auth.json" >> "$GITHUB_ENV"
          python3 - "$RUNNER_TEMP/kind-config.yaml" "$TLS_DIR/node-trust" "${{ matrix.lane }}" <<'PY_KIND'
          import json, sys
          from pathlib import Path
          roles = ['control-plane'] + (['worker'] * 3 if sys.argv[3] in ('lifecycle', 'lifecycle-chart') else [])
          config = {'kind': 'Cluster', 'apiVersion': 'kind.x-k8s.io/v1alpha4',
                    'nodes': [{'role': role, 'extraMounts': [{'hostPath': sys.argv[2],
                              'containerPath': '/etc/containerd/certs.d', 'readOnly': True}]} for role in roles]}
          Path(sys.argv[1]).write_text(json.dumps(config))
          PY_KIND
          /usr/local/bin/kind create cluster --name gapbox --config "$RUNNER_TEMP/kind-config.yaml" \
            --image "kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4"
          docker network connect kind kind-registry
          /usr/local/bin/kubectl cluster-info

      - name: Install pinned local-path provisioner (explicit StorageClass)
        run: |
          export PATH="/usr/local/bin:$PATH"
          # Pinned manifest (rancher local-path-provisioner v0.0.37): same
          # namespace/deployment names as kind's built-in provisioner, so
          # this upgrades it in place and adds the `local-path`
          # StorageClass — no duplicate provisioner, no ambient defaults.
          curl -fsSL -o "$RUNNER_TEMP/local-path.yaml" https://raw.githubusercontent.com/rancher/local-path-provisioner/49b2be8e26d6d34c9afaa21fa33108d2e82f8955/deploy/local-path-storage.yaml
          echo "9781b39c24f3f651bd6d6e41b561e04e4904bbdb6d4f8c7a6009df3a702dcd65  $RUNNER_TEMP/local-path.yaml" | sha256sum -c -
          /usr/local/bin/kubectl apply -f "$RUNNER_TEMP/local-path.yaml"
          /usr/local/bin/kubectl -n local-path-storage rollout status deploy/local-path-provisioner --timeout=180s
          /usr/local/bin/kubectl get storageclass local-path

      # Everything that needs the public network is finished before the boundary
      # closes: tool installs, the Kind node image, the registry image, the
      # provisioner and the platform stand-ins' third-party images. In a real gap
      # these are the platform's (gateway, database, storage helper) and exist
      # before the operator arrives. Only bundle images may be pulled afterwards.
      - name: Rehearsal platform stand-ins (public images, before the boundary)
        run: |
          export PATH="/usr/local/bin:$PATH"
          NS="rag-kind-$(echo "$SHA" | cut -c1-12)"
          echo "NS=$NS" >> "$GITHUB_ENV"
          /usr/local/bin/kubectl create namespace "$NS"
          # The provisioner's helper pod pulls this image on the first PVC; put it on
          # every node now so storage never needs the public network later.
          HELPER_IMAGE="$(awk '$1 == "image:" && $2 ~ /busybox/ {print $2; exit}' "$RUNNER_TEMP/local-path.yaml")"
          test -n "$HELPER_IMAGE"
          for node in $(/usr/local/bin/kind get nodes --name gapbox); do
            docker exec "$node" crictl pull "$HELPER_IMAGE"
          done
          # Real LiteLLM + PostgreSQL (platform-owned in production); images are
          # pulled by the nodes now. Model computation arrives later from the bundle.
          sh rehearsal-infra/scripts/ci/deploy_test_gateway.sh "$NS"

      # Open WebUI acceptance lane (#1070): the pushed derived image (pins.txt, by digest), the
      # pinned test IdP and the allow-list proxy image come from the public network now and are
      # loaded into the node by digest; the boundary closes right after, so the
      # checks themselves run with zero public egress. Nothing here ships.
      - name: Open WebUI images (public images, before the boundary)
        if: matrix.lane == 'openwebui'
        env:
          KIND_NAME: gapbox
          APP_NS: ${{ env.NS }}
          OWUI_STATE: ${{ runner.temp }}/owui-acceptance
          KIND_BIN: /usr/local/bin/kind
          KUBECTL: /usr/local/bin/kubectl
          HELM: /usr/local/bin/helm
        run: |
          export PATH="/usr/local/bin:$PATH"
          sh rehearsal-infra/scripts/openwebui/acceptance.sh images

      # Close the boundary: from here the shipped operator flow runs under a
      # kernel-enforced block. Outside it: the GitHub runner agent, the Docker
      # daemon and its embedded DNS, the infrastructure steps above, and the
      # post-mortem/teardown steps below. Nothing is mocked: every probe is a
      # real connect() that the packet filter must reject.
      - name: Close the network boundary (block public egress, prove it)
        run: |
          export PATH="/usr/local/bin:$PATH"
          GATE="sh rehearsal-infra/scripts/ci/egress_gate.sh"
          PROBE=rehearsal-infra/scripts/ci/egress_probe.py
          # Control: the public network answers right now, so a failure after
          # the gate is caused by the gate and not by an outage.
          python3 "$PROBE" reachable-any 1.1.1.1:443 8.8.8.8:443 9.9.9.9:443
          KIND_CIDRS="$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Subnet}} {{end}}')"
          RULE_ARGS=""
          for cidr in $KIND_CIDRS; do
            case "$cidr" in *:*) continue ;; esac
            RULE_ARGS="$RULE_ARGS --allow $cidr --block-source $cidr"
          done
          test -n "$RULE_ARGS"
          # shellcheck disable=SC2086
          $GATE install $RULE_ARGS
          # Pod egress is closed inside the cluster too: a pod SYN to a public
          # address was seen to leave through no host FORWARD rule at all (runs
          # 39936150839, 39942787786, 39945681590), so the host rules cannot be
          # the only enforcement. kindnet enforces NetworkPolicy including egress.
          # Allowed: cluster DNS, pods of this namespace (stand-in gateway, mock
          # vLLM, Qdrant, agent, ingest) and the API server on the Kind network.
          KIND_V4=""
          for cidr in $KIND_CIDRS; do case "$cidr" in *:*) ;; *) KIND_V4="$cidr" ;; esac; done
          test -n "$KIND_V4"
          /usr/local/bin/kubectl -n "$NS" apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata: {name: rehearsal-default-deny-egress}
          spec:
            # Every pod except the Open WebUI front end (openwebui lane): its egress is governed by
            # the chart's own NetworkPolicy alone, the policy production ships; a namespace-wide
            # allow here would be unioned into it. acceptance.py fails if any other policy selects it.
            podSelector:
              matchExpressions: [{key: app, operator: NotIn, values: [rag-openwebui]}]
            policyTypes: [Egress]
            egress:
              - to:
                  - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
                    podSelector: {matchLabels: {k8s-app: kube-dns}}
                ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
              - to: [{podSelector: {}}]
              - to: [{ipBlock: {cidr: "${KIND_V4}"}}]
                ports: [{port: 6443, protocol: TCP}]
          EOF
          # Counterexamples behind the boundary: these must all fail.
          $GATE run python3 "$PROBE" blocked 1.1.1.1:443 8.8.8.8:443 9.9.9.9:443 github.com:443 get.helm.sh:443
          if $GATE run curl -sS --max-time 10 -o /dev/null https://get.helm.sh/; then
            echo "::error::a public download succeeded behind the boundary"
            exit 1
          fi
          # Controls: the prepared local services still answer through the gate.
          code="$($GATE run curl -sS --max-time 10 --cacert "$RUNNER_TEMP/registry-tls/ca.crt" -o /dev/null -w '%{http_code}' https://kind-registry:5000/v2/)"
          test "$code" = 401
          $GATE run /usr/local/bin/kubectl get nodes
          $GATE require-hits host
          $GATE status | tee diagnostics/egress-gate-installed.txt

      - name: Black-box handoff (verify, unpack, bootstrap) with public egress blocked
        env:
          IMAGE_SHA: ${{ env.SHA }}
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox
          sha256sum -c "qdrant-pdf-rag-${SHA}.tar.sha256"
          tar xf "qdrant-pdf-rag-${SHA}.tar"
          AIRGAP_WORKSPACE=qdrant-pdf-rag sh bootstrap.sh
          test -f qdrant-pdf-rag/dist/SHA256SUMS
          (cd qdrant-pdf-rag/dist && sha256sum -c SHA256SUMS)
          test -f qdrant-pdf-rag/dist/sbom.json
          test -f qdrant-pdf-rag/dist/SHA256SUMS.sig
          test -f qdrant-pdf-rag/dist/sneakernet-signing.pub
          test -f qdrant-pdf-rag/dist/task_linux_amd64.tar.gz
          test -f qdrant-pdf-rag/dist/task-pin.txt
          test -f qdrant-pdf-rag/dist/task-LICENSE
          test -s qdrant-pdf-rag/dist/THIRD-PARTY-NOTICES.txt
          grep -q "^task_version: " qdrant-pdf-rag/dist/MANIFEST.txt
          grep -q "go-task/task" qdrant-pdf-rag/dist/sbom.json
          test "$(git -C qdrant-pdf-rag rev-parse HEAD)" = "$SHA"
          test "$(awk '/^sha: /{print $2}' qdrant-pdf-rag/dist/MANIFEST.txt)" = "$SHA"

      - name: Operator airgap.env (Kind stand-ins, never prod values)
        env:
          IMAGE_SHA: ${{ env.SHA }}
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          NS="rag-kind-$(echo "$SHA" | cut -c1-12)"
          echo "NS=$NS" >> "$GITHUB_ENV"
          sed -i \
            -e 's|^INTERNAL_REGISTRY=.*|INTERNAL_REGISTRY=kind-registry:5000|' \
            -e "s|^NAMESPACE=.*|NAMESPACE=$NS|" \
            -e 's|^STORAGE_CLASS=.*|STORAGE_CLASS=local-path|' \
            -e 's|^IMAGE_SHA=.*|IMAGE_SHA='"$SHA"'|' \
            -e 's|^EMBED_MODEL=.*|EMBED_MODEL=mock-embed|' \
            -e 's|^EMBED_MODEL_REVISION=.*|EMBED_MODEL_REVISION=mock-embed@ci|' \
            -e 's|^DENSE_DIM=.*|DENSE_DIM=1024|' \
            -e 's|^CORPUS_PVC=.*|CORPUS_PVC=corpus|' \
            -e 's|^QDRANT_SHARD_NUMBER=.*|QDRANT_SHARD_NUMBER=1|' \
            -e 's|^QDRANT_REPLICATION_FACTOR=.*|QDRANT_REPLICATION_FACTOR=1|' \
            -e 's|^QDRANT_WRITE_CONSISTENCY_FACTOR=.*|QDRANT_WRITE_CONSISTENCY_FACTOR=1|' \
            airgap.env
          if [ "${{ matrix.lane }}" = "shared-gateway" ]; then
            # Shared-gateway lane (issue #551): prove GATEWAY_BASE_URL fallback
            # and the single shared Secret key live. Explicit per-operation URLs
            # stay unset so common.sh must resolve them from the shared base;
            # per-leg keys remain in the Secret for the other lanes.
            sed -i -e '/^EMBED_BASE_URL=/d' -e '/^LLM_BASE_URL=/d' airgap.env
            cat >> airgap.env <<'EOF'
          GATEWAY_BASE_URL=https://test-gateway:4000/v1
          LLM_MODEL_REASONING=mock-reasoning
          RERANK_ENABLED=false
          GATEWAY_API_KEY_SECRET=test-gateway-keys
          GATEWAY_API_KEY_SECRET_KEY=api-key
          GATEWAY_CA_CONFIGMAP=test-gateway-ca
          EOF
          else
            cat >> airgap.env <<'EOF'
          EMBED_BASE_URL=https://test-gateway:4000/v1
          LLM_BASE_URL=https://test-gateway:4000/v1
          LLM_MODEL_REASONING=mock-reasoning
          RERANK_ENABLED=false
          GATEWAY_API_KEY_SECRET=test-gateway-keys
          GATEWAY_CA_CONFIGMAP=test-gateway-ca
          EOF
          fi
          if [ "${{ matrix.lane }}" = "rerank" ]; then
            # Rerank rehearsal (issue #815): only this lane enables the leg, behind
            # the same gateway, with the stand-in model and the per-leg Secret key.
            # Every other lane keeps RERANK_ENABLED=false and its expected results.
            sed -i -e 's|^RERANK_ENABLED=false$|RERANK_ENABLED=true|' airgap.env
            cat >> airgap.env <<'EOF'
          RERANK_BASE_URL=https://test-gateway:4000/v1
          RERANK_MODEL=mock-rerank
          EOF
            grep -qx 'RERANK_ENABLED=true' airgap.env
          fi
          if [ "${{ matrix.lane }}" = "observability" ]; then
            # Metrics on so the chart renders the otelcol collector; Kind has no
            # ServiceMonitor CRD, so the monitor stays off.
            cat >> airgap.env <<'EOF'
          METRICS_ENABLED=true
          SERVICEMONITOR_ENABLED=false
          EOF
          fi
          grep -E "^(INTERNAL_REGISTRY|NAMESPACE|STORAGE_CLASS|IMAGE_SHA|EMBED_MODEL|EMBED_MODEL_REVISION|DENSE_DIM|EMBED_BASE_URL|CORPUS_PVC|INSECURE_REGISTRY)" airgap.env

      - name: Write Kind-scale Qdrant overrides (runner quota only; git prod values untouched)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cat > "$RUNNER_TEMP/qdrant-kind-scale.yaml" <<'EOF'
          # Rehearsal-only: a CI runner cannot schedule the 3x16Gi prod
          # Qdrant (Insufficient memory on one node — proven locally).
          replicaCount: 1
          # Kind has no SCC to supply a volume group for the init emptyDir.
          podSecurityContext: {fsGroup: 3000}
          resources:
            requests: {cpu: "200m", memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          EOF
          echo "QDRANT_EXTRA_VALUES=$RUNNER_TEMP/qdrant-kind-scale.yaml" >> "$GITHUB_ENV"
          echo "CI_REHEARSAL=1" >> "$GITHUB_ENV"
          # Kind has no SCC to assign a UID and the OpenObserve image runs as root.
          echo "OPENOBSERVE_RUN_AS_ID=10001" >> "$GITHUB_ENV"

      - name: Write Kind-scale ingest patch (same quota; prod Job asks 4cpu/8Gi)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cat > "$RUNNER_TEMP/ingest-kind-scale.json" <<'EOF'
          {"spec":{"template":{"spec":{"containers":[{"name":"ingest","resources":{"requests":{"cpu":"250m","memory":"512Mi"},"limits":{"cpu":"1","memory":"1Gi"}}}]}}}}
          EOF
          echo "INGEST_EXTRA_PATCH=$RUNNER_TEMP/ingest-kind-scale.json" >> "$GITHUB_ENV"

      - name: airgap-load (fill the Kind registry BEFORE any pod pulls it)
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          sh scripts/tools/run-task.sh airgap:load

      - name: Create registry pull secret before the first node pull
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kubectl create namespace "$NS" --dry-run=client -o yaml | /usr/local/bin/kubectl apply -f -
          /usr/local/bin/kubectl -n "$NS" create secret generic rehearsal-pull \
            --type=kubernetes.io/dockerconfigjson \
            --from-file=.dockerconfigjson="$REGISTRY_AUTH_FILE"
          /usr/local/bin/kubectl -n "$NS" patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"rehearsal-pull"}]}'
          sed -i 's|^PULL_SECRET=.*|PULL_SECRET=rehearsal-pull|' gapbox/qdrant-pdf-rag/airgap.env

      - name: Deploy mock vLLM (deterministic embeddings stand-in)
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          /usr/local/bin/kubectl create namespace "$NS" --dry-run=client -o yaml | /usr/local/bin/kubectl apply -f -
          /usr/local/bin/kubectl -n "$NS" create configmap mock-vllm --from-file=mock_vllm.py=scripts/mock_vllm.py
          /usr/local/bin/kubectl apply -n "$NS" -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vllm-mock
            labels: {app: vllm-mock}
          spec:
            replicas: 1
            # A fault transition must retire the previous computation state.
            strategy: {type: Recreate}
            selector: {matchLabels: {app: vllm-mock}}
            template:
              metadata: {labels: {app: vllm-mock}}
              spec:
                containers:
                  - name: mock
                    # Tarball-faithful: loaded from the bundle, like the
                    # corpus-gen image below — never a GHCR pull.
                    image: kind-registry:5000/qdrant-pdf-rag-ingest:${SHA}
                    command: ["python3", "/cm/mock_vllm.py"]
                    env:
                      - {name: MOCK_DIM, value: "1024"}
                      - {name: PORT, value: "8000"}
                    ports: [{containerPort: 8000}]
                    readinessProbe:
                      httpGet: {path: /healthz, port: 8000}
                      initialDelaySeconds: 2
                    resources:
                      requests: {cpu: "50m", memory: 128Mi}
                      limits: {cpu: "500m", memory: 256Mi}
                    volumeMounts: [{name: mock, mountPath: /cm}]
                volumes:
                  - name: mock
                    configMap: {name: mock-vllm}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: vllm-mock
          spec:
            selector: {app: vllm-mock}
            ports: [{port: 8000, targetPort: 8000}]
          EOF
          /usr/local/bin/kubectl -n "$NS" rollout status deploy/vllm-mock --timeout=180s

      # Pods and nodes: the mock pod runs a bundle image, so this probe is a real
      # connect() from inside the cluster's own network path.
      - name: Prove node and pod egress is blocked (mock vLLM pod, real sockets)
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          PROBE=rehearsal-infra/scripts/ci/egress_probe.py
          /usr/local/bin/kubectl -n "$NS" exec -i deploy/vllm-mock -- python3 - reachable kubernetes.default.svc:443 < "$PROBE"
          /usr/local/bin/kubectl -n "$NS" exec -i deploy/vllm-mock -- python3 - blocked 1.1.1.1:443 8.8.8.8:443 9.9.9.9:443 < "$PROBE"

      # Pod egress is stopped in the node by the NetworkPolicy, so pod probes no
      # longer reach the host DOCKER-USER rule. A node's own network namespace is
      # outside NetworkPolicy: this connect (curl; the node image has no python)
      # must be refused by the host rule, which is what require-hits nodes proves.
      - name: Prove node egress is blocked (Kind node network namespace, real sockets)
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          NODES="$(/usr/local/bin/kind get nodes --name gapbox)"
          test -n "$NODES" || { echo "VIOLATED: no Kind node found; the probe did not run"; exit 1; }
          for node in $NODES; do
            for target in 1.1.1.1 8.8.8.8 9.9.9.9; do
              rc=0
              docker exec "$node" curl -sS --max-time 5 -o /dev/null "https://$target/" 2>/dev/null || rc=$?
              # Only a network failure counts as blocked: 6 resolve, 7 refused or
              # unreachable (REJECT's ICMP port-unreachable), 28 timeout, 35/56 TLS
              # or receive failure. 0 means it connected; docker exec failures
              # (125-127, no such container) and anything else mean it never ran.
              case "$rc" in
                6|7|28) echo "unreachable $node -> $target:443 (curl exit $rc)" ;;
                0) echo "VIOLATED: $node reached $target:443"; exit 1 ;;
                *) echo "VIOLATED: probe did not run on $node for $target (exit $rc)"; exit 1 ;;
              esac
            done
          done
          echo "node egress probe blocked: ok"

      - name: Assert the boundary rejected real traffic (host and pods)
        run: |
          sh rehearsal-infra/scripts/ci/egress_gate.sh require-hits host
          sh rehearsal-infra/scripts/ci/egress_gate.sh require-hits nodes

      - name: airgap-validate LIVE (cluster, StorageClass, MANIFEST match)
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          sh scripts/tools/run-task.sh airgap:validate

      - name: Generate corpus PVC + demo PDFs (operator-supplied corpus step)
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          /usr/local/bin/kubectl -n "$NS" apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata: {name: corpus}
          spec:
            accessModes: ["ReadWriteOnce"]
            resources: {requests: {storage: 1Gi}}
            storageClassName: local-path
          ---
          apiVersion: batch/v1
          kind: Job
          metadata: {name: corpus-gen}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: gen
                    # Tarball-faithful: this image came out of the sneakernet
                    # bundle via airgap-load, not from GHCR.
                    image: kind-registry:5000/qdrant-pdf-rag-ingest:${SHA}
                    command: ["/bin/sh", "-ec"]
                    args:
                      - |
                        python3 /app/scripts/make_synthetic_pdf.py --out /corpus/SA22-0000-00_outline.pdf
                        python3 /app/scripts/make_synthetic_pdf.py --plain --out /corpus/plain-widget-notes.pdf
                        ls -la /corpus
                    volumeMounts: [{name: corpus, mountPath: /corpus}]
                volumes:
                  - name: corpus
                    persistentVolumeClaim: {claimName: corpus}
          EOF
          /usr/local/bin/kubectl -n "$NS" wait --for=condition=complete job/corpus-gen --timeout=300s

      - name: OpenObserve credentials Secret (operator-created, ADR-0006)
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          # Tracing is on by default, so every lane needs the Secret deploy.sh checks.
          # Values come from files in a private directory, never argv; random per run.
          D="$(mktemp -d)"; chmod 700 "$D"
          printf 'ci@openobserve.invalid' > "$D/root-user-email"
          # OpenObserve v1.1.2 refuses a weak root password: keep upper+lower+digit+special.
          { od -An -N24 -tx1 /dev/urandom | tr -d ' \n'; printf 'Aa1!'; } > "$D/root-user-password"
          B64="$(printf '%s:%s' "$(cat "$D/root-user-email")" "$(cat "$D/root-user-password")" | base64 | tr -d '\n')"
          printf 'Authorization=Basic %s' "$B64" > "$D/otlp-headers"
          printf 'Basic %s' "$B64" > "$D/metrics-auth"
          /usr/local/bin/kubectl -n "$NS" create secret generic openobserve-credentials \
            --from-file=root-user-email="$D/root-user-email" --from-file=root-user-password="$D/root-user-password" \
            --from-file=otlp-headers="$D/otlp-headers" --from-file=metrics-auth="$D/metrics-auth"
          rm -rf "$D"

      - name: Enforce PSA restricted on the namespace (observability lane)
        if: matrix.lane == 'observability'
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          # Existing stand-in pods are not evicted by an enforce label; every
          # pod the pipeline admits from here (OpenObserve, otelcol) must pass it.
          /usr/local/bin/kubectl label namespace "$NS" pod-security.kubernetes.io/enforce=restricted --overwrite

      - name: airgap-pipeline LIVE (deploy, ingest, smoke; registry pre-loaded)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          QDRANT_STORAGE_SIZE: 1Gi
          INGEST_WORK_SIZE: 2Gi
          INGEST_TIMEOUT: "900"
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          # Images are already in the Kind registry from the airgap-load
          # step above (mock and corpus-gen pods pulled them); skip the
          # second push — same flag an operator re-running pipeline uses.
          sh scripts/airgap/pipeline.sh --skip-load

      - name: Application pod egress is blocked (agent pod, real sockets)
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          PROBE=rehearsal-infra/scripts/ci/egress_probe.py
          /usr/local/bin/kubectl -n "$NS" exec -i deploy/rag-agent -- python3 - reachable test-gateway:4000 qdrant:6333 < "$PROBE"
          /usr/local/bin/kubectl -n "$NS" exec -i deploy/rag-agent -- python3 - blocked 1.1.1.1:443 8.8.8.8:443 9.9.9.9:443 < "$PROBE"

      - name: Assert shared-gateway rendering (no explicit URLs, one key)
        if: matrix.lane == 'shared-gateway'
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          python3 scripts/ci/check_gateway_rendering.py \
            --env-file airgap.env --agent-render dist/agent-rendered.yaml \
            --ingest-render dist/ingest-rendered.yaml \
            --shared-url https://test-gateway:4000/v1 \
            --secret-name test-gateway-keys --secret-key api-key \
            --embed-model mock-embed --reasoning-model mock-reasoning \
            --context-model '' \
            --diagnostics "$GITHUB_WORKSPACE/diagnostics/shared-gateway-rendering.json"

      - name: Require reasoning and complete streams from the application pod
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python3 /app/scripts/probe_gateway.py --require-reasoning --stream

      - name: Cited answers, follow-up chat and every application stream
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kubectl -n "$NS" exec -i deploy/rag-agent -- python3 - \
            < gapbox/qdrant-pdf-rag/scripts/ci/application_contracts.py

      - name: Expected-substring acceptance
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          NS="$(grep '^NAMESPACE=' airgap.env | cut -d= -f2)"
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python3 /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "IEA500I operator message" --expect "IEA500I"
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python3 /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "torque the widget screws" --expect "torque"

      # The front end next to the agent this lane just deployed (mock reasoning and
      # embedding models behind the test gateway; no hash mode, no GPU). The chart's
      # Open WebUI objects come from this checkout, with Kind stand-ins for the
      # route and the IdP (docs/openwebui-dev.md). Zero-egress checks run behind the gate.
      - name: Open WebUI acceptance (ADR-0007 conditions, by execution)
        if: matrix.lane == 'openwebui'
        env:
          KIND_NAME: gapbox
          APP_NS: ${{ env.NS }}
          OWUI_STATE: ${{ runner.temp }}/owui-acceptance
          KIND_BIN: /usr/local/bin/kind
          KUBECTL: /usr/local/bin/kubectl
          HELM: /usr/local/bin/helm
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          sh rehearsal-infra/scripts/openwebui/acceptance.sh deploy
          sh rehearsal-infra/scripts/openwebui/acceptance.sh run

      - name: Gateway fault contracts
        if: startsWith(matrix.lane, 'gateway-')
        env:
          FAULT_LANE: ${{ matrix.lane }}
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          sh scripts/ci/gateway_faults.sh "$NS" "${FAULT_LANE#gateway-}"

      - name: Rerank leg rehearsal (key, order, fallback, call count, fail-closed)
        if: matrix.lane == 'rerank'
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          sh scripts/ci/rerank_rehearsal.sh "$NS"

      - name: First-party Helm chart lifecycle from the published bundle
        if: matrix.lane == 'lifecycle-chart'
        env:
          QDRANT_STORAGE_SIZE: 1Gi
          INGEST_WORK_SIZE: 2Gi
          INGEST_TIMEOUT: "900"
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          sh scripts/ci/rehearse_chart.sh
          sh scripts/airgap/pipeline.sh --skip-load

      - name: Three-worker lifecycle and repeated pipeline
        if: matrix.lane == 'lifecycle'
        env:
          QDRANT_STORAGE_SIZE: 1Gi
          INGEST_WORK_SIZE: 2Gi
          INGEST_TIMEOUT: "900"
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          test "$(/usr/local/bin/kubectl get nodes -l '!node-role.kubernetes.io/control-plane' --no-headers | wc -l)" -eq 3
          sh scripts/ci/check_lifecycle.sh "$NS"
          sh scripts/airgap/pipeline.sh --skip-load

      - name: OpenObserve admission, trace + metric arrival and canary scan (ADR-0006)
        if: matrix.lane == 'observability'
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox/qdrant-pdf-rag
          sh scripts/ci/observability_lane.sh "$NS"

      - name: Record the egress boundary state
        if: always()
        run: |
          mkdir -p diagnostics
          sh rehearsal-infra/scripts/ci/egress_gate.sh status > diagnostics/egress-gate-final.txt 2>&1 || true
          cat diagnostics/egress-gate-final.txt
          # Node-side masquerade state, to explain a pod probe that leaked.
          for node in $(docker ps --filter label=io.x-k8s.kind.cluster=gapbox --format '{{.Names}}'); do
            { echo "== $node nat POSTROUTING"; docker exec "$node" iptables -t nat -S POSTROUTING; } >> diagnostics/egress-gate-nodes-nat.txt 2>&1 || true
          done
          cat diagnostics/egress-gate-nodes-nat.txt 2>/dev/null || true

      - name: Failure diagnostics (pods, events, logs)
        if: failure()
        run: |
          export PATH="/usr/local/bin:$PATH"
          NS="$(grep '^NAMESPACE=' gapbox/qdrant-pdf-rag/airgap.env | cut -d= -f2)"
          /usr/local/bin/kubectl -n "$NS" get pods,pvc,svc,jobs -o wide || true
          /usr/local/bin/kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -40 || true
          /usr/local/bin/kubectl -n "$NS" logs statefulset/qdrant --all-containers --tail=50 || true
          /usr/local/bin/kubectl -n "$NS" logs deploy/rag-agent --all-containers --tail=100 || true
          /usr/local/bin/kubectl -n "$NS" logs job/ingest --tail=100 || true

      - name: Open WebUI acceptance evidence (no passwords, keys or certificates)
        if: always() && matrix.lane == 'openwebui'
        env:
          OWUI_STATE: ${{ runner.temp }}/owui-acceptance
        shell: sh rehearsal-infra/scripts/ci/egress_gate.sh run bash -e {0}
        run: |
          export PATH="/usr/local/bin:$PATH"
          mkdir -p diagnostics/openwebui
          for f in logs/acceptance.json logs/apply-openwebui.log logs/apply-support.log images.txt node-images.txt render/openwebui.yaml render/pipe.sha256; do
            test ! -f "$OWUI_STATE/$f" || cp "$OWUI_STATE/$f" "diagnostics/openwebui/$(basename "$f")"
          done
          /usr/local/bin/kubectl -n "$NS" get pods,pvc,svc,networkpolicy -o wide > diagnostics/openwebui/workloads.txt 2>&1 || true
          /usr/local/bin/kubectl -n "$NS" describe deploy/rag-openwebui > diagnostics/openwebui/describe-rag-openwebui.txt 2>&1 || true

      - name: Retain sanitized cluster diagnostics
        if: always()
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kubectl get nodes -o wide > diagnostics/nodes.txt 2>&1 || true
          /usr/local/bin/kubectl -n "$NS" get pods,pvc,svc,jobs -o wide > diagnostics/workloads.txt 2>&1 || true
          /usr/local/bin/kubectl -n "$NS" get events --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
          test ! -f gapbox/qdrant-pdf-rag/dist/MANIFEST.txt || cp gapbox/qdrant-pdf-rag/dist/MANIFEST.txt diagnostics/
          test ! -f "gapbox/qdrant-pdf-rag-${SHA}.tar.sha256" || cp "gapbox/qdrant-pdf-rag-${SHA}.tar.sha256" diagnostics/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; artifact upload only
        if: always()
        with:
          name: kind-${{ matrix.lane }}-evidence-${{ env.SHA }}
          path: diagnostics/
          retention-days: 30

      - name: Delete Kind cluster (ephemeral, always)
        if: always()
        run: |
          export PATH="/usr/local/bin:$PATH"
          /usr/local/bin/kind delete cluster --name gapbox || true
          docker rm -f kind-registry || true
          sh rehearsal-infra/scripts/ci/egress_gate.sh remove || true

  # ------------------------------------------------- secret gate (fork-safe)
  e2e-secrets-check:
    concurrency:
      group: e2e-secrets-check-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    env:
      SHARE: "false"
    steps:
      - id: check
        env:
          SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          if [ -n "$SERVER" ] && [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "OPENSHIFT_SERVER / OPENSHIFT_TOKEN not set; e2e will be skipped."
          fi

  # Offline rendering of the production Helm launchers.
  airgap-dryrun:
    needs: select
    if: contains(fromJSON(needs.select.outputs.lanes), 'packaging')
    concurrency:
      group: airgap-dryrun-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Open WebUI is default-on (ADR-0008) and fails closed without site inputs; this job
      # does not deploy it (the kind `openwebui` lane does, via scripts/openwebui/acceptance.sh).
      OPENWEBUI_ENABLED: "false"
      SHARE: "false"
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - name: Record packaging checkout identity
        run: python3 scripts/ci_evidence.py --lane packaging --job-name airgap-dryrun --output "$RUNNER_TEMP/evidence-airgap-dryrun" --identity-only
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: evidence-airgap-dryrun-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-airgap-dryrun
          if-no-files-found: error

      - name: Install checksum-pinned Helm
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-unpack"
          tar xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/helm-unpack" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/helm-unpack/linux-amd64/helm" /usr/local/bin/helm
          /usr/local/bin/helm version --short

      - name: Install pinned kubectl (CI patch --local)
        run: |
          export PATH="/usr/local/bin:$PATH"
          KUBECTL_VERSION=v1.33.12
          # sha256 recorded in-repo (AGENTS.md §6): dl.k8s.io checksum file.
          KUBECTL_SHA256=fe80ae4133b44fa2077db4af144e80765eb1b3b2eede55fbff6933c4374d8c6e
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          /usr/local/bin/kubectl version --client=true

      - name: Install pinned Task runner
        run: |
          sh scripts/tools/install-task.sh

      - name: Vendored Qdrant production-values lint and render
        run: |
          export PATH="/usr/local/bin:$PATH"
          sh scripts/tools/run-task.sh artifacts:helm-lint
          # The chart generates Secret data; keep rendered YAML out of logs
          # and uploaded artifacts. These tasks use the checked-in prod values.
          sh scripts/tools/run-task.sh artifacts:helm-render > "$RUNNER_TEMP/qdrant-rendered.yaml"

      - name: airgap-deploy dry-run (prod render, fail-closed placeholders, knobs)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          EMBED_BASE_URL: http://vllm:8000/v1
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          sh scripts/tools/run-task.sh airgap:deploy
          test -f dist/agent-rendered.yaml
          grep -q "ghcr.io/dryrun-standin/qdrant-pdf-rag-agent:${SHA}" dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/agent-rendered.yaml
          # Tracing defaults ON: an unset endpoint resolves to the in-cluster
          # OpenObserve (issue #956, ADR-0006), so the default deploy renders it too.
          test -f dist/openobserve-rendered.yaml
          grep -Eq 'value: "?http://openobserve:5080/api/default"?$' dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/openobserve-rendered.yaml

      - name: First-party release inventory assertions
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          EMBED_BASE_URL: http://vllm:8000/v1
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          sh scripts/tools/run-task.sh artifacts:app-helm-lint
          sh scripts/tools/run-task.sh airgap:deploy
          test -f dist/mainframe-rag-release-values.yaml
          test -f dist/agent-rendered.yaml
          grep -q "ghcr.io/dryrun-standin/qdrant-pdf-rag-agent:${SHA}" dist/agent-rendered.yaml
          grep -q "kind: Deployment" dist/agent-rendered.yaml
          grep -q "kind: Service" dist/agent-rendered.yaml
          # Steady-state release owns no one-shot Job (D3).
          ! grep -q "kind: Job" dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/mainframe-rag-release-values.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/agent-rendered.yaml

      - name: airgap-deploy dry-run with PULL_SECRET + extra values
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          EMBED_BASE_URL: http://vllm:8000/v1
          PULL_SECRET: ci-pull
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          printf 'resources:\n  requests: {cpu: "100m", memory: 256Mi}\n' > "$RUNNER_TEMP/vals.yaml"
          export QDRANT_EXTRA_VALUES="$RUNNER_TEMP/vals.yaml"
          export CI_REHEARSAL=1
          out="$(sh scripts/tools/run-task.sh airgap:deploy)"
          echo "$out" | grep -q "persistence.size=1Gi"
          echo "$out" | grep -q "imagePullSecrets\[0\].name=ci-pull"
          grep -q "name: ci-pull" dist/agent-rendered.yaml

      - name: airgap-deploy dry-run fails closed on a bad extra-values file
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          EMBED_BASE_URL: http://vllm:8000/v1
          QDRANT_EXTRA_VALUES: /nonexistent/vals.yaml
          CI_REHEARSAL: "1"
        run: |
          export PATH="/usr/local/bin:$PATH"
          if sh scripts/tools/run-task.sh airgap:deploy 2>err.log; then
            echo "::error::deploy.sh did not fail on a missing QDRANT_EXTRA_VALUES file"
            exit 1
          fi
          grep -q "QDRANT_EXTRA_VALUES file not found" err.log

      - name: airgap-deploy dry-run with tracing on (bundled OpenObserve + otelcol render, issue #956)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          EMBED_BASE_URL: http://vllm:8000/v1
          METRICS_ENABLED: "true"
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          sh scripts/tools/run-task.sh airgap:deploy
          test -f dist/openobserve-rendered.yaml
          # Chart images carry repository:tag; the v1.1.2 digest is enforced from images.txt.
          grep -q "ghcr.io/dryrun-standin/openobserve/openobserve:v1.1.2" dist/openobserve-rendered.yaml
          grep -q "storageClassName: standard" dist/openobserve-rendered.yaml
          grep -Eq 'value: "?http://openobserve:5080/api/default"?$' dist/agent-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/openobserve-rendered.yaml

      - name: airgap-deploy dry-run with metrics enabled (ServiceMonitor render, issue #187)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          EMBED_BASE_URL: http://vllm:8000/v1
          METRICS_ENABLED: "true"
          OTEL_EXPORTER_OTLP_ENDPOINT: off
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          # Hermetic w.r.t. sibling dry-run steps sharing this workspace, and
          # focused: tracing defaults ON (asserted by the prod-render step), so
          # this step uses the off sentinel — metrics-on does not depend on
          # tracing and must not drag OpenObserve along.
          rm -f dist/openobserve-rendered.yaml
          sh scripts/tools/run-task.sh airgap:deploy
          test -f dist/servicemonitor-rendered.yaml
          grep -q "kind: ServiceMonitor" dist/servicemonitor-rendered.yaml
          grep -q "path: /metrics" dist/servicemonitor-rendered.yaml
          grep -q "namespace: airgap-dryrun" dist/servicemonitor-rendered.yaml
          grep -A1 'name: METRICS_ENABLED' dist/agent-rendered.yaml | grep -q 'value: "true"'
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/servicemonitor-rendered.yaml
          test ! -f dist/openobserve-rendered.yaml

      - name: airgap-ingest dry-run (prod ingest render + patch knob)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          CORPUS_PVC: corpus
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          EMBED_BASE_URL: http://vllm:8000/v1
          INGEST_WORK_SIZE: 2Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          cat > "$RUNNER_TEMP/ingest-patch.json" <<'EOF'
          {"spec":{"template":{"spec":{"containers":[{"name":"ingest","resources":{"requests":{"cpu":"250m","memory":"512Mi"},"limits":{"cpu":"1","memory":"1Gi"}}}]}}}}
          EOF
          export INGEST_EXTRA_PATCH="$RUNNER_TEMP/ingest-patch.json"
          export CI_REHEARSAL=1
          sh scripts/tools/run-task.sh airgap:ingest
          test -f dist/ingest-rendered.yaml
          grep -q "ghcr.io/dryrun-standin/qdrant-pdf-rag-ingest:${SHA}" dist/ingest-rendered.yaml
          grep -q "cpu: 250m" dist/ingest-rendered.yaml   # INGEST_EXTRA_PATCH applied
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/ingest-rendered.yaml
          # Explicit chart Job render (D3: show-only, never auto-installed).
          test -f dist/ingest-rendered.yaml
          grep -q "kind: Job" dist/ingest-rendered.yaml
          grep -q "ghcr.io/dryrun-standin/qdrant-pdf-rag-ingest:${SHA}" dist/ingest-rendered.yaml
          ! grep -Eq "__[A-Z][A-Z0-9_]*__" dist/ingest-rendered.yaml

      - name: Task airgap:dryrun (full pipeline dry-run incl. validate/load/smoke)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          AIRGAP_DRYRUN: "1"
          INTERNAL_REGISTRY: ghcr.io/dryrun-standin
          NAMESPACE: airgap-dryrun
          STORAGE_CLASS: standard
          EMBED_MODEL: embed-from-airgap-env
          DENSE_DIM: "768"
          EMBED_MODEL_REVISION: dryrun-rev-1
          EMBED_BASE_URL: http://vllm:8000/v1
          CORPUS_PVC: corpus
        run: |
          export PATH="/usr/local/bin:$PATH"
          sh scripts/tools/run-task.sh airgap:dryrun
          test -f dist/agent-rendered.yaml
          test -f dist/ingest-rendered.yaml
          test -f dist/mainframe-rag-release-values.yaml
          test -f dist/agent-rendered.yaml
          test -f dist/ingest-rendered.yaml

  # ---------------------------------------------- air-gap runbook rehearsal
  # Rehearses the OPERATOR RUNBOOK (issue #15) against the lab OpenShift, so
  # CI-green proves the air-gap deployment path works at the packed SHA:
  #   airgap-pack -> airgap-load (INTERNAL_REGISTRY stand-in: GHCR)
  #   -> airgap-deploy (first-party chart + separate Qdrant Helm release)
  #   -> airgap-ingest (corpus PVC) -> airgap-smoke.
  # CI-only stand-ins, never in git prod values (see the size knobs in
  # scripts/airgap/deploy.sh + ingest.sh):
  #   - GHCR plays INTERNAL_REGISTRY (node-side HTTP registry config is a
  #     cluster-admin operation the lab does not grant).
  #   - scripts/mock_vllm.py plays the owning team's vLLM endpoint: same API
  #     shape, deterministic vectors — the airgap scripts refuse
  #     EMBED_MODE=hash, so the prod embed path stays honest.
  #   - QDRANT_STORAGE_SIZE / QDRANT_EXTRA_VALUES / INGEST_WORK_SIZE /
  #     INGEST_EXTRA_PATCH shrink PVCs and resources for lab quota.
  #   - PULL_SECRET (ghcr-pull) is wired into deploy/ingest: load pushes the
  #     qdrant image to a fresh (private) GHCR package, so anonymous pull
  #     would ImagePullBackoff.
  airgap-rehearsal:
    concurrency:
      group: airgap-rehearsal-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    needs: [build, airgap-package, e2e-secrets-check]
    if: >-
      needs.e2e-secrets-check.outputs.ok == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Open WebUI is default-on (ADR-0008) and fails closed without site inputs; this job
      # does not deploy it (the kind `openwebui` lane does, via scripts/openwebui/acceptance.sh).
      OPENWEBUI_ENABLED: "false"
      SHARE: "false"
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      SHA: ${{ needs.build.outputs.sha }}
      AGENT_IMAGE: ${{ needs.build.outputs.agent_image }}
      INGEST_IMAGE: ${{ needs.build.outputs.ingest_image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0; artifact bytes only
        with:
          name: sneakernet-bundle-${{ env.SHA }}
          path: gapbox/
      - name: Fresh published-bundle bootstrap
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd gapbox
          sha256sum -c "qdrant-pdf-rag-${SHA}.tar.sha256"
          tar xf "qdrant-pdf-rag-${SHA}.tar"
          AIRGAP_WORKSPACE=qdrant-pdf-rag sh bootstrap.sh
          test "$(git -C qdrant-pdf-rag rev-parse HEAD)" = "$SHA"
          echo "BUNDLE_CHECKOUT=$GITHUB_WORKSPACE/gapbox/qdrant-pdf-rag" >> "$GITHUB_ENV"

      - name: Install checksum-pinned Helm
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-unpack"
          tar xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/helm-unpack" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/helm-unpack/linux-amd64/helm" /usr/local/bin/helm
          /usr/local/bin/helm version --short
      - name: Install checksum-pinned OpenShift client
        run: |
          export PATH="/usr/local/bin:$PATH"
          curl -fsSL -o "$RUNNER_TEMP/oc.tgz" https://mirror.openshift.com/pub/openshift-v4/clients/ocp/4.22.7/openshift-client-linux.tar.gz
          echo "3d02d45ae5037a723afbbdda1063c08d4788a9b9ace6c6f44aa329764ee648a1  $RUNNER_TEMP/oc.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oc-unpack"
          tar xzf "$RUNNER_TEMP/oc.tgz" -C "$RUNNER_TEMP/oc-unpack" oc kubectl
          sudo install -m 0755 "$RUNNER_TEMP/oc-unpack/oc" /usr/local/bin/oc
          sudo install -m 0755 "$RUNNER_TEMP/oc-unpack/kubectl" /usr/local/bin/kubectl
          /usr/local/bin/oc version --client=true
      - name: Install skopeo (pack/load)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Log in to lab OpenShift
        run: /usr/local/bin/oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true

      - name: Create ephemeral namespace
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          NS="rag-gap-${SHA}"
          echo "NS=$NS" >> "$GITHUB_ENV"
          /usr/local/bin/oc new-project "$NS"
          /usr/local/bin/oc label namespace "$NS" app.kubernetes.io/managed-by=e2e-workflow ephemeral=true

      - name: Create GHCR pull secret (rehearsal loads private packages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          /usr/local/bin/kubectl -n "$NS" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GITHUB_TOKEN"
          echo "PULL_SECRET=ghcr-pull" >> "$GITHUB_ENV"

      # The mock ships as a ConfigMap: scripts/mock_vllm.py is excluded from
      # the images (.dockerignore) so a CI-only HTTP server never ships in a
      # prod image.
      - name: Deploy mock vLLM (deterministic embeddings stand-in)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')"
          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_ENV"
          /usr/local/bin/kubectl -n "$NS" create configmap mock-vllm --from-file=mock_vllm.py=scripts/mock_vllm.py
          /usr/local/bin/kubectl apply -n "$NS" -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vllm-mock
            labels: {app: vllm-mock}
          spec:
            replicas: 1
            selector: {matchLabels: {app: vllm-mock}}
            template:
              metadata: {labels: {app: vllm-mock}}
              spec:
                containers:
                  - name: mock
                    image: ${AGENT_IMAGE}
                    command: ["python3", "/cm/mock_vllm.py"]
                    env:
                      - {name: MOCK_DIM, value: "1024"}
                      - {name: PORT, value: "8000"}
                    ports: [{containerPort: 8000}]
                    readinessProbe:
                      httpGet: {path: /healthz, port: 8000}
                      initialDelaySeconds: 2
                    resources:
                      requests: {cpu: "50m", memory: 128Mi}
                      limits: {cpu: "500m", memory: 256Mi}
                    volumeMounts: [{name: mock, mountPath: /cm}]
                volumes:
                  - name: mock
                    configMap: {name: mock-vllm}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: vllm-mock
          spec:
            selector: {app: vllm-mock}
            ports: [{port: 8000, targetPort: 8000}]
          EOF
          /usr/local/bin/kubectl -n "$NS" rollout status deploy/vllm-mock --timeout=180s

      - name: Detect default StorageClass
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          SC="$(/usr/local/bin/oc get sc -o jsonpath='{range .items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")]}{.metadata.name}{end}')"
          [ -n "$SC" ] || { echo "::error::no default StorageClass on the lab cluster"; exit 1; }
          echo "SC=$SC" >> "$GITHUB_ENV"

      - name: Write CI-scale Qdrant overrides (lab quota only; git prod values untouched)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          cat > "$RUNNER_TEMP/qdrant-ci-scale.yaml" <<'EOF'
          # Rehearsal-only: prod values.yaml keeps 4cpu/16Gi requests; the lab
          # namespace quota cannot fit 3 replicas at prod size.
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          EOF
          echo "QDRANT_EXTRA_VALUES=$RUNNER_TEMP/qdrant-ci-scale.yaml" >> "$GITHUB_ENV"
          echo "CI_REHEARSAL=1" >> "$GITHUB_ENV"

      - name: Write CI-scale ingest patch (same quota; prod Job asks 4cpu/8Gi)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          cat > "$RUNNER_TEMP/ingest-ci-scale.json" <<'EOF'
          {"spec":{"template":{"spec":{"containers":[{"name":"ingest","resources":{"requests":{"cpu":"250m","memory":"512Mi"},"limits":{"cpu":"1","memory":"1Gi"}}}]}}}}
          EOF
          echo "INGEST_EXTRA_PATCH=$RUNNER_TEMP/ingest-ci-scale.json" >> "$GITHUB_ENV"

      - name: airgap-load (GHCR stands in for INTERNAL_REGISTRY)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          INTERNAL_REGISTRY="ghcr.io/${OWNER_LC}"
          echo "${GITHUB_TOKEN}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          export INTERNAL_REGISTRY
          sh scripts/tools/run-task.sh airgap:load

      - name: airgap-deploy (production values, helm-knobbed sizes, fail-closed checks)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          EMBED_MODEL: mock-embed
          DENSE_DIM: "1024"
          EMBED_MODEL_REVISION: mock-embed@ci
          EMBED_BASE_URL: http://vllm-mock:8000/v1
          LLM_BASE_URL: http://vllm-mock:8000/v1
          LLM_MODEL_REASONING: mock-reasoning
          QDRANT_STORAGE_SIZE: 1Gi
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          export INTERNAL_REGISTRY="ghcr.io/${OWNER_LC}"
          export NAMESPACE="$NS"
          export STORAGE_CLASS="$SC"
          sh scripts/tools/run-task.sh airgap:deploy

      - name: Generate corpus PVC + demo PDFs (operator-supplied corpus step)
        env:
          STORAGE_CLASS: ${{ env.SC }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          /usr/local/bin/kubectl -n "$NS" apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata: {name: corpus}
          spec:
            accessModes: ["ReadWriteOnce"]
            resources: {requests: {storage: 1Gi}}
            storageClassName: ${STORAGE_CLASS}
          ---
          apiVersion: batch/v1
          kind: Job
          metadata: {name: corpus-gen}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: gen
                    image: ${INGEST_IMAGE}
                    command: ["/bin/sh", "-ec"]
                    args:
                      - |
                        python3 /app/scripts/make_synthetic_pdf.py --out /corpus/SA22-0000-00_outline.pdf
                        python3 /app/scripts/make_synthetic_pdf.py --plain --out /corpus/plain-widget-notes.pdf
                        ls -la /corpus
                    volumeMounts: [{name: corpus, mountPath: /corpus}]
                volumes:
                  - name: corpus
                    persistentVolumeClaim: {claimName: corpus}
          EOF
          /usr/local/bin/kubectl -n "$NS" wait --for=condition=complete job/corpus-gen --timeout=300s

      - name: airgap-ingest (PROD ingest Job, corpus PVC, vLLM-shaped endpoint)
        env:
          IMAGE_SHA: ${{ env.SHA }}
          CORPUS_PVC: corpus
          EMBED_MODEL: mock-embed
          DENSE_DIM: "1024"
          EMBED_MODEL_REVISION: mock-embed@ci
          EMBED_BASE_URL: http://vllm-mock:8000/v1
          LLM_BASE_URL: http://vllm-mock:8000/v1
          LLM_MODEL_REASONING: mock-reasoning
          INGEST_WORK_SIZE: 2Gi
          INGEST_TIMEOUT: "900"
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          export INTERNAL_REGISTRY="ghcr.io/${OWNER_LC}"
          export NAMESPACE="$NS"
          export STORAGE_CLASS="$SC"
          sh scripts/tools/run-task.sh airgap:ingest

      - name: airgap-smoke (operator smoke + expected-substring checks)
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          NAMESPACE="$NS" QUERY="IEA500I operator message" sh scripts/tools/run-task.sh airgap:smoke
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "IEA500I operator message" --expect "IEA500I"
          /usr/local/bin/kubectl -n "$NS" exec deploy/rag-agent -- \
            python /app/scripts/smoke_search.py \
              --url http://localhost:8080 --query "torque the widget screws" --expect "torque"

      - name: Delete ephemeral namespace
        if: always()
        run: |
          export PATH="/usr/local/bin:$PATH"
          cd "$BUNDLE_CHECKOUT"
          /usr/local/bin/oc delete project "$NS" --wait=false --ignore-not-found || \
            /usr/local/bin/kubectl delete namespace "$NS" --ignore-not-found --wait=false || true
