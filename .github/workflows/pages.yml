# Project site (#888): publishes site/ to GitHub Pages from main, with the
# Sphinx API reference (#889) built into site/reference from the docs-only lock.
# Pages must be enabled in repository settings with the source set to GitHub
# Actions (maintainer action, tracker #891).
#
# Pull requests that touch the reference inputs run the build job only (#1320):
# the same warnings-as-errors build, before merge. It has read-only contents
# permission and never reaches the github-pages environment; deploy is a
# separate job that runs on main (push or dispatch) only.
name: pages
on:
  push:
    branches: [main]
    paths:
      - site/**
      - site-src/**
      - src/**
      - scripts/build_reference.sh
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site-src/**
      - src/**
      - scripts/build_reference.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: reference-build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: pages-build-${{ github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # API reference (#889): docs-only hash lock, never a product profile.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - run: 'python -m pip install --require-hashes --no-deps --only-binary :all: -r site-src/reference/requirements.docs.lock.txt'
      - run: sh scripts/build_reference.sh site/reference
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
