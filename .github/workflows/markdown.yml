# Markdown-only lint (markdownlint-cli2). Runs ONLY when a change is exclusively
# markdown (and not vendored .agents/ or vendor/ docs): full CI (hygiene +
# pytest, via paths-ignore in ci.yml) AND the GHCR image build (paths-ignore in
# e2e.yml) are skipped for those. Mixed changes run ci + e2e WITHOUT this job —
# linting docs is not allowed to block code PRs. Vendored-only markdown bumps
# run nothing at all. Root-level files need explicit '*.md' globs in the
# filters below (dorny/paths-filter v3 + picomatch: '**/*.md' alone does not
# reliably match repo-root files — issue #18).
name: markdown-lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      markdown_only: ${{ steps.decide.outputs.markdown_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # micromatch's '**/*.md' does not match repo-root files
            # (AGENTS.md, README.md) — list '*.md' explicitly, here and in the
            # code exclusions, or exclusive-root-markdown PRs run no lint.
            markdown:
              - '*.md'
              - '**/*.md'
              - '*.markdown'
              - '**/*.markdown'
              - '!.agents/**'
              - '!vendor/**'
            code:
              - '**'
              - '!*.md'
              - '!**/*.md'
              - '!*.markdown'
              - '!**/*.markdown'
      - id: decide
        env:
          MARKDOWN: ${{ steps.filter.outputs.markdown }}
          CODE: ${{ steps.filter.outputs.code }}
        run: |
          if [ "$MARKDOWN" = "true" ] && [ "$CODE" != "true" ]; then
            echo "markdown_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "markdown_only=false" >> "$GITHUB_OUTPUT"
          fi

  markdownlint:
    needs: changes
    if: needs.changes.outputs.markdown_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
