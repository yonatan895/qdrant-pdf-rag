# CI overlay for the vendored Qdrant chart (issue #8, connected lab OpenShift).
# 1 replica, tiny PVC, no snapshots, no P2P cluster, no Route. Synthetic demo
# data only. Prod sizing (3 replicas / 500Gi) lives in overlays/openshift/.
# Runs on a CONNECTED cluster only: pulling docker.io here is acceptable.

replicaCount: 1

image:
  repository: docker.io/qdrant/qdrant
  tag: v1.19.0            # chart appends "-unprivileged" (useUnprivilegedImage)
  pullPolicy: IfNotPresent
  useUnprivilegedImage: true

imagePullSecrets: []       # lab cluster pulls Docker Hub directly

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 2000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

podSecurityContext:
  fsGroup: 3000
  fsGroupChangePolicy: Always

persistence:
  accessModes: ["ReadWriteOnce"]
  size: 1Gi
  # storageClassName: unset -> lab cluster default; must be RWO block

snapshotPersistence:
  enabled: false

# Single node: no consensus/P2P.
config:
  cluster:
    enabled: false

apiKey: true               # chart-generated secret <release>-apikey
readOnlyApiKey: false

service:
  type: ClusterIP

ingress:
  enabled: false           # smoke uses oc exec in-cluster; no public Route

podManagementPolicy: Parallel

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: "250m"
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
