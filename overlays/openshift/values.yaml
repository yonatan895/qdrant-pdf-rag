# OpenShift overlay for the vendored Qdrant chart (charts/qdrant-*.tgz).
# Placeholders only — real values come from airgap.env at deploy time
# (airgap-deploy sets image.repository; secrets are cluster-side, never in git).
# Pins: image v1.19.0-unprivileged, SCC restricted-v2, RWO block storage.
# See docs/architecture.md section 3.2.

replicaCount: 3

image:
  repository: PLACEHOLDER_REGISTRY/qdrant/qdrant   # airgap-deploy overrides with ${INTERNAL_REGISTRY}
  tag: v1.19.0        # chart appends "-unprivileged" when useUnprivilegedImage: true
  pullPolicy: IfNotPresent
  useUnprivilegedImage: true

imagePullSecrets:
  - name: PLACEHOLDER_PULL_SECRET

containerSecurityContext:
  runAsNonRoot: true
  # Null removes the chart defaults; restricted-v2 assigns the project identity.
  runAsUser: null
  runAsGroup: null
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

podSecurityContext:
  fsGroup: null
  fsGroupChangePolicy: Always

persistence:
  accessModes: ["ReadWriteOnce"]
  size: 500Gi
  storageClassName: PLACEHOLDER_STORAGE_CLASS   # must be RWO block; not NFS, not S3

snapshotPersistence:
  enabled: true
  accessModes: ["ReadWriteOnce"]
  size: 500Gi
  storageClassName: PLACEHOLDER_STORAGE_CLASS

config:
  cluster:
    enabled: true
    p2p:
      port: 6335
      enable_tls: false
  service:
    enable_tls: false

# true => auto-generated API keys stored in a chart-managed secret.
# Rotate/replace with SealedSecret or cluster secret by the platform team.
apiKey: true
readOnlyApiKey: true

service:
  type: ClusterIP   # no Route, no ingress; ClusterIP only

ingress:
  enabled: false

podManagementPolicy: Parallel

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Issue #360: hard separation of the three peers across workers. Required
# pod anti-affinity (not ScheduleAnyway spreading) so a capacity squeeze
# leaves a peer Pending with a useful diagnosis instead of silently
# colocating and faking redundancy. The selector uses the chart's stable
# `app.kubernetes.io/name` label: one Qdrant release per namespace is the
# architecture, it follows release renames, and it also repels old-generation
# pods during a rolling upgrade. A PDB limits voluntary disruption only; it
# is not a copy count.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: qdrant
        topologyKey: kubernetes.io/hostname

resources:
  requests:
    cpu: "4"
    memory: 16Gi
  limits:
    cpu: "8"
    memory: 32Gi
