# OpenShift overlay for the vendored Qdrant chart (charts/qdrant-*.tgz).
# Placeholders only — real values come from airgap.env at deploy time
# (helm-apply sets image.repository; secrets are cluster-side, never in git).
# Pins: image v1.19.0-unprivileged, SCC restricted-v2, RWO block storage.
# See docs/architecture.md section 3.2.

replicaCount: 3

image:
  repository: PLACEHOLDER_REGISTRY/qdrant/qdrant   # helm-apply overrides with ${REGISTRY_INTERNAL}
  tag: v1.19.0        # chart appends "-unprivileged" when useUnprivilegedImage: true
  pullPolicy: IfNotPresent
  useUnprivilegedImage: true

imagePullSecrets:
  - name: PLACEHOLDER_PULL_SECRET

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 2000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

podSecurityContext:
  fsGroup: 3000
  fsGroupChangePolicy: Always

persistence:
  accessModes: ["ReadWriteOnce"]
  size: 500Gi
  storageClassName: PLACEHOLDER_STORAGE_CLASS   # must be RWO block; not NFS, not S3

snapshotPersistence:
  enabled: true
  accessModes: ["ReadWriteOnce"]
  size: 500Gi
  storageClassName: PLACEHOLDER_STORAGE_CLASS

config:
  cluster:
    enabled: true
    p2p:
      port: 6335
      enable_tls: true
  service:
    enable_tls: false

# true => auto-generated API keys stored in a chart-managed secret.
# Rotate/replace with SealedSecret or cluster secret by the platform team.
apiKey: true
readOnlyApiKey: true

service:
  type: ClusterIP   # no Route, no ingress; ClusterIP only

ingress:
  enabled: false

podManagementPolicy: Parallel

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: qdrant

resources:
  requests:
    cpu: "4"
    memory: 16Gi
  limits:
    cpu: "8"
    memory: 32Gi
