# Jaeger uses the project UID and volume group assigned by restricted-v2.
# Storage config is baked (badger) — no size knob. Tracing is on by default:
# an unset OTEL_EXPORTER_OTLP_ENDPOINT resolves to this in-cluster Jaeger;
# the `off` sentinel disables tracing and skips this dir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  # Badger holds an exclusive directory lock on its persistent volume.
  # Release it before starting the replacement, including on a single node.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # [] by default; scripts/airgap/deploy.sh substitutes the PULL_SECRET
      # from airgap.env when the namespace cannot pull anonymously.
      imagePullSecrets: []
      containers:
        - name: jaeger
          image: jaeger:ci
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args: ["--config", "/etc/jaeger/config-badger.yaml"]
          ports:
            - containerPort: 4318
              name: otlp-http
            - containerPort: 16686
              name: ui
          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: 128Mi }
            limits: { cpu: "500m", memory: 512Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
            - name: badger
              mountPath: /badger
      volumes:
        - name: config
          configMap:
            name: jaeger-config
        - name: badger
          persistentVolumeClaim:
            claimName: jaeger-badger
