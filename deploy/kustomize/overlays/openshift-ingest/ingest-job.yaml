# One-shot prod ingest Job (issue #15). Included only by airgap-ingest — the
# CI demo Job in overlays/ci is never used here. Corpus comes from a
# caller-supplied PVC mounted read-only; no demo PDFs, no EMBED_MODE=hash.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest
  labels:
    app: ingest
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: ingest
    spec:
      restartPolicy: Never
      # [] by default; scripts/airgap/ingest.sh substitutes the PULL_SECRET
      # from airgap.env when the namespace cannot pull anonymously.
      imagePullSecrets: []
      containers:
        - name: ingest
          image: __INTERNAL_REGISTRY__/qdrant-pdf-rag-ingest:__IMAGE_SHA__
          imagePullPolicy: IfNotPresent
          # Maintenance args (issue #391 current packet) are rendered by
          # scripts/airgap/ingest.sh from validated INGEST_REINGEST /
          # INGEST_RETIRE_DOCS values; the progress path is fixed there too
          # (one authorized publisher per shared ingest-work PVC). The
          # placeholder is a whole YAML scalar so an empty rendering stays a
          # valid sequence.
          args: __INGEST_ARGS__
          env:
            - name: QDRANT_URL
              value: __QDRANT_URL__
            - name: QDRANT_COLLECTION
              value: mainframe_manuals
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: __QDRANT_RELEASE__-apikey
                  key: api-key
            # Issue #391 current packet: alias publication is an explicit
            # deployment-mode choice, never a default flip. Required for
            # explicit removals (INGEST_RETIRE_DOCS) and for repair
            # isolation; in-place mode keeps its documented maintenance
            # window.
            - name: INGEST_ALIAS_PUBLISH
              value: "__INGEST_ALIAS_PUBLISH__"
            - name: EMBED_BASE_URL
              value: __EMBED_BASE_URL__
            - name: EMBED_MODEL
              value: __EMBED_MODEL__
            - name: DENSE_DIM
              value: __DENSE_DIM__
            # Issue #391 F1: representation preflight refuses a blank
            # attestation; ingest.sh requires the same value pre-flight.
            - name: EMBED_MODEL_REVISION
              value: __EMBED_MODEL_REVISION__
            # OTel (issue #83): endpoint substituted from
            # OTEL_EXPORTER_OTLP_ENDPOINT in airgap.env (unset resolves to the
            # in-cluster Jaeger; the `off` sentinel renders empty).
            # Parent-process spans only; parse workers stay untraced.
            # Deploy identity for trace resource attributes (issue #315):
            # service.version is the packed IMAGE_SHA (ingest.sh fail-closes
            # on empty/HEAD before rendering, same as deploy.sh).
            - name: IMAGE_SHA
              value: __IMAGE_SHA__
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: __OTEL_EXPORTER_OTLP_ENDPOINT__
            - name: OTEL_SERVICE_NAME
              value: mainframe-rag-ingest
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: __OTEL_DEPLOYMENT_ENVIRONMENT__
            - name: INGEST_WORKERS
              value: "__INGEST_WORKERS__"
            - name: CONTEXTUAL_EMBED_ENABLED
              value: "__CONTEXTUAL_EMBED_ENABLED__"
            - name: CONTEXT_LLM_BASE_URL
              value: "__CONTEXT_LLM_BASE_URL__"
            - name: CONTEXT_LLM_MODEL
              value: "__CONTEXT_LLM_MODEL__"
            # Gateway virtual keys (LiteLLM): optional block. ingest.sh keeps
            # these entries only when GATEWAY_API_KEY_SECRET names an
            # operator-created Secret in the namespace (data keys
            # embed-api-key, context-llm-api-key); when unset they are
            # stripped by env-entry name (markers are documentation only —
            # kustomize drops comments and sorts mapping keys).
            # gateway-api-keys-begin
            - name: EMBED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: __GATEWAY_API_KEY_SECRET__
                  key: embed-api-key
            - name: CONTEXT_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: __GATEWAY_API_KEY_SECRET__
                  key: context-llm-api-key
            # gateway-api-keys-end
          resources:
            requests: { cpu: "4", memory: 8Gi }
            limits: { cpu: "16", memory: 32Gi }
          volumeMounts:
            - name: corpus
              mountPath: /corpus
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: corpus
          persistentVolumeClaim:
            claimName: __CORPUS_PVC__
            readOnly: true
        - name: work
          persistentVolumeClaim:
            claimName: ingest-work
