# Prod agent sizing + env. Values with __TOKENS__ are substituted by
# scripts/airgap/deploy.sh. EMBED_MODE is deliberately absent: prod embeds via
# the internal vLLM endpoint (EMBED_BASE_URL), never hash.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-agent
spec:
  replicas: 2
  template:
    spec:
      # [] by default; scripts/airgap/deploy.sh substitutes the PULL_SECRET
      # from airgap.env when the namespace cannot pull anonymously.
      imagePullSecrets: []
      containers:
        - name: agent
          env:
            - name: QDRANT_URL
              value: __QDRANT_URL__
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: __QDRANT_RELEASE__-apikey   # created by the vendored chart (apiKey: true)
                  key: api-key
            - name: EMBED_BASE_URL
              value: __EMBED_BASE_URL__
            - name: EMBED_MODEL
              value: __EMBED_MODEL__
            - name: DENSE_DIM
              value: __DENSE_DIM__
            - name: LLM_BASE_URL
              value: __LLM_BASE_URL__
            - name: LLM_MODEL_REASONING
              value: __LLM_MODEL_REASONING__
            # Issue #83: substituted from OTEL_EXPORTER_OTLP_ENDPOINT in
            # airgap.env (http://jaeger:4318 enables tracing — deploy.sh also
            # deploys Jaeger in that case). Empty string keeps tracing OFF
            # (fail-closed default); Jaeger is not deployed without it.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: __OTEL_EXPORTER_OTLP_ENDPOINT__
            # Cross-encoder reranker (issue #76): default off (RERANK_ENABLED=false).
            - name: RERANK_ENABLED
              value: "__RERANK_ENABLED__"
            - name: RERANK_BASE_URL
              value: "__RERANK_BASE_URL__"
            - name: RERANK_MODEL
              value: "__RERANK_MODEL__"
