# ServiceAccount for the oauth-proxy (ADR-0004). The redirect reference lets
# `--openshift-service-account=rag-agent` derive the OAuth callback from the
# Route without any hostname in git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-agent
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"rag-agent"}}
