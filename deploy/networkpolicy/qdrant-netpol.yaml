# Qdrant: only agent + ingest in-namespace may hit 6333/6334; P2P 6335 among replicas only.
# No ingress from other namespaces. No egress to the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-allow-clients
  namespace: mainframe-rag
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rag-agent
        - podSelector:
            matchLabels:
              app: ingest
      ports:
        - port: 6333
          protocol: TCP
        - port: 6334
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-allow-p2p
  namespace: mainframe-rag
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - port: 6335
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-default-deny-egress
  namespace: mainframe-rag
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  policyTypes: [Egress]
  egress:
    # DNS via platform; P2P among replicas. No other egress.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 5353
          protocol: UDP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - port: 6335
          protocol: TCP
        - port: 6333
          protocol: TCP
        - port: 6334
          protocol: TCP
