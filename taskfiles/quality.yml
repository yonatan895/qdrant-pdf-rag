# Quality tasks — issue #402 increment A.
#
# Dispatch only: ruff/mypy/pytest and the offline context checker keep their
# own validation, selection and exit semantics. No install policy lives here;
# verification diagnoses a missing `.venv`, `task dev:setup` prepares it.
# Included with `dir: .` from the root Taskfile so commands always run at the
# repository root, including invocation from documented subdirectories.
version: '3'

tasks:
  prerequisites:
    desc: Verify the prepared unit environment without installing anything
    summary: |
      Checks CPython 3.14 GIL/no JIT, the complete locked dev inventory and
      editable source identity, verified Task/Helm binaries and tracked
      Qdrant inputs. No network, environment repair or service startup.
      Runtime-image inventory is checked during image build and packaging.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - '.venv/bin/python scripts/agent_doctor.py --python .venv/bin/python'

  lint:
    desc: Run ruff lint over src and tests
    summary: |
      Runs `.venv/bin/python -m ruff check src tests` (same tool and scope as
      the retired `make lint`). Fails closed when `.venv/bin/python` is absent — run
      `task dev:setup` explicitly. Never creates or mutates the environment.
      No network, Docker, model or credentials required.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - '.venv/bin/python -m ruff check src tests'

  typecheck:
    desc: Run mypy typecheck over src
    summary: |
      Runs `.venv/bin/python -m mypy src` (same tool and scope as
      the retired `make typecheck`). Fails closed when `.venv/bin/python` is absent — run
      `task dev:setup` explicitly. Never creates or mutates the environment.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - '.venv/bin/python -m mypy src'

  unit:
    desc: Run the unit test suite (integration deselected by pyproject)
    summary: |
      Default `task qa:unit` runs `.venv/bin/python -m pytest tests -v`,
      matching the retired `make test` (pyproject addopts deselect integration).
      Focused selection replaces the default argv once:
      `task qa:unit -- tests/test_agent_context.py -q` runs exactly that
      selection (shell word-splitting applies to CLI_ARGS; trusted developer
      input only — never untrusted free text). An empty selection keeps the
      default. Runs the read-only prerequisite gate before pytest; fails closed
      when the prepared interpreter or verified tools are unavailable.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - task: prerequisites
      - '.venv/bin/python -m pytest {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}tests -v{{end}}'

  check:
    desc: Run lint, then typecheck, then unit tests, in that order
    summary: |
      Sequential replacing the retired `make check` (same three tools, same scope).
      Steps run one after another through direct task calls — never parallel
      `deps`, so one shared `.venv` is never installed into concurrently and
      a failed step stops the sequence with its own exit status.
    cmds:
      - task: prerequisites
      - task: lint
      - task: typecheck
      - task: unit

  context:
    desc: Run offline agent-context structure check (no installs)
    summary: |
      Runs `scripts/check_agent_context.py` with the selected Python (PY,
      default python3; use PY=python to match CI, or a full path). An explicit
      empty PY is preserved and fails in the script rather than silently
      falling back; explicit false/zero-like strings are passed through
      unchanged. Requires no venv, Docker, network, model, credentials or
      private config and modifies nothing.
    vars:
      PY: '{{if hasKey . "PY"}}{{.PY}}{{else}}python3{{end}}'
    env:
      TASK_PY: '{{.PY}}'
    cmds:
      - '"$TASK_PY" scripts/check_agent_context.py'

  sim:
    desc: Run the sim integration tier against disposable Qdrant (load and HA tiers excluded, 0 skips)
    summary: |
      `.venv/bin/python -m pytest -m integration --ignore=tests/test_load_tier.py
      --ignore=tests/test_ha_cluster.py -v -rs`, mirroring the retired `make sim`.
      The sim lane covers correctness; the load tier (`tests/test_load_tier.py`,
      run via `task qa:load`) is excluded so its absolute concurrency contracts
      are asserted exactly once, and the multi-peer HA fixture
      (`tests/test_ha_cluster.py`, run via `task qa:ha`) is excluded so the
      three-container placement/fault lane is not paid on every sim run. A skip
      fails the run (a skip on missing local weights means symlink or rebuild
      them, never ignore it). Needs docker (or QDRANT_SIM_URL) and the BM25
      weights; no GPU or live gateway.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - .venv/bin/python -m pytest -m integration --ignore=tests/test_load_tier.py --ignore=tests/test_ha_cluster.py -v -rs

  ha:
    desc: Run the disposable three-peer HA fixture (placement, false HA, peer loss)
    summary: |
      `.venv/bin/python -m pytest -m integration tests/test_ha_cluster.py -v`,
      replacing no retired target: the multi-peer lane is an explicitly
      selected addition (issue #360). It starts the pinned Qdrant image as a
      real three-peer cluster with separate storage and asserts actual
      placement (6/3/2), refusal of a false-HA (RF1) configuration, degraded
      reads and healthy rejoin after one peer is stopped, and exact point
      identity across survivors. Needs docker and the pinned image (pulled on
      a connected host); a missing prerequisite fails — this lane must never
      skip. Three containers on one host prove distributed software behavior
      only, never independent-worker or site tolerance.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - .venv/bin/python -m pytest -m integration tests/test_ha_cluster.py -v

  load:
    desc: Run the load tier (same composition CI runs, absolute contracts)
    summary: |
      `.venv/bin/python -m pytest -m integration tests/test_load_tier.py
      -v`, replacing the retired `make loadtest-mock`. This is the only lane
      that runs the load tier: `task qa:sim` excludes this file, so the two
      lanes cover every `integration`-marked node with no overlap.
      Fail-closed: no skips; docker/startup/zero-request failures raise. Knobs live in the
      caller environment (LOAD_SEARCH_CONCURRENCY and friends, read by the
      test itself).
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - .venv/bin/python -m pytest -m integration tests/test_load_tier.py -v

  vllm-e2e:
    desc: Gateway-shaped vLLM end-to-end suite (explicitly selected)
    summary: |
      `PYTHONPATH=. .venv/bin/python scripts/test_local_e2e_vllm.py` with
      only the caller-set model/URL/dim/mode flags, mirroring
      the retired `make test-vllm-e2e`. Needs the local backends serving; explicitly
      selected, never part of ordinary verification.
    env:
      PYTHONPATH: '.'
      TASK_MODEL: '{{.MODEL}}'
      TASK_VLLM_URL: '{{.VLLM_URL}}'
      TASK_EMBED_MODEL: '{{.EMBED_MODEL}}'
      TASK_EMBED_URL: '{{.EMBED_URL}}'
      TASK_DENSE_DIM: '{{.DENSE_DIM}}'
      TASK_EMBED_MODE: '{{if hasKey . "EMBED_MODE"}}{{.EMBED_MODE}}{{else}}hash{{end}}'
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - >-
        set --;
        if [ -n "${TASK_MODEL:-}" ]; then set -- "$@" --model "$TASK_MODEL"; fi;
        if [ -n "${TASK_VLLM_URL:-}" ]; then set -- "$@" --vllm-url "$TASK_VLLM_URL"; fi;
        if [ -n "${TASK_EMBED_MODEL:-}" ]; then set -- "$@" --embed-model "$TASK_EMBED_MODEL"; fi;
        if [ -n "${TASK_EMBED_URL:-}" ]; then set -- "$@" --embed-url "$TASK_EMBED_URL"; fi;
        if [ -n "${TASK_DENSE_DIM:-}" ]; then set -- "$@" --dense-dim "$TASK_DENSE_DIM"; fi;
        if [ -n "${TASK_EMBED_MODE:-}" ]; then set -- "$@" --embed-mode "$TASK_EMBED_MODE"; fi;
        exec .venv/bin/python scripts/test_local_e2e_vllm.py "$@"
