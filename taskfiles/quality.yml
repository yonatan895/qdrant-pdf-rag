# Quality tasks — issue #402 increment A.
#
# Dispatch only: ruff/mypy/pytest and the offline context checker keep their
# own validation, selection and exit semantics. No general install policy lives
# here; verification diagnoses a missing `.venv` and `task dev:setup` prepares
# it. The sole bounded exception is `qa:deps`: it builds and removes a
# temporary venv from the prepared interpreter and never installs into `.venv`.
# Included with `dir: .` from the root Taskfile so commands always run at the
# repository root, including invocation from documented subdirectories.
version: '3'

tasks:
  prerequisites:
    desc: Verify the prepared unit environment without installing anything
    summary: |
      Checks CPython 3.14 GIL/no JIT, the complete locked dev inventory and
      editable source identity, verified Task/Helm binaries and tracked
      Qdrant inputs. No network, environment repair or service startup.
      Runtime-image inventory is checked during image build and packaging.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - '.venv/bin/python scripts/agent_doctor.py --python .venv/bin/python'

  lint:
    desc: Run ruff lint over src and tests
    summary: |
      Runs `.venv/bin/python -m ruff check src tests` (same tool and scope as
      the retired `make lint`). Fails closed when `.venv/bin/python` is absent — run
      `task dev:setup` explicitly. Never creates or mutates the environment.
      No network, Docker, model or credentials required.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - '.venv/bin/python -m ruff check src tests'

  typecheck:
    desc: Run mypy typecheck over src
    summary: |
      Runs `.venv/bin/python -m mypy src` (same tool and scope as
      the retired `make typecheck`). Fails closed when `.venv/bin/python` is absent — run
      `task dev:setup` explicitly. Never creates or mutates the environment.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - '.venv/bin/python -m mypy src'

  unit:
    desc: Run the unit test suite (integration deselected by pyproject)
    summary: |
      Default `task qa:unit` runs `.venv/bin/python -m pytest tests -v`,
      matching the retired `make test` (pyproject addopts deselect integration).
      Focused selection replaces the default argv once:
      `task qa:unit -- tests/test_agent_context.py -q` runs exactly that
      selection (shell word-splitting applies to CLI_ARGS; trusted developer
      input only — never untrusted free text). An empty selection keeps the
      default. Runs the read-only prerequisite gate before pytest; fails closed
      when the prepared interpreter or verified tools are unavailable.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - task: prerequisites
      - '.venv/bin/python -m pytest {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}tests -v{{end}}'

  coverage:
    desc: Advisory branch coverage of the unit selection, reports outside the repo (#587)
    summary: |
      Measures branch coverage of `mainframe_rag` while running the same
      selection as `task qa:unit`: default `tests -q` (pyproject addopts
      deselect integration); `task qa:coverage -- tests/test_config.py -q`
      replaces it once (trusted developer input, shell word-splitting applies).
      Writes the terminal summary, coverage.json, coverage.xml, junit.xml and the
      data file into OUT, default ${XDG_STATE_HOME:-$HOME/.local/state}/mainframe-rag/coverage;
      an OUT inside the repository is refused. Advisory: no percentage ever
      fails the task, and neither does a failing test: failures are listed
      from junit.xml (timing-sensitive tests can fail under tracing) and the
      CI unit lane owns correctness. It exits non-zero only when the
      measurement itself failed (no tests collected, interruption, usage or
      internal error, a missing report) or a prerequisite is missing. It is
      neither verification nor acceptance evidence. PYTEST_ADDOPTS stays
      unset. Python subprocesses the tests spawn are traced (data files stay in OUT). Fails closed when the
      prepared interpreter or verified tools are unavailable.
    env:
      TASK_COVERAGE_OUT: '{{if hasKey . "OUT"}}{{.OUT}}{{end}}'
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - task: prerequisites
      - |
        out="${TASK_COVERAGE_OUT:-${XDG_STATE_HOME:-$HOME/.local/state}/mainframe-rag/coverage}"
        out="$(realpath -m "$out")"
        case "$out/" in
          "$(pwd -P)"/*) echo "coverage output must be outside the repository: $out" >&2; exit 2 ;;
        esac
        mkdir -p "$out"
        rm -f "$out/coverage.json" "$out/coverage.xml" "$out/junit.xml"
        rc=0
        COVERAGE_FILE="$out/.coverage" .venv/bin/python -m pytest \
          --cov --cov-report=term \
          --cov-report="json:$out/coverage.json" --cov-report="xml:$out/coverage.xml" \
          --junitxml="$out/junit.xml" \
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}tests -q{{end}} || rc=$?
        # Exit 1 means only that tests failed: the measurement still ran.
        # Anything else (no tests collected, interruption, internal or usage
        # error) or a missing report is a failed measurement.
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
          echo "coverage measurement failed: pytest exited $rc" >&2; exit "$rc"
        fi
        for f in coverage.json coverage.xml junit.xml .coverage; do
          [ -s "$out/$f" ] || { echo "coverage measurement failed: $out/$f was not produced" >&2; exit 3; }
        done
        .venv/bin/python -I - "$out/junit.xml" <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        failed = [
            f"{case.get('classname')}::{case.get('name')}"
            for case in ET.parse(sys.argv[1]).iter("testcase")
            if case.find("failure") is not None or case.find("error") is not None
        ]
        if failed:
            print(f"tests failed under coverage tracing: {len(failed)} "
                  "(advisory; correctness is owned by the CI unit lane)")
            for node in failed:
                print(f"  {node}")
        PY
        echo "coverage reports: $out"

  local:
    desc: Hermetic local verification of the change (T0/T1/T2) with a receipt (#796)
    summary: |
      `task qa:local` selects tests from the diff against origin/main plus
      dirty paths, runs T0 (ruff/mypy on changed files) and then T1, or T2 for
      broad changes (`--t2` forces it). An unmapped src/scripts change refuses
      until `-- --select tests/<file>` covers it. `task qa:local --
      tests/test_x.py[::node]` runs exactly that selection instead.
      Runs in an allowlisted environment, on disk outside the repository,
      under a memory cap, and writes a receipt under
      $XDG_STATE_HOME/mainframe-rag/local-verify. Refuses (exit 2) when the
      interpreter imports another tree's src, the Colab assignment lock is
      held, or pytest already runs from this tree. Never a substitute for the
      CI unit lane, which owns the full suite.
    cmds:
      - 'python3 -I scripts/local_verify.py {{.CLI_ARGS}}'

  hazards:
    desc: Prove sensitivity to the selected critical historical hazards
    summary: |
      Requires a committed candidate and explicitly prepared locked Python,
      Task and Helm. Runs unchanged baseline tests and isolated mutations;
      only the intended behavioral assertion counts as a detection.
      OUT must name a new evidence directory. PY defaults to .venv/bin/python;
      CI may select its explicitly prepared interpreter. No service or install.
      WORKERS defaults to 1; GitHub explicitly selects 4 isolated worker
      processes. Each pair keeps baseline before mutation and owns its cleanup.
    requires:
      vars: [OUT]
    vars:
      PY: '{{if hasKey . "PY"}}{{.PY}}{{else}}.venv/bin/python{{end}}'
      WORKERS: '{{if hasKey . "WORKERS"}}{{.WORKERS}}{{else}}1{{end}}'
    env:
      TASK_HAZARD_PY: '{{.PY}}'
      TASK_HAZARD_OUT: '{{.OUT}}'
      TASK_HAZARD_WORKERS: '{{.WORKERS}}'
    cmds:
      - '"$TASK_HAZARD_PY" scripts/check_hazard_sensitivity.py --python "$TASK_HAZARD_PY" --out "$TASK_HAZARD_OUT" --workers "$TASK_HAZARD_WORKERS"'

  check:
    desc: Run lint, then typecheck, then unit tests, in that order
    summary: |
      Sequential replacing the retired `make check` (same three tools, same scope).
      Steps run one after another through direct task calls — never parallel
      `deps`, so one shared `.venv` is never installed into concurrently and
      a failed step stops the sequence with its own exit status.
    cmds:
      - task: prerequisites
      - task: lint
      - task: typecheck
      - task: unit

  context:
    desc: Run offline agent-context structure check (no installs)
    summary: |
      Runs `scripts/check_agent_context.py` with the selected Python (PY,
      default python3; use PY=python to match CI, or a full path). An explicit
      empty PY is preserved and fails in the script rather than silently
      falling back; explicit false/zero-like strings are passed through
      unchanged. Requires no venv, Docker, network, model, credentials or
      private config and modifies nothing.
    vars:
      PY: '{{if hasKey . "PY"}}{{.PY}}{{else}}python3{{end}}'
    env:
      TASK_PY: '{{.PY}}'
    cmds:
      - '"$TASK_PY" scripts/check_agent_context.py'

  deps:
    desc: Verify a refreshed lock offline in a clean temporary venv (on-demand)
    summary: |
      `sh scripts/tools/run-task.sh qa:deps WHEELHOUSE=/approved/dev-wheels`
      verifies the selected profile's wheelhouse against the lock manifest,
      creates a temporary CPython 3.14 venv from PY (default .venv/bin/python),
      installs the complete dev profile with `--no-index --find-links`, runs
      `pip check`, then the dependency-lock, licence-inventory, BM25-weights,
      embed-budget and hash-embed suites in that clean environment. PROFILE
      defaults to dev and must be dev: it is the only profile with the test
      runner and is a strict superset of runtime/build at identical pins.
      WHEELHOUSE defaults to .tools/python-wheels/dev (the prepared dev
      wheelhouse); point it at the candidate wheelhouse for a refresh. Never
      uses the network, never installs into .venv, never edits a lock, and
      removes the temporary environment. Missing, incomplete or unsafe inputs
      fail closed. On-demand maintenance; not an every-lane CI job.
    vars:
      PROFILE: '{{if hasKey . "PROFILE"}}{{.PROFILE}}{{else}}dev{{end}}'
      WHEELHOUSE: '{{if hasKey . "WHEELHOUSE"}}{{.WHEELHOUSE}}{{else}}.tools/python-wheels/dev{{end}}'
      PY: '{{if hasKey . "PY"}}{{.PY}}{{else}}.venv/bin/python{{end}}'
    env:
      TASK_DEPS_PROFILE: '{{.PROFILE}}'
      TASK_DEPS_WHEELHOUSE: '{{.WHEELHOUSE}}'
      TASK_DEPS_PY: '{{.PY}}'
    cmds:
      - 'test -f "$TASK_DEPS_PY" || { echo "missing development environment: $TASK_DEPS_PY absent; run: task dev:setup or pass PY=<prepared python> (qa:deps builds only a disposable temporary venv)" >&2; exit 1; }'
      - '"$TASK_DEPS_PY" scripts/verify_dependency_refresh.py --profile "$TASK_DEPS_PROFILE" --wheelhouse "$TASK_DEPS_WHEELHOUSE" --python "$TASK_DEPS_PY"'

  sim:
    desc: Run the sim integration tier against disposable Qdrant (load and HA tiers excluded, 0 skips)
    summary: |
      `.venv/bin/python -m pytest -m integration --ignore=tests/test_load_tier.py
      --ignore=tests/test_ha_cluster.py -v -rs`, mirroring the retired `make sim`.
      The sim lane covers correctness; the load tier (`tests/test_load_tier.py`,
      run via `task qa:load`) is excluded so its absolute concurrency contracts
      are asserted exactly once, and the multi-peer HA fixture
      (`tests/test_ha_cluster.py`, run via `task qa:ha`) is excluded so the
      three-container placement/fault lane is not paid on every sim run. A skip
      fails the run (missing or corrupt local weights fail before collection). Needs the prepared approved local Docker image and verified BM25
      cache; no GPU or live gateway. The authorization tests need local Docker
      even when QDRANT_SIM_URL supplies the other simulation server.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - .venv/bin/python scripts/agent_doctor.py --profile sim --python .venv/bin/python
      - .venv/bin/python -m pytest -m integration --ignore=tests/test_load_tier.py --ignore=tests/test_ha_cluster.py -v -rs

  ha:
    desc: Run the disposable three-peer HA fixture (placement, false HA, peer loss)
    summary: |
      `.venv/bin/python -m pytest -m integration tests/test_ha_cluster.py -v`,
      replacing no retired target: the multi-peer lane is an explicitly
      selected addition (issue #360). It starts the pinned Qdrant image as a
      real three-peer cluster with separate storage and asserts actual
      placement (6/3/2), refusal of a false-HA (RF1) configuration, degraded
      reads and healthy rejoin after one peer is stopped, and exact point
      identity across survivors. Needs docker and the explicitly prepared digest-pinned image; a missing prerequisite fails — this lane must never
      skip. Three containers on one host prove distributed software behavior
      only, never independent-worker or site tolerance.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - .venv/bin/python scripts/agent_doctor.py --profile ha --python .venv/bin/python
      - .venv/bin/python -m pytest -m integration tests/test_ha_cluster.py -v

  load:
    desc: Run the load tier (same composition CI runs, absolute contracts)
    summary: |
      `.venv/bin/python -m pytest -m integration tests/test_load_tier.py
      -v`, replacing the retired `make loadtest-mock`. This is the only lane
      that runs the load tier: `task qa:sim` excludes this file, so the two
      lanes cover every `integration`-marked node with no overlap.
      Fail-closed: no skips; docker/startup/zero-request failures raise. Knobs live in the
      caller environment (LOAD_SEARCH_CONCURRENCY and friends, read by the
      test itself).
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - .venv/bin/python scripts/agent_doctor.py --profile load --python .venv/bin/python
      - .venv/bin/python -m pytest -m integration tests/test_load_tier.py -v
