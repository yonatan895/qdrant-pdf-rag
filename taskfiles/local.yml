# Local simulation tasks — issue #402 increment B3.
#
# Dispatch only: launchers own process lifetime, readiness probes, traps and
# cleanup; YAML only forwards inputs. Three Make input forms map to three
# shell patterns (documented in docs/task-runner.md#inputs):
# - `?=` (unset selects default, explicit empty preserved): hasKey template
#   defaults plus bridged TASK_ variables bound at the command boundary so
#   CLI variables override ambient environment variables.
# - `$(or)` (empty falls back): raw bridges plus shell `:-` at use site.
# - `$(if)` (unset/empty omits): raw bridges plus `${VAR:+...}` (flags) or a
#   conditional `export` in the same command (environment).
# Secrets (gateway keys) are NEVER Task vars: they ride the caller process
# environment, which children inherit; Task never echoes them into previews.
# Included with `dir: .` from the root Taskfile: always runs at repo root.
version: '3'

tasks:
  colab:initialize-fresh:
    desc: Verify a fresh retained Qdrant target and exclusively initialize its private binding
    summary: |
      CPU-only explicit first-run operation; never allocates Colab or changes Qdrant.
      Requires complete admitted production inputs, COLAB_INITIALIZE_COLLECTION
      matching native QDRANT_COLLECTION, an empty private COLAB_DATA_STATE, fresh
      COLAB_STATE and explicit existing Kubernetes target. Keep every target writer
      serialized from this operation through first native publication. Use the
      existing host guard/lock; see docs/colab-playground.md. No tool installs.
    env:
      TASK_COLAB_STATE: '{{.COLAB_STATE}}'
      TASK_COLAB_INITIALIZE_COLLECTION: '{{.COLAB_INITIALIZE_COLLECTION}}'
      TASK_COLAB_CORPUS: '{{.PRODUCTION_CORPUS_DIR}}'
      TASK_COLAB_GOLDEN: '{{.PRODUCTION_GOLDEN_PATH}}'
      TASK_COLAB_INVENTORY: '{{.COLAB_INVENTORY}}'
      TASK_COLAB_SOURCE_INVENTORY: '{{.COLAB_SOURCE_INVENTORY}}'
      TASK_COLAB_EMBEDDING_EVIDENCE: '{{.COLAB_EMBEDDING_EVIDENCE}}'
      TASK_COLAB_PRODUCTION_APPROVAL: '{{.COLAB_PRODUCTION_APPROVAL}}'
      TASK_COLAB_DATA_STATE: '{{.COLAB_DATA_STATE}}'
      TASK_COLAB_KUBECONFIG: '{{.COLAB_KUBECONFIG}}'
      TASK_COLAB_KUBE_CONTEXT: '{{.COLAB_KUBE_CONTEXT}}'
      TASK_COLAB_NAMESPACE: '{{.COLAB_NAMESPACE}}'
      TASK_COLAB_QDRANT_SERVICE: '{{.COLAB_QDRANT_SERVICE}}'
      TASK_COLAB_INFERENCE_LOCK: '{{.COLAB_INFERENCE_LOCK}}'
      TASK_COLAB_PROFILE: '{{.COLAB_PROFILE}}'
      TASK_COLAB_QDRANT_PORT: '{{.COLAB_QDRANT_PORT}}'
      TASK_COLAB_EMBEDDING_MAX_LEN: '{{.COLAB_EMBEDDING_MAX_LEN}}'
      TASK_COLAB_INITIALIZE_SECONDS: '{{.COLAB_INITIALIZE_SECONDS}}'
      TASK_COLAB_KUBECTL_BIN: '{{.COLAB_KUBECTL_BIN}}'
      TASK_COLAB_CLI_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - >-
        test -z "${TASK_COLAB_CLI_ARGS:-}" ||
        { echo "use named Colab Task inputs, not trailing shell arguments" >&2; exit 2; };
        set -- initialize-fresh --state "$TASK_COLAB_STATE" --collection "$TASK_COLAB_INITIALIZE_COLLECTION"
        --corpus "$TASK_COLAB_CORPUS" --golden "$TASK_COLAB_GOLDEN" --inventory "$TASK_COLAB_INVENTORY"
        --source-inventory "$TASK_COLAB_SOURCE_INVENTORY" --embedding-evidence "$TASK_COLAB_EMBEDDING_EVIDENCE"
        --production-approval "$TASK_COLAB_PRODUCTION_APPROVAL" --data-state "$TASK_COLAB_DATA_STATE"
        --kubeconfig "$TASK_COLAB_KUBECONFIG" --kube-context "$TASK_COLAB_KUBE_CONTEXT"
        --namespace "$TASK_COLAB_NAMESPACE" --qdrant-service "$TASK_COLAB_QDRANT_SERVICE"
        --inference-lock "$TASK_COLAB_INFERENCE_LOCK";
        if [ -n "${TASK_COLAB_PROFILE:-}" ]; then set -- "$@" --profile "$TASK_COLAB_PROFILE"; fi;
        if [ -n "${TASK_COLAB_QDRANT_PORT:-}" ]; then set -- "$@" --qdrant-port "$TASK_COLAB_QDRANT_PORT"; fi;
        if [ -n "${TASK_COLAB_EMBEDDING_MAX_LEN:-}" ]; then set -- "$@" --embedding-max-len "$TASK_COLAB_EMBEDDING_MAX_LEN"; fi;
        if [ -n "${TASK_COLAB_INITIALIZE_SECONDS:-}" ]; then set -- "$@" --deadline-seconds "$TASK_COLAB_INITIALIZE_SECONDS"; fi;
        if [ -n "${TASK_COLAB_KUBECTL_BIN:-}" ]; then set -- "$@" --kubectl "$TASK_COLAB_KUBECTL_BIN"; fi;
        exec .venv/bin/python scripts/colab.py "$@"

  colab:prepare:
    desc: Prepare private Colab run state without allocating or authenticating
    summary: |
      Local-only preparation for issue #706; see docs/colab-playground.md.
      Requires COLAB_STATE (fresh directory outside Git) and
      COLAB_GATEWAY_IMAGE (existing digest pin). Optional COLAB_* inputs map
      to scripts/colab.py prepare flags; PRODUCTION_CORPUS_DIR and
      PRODUCTION_GOLDEN_PATH supply private production sources. Unset/empty
      optional values preserve controller defaults. COLAB_INGEST_REINGEST=1
      (production only) freezes an explicit ingest --reingest for this run
      (issue #737). Never installs tools, logs in, allocates a session or
      approves compute units.
    env:
      TASK_COLAB_STATE: '{{.COLAB_STATE}}'
      TASK_COLAB_GATEWAY_IMAGE: '{{.COLAB_GATEWAY_IMAGE}}'
      TASK_COLAB_PROFILE: '{{.COLAB_PROFILE}}'
      TASK_COLAB_DATASET: '{{.COLAB_DATASET}}'
      TASK_COLAB_CORPUS: '{{.PRODUCTION_CORPUS_DIR}}'
      TASK_COLAB_GOLDEN: '{{.PRODUCTION_GOLDEN_PATH}}'
      TASK_COLAB_INVENTORY: '{{.COLAB_INVENTORY}}'
      TASK_COLAB_SOURCE_INVENTORY: '{{.COLAB_SOURCE_INVENTORY}}'
      TASK_COLAB_EMBEDDING_EVIDENCE: '{{.COLAB_EMBEDDING_EVIDENCE}}'
      TASK_COLAB_PRODUCTION_APPROVAL: '{{.COLAB_PRODUCTION_APPROVAL}}'
      TASK_COLAB_DATA_STATE: '{{.COLAB_DATA_STATE}}'
      TASK_COLAB_KUBECONFIG: '{{.COLAB_KUBECONFIG}}'
      TASK_COLAB_KUBE_CONTEXT: '{{.COLAB_KUBE_CONTEXT}}'
      TASK_COLAB_NAMESPACE: '{{.COLAB_NAMESPACE}}'
      TASK_COLAB_QDRANT_SERVICE: '{{.COLAB_QDRANT_SERVICE}}'
      TASK_COLAB_INFERENCE_LOCK: '{{.COLAB_INFERENCE_LOCK}}'
      TASK_COLAB_TRANSPORT_RECEIPT: '{{.COLAB_TRANSPORT_RECEIPT}}'
      TASK_COLAB_REASONING_PORT: '{{.COLAB_REASONING_PORT}}'
      TASK_COLAB_EMBEDDING_PORT: '{{.COLAB_EMBEDDING_PORT}}'
      TASK_COLAB_QDRANT_PORT: '{{.COLAB_QDRANT_PORT}}'
      TASK_COLAB_EMBEDDING_MAX_LEN: '{{.COLAB_EMBEDDING_MAX_LEN}}'
      TASK_COLAB_DEADLINE_SECONDS: '{{.COLAB_DEADLINE_SECONDS}}'
      TASK_COLAB_CU_CAP: '{{.COLAB_CU_CAP}}'
      TASK_COLAB_CU_FLOOR: '{{.COLAB_CU_FLOOR}}'
      TASK_COLAB_DOCKER_GATEWAY: '{{.COLAB_DOCKER_GATEWAY}}'
      TASK_COLAB_POLL_SECONDS: '{{.COLAB_POLL_SECONDS}}'
      TASK_COLAB_INGEST_REINGEST: '{{.COLAB_INGEST_REINGEST}}'
      TASK_COLAB_BIN: '{{.COLAB_BIN}}'
      TASK_COLAB_SSH_BIN: '{{.COLAB_SSH_BIN}}'
      TASK_COLAB_SSH_KEYGEN_BIN: '{{.COLAB_SSH_KEYGEN_BIN}}'
      TASK_COLAB_DOCKER_BIN: '{{.COLAB_DOCKER_BIN}}'
      TASK_COLAB_KUBECTL_BIN: '{{.COLAB_KUBECTL_BIN}}'
      TASK_COLAB_CLI_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - >-
        test -n "${TASK_COLAB_STATE:-}" && test -n "${TASK_COLAB_GATEWAY_IMAGE:-}" ||
        { echo "COLAB_STATE and COLAB_GATEWAY_IMAGE are required" >&2; exit 2; };
        test -z "${TASK_COLAB_CLI_ARGS:-}" ||
        { echo "use named Colab Task inputs, not trailing shell arguments" >&2; exit 2; };
        set -- prepare --state "$TASK_COLAB_STATE" --gateway-image "$TASK_COLAB_GATEWAY_IMAGE";
        if [ -n "${TASK_COLAB_PROFILE:-}" ]; then set -- "$@" --profile "$TASK_COLAB_PROFILE"; fi;
        if [ -n "${TASK_COLAB_DATASET:-}" ]; then set -- "$@" --dataset "$TASK_COLAB_DATASET"; fi;
        if [ -n "${TASK_COLAB_CORPUS:-}" ]; then set -- "$@" --corpus "$TASK_COLAB_CORPUS"; fi;
        if [ -n "${TASK_COLAB_GOLDEN:-}" ]; then set -- "$@" --golden "$TASK_COLAB_GOLDEN"; fi;
        if [ -n "${TASK_COLAB_INVENTORY:-}" ]; then set -- "$@" --inventory "$TASK_COLAB_INVENTORY"; fi;
        if [ -n "${TASK_COLAB_SOURCE_INVENTORY:-}" ]; then set -- "$@" --source-inventory "$TASK_COLAB_SOURCE_INVENTORY"; fi;
        if [ -n "${TASK_COLAB_EMBEDDING_EVIDENCE:-}" ]; then set -- "$@" --embedding-evidence "$TASK_COLAB_EMBEDDING_EVIDENCE"; fi;
        if [ -n "${TASK_COLAB_PRODUCTION_APPROVAL:-}" ]; then set -- "$@" --production-approval "$TASK_COLAB_PRODUCTION_APPROVAL"; fi;
        if [ -n "${TASK_COLAB_DATA_STATE:-}" ]; then set -- "$@" --data-state "$TASK_COLAB_DATA_STATE"; fi;
        if [ -n "${TASK_COLAB_KUBECONFIG:-}" ]; then set -- "$@" --kubeconfig "$TASK_COLAB_KUBECONFIG"; fi;
        if [ -n "${TASK_COLAB_KUBE_CONTEXT:-}" ]; then set -- "$@" --kube-context "$TASK_COLAB_KUBE_CONTEXT"; fi;
        if [ -n "${TASK_COLAB_NAMESPACE:-}" ]; then set -- "$@" --namespace "$TASK_COLAB_NAMESPACE"; fi;
        if [ -n "${TASK_COLAB_QDRANT_SERVICE:-}" ]; then set -- "$@" --qdrant-service "$TASK_COLAB_QDRANT_SERVICE"; fi;
        if [ -n "${TASK_COLAB_INFERENCE_LOCK:-}" ]; then set -- "$@" --inference-lock "$TASK_COLAB_INFERENCE_LOCK"; fi;
        if [ -n "${TASK_COLAB_TRANSPORT_RECEIPT:-}" ]; then set -- "$@" --transport-receipt "$TASK_COLAB_TRANSPORT_RECEIPT"; fi;
        if [ -n "${TASK_COLAB_REASONING_PORT:-}" ]; then set -- "$@" --reasoning-port "$TASK_COLAB_REASONING_PORT"; fi;
        if [ -n "${TASK_COLAB_EMBEDDING_PORT:-}" ]; then set -- "$@" --embedding-port "$TASK_COLAB_EMBEDDING_PORT"; fi;
        if [ -n "${TASK_COLAB_QDRANT_PORT:-}" ]; then set -- "$@" --qdrant-port "$TASK_COLAB_QDRANT_PORT"; fi;
        if [ -n "${TASK_COLAB_EMBEDDING_MAX_LEN:-}" ]; then set -- "$@" --embedding-max-len "$TASK_COLAB_EMBEDDING_MAX_LEN"; fi;
        if [ -n "${TASK_COLAB_DEADLINE_SECONDS:-}" ]; then set -- "$@" --deadline-seconds "$TASK_COLAB_DEADLINE_SECONDS"; fi;
        if [ -n "${TASK_COLAB_CU_CAP:-}" ]; then set -- "$@" --cu-cap "$TASK_COLAB_CU_CAP"; fi;
        if [ -n "${TASK_COLAB_CU_FLOOR:-}" ]; then set -- "$@" --cu-floor "$TASK_COLAB_CU_FLOOR"; fi;
        if [ -n "${TASK_COLAB_DOCKER_GATEWAY:-}" ]; then set -- "$@" --docker-gateway "$TASK_COLAB_DOCKER_GATEWAY"; fi;
        if [ -n "${TASK_COLAB_POLL_SECONDS:-}" ]; then set -- "$@" --poll-seconds "$TASK_COLAB_POLL_SECONDS"; fi;
        case "${TASK_COLAB_INGEST_REINGEST:-}" in ''|0) ;; 1) set -- "$@" --ingest-reingest ;; *) echo "COLAB_INGEST_REINGEST must be 0 or 1" >&2; exit 2 ;; esac;
        if [ -n "${TASK_COLAB_BIN:-}" ]; then set -- "$@" --colab "$TASK_COLAB_BIN"; fi;
        if [ -n "${TASK_COLAB_SSH_BIN:-}" ]; then set -- "$@" --ssh "$TASK_COLAB_SSH_BIN"; fi;
        if [ -n "${TASK_COLAB_SSH_KEYGEN_BIN:-}" ]; then set -- "$@" --ssh-keygen "$TASK_COLAB_SSH_KEYGEN_BIN"; fi;
        if [ -n "${TASK_COLAB_DOCKER_BIN:-}" ]; then set -- "$@" --docker "$TASK_COLAB_DOCKER_BIN"; fi;
        if [ -n "${TASK_COLAB_KUBECTL_BIN:-}" ]; then set -- "$@" --kubectl "$TASK_COLAB_KUBECTL_BIN"; fi;
        exec .venv/bin/python scripts/colab.py "$@"

  colab:run:
    desc: Run one explicitly approved Colab session in the foreground
    summary: |
      Requires COLAB_STATE and a fresh explicit COLAB_APPROVE_CU matching
      that prepared run's cap. Caller must use the existing host resource
      guard and shared host lock; this dispatcher adds neither. Optional
      COLAB_WORKLOAD is one executable path for synthetic runs, never a
      shell command string. Production permits only the native local:stack
      invocation so its recipe and environment remain verifiable. Otherwise the
      controller chooses its existing CPU/local-stack workload. No login.
    env:
      TASK_COLAB_STATE: '{{.COLAB_STATE}}'
      TASK_COLAB_APPROVE_CU: '{{.COLAB_APPROVE_CU}}'
      TASK_COLAB_WORKLOAD: '{{.COLAB_WORKLOAD}}'
      TASK_COLAB_CLI_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - >-
        test -n "${TASK_COLAB_STATE:-}" && test -n "${TASK_COLAB_APPROVE_CU:-}" ||
        { echo "COLAB_STATE and explicit per-run COLAB_APPROVE_CU are required" >&2; exit 2; };
        test -z "${TASK_COLAB_CLI_ARGS:-}" ||
        { echo "use COLAB_WORKLOAD for a private executable, not trailing shell arguments" >&2; exit 2; };
        set -- run --state "$TASK_COLAB_STATE" --approve-cu "$TASK_COLAB_APPROVE_CU";
        if [ -n "${TASK_COLAB_WORKLOAD:-}" ]; then set -- "$@" -- "$TASK_COLAB_WORKLOAD"; fi;
        exec .venv/bin/python scripts/colab.py "$@"

  colab:stop:
    desc: Recover and verify release of the exact Colab session in private state
    summary: |
      Requires COLAB_STATE. Uses that controller's bounded cleanup and
      session ownership; does not stop unrelated sessions or delete corpus,
      Qdrant storage or retained ingest progress. Interrupt the active
      controller before recovery; never treat an unconfirmed stop as release.
    env:
      TASK_COLAB_STATE: '{{.COLAB_STATE}}'
      TASK_COLAB_CLI_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - >-
        test -n "${TASK_COLAB_STATE:-}" ||
        { echo "COLAB_STATE is required" >&2; exit 2; };
        test -z "${TASK_COLAB_CLI_ARGS:-}" ||
        { echo "use named Colab Task inputs, not trailing shell arguments" >&2; exit 2; };
        exec .venv/bin/python scripts/colab.py stop --state "$TASK_COLAB_STATE"

  qdrant:up:
    desc: Start the pinned sim Qdrant on the fixed loopback port
    summary: |
      `sh scripts/sim_qdrant.sh up` (shared owner with
      scripts/run_local_stack.sh): reuses the named container when it
      already runs with the approved image ID, else starts the prepared
      images.txt digest-pinned image with pulling disabled on
      127.0.0.1:SIM_PORT. Inputs: SIM_CONTAINER (default qdrant-sim),
      SIM_PORT (default 6333); explicit empty fails closed in the helper.
      Run artifacts:qdrant explicitly first on a connected preparation host.
    vars: &qdrant_vars
      SIM_CONTAINER: '{{if hasKey . "SIM_CONTAINER"}}{{.SIM_CONTAINER}}{{else}}qdrant-sim{{end}}'
      SIM_PORT: '{{if hasKey . "SIM_PORT"}}{{.SIM_PORT}}{{else}}6333{{end}}'
    env: &qdrant_env
      TASK_SIM_CONTAINER: '{{.SIM_CONTAINER}}'
      TASK_SIM_PORT: '{{.SIM_PORT}}'
    cmds:
      - SIM_CONTAINER="$TASK_SIM_CONTAINER" SIM_PORT="$TASK_SIM_PORT" sh scripts/sim_qdrant.sh up

  qdrant:down:
    desc: Stop the sim Qdrant container (ignores an already-stopped one)
    summary: |
      `sh scripts/sim_qdrant.sh down`, replacing the retired `make sim-clean`. Never
      fails when the container is already gone. Same inputs as
      `local:qdrant:up`.
    vars: *qdrant_vars
    env: *qdrant_env
    cmds:
      - SIM_CONTAINER="$TASK_SIM_CONTAINER" SIM_PORT="$TASK_SIM_PORT" sh scripts/sim_qdrant.sh down

  qdrant:forward:
    desc: Supervised loopback port-forward to a retained Kind Qdrant Service
    summary: |
      `scripts/kube_forward.py` (issue #751): binds 127.0.0.1 only, refuses
      an occupied port, restarts `kubectl port-forward` with bounded backoff
      when it exits or its /readyz probe keeps failing, and stops on Ctrl-C.
      A loopback relay replaces a forwarded stream idle 4 s after the
      server's last data, below Qdrant's 5 s keep-alive (#762). The Service
      stays ClusterIP. Inputs: QDRANT_FORWARD_NAMESPACE (required),
      QDRANT_FORWARD_SERVICE (default qdrant), QDRANT_FORWARD_PORT (default
      16333), QDRANT_FORWARD_KUBECONFIG, QDRANT_FORWARD_CONTEXT,
      QDRANT_FORWARD_KUBECTL (default kubectl). Foreground; never mutates the
      cluster.
    env:
      TASK_QF_NAMESPACE: '{{.QDRANT_FORWARD_NAMESPACE}}'
      TASK_QF_SERVICE: '{{.QDRANT_FORWARD_SERVICE}}'
      TASK_QF_PORT: '{{.QDRANT_FORWARD_PORT}}'
      TASK_QF_KUBECONFIG: '{{.QDRANT_FORWARD_KUBECONFIG}}'
      TASK_QF_CONTEXT: '{{.QDRANT_FORWARD_CONTEXT}}'
      TASK_QF_KUBECTL: '{{.QDRANT_FORWARD_KUBECTL}}'
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - >-
        test -n "${TASK_QF_NAMESPACE:-}" || { echo "QDRANT_FORWARD_NAMESPACE is required" >&2; exit 2; };
        exec .venv/bin/python scripts/kube_forward.py --namespace "$TASK_QF_NAMESPACE"
        --service "${TASK_QF_SERVICE:-qdrant}" --local-port "${TASK_QF_PORT:-16333}" --remote-port 6333
        --kubectl "${TASK_QF_KUBECTL:-kubectl}" --kubeconfig "${TASK_QF_KUBECONFIG:-}" --context "${TASK_QF_CONTEXT:-}"

  query:
    desc: Interactive query inspection against Qdrant/gateway (read-only)
    summary: |
      `PYTHONPATH=. .venv/bin/python scripts/query_demo.py` with only the
      caller-set `--flag value` pairs, replacing the retired `make query-demo` (12
      optional flags; unset/empty inputs are omitted, never sent empty).
      Pairs accumulate through positional parameters, so free-text values
      arrive as single argv entries and execute nothing. Read-only
      inspection, not a substitute for eval.
    vars:
      TASK_ANSWER: 'false'
    env: &query_env
      TASK_ANSWER: '{{.TASK_ANSWER}}'
      PYTHONPATH: '.'
      TASK_QUERY: '{{.QUERY}}'
      TASK_COLLECTION: '{{.COLLECTION}}'
      TASK_LIMIT: '{{.LIMIT}}'
      TASK_PRODUCT: '{{.PRODUCT}}'
      TASK_VERSION: '{{.VERSION}}'
      TASK_EMBED_MODEL: '{{.EMBED_MODEL}}'
      TASK_EMBED_URL: '{{.EMBED_URL}}'
      TASK_EMBED_MODE: '{{if hasKey . "EMBED_MODE"}}{{.EMBED_MODE}}{{else}}hash{{end}}'
      EMBED_MODE: '{{if hasKey . "EMBED_MODE"}}{{.EMBED_MODE}}{{else}}hash{{end}}'
      TASK_DENSE_DIM: '{{.DENSE_DIM}}'
      TASK_MODEL: '{{.MODEL}}'
      TASK_VLLM_URL: '{{.VLLM_URL}}'
      TASK_OTEL_ENDPOINT: '{{.OTEL_ENDPOINT}}'
    cmds: &query_cmds
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - >-
        set --;
        if [ "${TASK_ANSWER:-}" = true ]; then set -- --answer; fi;
        if [ -n "${TASK_QUERY:-}" ]; then set -- "$@" --query "$TASK_QUERY"; fi;
        if [ -n "${TASK_COLLECTION:-}" ]; then set -- "$@" --collection "$TASK_COLLECTION"; fi;
        if [ -n "${TASK_LIMIT:-}" ]; then set -- "$@" --limit "$TASK_LIMIT"; fi;
        if [ -n "${TASK_PRODUCT:-}" ]; then set -- "$@" --product "$TASK_PRODUCT"; fi;
        if [ -n "${TASK_VERSION:-}" ]; then set -- "$@" --version "$TASK_VERSION"; fi;
        if [ -n "${TASK_EMBED_MODEL:-}" ]; then set -- "$@" --embed-model "$TASK_EMBED_MODEL"; fi;
        if [ -n "${TASK_EMBED_URL:-}" ]; then set -- "$@" --embed-url "$TASK_EMBED_URL"; fi;
        if [ -n "${TASK_EMBED_MODE:-}" ]; then set -- "$@" --embed-mode "$TASK_EMBED_MODE"; fi;
        if [ -n "${TASK_DENSE_DIM:-}" ]; then set -- "$@" --dense-dim "$TASK_DENSE_DIM"; fi;
        if [ -n "${TASK_MODEL:-}" ]; then set -- "$@" --model "$TASK_MODEL"; fi;
        if [ -n "${TASK_VLLM_URL:-}" ]; then set -- "$@" --vllm-url "$TASK_VLLM_URL"; fi;
        if [ -n "${TASK_OTEL_ENDPOINT:-}" ]; then set -- "$@" --otel-endpoint "$TASK_OTEL_ENDPOINT"; fi;
        . scripts/local_lane_budget.sh;
        exec .venv/bin/python scripts/query_demo.py "$@"

  ask:
    desc: Interactive conversational Q&A against Qdrant/reasoning model
    summary: |
      Same forwarding as `local:query` with `--answer` first, mirroring
      the retired `make ask`. Interactive; output goes to the terminal.
    vars:
      TASK_ANSWER: 'true'
    env: *query_env
    cmds: *query_cmds

  llm:
    desc: Serve the reasoning model locally (GPU, foreground)
    summary: |
      `BUDGET_PYTHON=<repo>/.venv/bin/python ROLE=<role>
      sh scripts/run_local_vllm.sh`, replacing the retired `make local-vllm`. The venv
      interpreter is always used for Budget resolution (never exported
      globally). Inputs: ROLE (default reasoning), MODEL, PORT, BUDGET_PROFILE,
      GPU_MEM, MAX_LEN, SEQS, VLLM_IMAGE, SERVED_NAME, CONTAINER_NAME. Foreground: Ctrl-C stops
      the server. Needs the 8GB GPU budget; see docs/live-stack.md.
    env: &vllm_env
      TASK_ROLE: '{{.ROLE}}'
      TASK_MODEL: '{{.MODEL}}'
      TASK_PORT: '{{.PORT}}'
      TASK_BUDGET_PROFILE: '{{.BUDGET_PROFILE}}'
      TASK_GPU_MEM: '{{.GPU_MEM}}'
      TASK_MAX_LEN: '{{.MAX_LEN}}'
      TASK_SEQS: '{{.SEQS}}'
      TASK_VLLM_IMAGE: '{{.VLLM_IMAGE}}'
      TASK_SERVED_NAME: '{{.SERVED_NAME}}'
      TASK_CONTAINER_NAME: '{{.CONTAINER_NAME}}'
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - >-
        export BUDGET_PYTHON="$PWD/.venv/bin/python";
        if [ -n "${TASK_ROLE:-}" ]; then export ROLE="$TASK_ROLE"; else export ROLE="${ROLE:-reasoning}"; fi;
        if [ -n "${TASK_MODEL:-}" ]; then export MODEL="$TASK_MODEL"; fi;
        if [ -n "${TASK_PORT:-}" ]; then export PORT="$TASK_PORT"; fi;
        if [ -n "${TASK_BUDGET_PROFILE:-}" ]; then export BUDGET_PROFILE="$TASK_BUDGET_PROFILE"; fi;
        if [ -n "${TASK_GPU_MEM:-}" ]; then export GPU_MEM="$TASK_GPU_MEM"; fi;
        if [ -n "${TASK_MAX_LEN:-}" ]; then export MAX_LEN="$TASK_MAX_LEN"; fi;
        if [ -n "${TASK_SEQS:-}" ]; then export SEQS="$TASK_SEQS"; fi;
        if [ -n "${TASK_VLLM_IMAGE:-}" ]; then export VLLM_IMAGE="$TASK_VLLM_IMAGE"; fi;
        if [ -n "${TASK_SERVED_NAME:-}" ]; then export SERVED_NAME="$TASK_SERVED_NAME"; fi;
        if [ -n "${TASK_CONTAINER_NAME:-}" ]; then export CONTAINER_NAME="$TASK_CONTAINER_NAME"; fi;
        sh scripts/run_local_vllm.sh

  embed:
    desc: Serve the embedding model locally (GPU, foreground)
    summary: |
      Like `local:llm` for the embed role, replacing the retired `make local-vllm-embed`.
      Inputs: ROLE (default embed), MODEL (default
      Qwen/Qwen3-Embedding-0.6B), PORT (default 8001), BUDGET_PROFILE,
      GPU_MEM, MAX_LEN, SEQS, VLLM_IMAGE, SERVED_NAME, CONTAINER_NAME. Never export MODEL
      globally: it would hijack the sibling launchers' defaults.
    env: *vllm_env
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - >-
        export BUDGET_PYTHON="$PWD/.venv/bin/python";
        if [ -n "${TASK_ROLE:-}" ]; then export ROLE="$TASK_ROLE"; else export ROLE="${ROLE:-embed}"; fi;
        if [ -n "${TASK_MODEL:-}" ]; then export MODEL="$TASK_MODEL"; else export MODEL="${MODEL:-Qwen/Qwen3-Embedding-0.6B}"; fi;
        if [ -n "${TASK_PORT:-}" ]; then export PORT="$TASK_PORT"; else export PORT="${PORT:-8001}"; fi;
        if [ -n "${TASK_BUDGET_PROFILE:-}" ]; then export BUDGET_PROFILE="$TASK_BUDGET_PROFILE"; fi;
        if [ -n "${TASK_GPU_MEM:-}" ]; then export GPU_MEM="$TASK_GPU_MEM"; fi;
        if [ -n "${TASK_MAX_LEN:-}" ]; then export MAX_LEN="$TASK_MAX_LEN"; fi;
        if [ -n "${TASK_SEQS:-}" ]; then export SEQS="$TASK_SEQS"; fi;
        if [ -n "${TASK_VLLM_IMAGE:-}" ]; then export VLLM_IMAGE="$TASK_VLLM_IMAGE"; fi;
        if [ -n "${TASK_SERVED_NAME:-}" ]; then export SERVED_NAME="$TASK_SERVED_NAME"; fi;
        if [ -n "${TASK_CONTAINER_NAME:-}" ]; then export CONTAINER_NAME="$TASK_CONTAINER_NAME"; fi;
        sh scripts/run_local_vllm.sh

  rerank:
    desc: Serve the reranker locally (GPU, foreground, triple pack only)
    summary: |
      Like `local:llm` for the rerank role, mirroring
      the retired `make local-vllm-rerank`. Inputs: BUDGET_PROFILE (default TRIPLE_8GB),
      ROLE (default rerank), MODEL (default BAAI/bge-reranker-v2-m3), PORT
      (default 8002), GPU_MEM, MAX_LEN, SEQS, VLLM_IMAGE, SERVED_NAME, CONTAINER_NAME. Never alongside
      the default 8GB pair.
    env: *vllm_env
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - >-
        export BUDGET_PYTHON="$PWD/.venv/bin/python";
        if [ -n "${TASK_BUDGET_PROFILE:-}" ]; then export BUDGET_PROFILE="$TASK_BUDGET_PROFILE"; else export BUDGET_PROFILE="${BUDGET_PROFILE:-TRIPLE_8GB}"; fi;
        if [ -n "${TASK_ROLE:-}" ]; then export ROLE="$TASK_ROLE"; else export ROLE="${ROLE:-rerank}"; fi;
        if [ -n "${TASK_MODEL:-}" ]; then export MODEL="$TASK_MODEL"; else export MODEL="${MODEL:-BAAI/bge-reranker-v2-m3}"; fi;
        if [ -n "${TASK_PORT:-}" ]; then export PORT="$TASK_PORT"; else export PORT="${PORT:-8002}"; fi;
        if [ -n "${TASK_GPU_MEM:-}" ]; then export GPU_MEM="$TASK_GPU_MEM"; fi;
        if [ -n "${TASK_MAX_LEN:-}" ]; then export MAX_LEN="$TASK_MAX_LEN"; fi;
        if [ -n "${TASK_SEQS:-}" ]; then export SEQS="$TASK_SEQS"; fi;
        if [ -n "${TASK_VLLM_IMAGE:-}" ]; then export VLLM_IMAGE="$TASK_VLLM_IMAGE"; fi;
        if [ -n "${TASK_SERVED_NAME:-}" ]; then export SERVED_NAME="$TASK_SERVED_NAME"; fi;
        if [ -n "${TASK_CONTAINER_NAME:-}" ]; then export CONTAINER_NAME="$TASK_CONTAINER_NAME"; fi;
        sh scripts/run_local_vllm.sh

  gateway:up:
    desc: Start the local LiteLLM gateway in front of the backends
    summary: |
      `GATEWAY_PORT=<port> sh scripts/run_local_gateway.sh`, mirroring
      the retired `make local-gateway`. Input: GATEWAY_PORT (default 4000). Keys ride
      the caller environment only (GATEWAY_MASTER_KEY etc.; the script mints
      per-start keys when absent and prints them once) — never Task vars,
      never CLI values. Foreground: Ctrl-C stops the gateway containers.
      Start the enabled model backends first. Two-model profiles keep reranking
      disabled in agent/ingest consumers; the unused route is not a live backend.
    env:
      TASK_GATEWAY_PORT: '{{.GATEWAY_PORT}}'
    cmds:
      - >-
        if [ -n "${TASK_GATEWAY_PORT:-}" ]; then export GATEWAY_PORT="$TASK_GATEWAY_PORT"; else export GATEWAY_PORT="${GATEWAY_PORT:-4000}"; fi;
        sh scripts/run_local_gateway.sh

  gateway:down:
    desc: Stop the local gateway and its key-store (ignores absent ones)
    summary: |
      `docker stop`/`docker network rm` over the gateway names, mirroring
      the retired `make local-gateway-stop`. Each cleanup tolerates an already-removed
      resource locally without masking other failures. Inputs: GATEWAY_NAME,
      PG_NAME, PG_NET (defaults local-litellm-gateway[-pg[-net]]).
    env:
      TASK_GATEWAY_NAME: '{{.GATEWAY_NAME}}'
      TASK_PG_NAME: '{{.PG_NAME}}'
      TASK_PG_NET: '{{.PG_NET}}'
    cmds:
      - >-
        GATEWAY_NAME="${TASK_GATEWAY_NAME:-${GATEWAY_NAME:-local-litellm-gateway}}";
        PG_NAME="${TASK_PG_NAME:-${PG_NAME:-local-litellm-gateway-pg}}";
        PG_NET="${TASK_PG_NET:-${PG_NET:-local-litellm-gateway-net}}";
        docker stop "$GATEWAY_NAME" "$PG_NAME" 2>/dev/null || true;
        docker network rm "$PG_NET" 2>/dev/null || true

  openobserve:up:
    desc: Start the local OpenObserve trace/metrics backend (or reuse a running one)
    summary: |
      `sh scripts/run_local_openobserve.sh` (ADR-0006), replacing the retired
      `local:jaeger:up`. Starts only when nothing answers on :5080; an
      already-running OpenObserve is reused, never stopped by us. Root
      credentials live in a 0600 env file (O2_ENV_FILE), created on first start.
      O2_COLLECTOR=1 also starts the pinned otelcol metrics scraper.
    cmds:
      - sh scripts/run_local_openobserve.sh

  openobserve:down:
    desc: Stop the local OpenObserve and collector containers (ignores absent ones)
    summary: |
      `docker stop` over the OpenObserve and collector names. The data volume
      (O2_VOLUME, default local-openobserve-data) is kept.
      Input: O2_NAME (default local-openobserve), O2_COLLECTOR_NAME (default local-otelcol).
    env:
      TASK_O2_NAME: '{{.O2_NAME}}'
      TASK_O2_COLLECTOR_NAME: '{{.O2_COLLECTOR_NAME}}'
    cmds:
      - docker stop "${TASK_O2_COLLECTOR_NAME:-${O2_COLLECTOR_NAME:-local-otelcol}}" 2>/dev/null || true
      - docker stop "${TASK_O2_NAME:-${O2_NAME:-local-openobserve}}" 2>/dev/null || true

  stack:
    desc: Run the full local production simulation (supervisor)
    summary: |
      `sh scripts/run_local_stack.sh` with caller-set CORPUS_DIR,
      LOCAL_INGEST_PROGRESS (unset retains the log-directory inventory),
      LOCAL_INGEST_REINGEST (explicit 1 passes ingest --reingest, the
      contract's resumption of a pending build; unset/0 keeps the default),
      GATEWAY_PORT, GATEWAY_PROBE_MAX_TOKENS (default 16, range 1–4096),
      LOCAL_AGENT_PORT, O2_PORT and LOCAL_STACK_DRYRUN
      forwarded, replacing the retired `make local-stack`. The supervisor owns
      gateway/OpenObserve/agent lifetime (traps, readiness probes, trace check);
      Qdrant falls back to scripts/sim_qdrant.sh. LOCAL_STACK_DRYRUN=1
      prints the plan without Docker/network. Needs docker, the three
      backends and .venv (checked by the script, not here — same as Make).
    env:
      TASK_CORPUS_DIR: '{{.CORPUS_DIR}}'
      TASK_LOCAL_INGEST_PROGRESS: '{{.LOCAL_INGEST_PROGRESS}}'
      TASK_LOCAL_INGEST_REINGEST: '{{.LOCAL_INGEST_REINGEST}}'
      TASK_GATEWAY_PORT: '{{.GATEWAY_PORT}}'
      TASK_LOCAL_AGENT_PORT: '{{.LOCAL_AGENT_PORT}}'
      TASK_GATEWAY_PROBE_MAX_TOKENS: '{{.GATEWAY_PROBE_MAX_TOKENS}}'
      TASK_O2_PORT: '{{.O2_PORT}}'
      TASK_LOCAL_STACK_DRYRUN: '{{.LOCAL_STACK_DRYRUN}}'
    cmds:
      - >-
        if [ -n "${TASK_CORPUS_DIR:-}" ]; then export CORPUS_DIR="$TASK_CORPUS_DIR"; fi;
        if [ -n "${TASK_LOCAL_INGEST_PROGRESS:-}" ]; then export LOCAL_INGEST_PROGRESS="$TASK_LOCAL_INGEST_PROGRESS"; else unset LOCAL_INGEST_PROGRESS; fi;
        if [ -n "${TASK_LOCAL_INGEST_REINGEST:-}" ]; then export LOCAL_INGEST_REINGEST="$TASK_LOCAL_INGEST_REINGEST"; else unset LOCAL_INGEST_REINGEST; fi;
        if [ -n "${TASK_GATEWAY_PORT:-}" ]; then export GATEWAY_PORT="$TASK_GATEWAY_PORT"; fi;
        if [ -n "${TASK_LOCAL_AGENT_PORT:-}" ]; then export LOCAL_AGENT_PORT="$TASK_LOCAL_AGENT_PORT"; fi;
        if [ -n "${TASK_GATEWAY_PROBE_MAX_TOKENS:-}" ]; then export GATEWAY_PROBE_MAX_TOKENS="$TASK_GATEWAY_PROBE_MAX_TOKENS"; else unset GATEWAY_PROBE_MAX_TOKENS; fi;
        if [ -n "${TASK_O2_PORT:-}" ]; then export O2_PORT="$TASK_O2_PORT"; fi;
        if [ -n "${TASK_LOCAL_STACK_DRYRUN:-}" ]; then export LOCAL_STACK_DRYRUN="$TASK_LOCAL_STACK_DRYRUN"; fi;
        sh scripts/run_local_stack.sh

  agent:
    desc: Run the agent API locally under uvicorn (component runner)
    summary: |
      `LLM_STREAM=true .venv/bin/python -m uvicorn ... --port <port>` with
      UI_ENABLED forwarded only when set, replacing the retired `make run-agent`.
      Inputs: PORT (default 8080), UI_ENABLED (unset keeps the app
      fail-closed; `true` opens /ui). Honors the supervisor-owned gateway
      handoff in the caller environment.
    env:
      TASK_PORT: '{{.PORT}}'
      TASK_UI_ENABLED: '{{.UI_ENABLED}}'
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - >-
        if [ -n "${TASK_UI_ENABLED:-}" ]; then export UI_ENABLED="$TASK_UI_ENABLED"; fi;
        PORT="${TASK_PORT:-${PORT:-8080}}";
        LLM_STREAM=true .venv/bin/python -m uvicorn mainframe_rag.agent.app:app --host 0.0.0.0 --port "$PORT"

  check:
    desc: Require grounded answers, completed console follow-up and a fresh trace
    summary: |
      Read-only acceptance against existing agent/OpenObserve listeners; runs real
      model requests sequentially. Requires --agent, --trace-url, --query,
      --followup and a new private --report path after --. Nonzero on incomplete
      answers, insufficient evidence, stream errors or a missing fresh trace.
      Does not launch services or replace gateway/TLS/model identity checks.
      OpenObserve credentials come from TRACE_QUERY_USER and TRACE_QUERY_PASSWORD
      in the caller environment (the local root user in O2_ENV_FILE); they are
      never taken from CLI_ARGS. CLI_ARGS are trusted operator shell arguments,
      as in qa:unit.
    cmds:
      - .venv/bin/python scripts/check_live.py {{.CLI_ARGS}}


  openwebui:dev-up:
    desc: Open WebUI dev environment on Kind (heavy lock, RAM admission)
    summary: |
      `sh scripts/openwebui/dev.sh up`; owner doc docs/openwebui-dev.md.
      OWUI_STATE (optional) selects the private state directory.
    env:
      TASK_OWUI_STATE: '{{.OWUI_STATE}}'
    cmds:
      - >-
        if [ -n "${TASK_OWUI_STATE:-}" ]; then export OWUI_STATE="$TASK_OWUI_STATE"; fi;
        sh scripts/openwebui/dev.sh up

  openwebui:dev-dry-run:
    desc: Validate the dev environment without docker or a cluster
    summary: |
      `sh scripts/openwebui/dev.sh --dry-run up`: tools, pins, chart render,
      manifests, ports, memory and the lock. Run it with an isolated OWUI_STATE.
    env:
      TASK_OWUI_STATE: '{{.OWUI_STATE}}'
    cmds:
      - >-
        if [ -n "${TASK_OWUI_STATE:-}" ]; then export OWUI_STATE="$TASK_OWUI_STATE"; fi;
        sh scripts/openwebui/dev.sh --dry-run up

  openwebui:dev-down:
    desc: Delete only the dev cluster this tooling created
    summary: |
      `sh scripts/openwebui/dev.sh down`: deletes the Kind cluster only when the
      state directory records its node.
    env:
      TASK_OWUI_STATE: '{{.OWUI_STATE}}'
    cmds:
      - >-
        if [ -n "${TASK_OWUI_STATE:-}" ]; then export OWUI_STATE="$TASK_OWUI_STATE"; fi;
        sh scripts/openwebui/dev.sh down

  workspace:isolation-kind:
    desc: Workspace isolation proof on a throwaway Kind cluster (heavy; ISO_STATE required)
    summary: |
      `sh scripts/ci/workspace_isolation_kind.sh`, the CI lane kind-workspace-isolation
      (.github/workflows/workspace-isolation.yml): the proof must be proven, fail on
      two negative controls, then be proven again. Needs docker, kind, kubectl, the
      scripts/tools/oc-pin.txt oc and Python 3.14 (KIND_BIN, KUBECTL, OC, PYTHON pick
      them). ISO_STATE names an empty state directory; ISO_CLUSTER names the new
      cluster. On a shared host take the heavy-work lock first.
    env:
      TASK_ISO_STATE: '{{.ISO_STATE}}'
    cmds:
      - >-
        if [ -n "${TASK_ISO_STATE:-}" ]; then export ISO_STATE="$TASK_ISO_STATE"; fi;
        sh scripts/ci/workspace_isolation_kind.sh

  openwebui:acceptance:
    desc: Acceptance suite against an existing Kind lane (KIND_NAME, APP_NS, OWUI_STATE required)
    summary: |
      `sh scripts/openwebui/acceptance.sh deploy`, then `run`, against a Kind
      lane whose images were loaded (`acceptance.sh images`). KIND_NAME, APP_NS
      and OWUI_STATE have no defaults; the script refuses without them.
    env:
      TASK_KIND_NAME: '{{.KIND_NAME}}'
      TASK_APP_NS: '{{.APP_NS}}'
      TASK_OWUI_STATE: '{{.OWUI_STATE}}'
    cmds:
      - >-
        if [ -n "${TASK_KIND_NAME:-}" ]; then export KIND_NAME="$TASK_KIND_NAME"; fi;
        if [ -n "${TASK_APP_NS:-}" ]; then export APP_NS="$TASK_APP_NS"; fi;
        if [ -n "${TASK_OWUI_STATE:-}" ]; then export OWUI_STATE="$TASK_OWUI_STATE"; fi;
        sh scripts/openwebui/acceptance.sh deploy &&
        sh scripts/openwebui/acceptance.sh run
