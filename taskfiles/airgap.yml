      TASK_SNEAKERNET_TRUSTED_PUB: '{{.SNEAKERNET_TRUSTED_PUB}}'
      TASK_STORAGE_CLASS: '{{.STORAGE_CLASS}}'
      TASK_UI_ENABLED: '{{.UI_ENABLED}}'
      TASK_VLLM_BASE_URL: '{{.VLLM_BASE_URL}}'
    cmds:
      - >-
        for _k in $TASK_OP_KEYS; do
          eval "export ${_k}=\"\${TASK_${_k}:-}\"";
        done;
        sh scripts/airgap/pipeline.sh

  dryrun:
    desc: Execute the real hermetic pipeline validation (not a preview)
    summary: |
      The fixed dry-run stand-ins plus `sh scripts/airgap/pipeline.sh
      --dry-run`, replacing the retired `make airgap-dryrun`. This EXECUTES the
      validation/rendering path; `task --dry` (command preview) is not
      acceptance evidence. Stand-ins win over caller and file values, same
      as the Make recipe environment.
    cmds:
      - AIRGAP_DRYRUN=1 IMAGE_SHA="$(git rev-parse HEAD 2>/dev/null || echo "0000000000000000000000000000000000000000")" INTERNAL_REGISTRY=registry.example.internal/mainframe-rag NAMESPACE=mainframe-rag STORAGE_CLASS=gp3-csi EMBED_MODEL=ibm-granite/granite-embedding-278m-multilingual DENSE_DIM=768 EMBED_MODEL_REVISION=dryrun-rev-1 VLLM_BASE_URL=http://vllm.inference.svc.cluster.local:8000/v1 CORPUS_PVC=corpus-pvc sh scripts/airgap/pipeline.sh --dry-run
