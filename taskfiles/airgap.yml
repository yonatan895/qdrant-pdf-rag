  pack:
    desc: Build the signed sneakernet bundle (connected host only)
    summary: |
      `sh scripts/airgap/pack.sh`, replacing the retired `make airgap-pack`. Needs
      IMAGE_SHA (must equal git HEAD) and the signing key in the caller
      environment. Connected image factory only; the gap never builds.
