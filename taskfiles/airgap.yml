# Air-gap tasks — issue #402 increment B4.
#
# Thin wrappers only: every stage keeps its validation, sequencing, retry and
# structured-error logic in scripts/airgap/*.sh (pipeline.sh owns the
# validate -> load -> deploy -> ingest -> smoke order; Task never
# reconstructs it as a dependency graph). The supported `sh
# scripts/airgap/<stage>.sh` entry points stay for troubleshooting.
#
# Operator settings flow exactly like Make: every documented operator key is
# bridged per task under a TASK_ prefix and delivered at the quoted command
# boundary, so explicit Task CLI overrides (`task airgap:deploy NAMESPACE=x`)
# and ambient environment variables (`NAMESPACE=x task airgap:deploy`) both
# reach common.sh with correct CLI-over-ambient precedence, while empty stays
# unset. There is deliberately no root dotenv and no default for any operator
# key here. The bridge set of every task must equal OPERATOR_ENV_KEYS in
# scripts/airgap/common.sh (pinned by contract test).
# Included with `dir: .` from the root Taskfile: always runs at repo root.
version: '3'

tasks:
  pack:
    desc: Build the signed sneakernet bundle (connected host only)
    summary: |
      `sh scripts/airgap/pack.sh`, replacing the retired `make airgap-pack`. Needs
      IMAGE_SHA (must equal git HEAD) and the signing key in the caller
      environment. Connected image factory only; the gap never builds.
    env:
      TASK_OP_KEYS: "AGENT_ROUTE AIRGAP_APP_REGISTRY AIRGAP_BUNDLE_DIR AIRGAP_DRYRUN AIRGAP_ENV AIRGAP_WORKSPACE CONTEXTUAL_EMBED_ENABLED CONTEXT_LLM_BASE_URL CONTEXT_LLM_MODEL CORPUS_PVC DENSE_DIM EMBED_BASE_URL EMBED_MODE EMBED_MODEL EMBED_MODEL_REVISION GATEWAY_API_KEY_SECRET GATEWAY_CA_CONFIGMAP GHCR_OWNER IMAGE_SHA INGEST_ALIAS_PUBLISH INGEST_EXTRA_PATCH INGEST_REINGEST INGEST_RETIRE_DOCS INGEST_TIMEOUT INGEST_WORKERS INGEST_WORK_SIZE INSECURE_REGISTRY INTERNAL_REGISTRY JAEGER_QUERY_URL KC LLM_BASE_URL LLM_MODEL_REASONING CHAT_CONDENSE_ENABLED METRICS_ENABLED NAMESPACE OPENSHIFT_NAMESPACE OTEL_DEPLOYMENT_ENVIRONMENT OTEL_EXPORTER_OTLP_ENDPOINT OTEL_SERVICE_NAME PULL_SECRET QDRANT_EXTRA_VALUES QDRANT_IMAGE QDRANT_RELEASE QDRANT_PEER_URLS QDRANT_REPLICATION_FACTOR QDRANT_SHARD_NUMBER QDRANT_STORAGE_SIZE QDRANT_TAG QDRANT_WRITE_CONSISTENCY_FACTOR QUERY REGISTRY_INTERNAL RERANK_BASE_URL RERANK_ENABLED RERANK_ENDPOINT_ORDER RERANK_MODEL SKOPEO_ARGS SNAPSHOT_STORAGE_CLASS SNEAKERNET_KEY_TRUSTED SNEAKERNET_SIGNING_KEY SNEAKERNET_TRUSTED_PUB AIRGAP_TASK_ARCHIVE STORAGE_CLASS UI_ENABLED VLLM_BASE_URL"
