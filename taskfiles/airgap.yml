    cmds:
      - >-
        for _k in $TASK_OP_KEYS; do
          eval "export ${_k}=\"\${TASK_${_k}:-}\"";
        done;
        sh scripts/airgap/pack.sh

  load:
    desc: Load bundle images into the cluster registry
    summary: |
      `sh scripts/airgap/load.sh`, replacing the retired `make airgap-load`. Follows
      ARTDIR discovery for the unpacked bundle.
    env: *operator_env
    cmds:
      - >-
        for _k in $TASK_OP_KEYS; do
          eval "export ${_k}=\"\${TASK_${_k}:-}\"";
        done;
        sh scripts/airgap/load.sh

  deploy:
    desc: Deploy the application over the loaded images
    summary: |
      `sh scripts/airgap/deploy.sh`, replacing the retired `make airgap-deploy`.
      Renders with explicit caller values winning over the env file; see the
      module header for the precedence rule.
    env: *operator_env
    cmds:
      - >-
        for _k in $TASK_OP_KEYS; do
          eval "export ${_k}=\"\${TASK_${_k}:-}\"";
        done;
        sh scripts/airgap/deploy.sh

  ingest:
    desc: Ingest the corpus through the deployed pipeline
    summary: |
      `sh scripts/airgap/ingest.sh`, replacing the retired `make airgap-ingest`.
      Needs CORPUS_PVC pointing at the prepared claim.
    env: *operator_env
    cmds:
      - >-
        for _k in $TASK_OP_KEYS; do
          eval "export ${_k}=\"\${TASK_${_k}:-}\"";
        done;
        sh scripts/airgap/ingest.sh

  smoke:
    desc: Smoke the deployed search path with a literal query
    summary: |
      `sh scripts/airgap/smoke.sh`, replacing the retired `make airgap-smoke`.
      QUERY arrives as the script's quoted value; run ingest first.
    env: *operator_env
    cmds:
      - >-
        for _k in $TASK_OP_KEYS; do
          eval "export ${_k}=\"\${TASK_${_k}:-}\"";
        done;
        sh scripts/airgap/smoke.sh

  validate:
    desc: Validate bundle, workspace and configuration without mutating
    summary: |
      `sh scripts/airgap/validate.sh`, replacing the retired `make airgap-validate`.
      With AIRGAP_DRYRUN=1 it renders against stand-ins; without it, it
      checks the real workspace. Prints the next step on success.
    env: *operator_env
    cmds:
      - >-
        for _k in $TASK_OP_KEYS; do
          eval "export ${_k}=\"\${TASK_${_k}:-}\"";
        done;
        sh scripts/airgap/validate.sh

  pipeline:
    desc: 'Run the full air-gap pipeline in stage order (owner: pipeline.sh)'
    summary: |
      `sh scripts/airgap/pipeline.sh`, replacing the retired `make airgap-pipeline`.
      The script owns stage order and skipping; this task only forwards the
      operator environment. Not reconstructed as a Task dependency graph.
    env: *operator_env
    cmds:
      - >-
        for _k in $TASK_OP_KEYS; do
          eval "export ${_k}=\"\${TASK_${_k}:-}\"";
        done;
        sh scripts/airgap/pipeline.sh

  dryrun:
    desc: Execute the real hermetic pipeline validation (not a preview)
    summary: |
      The fixed dry-run stand-ins plus `sh scripts/airgap/pipeline.sh
      --dry-run`, replacing the retired `make airgap-dryrun`. This EXECUTES the
      validation/rendering path; `task --dry` (command preview) is not
      acceptance evidence. Stand-ins win over caller and file values, same
      as the Make recipe environment. Open WebUI renders at its default (on)
      from the fake site inputs of charts/mainframe-rag/ci/openwebui-site-values.yaml
      and its route CA fixture; a real site supplies its own.
    cmds:
      - AIRGAP_DRYRUN=1 IMAGE_SHA="$(git rev-parse HEAD 2>/dev/null || echo "0000000000000000000000000000000000000000")" INTERNAL_REGISTRY=registry.example.internal/mainframe-rag NAMESPACE=mainframe-rag STORAGE_CLASS=gp3-csi EMBED_MODEL=ibm-granite/granite-embedding-278m-multilingual DENSE_DIM=768 EMBED_MODEL_REVISION=dryrun-rev-1 EMBED_BASE_URL=http://vllm.inference.svc.cluster.local:8000/v1 CORPUS_PVC=corpus-pvc OPENWEBUI_ENABLED=true OPENWEBUI_SECRET=owui-test-secrets OPENWEBUI_HOST=docs.example.invalid OPENWEBUI_OIDC_PROVIDER_URL=https://idp.example.invalid/.well-known/openid-configuration OPENWEBUI_OIDC_CLIENT_ID=test-client OPENWEBUI_OIDC_ALLOWED_ROLES=test-users OPENWEBUI_OIDC_ADMIN_ROLES=test-admins OPENWEBUI_IDP_EGRESS_CIDRS=192.0.2.0/24 ROUTE_DESTINATION_CA_FILE=charts/mainframe-rag/ci/openwebui-route-ca.pem sh scripts/airgap/pipeline.sh --dry-run

  retire-legacy:
    desc: Copy, retire or roll back the d53595e plain collection (issue #1070)
    summary: |
      `sh scripts/airgap/retire_legacy.sh --stage copy|retire --confirm mainframe_manuals [--space-verified] [--no-keep-ok]`,
      or `--rollback --confirm mainframe_manuals [--qdrant-url http://127.0.0.1:<port>]`. Pass flags after `--`
      (trusted operator shell arguments, as in qa:unit).
      Runbook: docs/install_and_ops.md#upgrade-from-a-legacy-flat-collection-issue-1070
    env: *operator_env
    cmds:
      - >-
        for _k in $TASK_OP_KEYS; do
          eval "export ${_k}=\"\${TASK_${_k}:-}\"";
        done;
        sh scripts/airgap/retire_legacy.sh {{.CLI_ARGS}}
