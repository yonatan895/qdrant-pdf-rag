# Development environment tasks — issue #402 increment A.
#
# `dev:setup` is the only task here that installs anything, and only when the
# caller explicitly requests it. `dev:doctor` is read-only diagnostics.
# Included with `dir: .` from the root Taskfile so commands always run at the
# repository root.
version: '3'

tasks:
  setup:
    desc: Create .venv and install locked development dependencies (connected)
    summary: |
      Explicit connected preparation of the complete dev/build/runtime wheel
      profile. PY defaults to python3; empty fails. Approved wheel bytes are
      cached in .tools/python-wheels/dev and verified before changing .venv.
      Status rechecks the complete installed inventory and editable source.
      Never invoked implicitly by verification. For offline setup invoke
      scripts/prepare_python.py --venv .venv --wheelhouse /approved/dev-wheels.
    status:
      - 'test -x .venv/bin/python && test -f .venv/.setup-complete'
      - '.venv/bin/python -I scripts/dependency_lock.py installed --profile dev --project'
    vars:
      PY: '{{if hasKey . "PY"}}{{.PY}}{{else}}python3{{end}}'
    env:
      TASK_PY: '{{.PY}}'
    cmds:
      - 'test ! -L .venv || { echo "refusing to prepare a symlink environment" >&2; exit 1; }'
      - 'rm -f .venv/.setup-complete'
      - '"$TASK_PY" scripts/prepare_python.py --venv .venv --wheelhouse .tools/python-wheels/dev --connected'
      - 'touch .venv/.setup-complete'

  doctor:
    desc: Diagnose tool prerequisites (read-only)
    summary: |
      Runs `scripts/agent_doctor.py` (default unit profile; `PROFILE=sim`
      adds Docker, `PROFILE=deploy` adds skopeo/tar/openssl/sha256sum
      plus oc-or-kubectl presence). Every profile verifies pinned Task/Helm
      bytes and CPython 3.14 GIL/no JIT. Inputs: PY (default python3), PROFILE
      (default unit). An explicit empty value is preserved and fails in the
      script rather than silently falling back; explicit false/zero-like
      strings pass through unchanged. Reads only: creates no environment,
      contacts no service (the script's --probe-docker socket read is only
      available via the script flag, not through this task).
    vars:
      PY: '{{if hasKey . "PY"}}{{.PY}}{{else}}python3{{end}}'
      PROFILE: '{{if hasKey . "PROFILE"}}{{.PROFILE}}{{else}}unit{{end}}'
    env:
      TASK_PY: '{{.PY}}'
      TASK_PROFILE: '{{.PROFILE}}'
    cmds:
      - '"$TASK_PY" scripts/agent_doctor.py --profile "$TASK_PROFILE"'

  demo-pdfs:
    desc: Generate the original synthetic demo PDFs (dev only)
    summary: |
      Two `scripts/make_synthetic_pdf.py` runs into output/demo-pdfs (one
      outline, one `--plain`), replacing the retired `make e2e-demo-pdfs`. Original
      synthetic documents only; never vendor material.
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - mkdir -p output/demo-pdfs
      - .venv/bin/python scripts/make_synthetic_pdf.py --out output/demo-pdfs/SA22-0000-00_outline.pdf
      - .venv/bin/python scripts/make_synthetic_pdf.py --plain --out output/demo-pdfs/plain-widget-notes.pdf

  clean:
    desc: Remove generated environments and outputs (bounded, never external)
    summary: |
      Removes `.venv`, test caches, the bundle dir, `output/`, and
      non-archive leftovers inside `dist/`, replacing the retired `make clean`. Bounded
      retention contract: `*.tar*` release archives in `dist/` are kept; the
      workspace-local Task install (`.tools/`), external corpora, signing
      keys and snapshots live outside these paths and are never touched.
      Input: BUNDLE_DIR (default bundles).
    vars:
      BUNDLE_DIR: '{{if hasKey . "BUNDLE_DIR"}}{{.BUNDLE_DIR}}{{else}}bundles{{end}}'
    env:
      TASK_BUNDLE_DIR: '{{.BUNDLE_DIR}}'
    cmds:
      - rm -rf .venv .pytest_cache .mypy_cache .ruff_cache "$TASK_BUNDLE_DIR" output
      - 'if [ -d dist ]; then find dist -mindepth 1 ! -name "*.tar*" -delete 2>/dev/null || true; rmdir dist 2>/dev/null || true; fi'
