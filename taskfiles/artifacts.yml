# Artifact tasks — issue #402 increment B1.
#
# Preparation/freshness belongs to dependency_lock.py and fetch_bm25_weights.py.
# Task transports inputs; owners verify content and publish completion records.
# Verification tasks never cache: they re-verify on request.
# Included with `dir: .` from the root Taskfile: always runs at repo root.
version: '3'

tasks:
  qdrant:
    desc: Explicitly acquire and verify the approved Qdrant image (connected)
    summary: |
      Pulls the images.txt repository digest into the selected Docker daemon,
      then verifies it and prints the immutable image ID. Does not start a
      server. Verification tasks never call this preparation automatically.
    cmds:
      - python3 scripts/qdrant_pin.py --prepare

  wheelhouse:
    desc: Build the offline pip wheelhouse from the lockfile (connected)
    summary: |
      Explicit connected acquisition of the complete runtime profile's approved
      wheel bytes; no resolver or source build. BUNDLE_DIR defaults to bundles.
      The Python preparation owner verifies lock identity, interpreter/platform and every wheel
      against the approved manifest. Missing/tampered members are reacquired
      only by this explicitly requested preparation task, never by verification.
    vars:
      BUNDLE_DIR: '{{if hasKey . "BUNDLE_DIR"}}{{.BUNDLE_DIR}}{{else}}bundles{{end}}'
      WHEELHOUSE: '{{.BUNDLE_DIR}}/wheelhouse'
    env:
      TASK_WHEELHOUSE: '{{.WHEELHOUSE}}'
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - .venv/bin/python scripts/dependency_lock.py prepare --profile runtime --directory "$TASK_WHEELHOUSE"

  bm25:
    desc: Fetch BM25 sparse weights verified against the sha256 manifest
    summary: |
      Runs the venv Python over `scripts/fetch_bm25_weights.py --model
      <model> --out <dir> --verify-manifest bm25-weights.sha256`, mirroring
      the retired `make bm25-weights` (upstream drift fails closed in the script).
      Inputs: BM25_MODEL (default Qdrant/bm25), BUNDLE_DIR (default bundles).
      The Python owner verifies pinned bytes on every preparation and stages
      acquisition before replacing an invalid cache. Verified bytes are reused;
      the owner records manifest/model/recipe identity after verification.
      Explicit preparation requires readers to be stopped. Connected host only.
    vars:
      BUNDLE_DIR: '{{if hasKey . "BUNDLE_DIR"}}{{.BUNDLE_DIR}}{{else}}bundles{{end}}'
      BM25_MODEL: '{{if hasKey . "BM25_MODEL"}}{{.BM25_MODEL}}{{else}}Qdrant/bm25{{end}}'
      BM25_WEIGHTS: '{{.BUNDLE_DIR}}/bm25-weights'
    env:
      TASK_BM25_WEIGHTS: '{{.BM25_WEIGHTS}}'
      TASK_BM25_MODEL: '{{.BM25_MODEL}}'
    cmds:
      - 'test -x .venv/bin/python || { echo "missing development environment: .venv/bin/python absent; run: task dev:setup (verification never installs)" >&2; exit 1; }'
      - .venv/bin/python scripts/fetch_bm25_weights.py --model "$TASK_BM25_MODEL" --out "$TASK_BM25_WEIGHTS" --verify-manifest bm25-weights.sha256

  chart-check:
    desc: Verify the vendored Qdrant chart archive is present
    summary: |
      Passes only when `charts/qdrant-*.tgz` exists (normal runs use the
      vendored chart), replacing the retired `make chart`. Always re-verifies on request;
      never cached. Fetching is `task artifacts:chart-fetch` (connected
      maintenance only, never an implicit prerequisite).
    cmds:
      - 'ls charts/qdrant-*.tgz >/dev/null 2>&1 || { echo "charts/qdrant-*.tgz missing; run: task artifacts:chart-fetch (connected host)" >&2; exit 1; }'

  chart-fetch:
    desc: Fetch the Qdrant Helm chart (connected maintenance only)
    summary: |
      Runs `helm pull qdrant/qdrant --destination charts`, mirroring
      the retired `make pull-chart`. Connected host only; never an implicit deploy
      prerequisite. Always runs on request (upstream may have moved).
    cmds:
      - mkdir -p charts
      - helm pull qdrant/qdrant --destination charts

  helm-render:
    desc: Render the Qdrant chart with placeholder overrides
    summary: |
      Runs `helm template` against the vendored chart with the fixed
      placeholder `--set` values and `charts/qdrant-openshift.values.yaml`,
      replacing the retired `make helm-template`. Verifies chart presence first.
    cmds:
      - task: chart-check
      - helm template qdrant charts/qdrant-*.tgz -f charts/qdrant-openshift.values.yaml --set image.repository=PLACEHOLDER_REGISTRY/qdrant/qdrant --set imagePullSecrets[0].name=PLACEHOLDER_PULL_SECRET --set persistence.storageClassName=PLACEHOLDER_STORAGE_CLASS --set snapshotPersistence.storageClassName=PLACEHOLDER_STORAGE_CLASS

  helm-lint:
    desc: Lint the Qdrant chart against the OpenShift values
    summary: |
      Runs `helm lint` against the vendored chart, mirroring
      the retired `make helm-lint`. Verifies chart presence first; always re-verifies.
    cmds:
      - task: chart-check
      - helm lint charts/qdrant-*.tgz -f charts/qdrant-openshift.values.yaml

  app-helm-lint:
    desc: Lint the first-party application chart (issue #448)
    summary: |
      Runs `helm lint` against charts/mainframe-rag, validating templates
      and values.schema.json against the checked-in defaults. Always
      re-verifies; no cluster, registry, or private config required.
    cmds:
      - helm lint charts/mainframe-rag

  app-helm-render:
    desc: Render the first-party application chart with defaults (issue #448)
    summary: |
      Runs `helm template` against charts/mainframe-rag with the checked-in
      defaults (steady-state: no Route, no Job). Rendering proof only;
      operator releases render from mapped release values via
      scripts/airgap/map_values.py (see airgap:dryrun). No cluster required.
    cmds:
      - helm template app charts/mainframe-rag --namespace mainframe-rag

  images:
    desc: Build ingest and agent images with wheelhouse/bm25 contexts (connected)
    summary: |
      Builds both Containerfiles with the named `wheelhouse`/`bm25`
      build contexts and `-t <name>:<tag>`, replacing the retired `make build-images`.
      Preparation runs first and sequentially (wheelhouse, then bm25),
      never as parallel deps sharing state. Inputs: IMAGE_TAG (default
      latest), INGEST_IMAGE_NAME, AGENT_IMAGE_NAME, BUNDLE_DIR, BM25_MODEL.
      Connected host only; the air gap never builds.
    vars:
      IMAGE_TAG: '{{if hasKey . "IMAGE_TAG"}}{{.IMAGE_TAG}}{{else}}latest{{end}}'
      INGEST_IMAGE_NAME: '{{if hasKey . "INGEST_IMAGE_NAME"}}{{.INGEST_IMAGE_NAME}}{{else}}mainframe-rag/ingest{{end}}'
      AGENT_IMAGE_NAME: '{{if hasKey . "AGENT_IMAGE_NAME"}}{{.AGENT_IMAGE_NAME}}{{else}}mainframe-rag/agent{{end}}'
      BUNDLE_DIR: '{{if hasKey . "BUNDLE_DIR"}}{{.BUNDLE_DIR}}{{else}}bundles{{end}}'
    env:
      TASK_IMAGE_TAG: '{{.IMAGE_TAG}}'
      TASK_INGEST_IMAGE_NAME: '{{.INGEST_IMAGE_NAME}}'
      TASK_AGENT_IMAGE_NAME: '{{.AGENT_IMAGE_NAME}}'
      TASK_BUNDLE_DIR: '{{.BUNDLE_DIR}}'
    cmds:
      - task: wheelhouse
      - task: bm25
      - docker build --build-context wheelhouse="$TASK_BUNDLE_DIR/wheelhouse" --build-context bm25="$TASK_BUNDLE_DIR/bm25-weights" -f images/Containerfile.ingest -t "$TASK_INGEST_IMAGE_NAME:$TASK_IMAGE_TAG" .
      - docker build --build-context wheelhouse="$TASK_BUNDLE_DIR/wheelhouse" --build-context bm25="$TASK_BUNDLE_DIR/bm25-weights" -f images/Containerfile.agent -t "$TASK_AGENT_IMAGE_NAME:$TASK_IMAGE_TAG" .
