# markdownlint-cli2 config (runs via DavidAnson/markdownlint-cli2-action in
# .github/workflows/markdown.yml — the only CI that runs on markdown-only PRs).
# Vendored third-party docs are excluded: upstream style is upstream's.
config:
  MD013: false            # line length — our docs wrap loosely
  MD033: false            # inline HTML allowed
  MD041: false            # first-line heading (templates start with lists)
  MD060: false            # compact |---| table separators are the house style
  MD040: false            # ASCII diagrams / illustrative fences have no language
globs:
  - "**/*.md"
ignores:
  - ".agents/**"          # vendored Qdrant skills
  - "vendor/**"           # pin records
  - ".venv/**"
  - "node_modules/**"
