# ==============================================================================
# GitLab CI — air-gap entrypoint (issue #3)
#
# This file is committed to the public GitHub mirror and imported AS-IS into the
# enterprise air-gapped GitLab (git bundle / sneaker-net), so a clone can run
# pipelines with no rewrite. Job meaning mirrors .github/workflows/ci.yml:
# hygiene, lint/types, the unit suite, hazards, the simulation tier and the L1
# gate (issue #370). Every job fails the pipeline on a non-zero exit: no
# allow_failure, no masked status, and unit/sim reports must contain no skipped
# or xfailed test (scripts/check_junit_clean.py). If you change one CI, change
# the other in the same PR (AGENTS.md); tests/test_ci_gitlab_parity.py pins the
# correspondence and the failure propagation. Intentional differences: GitLab
# shards the unit suite into 4 jobs (`parallel: 4`, GitHub uses 8) with the
# same tests/ci_shard.py layout for that count; branch pipelines select lanes
# through a dynamic child pipeline (below); jobs run on the `gate` and `wip`
# runner tags (ADR-0009 section 2); jobs run on the pinned dev workspace image
# (ADR-0009 section 8) and use its installed dev environment, Task and Helm in
# place (prepare_python.py --kit, scripts/devkit/link-tools.sh), where GitHub
# prepares them from wheels and archives; and the simulation tier runs against
# the mirrored Qdrant service without tests/test_qdrant_auth.py and
# tests/test_openwebui_proxy_nginx.py, which drive a local Docker daemon.
# Each job's timeout is at most its GitHub counterpart's timeout-minutes scaled
# by the parallelism GitLab lacks (unit 8 to 4 shards, sim 3 to 1 process,
# hazards 4 to 1 worker). The runner runs job scripts with bash (errexit,
# pipefail) and the kit's `sh` is bash in POSIX mode, where GitHub's is dash;
# the parity test runs the job steps and the scripts they start under both.
#
# GitHub product CI ignores markdown-only changes; agent-context.yml checks
# relevant docs/instructions separately. GitLab keeps local hygiene/context checks
# on every pipeline; no deployment or external access is added.
#
# Pipelines (issue #808, ADR-0009 section 2, GH#1118 F11):
#   merge request and tag pipelines run every lane (hygiene, lint, test x4,
#   hazards, sim, gate-l1) directly, on the runner tag `gate` (one slot),
#   except that a draft merge request pipeline ($CI_MERGE_REQUEST_DRAFT ==
#   "true") runs on `wip`, so agent work never queues ahead of a merge gate.
#   A draft still runs every lane with no selection: marking a merge request
#   ready does not start a new pipeline, so the draft's pipeline may be the
#   one a merge rests on, and #808 forbids a partial one.
#   CI_MERGE_REQUEST_DRAFT needs GitLab >= 17.10 (GitLab's predefined-variable
#   reference); the 16.10 minimum stated for auto_cancel below does not cover
#   it. On an older GitLab the variable is unset, so every merge request
#   pipeline, draft or ready, runs on `gate`: it fails toward the gate, never
#   toward fewer lanes, and only the queue split is lost.
#   A release is built from an immutable tag, so the hygiene job refuses a tag
#   pipeline whose ref is not protected (protect the release tag pattern in
#   Settings > Repository > Protected tags, with creation limited to release
#   owners; a protected tag cannot be moved or deleted by developers).
#   branch pipelines run on `wip` (three slots). The `select` job runs the
#   fail-closed classifier `scripts/review_tooling.py profile` on the branch's
#   diff from its merge base with the default branch, as GitHub does;
#   scripts/gitlab_lanes.py turns its lanes into a child pipeline that holds
#   hygiene plus exactly the selected lane jobs, and `lanes` runs it. An
#   unmapped or unreadable change, or a change to this file, the generator or
#   the JUnit gate, selects every lane. A lane with no job here (packaging,
#   load, HA, HTTP probes, semantic eval) is not run by any GitLab pipeline.
#   A branch with an open merge request runs no branch pipeline: its merge
#   request pipeline is the only one, on `gate`, or on `wip` while a draft.
#   Set the variables below as project variables: a variable given only to one
#   pipeline (schedule, "Run pipeline", API) is not forwarded to the child
#   pipeline that runs a branch pipeline's lanes.
#   Every job is interruptible and a newer commit on the same ref cancels the
#   older pipeline (workflow:auto_cancel, GitLab >= 16.10, with "Auto-cancel
#   redundant pipelines" left on in Settings > CI/CD). Tag pipelines set
#   auto_cancel none: nothing cancels a release pipeline.
#
# GitLab admin setup (Settings > CI/CD > Variables) — names only, no secrets:
#   CI_APPROVED_REGISTRY (required) operator-approved registry path that holds every
#                                   job and service image, e.g. the Quay
#                                   organization for CI tooling. There is no
#                                   default: unset, job images do not resolve and
#                                   every job fails to start. It is deliberately
#                                   not derived from the GitLab registry.
#   CI_PYTHON_IMAGE  (optional)     leave unset. The default is the dev workspace
#                                   image (ADR-0009 §8) by the digest in
#                                   scripts/tools/devkit-pin.txt, at
#                                   "$CI_APPROVED_REGISTRY/qdrant-pdf-rag-devkit",
#                                   where scripts/devkit/install.sh puts it; so each
#                                   branch runs on the kit for its own dev lock. Its
#                                   installed dev environment, Task and Helm are
#                                   used in place; a Python job on any other image
#                                   fails.
#   CI_TASK_ARCHIVE (required for test, sim, hazards) path on the runner to the
#                                   approved pinned linux-amd64 Task release archive
#                                   (scripts/tools/task-pin.txt), for example the
#                                   release bundle's copy. The kit image holds the
#                                   Task binary only; the artifact tests and the
#                                   doctor read this archive.
#   CI_BM25_CACHE_DIR (required for sim) offline-prepared Qdrant/bm25 cache on the
#                                   runner, verified against bm25-weights.sha256
#                                   (artifacts:bm25 output); no download fallback.
#   CI_RUNNER_TAG   (optional)      one runner tag for every pipeline. Unset, ready
#                                   merge request and tag pipelines use `gate`, and
#                                   draft merge request and branch pipelines `wip`
#                                   (the two runner registrations
#                                   of ADR-0009 section 2). A project variable wins
#                                   over both: set it only on a single-runner site,
#                                   where it gives up the gate/wip split.
#   Retired (GH#1118 F5, docs/release-notes.md): CI_HELM_ARCHIVE is refused by
#   hygiene, since Helm comes from the kit image. PIP_FIND_LINKS and PIP_INDEX_URL
#   are no longer read: no job installs a package (the kit's environment is
#   already the dev lock, and prepare_python.py --kit installs only the checkout,
#   with --no-index and every PIP_* variable dropped).
#
# Air-gap contract: runners must not reach pypi.org, Docker Hub, or GitHub.
# Jobs FAIL CLOSED on any image other than the dev kit built for the checkout's
# dev lock, and on Task or Helm bytes other than their pins.
# Do not put internal registry hostnames, URLs, or tokens in this file or in git.
#
# The connected-path E2E (image build to GHCR + lab OpenShift smoke, issue #8)
# lives ONLY in .github/workflows/e2e.yml on public GitHub. Air-gap GitLab has
# no GHCR and no lab cluster access; a follow-up issue would add an
# internal-registry E2E if wanted. Do not add deploy jobs here.
# Same for the sneakernet path (issue #15): airgap-pack runs on a connected
# clone; airgap-load / airgap-deploy / airgap-ingest run by hand on the
# air-gap bastion (scripts/airgap/*.sh) — never as GitLab jobs.
# ==============================================================================

workflow:
  # GitLab >= 16.10. Cancels only interruptible jobs of an older pipeline on
  # the same ref; every job here is interruptible, and a branch pipeline's
  # child pipeline is cancelled with it.
  auto_cancel:
    on_new_commit: interruptible
  # First match wins. CI_RUNNER_TAG set here is a YAML variable, so a project
  # CI_RUNNER_TAG overrides it (see the admin setup above).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      variables:
        CI_RUNNER_TAG: "wip"
    # Draft merge requests: every lane, on wip (GitLab >= 17.10; see above).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"'
      variables:
        CI_RUNNER_TAG: "wip"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        CI_RUNNER_TAG: "gate"
    - if: '$CI_COMMIT_TAG'
      variables:
        CI_RUNNER_TAG: "gate"
      auto_cancel:
        on_new_commit: none
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      variables:
        CI_RUNNER_TAG: "wip"

stages: [hygiene, test]

variables:
  # CI_APPROVED_REGISTRY is operator-set and has no default here (see the admin
  # setup above). A project-level CI_PYTHON_IMAGE overrides this derived default
  # (YAML vars have the lowest precedence in GitLab). The digest is the one in
  # scripts/tools/devkit-pin.txt; tests/test_ci_gitlab_parity.py keeps them equal.
  CI_PYTHON_IMAGE: "$CI_APPROVED_REGISTRY/qdrant-pdf-rag-devkit@sha256:7d506221eea02df988d1cf702532016561dc13c09ece8a295054574c40f5b922"

default:
  image: $CI_PYTHON_IMAGE
  interruptible: true
  # Variable expansion in tags: requires GitLab >= 14.1. If jobs queue forever,
  # the tag did not expand: set the project variable CI_RUNNER_TAG to the
  # literal runner tag. Do not hardcode an internal hostname anywhere.
  tags: [$CI_RUNNER_TAG]

# The lane jobs below run directly in merge request and tag pipelines. A
# branch pipeline's child includes this file and re-enables only its selected
# lanes by replacing their rules (scripts/gitlab_lanes.py).
.gate-pipeline:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'

# Branch pipelines only; never inside the child pipeline that includes this file.
.wip-pipeline:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# Lane selection (branch pipelines). The merge base with the default branch
# makes the diff cumulative, so a cancelled earlier push never drops a change
# from selection. review_tooling.py is standard library only: no install.
select:
  timeout: 5m
  extends: .wip-pipeline
  stage: hygiene
  variables:
    GIT_DEPTH: "0"
  script:
    - git fetch --no-tags origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
    - BASE_SHA="$(git merge-base "refs/remotes/origin/${CI_DEFAULT_BRANCH}" "$CI_COMMIT_SHA")"
    - python scripts/review_tooling.py profile --base "$BASE_SHA" --head "$CI_COMMIT_SHA" --out lanes-manifest.json
    - python scripts/gitlab_lanes.py --manifest lanes-manifest.json --out lanes.yml
  artifacts:
    when: always
    paths: [lanes-manifest.json, lanes.yml]

# The child pipeline mirrors its status here (strategy: depend), so a failed
# lane fails the branch pipeline. YAML variables are not forwarded: the child
# reads this file's defaults and the project variables itself, so a project
# CI_PYTHON_IMAGE is never shadowed by a forwarded default.
lanes:
  extends: .wip-pipeline
  stage: test
  needs: [select]
  interruptible: true
  trigger:
    include:
      - artifact: lanes.yml
        job: select
    strategy: depend
    forward:
      yaml_variables: false

# Shared Python: the dev kit image (ADR-0009 §8) already holds the dev lock,
# installed and verified. prepare_python.py --kit refuses an image built for
# another dev lock, naming the kit to request, then layers a venv with only the
# checkout installed editable (no index, no wheel, no PIP_* variable).
.py-base:
  before_script:
    - |
      set -eu
      if [ ! -d /opt/devkit/locks ]; then
        echo "FAIL: the job image is not the dev kit image (no /opt/devkit/locks)." >&2
        echo "Leave the project variable CI_PYTHON_IMAGE unset so jobs run on the kit" >&2
        echo "that scripts/tools/devkit-pin.txt names (ADR-0009 section 8)." >&2
        exit 1
      fi
      python3 scripts/prepare_python.py --kit --venv "$CI_PROJECT_DIR/.venv"
    # The base image's BASH_ENV/ENV source its activate script in every bash
    # child, which would put the image interpreter back in front of the venv.
    - unset BASH_ENV ENV
    - export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"

hygiene:
  timeout: 5m
  extends: .gate-pipeline
  stage: hygiene
  script:
    - python3 scripts/check_agent_context.py
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ] && [ "${CI_COMMIT_REF_PROTECTED:-}" != "true" ]; then
        echo "FAIL: tag ${CI_COMMIT_TAG} is not a protected tag." >&2
        echo "A release pipeline is built only from an immutable (protected) tag." >&2
        exit 1
      fi
    # Retired runner input (GH#1118 F5; docs/release-notes.md): Helm comes from the
    # dev kit image now, so a leftover value is refused, never silently ignored.
    - |
      set -eu
      if [ -n "${CI_HELM_ARCHIVE:-}" ]; then
        echo "FAIL: CI_HELM_ARCHIVE is retired: Helm now comes from the dev kit job image" >&2
        echo "(sh scripts/devkit/link-tools.sh). Delete the CI_HELM_ARCHIVE project variable." >&2
        exit 1
      fi
    - |
      set -eu
      echo "Refusing committed binaries: .pdf / .pdx / .idx"
      if git ls-files | grep -Ei '\.(pdf|pdx|idx)$'; then
        echo "" >&2
        echo "FAIL: binaries are tracked in git. PDFs and Adobe catalogs (.pdx/.idx)" >&2
        echo "must never be committed (copyright + enterprise boundary, AGENTS.md)." >&2
        echo "Remove them from the tree and history; tests generate synthetic PDFs" >&2
        echo "at runtime via scripts/make_synthetic_pdf.py." >&2
        exit 1
      fi

# Unit suite in 4 shards (ADR-0009 section 2). tests/ci_shard.py partitions
# the eligible collection with the duration-balanced layout GitHub uses
# (scripts/unit_evidence.py select_nodes; GitHub runs it with 8). Each shard is
# its own job with its own clean-JUnit gate, and any failing shard fails the
# pipeline. `python -m pytest` puts the checkout on sys.path for the plugin,
# as GitHub's shard producer does.
test:
  timeout: 30m
  extends: [.py-base, .gate-pipeline]
  stage: test
  parallel: 4
  variables:
    TASK_CONTRACTS_REQUIRE_RUNNER: "1"
  script:
    - ': "${CI_TASK_ARCHIVE:?mount the approved pinned Task archive on the runner}"'
    - sh scripts/devkit/link-tools.sh --task-archive "$CI_TASK_ARCHIVE"
    - export PATH="$CI_PROJECT_DIR/.tools/bin:$PATH"
    - python scripts/agent_doctor.py --python "$(command -v python)"
    - rm -f unit-junit.xml
    # Plugins as GitHub's unit producer (scripts/unit_evidence.py) loads them. A
    # project variable outranks a YAML one, so the script turns autoloading off.
    - |
      if [ -n "${PYTEST_ADDOPTS:-}" ] || [ -n "${PYTEST_PLUGINS:-}" ]; then
        echo "FAIL: PYTEST_ADDOPTS or PYTEST_PLUGINS is set; the unit lane takes neither." >&2
        echo "Delete that project or pipeline variable (GitHub's unit producer refuses both)." >&2
        exit 1
      fi
    - export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
    - python -m pytest -q -p anyio.pytest_plugin -p tests.ci_shard --unit-shard="$CI_NODE_INDEX" --unit-shards="$CI_NODE_TOTAL" --unit-durations=tests/unit-durations.json --junitxml=unit-junit.xml
    # pytest's exit status alone lets skipped/xfailed tests pass; GitHub rejects
    # them per shard, and so does each shard here.
    - python scripts/check_junit_clean.py unit-junit.xml
  # Tests generate synthetic PDFs at runtime; the only artifact is the JUnit
  # report (test ids and outcomes, no corpus).
  artifacts:
    when: always
    paths: [unit-junit.xml]
    reports:
      junit: unit-junit.xml

hazards:
  timeout: 40m
  extends: [.py-base, .gate-pipeline]
  stage: test
  script:
    - ': "${CI_TASK_ARCHIVE:?mount the approved pinned Task archive on the runner}"'
    - sh scripts/devkit/link-tools.sh --task-archive "$CI_TASK_ARCHIVE"
    - sh scripts/tools/run-task.sh qa:hazards PY="$(command -v python)" OUT="$CI_PROJECT_DIR/dist/critical-hazards"
  artifacts:
    when: always
    paths: [dist/critical-hazards/]

# Simulation tier (issue #370): real ingest into a real Qdrant. GitHub starts the
# approved image with local Docker; offline GitLab reuses the same digest as a
# mirrored service (as gate-l1 does). tests/test_qdrant_auth.py and
# tests/test_openwebui_proxy_nginx.py (real pinned nginx, #1118 A5) are excluded
# because they drive a local Docker daemon, which this runner does not provide.
# Fail-closed like GitHub: any skipped/xfailed test, zero executed tests or a
# missing BM25 cache fails the job.
sim:
  timeout: 40m
  extends: [.py-base, .gate-pipeline]
  stage: test
  services:
    - name: ${CI_APPROVED_REGISTRY}/qdrant/qdrant@sha256:efb96a9425a90d2d5a1a0a474156280df1892dcdf1af3e8515bd2589b1bfd88b
      alias: qdrant
  variables:
    QDRANT_SIM_URL: "http://qdrant:6333"
    TASK_CONTRACTS_REQUIRE_RUNNER: "1"
  script:
    - ': "${CI_TASK_ARCHIVE:?mount the approved pinned Task archive on the runner}"'
    - sh scripts/devkit/link-tools.sh --task-archive "$CI_TASK_ARCHIVE"
    - export PATH="$CI_PROJECT_DIR/.tools/bin:$PATH"
    - ': "${CI_BM25_CACHE_DIR:?mount the offline-prepared BM25 cache on the runner}"'
    - export SIM_BM25_CACHE_DIR="$CI_BM25_CACHE_DIR"
    - python scripts/fetch_bm25_weights.py --out "$SIM_BM25_CACHE_DIR" --verify-manifest bm25-weights.sha256 --verify-only
    - python scripts/agent_doctor.py --python "$(command -v python)"
    - rm -f sim-junit.xml
    - python -m pytest -m integration --ignore=tests/test_load_tier.py --ignore=tests/test_ha_cluster.py --ignore=tests/test_qdrant_auth.py --ignore=tests/test_openwebui_proxy_nginx.py -v -rs --junitxml=sim-junit.xml
    - python scripts/check_junit_clean.py sim-junit.xml
  artifacts:
    when: always
    paths: [sim-junit.xml]
    reports:
      junit: sim-junit.xml

gate-l1:
  timeout: 15m
  extends: [.py-base, .gate-pipeline]
  stage: test
  services:
    # Mirror the existing approved images.txt bytes; a mutable tag is insufficient.
    - name: ${CI_APPROVED_REGISTRY}/qdrant/qdrant@sha256:efb96a9425a90d2d5a1a0a474156280df1892dcdf1af3e8515bd2589b1bfd88b
      alias: qdrant
  variables:
    QDRANT_SIM_URL: "http://qdrant:6333"
  script:
    - python scripts/gate_l1.py --out eval-report.json --summary eval-summary.md --delta eval-delta.md
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -n "${GITLAB_TOKEN:-}" ]; then
        # Append an attributable run record; a marker never grants ownership
        # of an existing note. Missing target identity remains explicit.
        NOTE_BODY="<!-- gate-l1-report -->
        Historical L1 report; not merge approval.
        Head: ${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-${CI_COMMIT_SHA}}
        Target: ${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-unavailable}
        Diff base: ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-unavailable}
        Execution: ${CI_COMMIT_SHA}
        Pipeline: ${CI_PIPELINE_ID}
        Job: ${CI_JOB_URL}
        $(cat eval-delta.md)"
        curl -s -f -X POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          --form-string "body=${NOTE_BODY}" || echo "warn: unable to post MR note"
      fi
  artifacts:
    when: always
    paths:
      - eval-report.json
      - eval-summary.md
      - eval-delta.md

# Deterministic lint and typechecking gate (issues #370, #413): the same three
# commands, in the same order, as the GitHub `lint` job (pinned by
# tests/test_ci_gitlab_parity.py). The ruleset itself is not changed here.
lint:
  timeout: 10m
  extends: [.py-base, .gate-pipeline]
  stage: hygiene
  script:
    - ruff check src tests scripts/eval_retrieval.py scripts/review_tooling.py scripts/ci_evidence.py scripts/acceptance_evidence.py scripts/devkit_key.py scripts/devkit/isolation_proof.py scripts/devkit/issue_snapshot.py scripts/extension_surface.py scripts/gitlab_lanes.py scripts/release_archive.py scripts/gap/ci_status.py
    - mypy src
    - mypy --follow-imports=silent scripts/eval_retrieval.py scripts/review_tooling.py scripts/ci_evidence.py scripts/acceptance_evidence.py scripts/devkit_key.py scripts/devkit/isolation_proof.py scripts/devkit/issue_snapshot.py scripts/extension_surface.py scripts/gitlab_lanes.py scripts/release_archive.py scripts/gap/ci_status.py
