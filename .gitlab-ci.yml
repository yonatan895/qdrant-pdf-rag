# ==============================================================================
# GitLab CI — air-gap entrypoint (issue #3)
#
# This file is committed to the public GitHub mirror and imported AS-IS into the
# enterprise air-gapped GitLab (git bundle / sneaker-net), so a clone can run
# pipelines with no rewrite. Job meaning mirrors .github/workflows/ci.yml:
# refuse committed binaries, then pytest. If you change one CI, change the
# other in the same PR (AGENTS.md).
#
# Trigger difference (deliberate): on GitHub, markdown-only changes run no
# checks at all (no lint workflow exists; ci.yml/e2e.yml paths-ignore *.md)
# and skip the jobs here; GitLab has no markdownlint, so these jobs run on
# every MR — fine, they are cheap and the hygiene gate must never silently
# skip.
#
# GitLab admin setup (Settings > CI/CD > Variables) — names only, no secrets:
#   CI_PYTHON_IMAGE  (recommended)  mirrored UBI/Python 3.14 image (issue #5:
#                                   3.14 GIL, no 3.14t), e.g.
#                                   "${CI_REGISTRY}/ci/python:3.14". The default
#                                   below is a placeholder for that mirror; the
#                                   image must contain git, python3, pip.
#   CI_RUNNER_TAG   (optional)      runner tag, default "airgap"
#   PIP_FIND_LINKS  (recommended)   path to a wheelhouse directory on the runner
#                                   (e.g. /wheelhouse) built from requirements.lock.txt
#   PIP_INDEX_URL   (alternative)   internal PyPI-compatible index
#
# Air-gap contract: runners must not reach pypi.org, Docker Hub, or GitHub.
# If neither PIP_FIND_LINKS nor PIP_INDEX_URL is set, jobs FAIL CLOSED.
# Do not put internal registry hostnames, URLs, or tokens in this file or in git.
#
# The connected-path E2E (image build to GHCR + lab OpenShift smoke, issue #8)
# lives ONLY in .github/workflows/e2e.yml on public GitHub. Air-gap GitLab has
# no GHCR and no lab cluster access; a follow-up issue would add an
# internal-registry E2E if wanted. Do not add deploy jobs here.
# Same for the sneakernet path (issue #15): airgap-pack runs on a connected
# clone; airgap-load / airgap-deploy / airgap-ingest run by hand on the
# air-gap bastion (scripts/airgap/*.sh) — never as GitLab jobs.
# ==============================================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages: [hygiene, test]

variables:
  # Placeholder default; overridden by the project-level CI_PYTHON_IMAGE
  # variable pointing at the mirrored internal image (YAML vars have the
  # lowest precedence in GitLab).
  CI_PYTHON_IMAGE: "$CI_REGISTRY/ci/python:3.14"
  CI_RUNNER_TAG: "airgap"

default:
  image: $CI_PYTHON_IMAGE
  # Variable expansion in tags: requires GitLab >= 14.1 (standard support at
  # time of writing). If jobs queue forever on the air-gap runner, the tag did
  # not expand: pin the literal runner tag here as a documented fallback
  # (e.g. tags: [airgap]). Do not hardcode an internal hostname anywhere.
  tags: [$CI_RUNNER_TAG]

# Shared install: wheelhouse first, then internal index, else fail closed.
# Never install from the default (public) index: the container must not be
# able to reach pypi.org, and if it could, we still refuse to depend on it.
.py-base:
  before_script:
    - |
      set -eu
      if [ -n "${PIP_FIND_LINKS:-}" ]; then
        echo "Installing pinned deps from wheelhouse: ${PIP_FIND_LINKS}"
        pip install --no-cache-dir --no-index --find-links "${PIP_FIND_LINKS}" \
          -r requirements.lock.txt -e ".[dev]"
      elif [ -n "${PIP_INDEX_URL:-}" ]; then
        echo "Installing pinned deps from internal index (PIP_INDEX_URL)"
        pip install --no-cache-dir --index-url "${PIP_INDEX_URL}" \
          -r requirements.lock.txt -e ".[dev]"
      else
        echo "FAIL: no package source configured." >&2
        echo "Set PIP_FIND_LINKS (wheelhouse path) or PIP_INDEX_URL (internal mirror)" >&2
        echo "as project CI/CD variables. This pipeline never installs from pypi.org." >&2
        exit 1
      fi

hygiene:
  stage: hygiene
  script:
    - |
      set -eu
      echo "Refusing committed binaries: .pdf / .pdx / .idx"
      if git ls-files | grep -Ei '\.(pdf|pdx|idx)$'; then
        echo "" >&2
        echo "FAIL: binaries are tracked in git. PDFs and Adobe catalogs (.pdx/.idx)" >&2
        echo "must never be committed (copyright + enterprise boundary, AGENTS.md)." >&2
        echo "Remove them from the tree and history; tests generate synthetic PDFs" >&2
        echo "at runtime via scripts/make_synthetic_pdf.py." >&2
        exit 1
      fi

test:
  extends: .py-base
  stage: test
  script:
    - pytest -q
  # Tests generate synthetic PDFs at runtime; no artifacts are cached or
  # uploaded anywhere (deliberately no artifacts: section).

gate-l1:
  extends: .py-base
  stage: test
  services:
    - name: ${CI_REGISTRY}/qdrant/qdrant:v1.19.0-unprivileged
      alias: qdrant
  variables:
    QDRANT_SIM_URL: "http://qdrant:6333"
  script:
    - python scripts/gate_l1.py --out eval-report.json --summary eval-summary.md --delta eval-delta.md
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -n "${GITLAB_TOKEN:-}" ]; then
        echo "Posting or updating delta table note on MR ${CI_MERGE_REQUEST_IID}..."
        HEADER="<!-- gate-l1-report -->"
        NOTE_BODY="${HEADER}
$(cat eval-delta.md)"
        EXISTING_NOTE_ID=$(curl -s -f -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes?per_page=100" | \
          python3 -c "import sys, json; notes = json.load(sys.stdin); match = [n['id'] for n in notes if '<!-- gate-l1-report -->' in n.get('body', '')]; print(match[0] if match else '')" 2>/dev/null || true)
        if [ -n "${EXISTING_NOTE_ID}" ]; then
          curl -s -f -X PUT "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/${EXISTING_NOTE_ID}" \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --form "body=${NOTE_BODY}" || echo "warn: unable to update MR note"
        else
          curl -s -f -X POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --form "body=${NOTE_BODY}" || echo "warn: unable to post MR note"
        fi
      fi
  artifacts:
    when: always
    paths:
      - eval-report.json
      - eval-summary.md
      - eval-delta.md

# lint is intentionally omitted (issue #3): ruff is a dev extra but is not in
# requirements.lock.txt, so a lint job would pull an unpinned package outside
# the lockfile. If ruff is ever pinned into the lock, add a `lint` job using
# the same .py-base install path.
