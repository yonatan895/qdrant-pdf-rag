# ==============================================================================
# GitLab CI — air-gap entrypoint (issue #3)
#
# This file is committed to the public GitHub mirror and imported AS-IS into the
# enterprise air-gapped GitLab (git bundle / sneaker-net), so a clone can run
# pipelines with no rewrite. Job meaning mirrors .github/workflows/ci.yml:
# hygiene, lint/types, the unit suite, hazards, the simulation tier and the L1
# gate (issue #370). Every job fails the pipeline on a non-zero exit: no
# allow_failure, no masked status, and unit/sim reports must contain no skipped
# or xfailed test (scripts/check_junit_clean.py). If you change one CI, change
# the other in the same PR (AGENTS.md); tests/test_ci_gitlab_parity.py pins the
# correspondence and the failure propagation. Intentional differences: GitLab
# runs the complete unit suite in one job (GitHub partitions it into four
# shards), runs every lane on every pipeline (no review_tooling lane
# selection), and runs the simulation tier against the mirrored Qdrant service
# without tests/test_qdrant_auth.py, which drives a local Docker daemon.
#
# GitHub product CI ignores markdown-only changes; agent-context.yml checks
# relevant docs/instructions separately. GitLab keeps local hygiene/context checks
# on every MR; no deployment or external access is added.
#
# GitLab admin setup (Settings > CI/CD > Variables) — names only, no secrets:
#   CI_PYTHON_IMAGE  (recommended)  mirrored UBI/Python 3.14 image (issue #5:
#                                   3.14 GIL, no 3.14t), e.g.
#                                   "${CI_REGISTRY}/ci/python:3.14". The default
#                                   below is a placeholder for that mirror; the
#                                   image must contain git, python3, pip, tar,
#                                   sha256sum and install.
#   CI_TASK_ARCHIVE (required for test) path to the approved pinned linux-amd64
#                                   Task release archive on the runner, transferred
#                                   offline (see scripts/tools/task-pin.txt).
#   CI_HELM_ARCHIVE (required for test) transferred checksum-pinned Helm archive
#                                   (scripts/tools/helm-pin.txt); no download fallback.
#   CI_BM25_CACHE_DIR (required for sim) offline-prepared Qdrant/bm25 cache on the
#                                   runner, verified against bm25-weights.sha256
#                                   (artifacts:bm25 output); no download fallback.
#   CI_RUNNER_TAG   (optional)      runner tag, default "airgap"
#   PIP_FIND_LINKS  (recommended)   path to a wheelhouse directory on the runner
#                                   (e.g. /wheelhouse) built from requirements.dev.lock.txt
#   PIP_INDEX_URL   (alternative)   internal HTTPS PyPI-compatible index; prepared
#                                   image must contain lock-qualified pip 26.2.1
#
# Air-gap contract: runners must not reach pypi.org, Docker Hub, or GitHub.
# If neither PIP_FIND_LINKS nor PIP_INDEX_URL is set, jobs FAIL CLOSED.
# Do not put internal registry hostnames, URLs, or tokens in this file or in git.
#
# The connected-path E2E (image build to GHCR + lab OpenShift smoke, issue #8)
# lives ONLY in .github/workflows/e2e.yml on public GitHub. Air-gap GitLab has
# no GHCR and no lab cluster access; a follow-up issue would add an
# internal-registry E2E if wanted. Do not add deploy jobs here.
# Same for the sneakernet path (issue #15): airgap-pack runs on a connected
# clone; airgap-load / airgap-deploy / airgap-ingest run by hand on the
# air-gap bastion (scripts/airgap/*.sh) — never as GitLab jobs.
# ==============================================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages: [hygiene, test]

variables:
  # Placeholder default; overridden by the project-level CI_PYTHON_IMAGE
  # variable pointing at the mirrored internal image (YAML vars have the
  # lowest precedence in GitLab).
  CI_PYTHON_IMAGE: "$CI_REGISTRY/ci/python:3.14"
  CI_RUNNER_TAG: "airgap"

default:
  image: $CI_PYTHON_IMAGE
  # Variable expansion in tags: requires GitLab >= 14.1 (standard support at
  # time of writing). If jobs queue forever on the air-gap runner, the tag did
  # not expand: pin the literal runner tag here as a documented fallback
  # (e.g. tags: [airgap]). Do not hardcode an internal hostname anywhere.
  tags: [$CI_RUNNER_TAG]

# Shared install: wheelhouse first, then internal index, else fail closed.
# Never install from the default (public) index: the container must not be
# able to reach pypi.org, and if it could, we still refuse to depend on it.
.py-base:
  before_script:
    - |
      set -eu
      if [ -n "${PIP_FIND_LINKS:-}" ]; then
        python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse "$PIP_FIND_LINKS"
      elif [ -n "${PIP_INDEX_URL:-}" ]; then
        python scripts/prepare_python.py --python "$(command -v python)" --wheelhouse .tools/python-wheels/dev --internal-index
      else
        echo "FAIL: no package source configured." >&2
        echo "Set PIP_FIND_LINKS (wheelhouse path) or PIP_INDEX_URL (internal mirror)" >&2
        echo "as project CI/CD variables. This pipeline never installs from pypi.org." >&2
        exit 1
      fi

hygiene:
  stage: hygiene
  script:
    - python3 scripts/check_agent_context.py
    - |
      set -eu
      echo "Refusing committed binaries: .pdf / .pdx / .idx"
      if git ls-files | grep -Ei '\.(pdf|pdx|idx)$'; then
        echo "" >&2
        echo "FAIL: binaries are tracked in git. PDFs and Adobe catalogs (.pdx/.idx)" >&2
        echo "must never be committed (copyright + enterprise boundary, AGENTS.md)." >&2
        echo "Remove them from the tree and history; tests generate synthetic PDFs" >&2
        echo "at runtime via scripts/make_synthetic_pdf.py." >&2
        exit 1
      fi

test:
  extends: .py-base
  stage: test
  variables:
    TASK_CONTRACTS_REQUIRE_RUNNER: "1"
  script:
    - ': "${CI_TASK_ARCHIVE:?mount the approved pinned Task archive on the runner}"'
    - sh scripts/tools/install-task.sh --archive "$CI_TASK_ARCHIVE"
    - ': "${CI_HELM_ARCHIVE:?mount the approved pinned Helm archive on the runner}"'
    - sh scripts/tools/install-helm.sh --archive "$CI_HELM_ARCHIVE"
    - export PATH="$CI_PROJECT_DIR/.tools/bin:$PATH"
    - python scripts/agent_doctor.py --python "$(command -v python)"
    - rm -f unit-junit.xml
    - pytest -q --junitxml=unit-junit.xml
    # pytest's exit status alone lets skipped/xfailed tests pass; GitHub rejects
    # them per shard, so this job rejects them for the complete suite.
    - python scripts/check_junit_clean.py unit-junit.xml
  # GitHub partitions the same eligible suite across four VMs. This offline
  # job keeps the complete suite (the union of those shards); no internal
  # runner-capacity change is needed. Tests generate synthetic PDFs at runtime;
  # the only artifact is the JUnit report (test ids and outcomes, no corpus).
  artifacts:
    when: always
    paths: [unit-junit.xml]
    reports:
      junit: unit-junit.xml

hazards:
  extends: .py-base
  stage: test
  script:
    - ': "${CI_TASK_ARCHIVE:?mount the approved pinned Task archive on the runner}"'
    - sh scripts/tools/install-task.sh --archive "$CI_TASK_ARCHIVE"
    - ': "${CI_HELM_ARCHIVE:?mount the approved pinned Helm archive on the runner}"'
    - sh scripts/tools/install-helm.sh --archive "$CI_HELM_ARCHIVE"
    - sh scripts/tools/run-task.sh qa:hazards PY="$(command -v python)" OUT="$CI_PROJECT_DIR/dist/critical-hazards"
  artifacts:
    when: always
    paths: [dist/critical-hazards/]

# Simulation tier (issue #370): real ingest into a real Qdrant. GitHub starts the
# approved image with local Docker; offline GitLab reuses the same digest as a
# mirrored service (as gate-l1 does). tests/test_qdrant_auth.py is excluded
# because it drives a local Docker daemon, which this runner does not provide.
# Fail-closed like GitHub: any skipped/xfailed test, zero executed tests or a
# missing BM25 cache fails the job.
sim:
  extends: .py-base
  stage: test
  services:
    - name: ${CI_REGISTRY}/qdrant/qdrant@sha256:a0e04fe623cb064502cd869cefc1dc7ce359d8edd481063b5bd351c0a0a2c91e
      alias: qdrant
  variables:
    QDRANT_SIM_URL: "http://qdrant:6333"
    TASK_CONTRACTS_REQUIRE_RUNNER: "1"
  script:
    - ': "${CI_TASK_ARCHIVE:?mount the approved pinned Task archive on the runner}"'
    - sh scripts/tools/install-task.sh --archive "$CI_TASK_ARCHIVE"
    - ': "${CI_HELM_ARCHIVE:?mount the approved pinned Helm archive on the runner}"'
    - sh scripts/tools/install-helm.sh --archive "$CI_HELM_ARCHIVE"
    - export PATH="$CI_PROJECT_DIR/.tools/bin:$PATH"
    - ': "${CI_BM25_CACHE_DIR:?mount the offline-prepared BM25 cache on the runner}"'
    - export SIM_BM25_CACHE_DIR="$CI_BM25_CACHE_DIR"
    - python scripts/fetch_bm25_weights.py --out "$SIM_BM25_CACHE_DIR" --verify-manifest bm25-weights.sha256 --verify-only
    - python scripts/agent_doctor.py --python "$(command -v python)"
    - rm -f sim-junit.xml
    - pytest -m integration --ignore=tests/test_load_tier.py --ignore=tests/test_ha_cluster.py --ignore=tests/test_qdrant_auth.py -v -rs --junitxml=sim-junit.xml
    - python scripts/check_junit_clean.py sim-junit.xml
  artifacts:
    when: always
    paths: [sim-junit.xml]
    reports:
      junit: sim-junit.xml

gate-l1:
  extends: .py-base
  stage: test
  services:
    # Mirror the existing approved images.txt bytes; a mutable tag is insufficient.
    - name: ${CI_REGISTRY}/qdrant/qdrant@sha256:a0e04fe623cb064502cd869cefc1dc7ce359d8edd481063b5bd351c0a0a2c91e
      alias: qdrant
  variables:
    QDRANT_SIM_URL: "http://qdrant:6333"
  script:
    - python scripts/gate_l1.py --out eval-report.json --summary eval-summary.md --delta eval-delta.md
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -n "${GITLAB_TOKEN:-}" ]; then
        # Append an attributable run record; a marker never grants ownership
        # of an existing note. Missing target identity remains explicit.
        NOTE_BODY="<!-- gate-l1-report -->
        Historical L1 report; not merge approval.
        Head: ${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-${CI_COMMIT_SHA}}
        Target: ${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-unavailable}
        Diff base: ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-unavailable}
        Execution: ${CI_COMMIT_SHA}
        Pipeline: ${CI_PIPELINE_ID}
        Job: ${CI_JOB_URL}
        $(cat eval-delta.md)"
        curl -s -f -X POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          --form-string "body=${NOTE_BODY}" || echo "warn: unable to post MR note"
      fi
  artifacts:
    when: always
    paths:
      - eval-report.json
      - eval-summary.md
      - eval-delta.md

# Deterministic lint and typechecking gate (issues #370, #413): the same three
# commands, in the same order, as the GitHub `lint` job (pinned by
# tests/test_ci_gitlab_parity.py). The ruleset itself is not changed here.
lint:
  extends: .py-base
  stage: hygiene
  script:
    - ruff check src tests scripts/eval_retrieval.py scripts/review_tooling.py scripts/ci_evidence.py scripts/acceptance_evidence.py
    - mypy src
    - mypy --follow-imports=silent scripts/eval_retrieval.py scripts/review_tooling.py scripts/ci_evidence.py scripts/acceptance_evidence.py
