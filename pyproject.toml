[project]
name = "mainframe-rag"
version = "0.1.0"
description = "Citation-first expert mainframe agent: Qdrant on OpenShift, PDF ingest, hybrid retrieval"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pymupdf",
    "qdrant-client",
    "fastembed",
    "httpx2",
    "fastapi",
    "jinja2",
    "python-multipart",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-prometheus",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: end-to-end tiers against a docker Qdrant server + loopback mocks (correctness via `sh scripts/tools/run-task.sh qa:sim`, load tier via `sh scripts/tools/run-task.sh qa:load`)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
ignore_missing_imports = true

# M1: strict checking for the narrowed core, without broadening legacy ignores.
[[tool.mypy.overrides]]
module = ["mainframe_rag.agent.answer_core", "mainframe_rag.agent.core_ports", "mainframe_rag.agent.model_adapter"]
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
warn_unused_ignores = true
