[project]
name = "mainframe-rag"
version = "0.1.0"
description = "Citation-first expert mainframe agent: Qdrant on OpenShift, PDF ingest, hybrid retrieval"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pymupdf",
    "qdrant-client",
    "fastembed",
    "httpx2",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: end-to-end simulation against a docker Qdrant server + loopback mocks (run via `make sim`)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
ignore_missing_imports = true
