[project]
name = "mainframe-rag"
version = "0.1.0"
description = "Citation-first expert mainframe agent: Qdrant on OpenShift, PDF ingest, hybrid retrieval"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pymupdf",
    "qdrant-client",
    "fastembed",
    "httpx2",
    "urllib3==2.8.0",
    "fastapi",
    "jinja2",
    "python-multipart",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-prometheus",
]

[project.scripts]
mainframe-rag-ops = "mainframe_rag.ops.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "ruff"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "browser: executed real-browser console contracts (issue #372); needs an offline Chrome for Testing + chromedriver and skips without one; run `pytest -m browser tests/console_browser_contracts.py`",
    "integration: end-to-end tiers against a docker Qdrant server + loopback mocks (correctness via `sh scripts/tools/run-task.sh qa:sim`, load tier via `sh scripts/tools/run-task.sh qa:load`)",
]

# Advisory branch coverage (#587), run only by `task qa:coverage` / coverage.yml.
# `source_pkgs` (not a path) because tests/conftest.py puts the worktree `src/`
# first on sys.path; importable-but-never-imported modules still report at 0%.
# No `omit`, no `fail_under`: nothing is silently excluded or gated.
[tool.coverage.run]
branch = true
source_pkgs = ["mainframe_rag"]
relative_files = true
# Trace python subprocesses the tests spawn (parallel data files, combined by
# pytest-cov / `coverage combine`); `patch` implies `parallel = true`.
patch = ["subprocess"]

[tool.coverage.report]
# Repository code only: tests copy the package to tmp dirs (e.g. Colab run
# snapshots) and subprocess tracing would otherwise count those copies.
include = ["src/mainframe_rag/*"]
precision = 1
sort = "Cover"
skip_covered = false
skip_empty = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Bastion scripts run on whatever python3 the site has (3.9+), not the project's
# 3.14. Without this, `ruff format` strips the parentheses from `except (A, B):`
# (PEP 758), which is a SyntaxError before 3.14.
[tool.ruff.per-file-target-version]
"scripts/openwebui/adfs_claims_check.py" = "py39"

[tool.ruff.lint]
# extend-select (not select) keeps the default rule set; see #584.
extend-select = ["B", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
# Rule module: its bytes are the extraction rules version (see
# tests/test_rules_version.py), so even a lint-only edit forces a corpus
# re-embed. Keep the unused enumerate index (B007) until chunk.py is next
# changed under an approved extraction concern, then drop this entry.
"src/mainframe_rag/ingest/chunk.py" = ["B007"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
ignore_missing_imports = true

# Strict ratchet (#584): modules listed here are --strict clean and must stay
# so. mypy's "strict = true" is global-only (inside an override it applies to
# every module), so the per-module-capable strict flags are spelled out.
# warn_redundant_casts and warn_unused_configs are global-only and cannot be
# set here. Add a module when it goes clean; never delete one to get green.
[[tool.mypy.overrides]]
module = [
    "mainframe_rag",
    "mainframe_rag.agent",
    "mainframe_rag.agent.admission",
    "mainframe_rag.agent.answer",
    "mainframe_rag.agent.answer_core",
    "mainframe_rag.agent.chat_turn",
    "mainframe_rag.agent.cites",
    "mainframe_rag.agent.core_ports",
    "mainframe_rag.agent.evidence",
    "mainframe_rag.agent.live_state",
    "mainframe_rag.agent.metrics",
    "mainframe_rag.agent.model_adapter",
    "mainframe_rag.agent.resources",
    "mainframe_rag.agent.serving",
    "mainframe_rag.agent.sse",
    "mainframe_rag.config",
    "mainframe_rag.eval",
    "mainframe_rag.eval.acceptance",
    "mainframe_rag.eval.answer_tier",
    "mainframe_rag.eval.datasets",
    "mainframe_rag.eval.load",
    "mainframe_rag.eval.performance",
    "mainframe_rag.eval.promotion",
    "mainframe_rag.eval.quality",
    "mainframe_rag.eval.statistics",
    "mainframe_rag.feedback",
    "mainframe_rag.feedback.client",
    "mainframe_rag.feedback.service",
    "mainframe_rag.feedback.store",
    "mainframe_rag.ingest",
    "mainframe_rag.ingest.bounds",
    "mainframe_rag.ingest.chrome",
    "mainframe_rag.ingest.chunk",
    "mainframe_rag.ingest.classify",
    "mainframe_rag.ingest.context",
    "mainframe_rag.ingest.identity",
    "mainframe_rag.ingest.inventory",
    "mainframe_rag.ingest.payload",
    "mainframe_rag.ingest.placement",
    "mainframe_rag.ingest.qdrant_io",
    "mainframe_rag.ingest.rules_version",
    "mainframe_rag.ingest.walk",
    "mainframe_rag.manifest",
    "mainframe_rag.mcp",
    "mainframe_rag.mcp.__main__",
    "mainframe_rag.ops",
    "mainframe_rag.ops.__main__",
    "mainframe_rag.ops.cli",
    "mainframe_rag.regexes",
    "mainframe_rag.retrieve",
    "mainframe_rag.retrieve.filters",
    "mainframe_rag.retrieve.rerank",
    "mainframe_rag.retrieve.rewrite",
    "mainframe_rag.retrieve.screen",
    "mainframe_rag.retrieve.split",
    "mainframe_rag.serve",
    "mainframe_rag.serve.__main__",
    "mainframe_rag.serve.budget",
    "mainframe_rag.serve.cli",
    "mainframe_rag.serve.colab_corpus",
    "mainframe_rag.serve.colab_production",
    "mainframe_rag.serve.colab_profiles",
    "mainframe_rag.serve.profiles",
    "mainframe_rag.webui",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
