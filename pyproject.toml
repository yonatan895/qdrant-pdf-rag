[project]
name = "mainframe-rag"
version = "0.1.0"
description = "Citation-first expert mainframe agent: Qdrant on OpenShift, PDF ingest, hybrid retrieval"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pymupdf",
    "qdrant-client",
    "fastembed",
    "httpx2",
    "urllib3==2.8.0",
    "fastapi",
    "jinja2",
    "python-multipart",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-prometheus",
]

[project.scripts]
mainframe-rag-ops = "mainframe_rag.ops.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration and not browser'"
markers = [
    "browser: executed real-browser console contracts (issue #372); needs an offline Chrome for Testing + chromedriver and skips without one; run `pytest -m browser tests/test_console_browser.py`",
    "integration: end-to-end tiers against a docker Qdrant server + loopback mocks (correctness via `sh scripts/tools/run-task.sh qa:sim`, load tier via `sh scripts/tools/run-task.sh qa:load`)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
ignore_missing_imports = true
