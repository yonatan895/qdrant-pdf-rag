# Default values for mainframe-rag.
# Operator contract: airgap.env remains the supported operator input for the
# deployment (D4). map_values.py produces the exact release
# values artifact from validated operator input; this file carries only
# checked-in defaults. No real registry hostname, credential, endpoint,
# corpus path or private namespace belongs here.
#
# Values expose operator/product decisions, not an arbitrary PodSpec (D5).
# SecurityContext, probe semantics, selector labels, stable ports and other
# protected implementation defaults stay in chart templates.

replicaCount: 2

# Packed image identity. The tag is the full git SHA (deploy.sh fail-closes
# on empty/HEAD; the same rule is enforced by values.schema.json). The
# repository is the full registry path set by the generator, e.g.
# registry.example.internal/mainframe-rag/qdrant-pdf-rag-agent. The default
# below carries no real registry.
images:
  agent:
    repository: qdrant-pdf-rag-agent
    tag: "0000000000000000000000000000000000000000"
    pullPolicy: IfNotPresent
  # One-shot ingest image. The tag is the same packed SHA as the agent in a
  # real release; kept as a separate field so each image reference has one
  # owner (D5). The generator sets both tags from IMAGE_SHA.
  ingest:
    repository: qdrant-pdf-rag-ingest
    tag: "0000000000000000000000000000000000000000"
    pullPolicy: IfNotPresent
  # Jaeger all-in-one (upstream tag 2.20.0; digest pinned in images.txt and
  # enforced at pack/load, not in the manifest).
  jaeger:
    repository: jaegertracing/jaeger
    tag: v2.20.0
    pullPolicy: IfNotPresent
  # OAuth proxy sidecar for the optional console Route (ADR-0004). Ref is the
  # internal retag (load.sh pushes the packed image under
  # <registry>/openshift4/ose-oauth-proxy:v4.14); digest pinned in images.txt.
  oauthProxy:
    repository: openshift4/ose-oauth-proxy
    tag: v4.14
    pullPolicy: IfNotPresent

# Single Qdrant release owner (D2). The chart derives the in-cluster URL
# (http://<release>:6333) and the chart-managed Secret name
# (<release>-apikey) from this one value so a rename cannot orphan one
# reference. The serving data key (read-only-api-key, issue #366) is a
# protected template default, not a value.
qdrantRelease: qdrant

models:
  embedding:
    baseUrl: http://vllm.inference.svc.cluster.local:8000/v1
    model: ibm-granite/granite-embedding-278m-multilingual
    revision: dryrun-rev-1
    dimension: 768
  reasoning:
    # Empty model disables /v1/answer; when set, baseUrl is required.
    baseUrl: ""
    model: ""
  rerank:
    enabled: false
    baseUrl: ""
    model: BAAI/bge-reranker-v2-m3
    endpointOrder: score_first

# Single operator-created Secret read via secretKeyRef (D7), or empty for
# keyless deployments. Data keys are fixed per consumer (agent:
# llm/embed/rerank-api-key); values never carry key material.
gateway:
  apiKeySecretName: ""
  # Optional complete trust bundle ConfigMap (key ca-bundle.crt) in the
  # release namespace; empty disables the mount. Matches wire_gateway_ca.
  caConfigMapName: ""

tracing:
  # Unset-equivalent default: enabled with the in-cluster Jaeger endpoint.
  # Disabled renders an empty OTEL_EXPORTER_OTLP_ENDPOINT and skips the
  # Jaeger resources. Custom collectors set a full http(s) URL.
  enabled: true
  endpoint: http://jaeger:4318
  # Optional deploy identity; empty renders an empty string (no attribute).
  deploymentEnvironment: ""
  # Optional service name; empty strips the entry entirely so the agent
  # default stands (a blank value would override it with "").
  serviceName: ""

metrics:
  # False renders METRICS_ENABLED="false" (/metrics 404s) and skips the
  # ServiceMonitor. True serves exposition and renders the monitor for UWM.
  enabled: false

# Optional console Route via the oauth-proxy sidecar (ADR-0004, issue #373).
# False keeps ClusterIP-only installs. True wires the sidecar, ServiceAccount,
# Service oauth port/serving-cert annotation and a reencrypt Route. The CA is
# the namespace service-CA bundle (non-secret generated value, D8); the
# cookie secret (rag-agent-oauth-cookie) is operator-created and checked by
# deploy.sh preflight, never a chart value (D7).
route:
  enabled: false
  timeoutSeconds: 300
  destinationCA: ""

# RWO block storage class for Jaeger Badger and ingest-work scratch.
# NFS refusal stays owned by shell preflight; schema additionally rejects
# nfs-looking names fail-closed.
storage:
  className: standard

# Explicit ingest operation (D3). Disabled by default so the steady-state
# release never owns a completed one-shot Job whose immutable fields would
# block later ingestion. Render explicitly, e.g.:
# helm template <release> charts/mainframe-rag --namespace <ns> -f release-values.yaml --set ingest.enabled=true --show-only templates/ingest-job.yaml
# then apply/replace the Job deliberately. Never a Helm hook.
ingest:
  enabled: false
  # Caller-supplied corpus PVC (read-only mount). Required when enabled.
  corpusPVC: ""
  workers: 4
  workSize: 100Gi
  aliasPublish: false
  reingest: false
  # Explicit approved removals (requires aliasPublish=true). Entries accept
  # the backend alphabet (labels may carry '/', '|' and spaces); shell
  # preflight remains the owner for malformed combinations (D6).
  retireDocs: []
  contextualEnabled: false
  contextLlmBaseUrl: ""
  contextLlmModel: ""
  # Collection distribution policy (issue #360). Rendered as bare ints into
  # the Job; the complete-tuple W<=RF validation stays owned by
  # validate_collection_policy in shell (D6).
  collectionPolicy:
    shardNumber: 6
    replicationFactor: 3
    writeConsistencyFactor: 2
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "16"
      memory: 32Gi

# Optional pull secret name; empty renders `imagePullSecrets: []`.
pullSecret:
  name: ""

resources:
  agent:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
