# Default values for mainframe-rag.
# Operator contract: airgap.env remains the supported operator input for the
# deployment (D4). map_values.py produces the exact release
# values artifact from validated operator input; this file carries only
# checked-in defaults. No real registry hostname, credential, endpoint,
# corpus path or private namespace belongs here.
#
# Values expose operator/product decisions, not an arbitrary PodSpec (D5).
# SecurityContext, probe semantics, selector labels, stable ports and other
# protected implementation defaults stay in chart templates.

# Agent replicas (rag-agent only; maintainer decision 2026-11-22, #1348).
replicaCount: 3

# Total request deadline in seconds for the agent (REQUEST_DEADLINE_S, #843 D6
# 2026-10-23, 270 s so it stays strictly below the 300 s route, client and answer
# timeouts; handoff owned by #374): expiry is 504 deadline_exceeded instead
# of a silent route cut. 0 disables. Settings keeps 0 for local/CI (#843 D5).
# Admission limits are separate values (below).
requestDeadlineSeconds: 270

# Request admission (#374, agent REQUEST_MAX_CONCURRENT / REQUEST_QUEUE_MAX /
# REQUEST_QUEUE_WAIT_S). Ships ON in the supported deployment (#843, maintainer
# decision 2026-10-23, G4 S10 D4): excess load is an immediate 503 instead of a
# 270 s 504. Sizing rule: requestMaxConcurrent = 2 x the engine's concurrent
# sequence slots; the site overrides via the #374 handoff. Settings keeps 0 (off)
# for local/CI. 0 is an explicit selection (wait must be > 0 while concurrency
# is > 0). Limits are per agent replica.
requestMaxConcurrent: 4      # 0..1000
requestQueueMax: 4           # 0..1000
requestQueueWaitSeconds: 30  # 0..300

# Request-body memory bounds (#1352, agent REQUEST_MAX_BODY_BYTES /
# REQUEST_BODY_BUDGET_BYTES; maintainer decision 2026-11-22), per agent replica.
# The cap is the largest body the agent accepts (larger: 413 before parsing);
# the budget is the sum of bodies in flight (a request waits unread up to
# requestQueueWaitSeconds, then 503). budget >= cap; the render refuses otherwise.
requestMaxBodyBytes: 25165824      # 1048576..268435456 (24 MiB)
requestBodyBudgetBytes: 134217728  # 1048576..4294967296 (128 MiB)

# Packed image identity. The tag is the full git SHA (deploy.sh fail-closes
# on empty/HEAD; the same rule is enforced by values.schema.json). The
# repository is the full registry path set by the generator, e.g.
# registry.example.internal/mainframe-rag/qdrant-pdf-rag-agent. The default
# below carries no real registry.
images:
  agent:
    repository: qdrant-pdf-rag-agent
    tag: "0000000000000000000000000000000000000000"
    pullPolicy: IfNotPresent
  # One-shot ingest image. The tag is the same packed SHA as the agent in a
  # real release; kept as a separate field so each image reference has one
  # owner (D5). The generator sets both tags from IMAGE_SHA.
  ingest:
    repository: qdrant-pdf-rag-ingest
    tag: "0000000000000000000000000000000000000000"
    pullPolicy: IfNotPresent
  # OpenObserve OSS (issue #956, ADR-0006), the bundled trace/metrics backend.
  # Tag form like the other images; the digest is pinned in images.txt and
  # enforced at pack/load (#960), never in the manifest.
  openobserve:
    repository: openobserve/openobserve
    tag: v1.1.2
    pullPolicy: IfNotPresent
  # Stateless otelcol-contrib that scrapes the agent /metrics and forwards to
  # OpenObserve. Same tag-plus-images.txt pin rule.
  otelcol:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.160.0
    pullPolicy: IfNotPresent
  # OAuth proxy sidecar for the optional console Route (ADR-0004). Ref is the
  # internal retag (load.sh pushes the packed image under
  # <registry>/openshift4/ose-oauth-proxy:v4.14); digest pinned in images.txt.
  oauthProxy:
    repository: openshift4/ose-oauth-proxy
    tag: v4.14
    pullPolicy: IfNotPresent
  # Open WebUI docs front end (ADR-0007, #1074): the hardened derived
  # image of the upstream slim release (#1073). Tag form like the other
  # third-party images; the digest is pinned in images.txt (sha256:PENDING
  # until the #1073 qualification records it) and enforced at pack/load.
  openwebui:
    repository: qdrant-pdf-rag-openwebui
    tag: v0.13.4-slim
    pullPolicy: IfNotPresent
  # Allow-list proxy sidecar of the Open WebUI pod (ADR-0007 E1, maintainer
  # decision 2026-10-24): nginx-unprivileged, pinned by digest in images.txt and
  # bundled together with the Open WebUI image.
  openwebuiProxy:
    repository: nginxinc/nginx-unprivileged
    tag: 1.30.6-alpine
    pullPolicy: IfNotPresent

# Single Qdrant release owner (D2). The chart derives the in-cluster URL
# (http://<release>:6333) and the chart-managed Secret name
# (<release>-apikey) from this one value so a rename cannot orphan one
# reference. The serving data key (read-only-api-key, issue #366) is a
# protected template default, not a value.
qdrantRelease: qdrant

models:
  embedding:
    baseUrl: http://vllm.inference.svc.cluster.local:8000/v1
    model: ibm-granite/granite-embedding-278m-multilingual
    revision: dryrun-rev-1
    dimension: 768
  reasoning:
    # Explicit opt-in for pronoun-only follow-ups; application default stays off.
    condenseEnabled: false
    # Chat history caps (#1268); absent keys keep the Settings defaults (shown):
    # prior messages kept, and characters kept of each prior message.
    # chatMaxTurns: 10
    # chatMaxPriorTurnChars: 4000  # 1000 before #1274
    # Antecedent-anchored follow-up retrieval (#1268); absent keeps it on
    # (#1274), unless condenseEnabled is true, which turns the default off.
    # Exclusive with condenseEnabled (the schema refuses both true).
    # followupAnchorEnabled: true  # false before #1274
    # Retrieval depth (#1191); absent keys keep the Settings defaults
    # (shown): hits per answer retrieval (1..32; /v1/search keeps its own
    # limit) and chunks kept per manual (1..10; applies to /v1/search too).
    # answerHitLimit: 16          # 8 before #1274
    # retrieveMaxChunksPerDoc: 5  # 3 before #1274
    # Coding mode (#1276); absent keeps the Settings default (on). false
    # restores the pre-#1276 prompts and complexity for every request (the
    # c/hlasm/asm/metalc/clist fence handling is not part of the setting).
    # codingModeEnabled: true
    # SPL mode (#1293); absent keeps the Settings default (off). true routes
    # Splunk SPL requests and pasted Splunk results to the complex path and
    # SPL prompt (taking precedence over coding mode when both match; the
    # `spl` fence handling is not part of the setting).
    # splModeEnabled: false
    # Pasted images in Open WebUI temporary chats (#1287); absent keeps the
    # Settings default (off). Turn on only after `probe_gateway.py
    # --probe-image` passes; true also sets the Open WebUI image caps, the
    # banner and the proxy's 55m body cap on /api/chat/completions.
    # chatImagesEnabled: false
    # Prompt tokens priced per pasted image (#1287; 256..65536); absent keeps
    # the Settings default (shown, an estimate). Set the image_tokens the
    # site's `probe_gateway.py --probe-image` measured, rounded up.
    # imageTokenReserve: 6144
    # Empty model disables /v1/answer; when set, baseUrl is required.
    baseUrl: ""
    model: ""
    # Optional bounded app overrides (#706); absent keys preserve Settings
    # defaults (shown, #777). Explicit zero thinking reserves and stream: false
    # are retained. maxModelLen must not exceed the served model window: the
    # 262144 default (#1274) assumes the model serves at least that; set the
    # served window when it serves less.
    # maxModelLen: 262144
    # reservedOutputTokens: 2560
    # thinkingReserveTokensSimple: 8192
    # thinkingReserveTokensComplex: 8192
    # The efforts are set explicitly so a rendered pod carries them (#917,
    # maintainer decision 2026-10-23: medium on both routes; xhigh before).
    reasoningEffortSimple: medium
    reasoningEffortComplex: medium
    # Efforts the served template accepts; the console offers exactly these and
    # both efforts above must be members. Stock Qwen3.8 needs low,medium,xhigh.
    # reasoningEfforts: low,medium,xhigh
    # stream: true
    # Model request arguments (#1193); absent keys send the earlier request.
    # extraBody is merged into every chat request and may nest objects such as
    # chat_template_kwargs. model, messages, stream and stream_options are
    # protected; max_tokens, max_completion_tokens, temperature and
    # reasoning_effort are refused (their own settings own them).
    # effortTransport: top_level (reasoning_effort), chat_template
    # (chat_template_kwargs.reasoning_effort) or none (not sent; only then may
    # extraBody fix chat_template_kwargs.reasoning_effort). Find the arguments
    # the served model honours with `probe_gateway.py --probe-args`.
    # extraBody:
    #   chat_template_kwargs:
    #     enable_thinking: true
    # effortTransport: top_level
    # Where the verified prompt count comes from (#1266;
    # docs/agent.md#token-count-sources): tokenize (default), completion_usage,
    # auto or estimate.
    # tokenCountSource: tokenize
  rerank:
    enabled: false
    baseUrl: ""
    model: BAAI/bge-reranker-v2-m3
    endpointOrder: score_first

# Single operator-created Secret read via secretKeyRef (D7), or empty for
# keyless deployments. Empty apiKeySecretKey retains the per-leg data keys;
# set it to reference one shared key for all model operations. No key material.
gateway:
  apiKeySecretName: ""
  apiKeySecretKey: ""
  # Optional complete trust bundle ConfigMap (key ca-bundle.crt) in the
  # release namespace; empty disables the mount. Matches wire_gateway_ca.
  caConfigMapName: ""

tracing:
  # Enabled with an empty endpoint renders the bundled OpenObserve and points
  # the agent at it. A set endpoint is the generic OTLP/HTTP escape hatch: an
  # external collector, no bundled backend. Disabled renders an empty
  # OTEL_EXPORTER_OTLP_ENDPOINT and no backend.
  enabled: true
  endpoint: ""
  # Optional deploy identity; empty renders an empty string (no attribute).
  deploymentEnvironment: ""
  # Optional service name; empty strips the entry entirely so the agent
  # default stands (a blank value would override it with "").
  serviceName: ""

# Bundled OpenObserve. Credentials are only ever a Secret reference: keys
# root-user-email, root-user-password, otlp-headers and metrics-auth (each
# header value is the full "Basic <b64>" form the consumer sends).
# The Secret must exist at deploy time (#960/deploy.sh checks it); emptying
# the name fails the render.
openobserve:
  credentialsSecretName: openobserve-credentials
  # Null keeps the OpenShift restricted-v2 contract (the platform assigns the
  # UID and fsGroup). The image runs as root by default, so plain Kubernetes
  # (Kind) sets one non-root id here: it is used as runAsUser, runAsGroup and
  # fsGroup so the data volume is writable.
  runAsId: null
  storage:
    size: 10Gi

metrics:
  # False renders METRICS_ENABLED="false" (/metrics 404s) and skips the
  # ServiceMonitor. True serves exposition and renders the monitor for UWM.
  enabled: false
  collector:
    # Metrics collector (otelcol-contrib -> OpenObserve). Null follows
    # metrics.enabled with the bundled OpenObserve; false skips it (platform
    # forwarding); true without both prerequisites is rejected.
    enabled: null
  serviceMonitor:
    # UWM ServiceMonitor for the agent /metrics (issue #529 OBS-2). Null
    # (default) follows metrics.enabled. Set false to serve exposition
    # without the monitor (e.g. platform-UWM scrape modes); setting true
    # while metrics.enabled is false is rejected (a monitor for a disabled
    # endpoint). Explicit values must be booleans, not truthy strings.
    enabled: null

# Operator console selection (issue #479). True preserves the existing
# default (UI_ENABLED="true", /ui served). False renders
# UI_ENABLED="false": the application serves its stable disabled contract
# for console form/stream/history/static entry points. Independent of
# route.enabled below: disabling the UI never removes OAuth/TLS/access
# controls, and turning the Route off is not a UI-off claim.
ui:
  enabled: true

# Optional console Route via the oauth-proxy sidecar (ADR-0004, issue #373).
# False keeps ClusterIP-only installs. True wires the sidecar, ServiceAccount,
# Service oauth port/serving-cert annotation and a reencrypt Route. The CA is
# the namespace service-CA bundle (non-secret generated value, D8); the
# cookie secret (rag-agent-oauth-cookie) is operator-created and checked by
# deploy.sh preflight, never a chart value (D7).
route:
  enabled: false
  timeoutSeconds: 300
  destinationCA: ""

# Ingress NetworkPolicy for the agent pods (issue #373). Default ON: the
# unauthenticated agent HTTP port (8080) is reachable only from this
# namespace, the monitoring namespaces (when metrics.enabled) and the
# namespaces listed in allowedNamespaces; the OAuth port (8443, route.enabled)
# is additionally reachable from the OpenShift router. Ingress only; Qdrant,
# OpenObserve and the ingest Job are not selected. Policies are additive: whether a
# site's own policies widen this is site acceptance evidence, not a chart
# claim. enabled=false renders no policy (and allowedNamespaces must be empty).
# allowedNamespaces: DNS-1123 namespace names (matched by the immutable
# kubernetes.io/metadata.name label) that may also reach 8080.
networkPolicy:
  enabled: true
  allowedNamespaces: []

# Answer-feedback service (ADR-0005, issue #804). Default OFF: nothing below
# renders and the agent Deployment is unchanged. True renders a single-replica
# StatefulSet (the existing agent image, one uvicorn worker), a kept RWO claim
# rag-feedback-data, a ClusterIP Service and the agent-only NetworkPolicy
# rag-feedback-ingress, and wires FEEDBACK_ENABLED/URL/API_KEY into the agent.
# secretName names an operator-created Secret with data key service-token (the
# bearer token for both sides); never a chart value. Requires
# networkPolicy.enabled. Disabling removes the workload but KEEPS the claim and
# its content: nothing purges while disabled until the operator deletes the
# claim (docs/deploy.md). The purge schedule is protected in the service.
feedback:
  enabled: false
  secretName: ""
  storageSize: 10Gi
  retentionDays: 180

# Open WebUI docs front end (ADR-0007, #1074): the main docs platform, ON by
# default (maintainer decision 2026-10-26). While the required site inputs
# below (secretName, host, oidc.providerUrl/clientId/allowedRoles/adminRoles,
# idpEgress.cidrs, route.destinationCA) are missing the render fails closed
# with a fixed message; opt out with `--set openwebui.enabled=false`, which
# renders nothing from this block and leaves every other object byte-identical
# to a render without it (K1 rollback). Enabled renders one Recreate replica of the hardened
# image (one worker, SQLite on the kept RWO claim rag-openwebui-data, never
# NFS), a ClusterIP Service on 8443 (TLS from the service-serving cert), a
# reencrypt Route on `host` whose destination CA is route.destinationCA (the
# namespace service CA, the single owner of that value), NetworkPolicy
# rag-openwebui (ingress from the router only; egress to the agent 8080,
# cluster DNS and idpEgress only) and the docs Pipe ConfigMap.
# Users sign in through the identity team's OIDC client; the local login form,
# signup and password auth are off. The answer path is the docs Pipe (#1072)
# over the agent: no model connection, no gateway key, no RAG.
# secretName names an operator-created Secret with data keys webui-secret-key
# and oidc-client-secret (optional admin-api-key, read only by deploy.sh to
# install the Pipe); never a chart value (D7).
# retentionDays is the chat retention window (maintainer decision 2026-10-24,
# ADR-0007 S2: 30 days; backups follow the same window). The purge sidecar in
# the Open WebUI pod enforces it; an explicit null fails the render.
openwebui:
  enabled: true
  secretName: ""
  # Public Route host; the OIDC redirect URI is https://<host>/oauth/oidc/callback.
  host: ""
  retentionDays: 30
  # Thumbs up/down on answers (#1255). enabled unset (the default since
  # #1274) follows feedback.enabled: on wherever the feedback store is on.
  # true requires feedback.enabled; false keeps ratings off beside the store.
  # Ratings go only to the agent's POST /v1/feedback and the feedback store
  # (ADR-0005); Open WebUI's own ratings stay off. On: the docs Pipe ends each
  # answer with an "Answer reference" line, and deploy.sh installs the
  # repository rating Action (hash-checked) next to the docs Pipe. Off again:
  # the next deploy removes the Action. One helper decides for every
  # template: mainframe-rag.openwebuiRatings.
  ratings: {}
    # enabled: false
  storageSize: 10Gi
  # Chat share links and temporary chats (ADR-0007 S2, #1255). Off by default;
  # turning either on is the site's (maintainer's) decision. These set the
  # default user permissions; an admin can still change a group's in the UI.
  chats:
    # Share links inside this instance (USER_PERMISSIONS_CHAT_SHARE). A link opens
    # only after sign-in, for its owner and the users or groups the owner grants;
    # the no-sign-in grant stays off for users (ADR-0007 R3 admin residual). The
    # snapshot is purged with its chat, or once it is older than retentionDays.
    share: false
    # Let a sharer open a link to every signed-in user of the instance
    # (USER_PERMISSIONS_CHAT_ALLOW_PUBLIC_SHARING). Needs share.
    shareWithAllUsers: false
    # Temporary chats (never saved) stay available. true: non-admins cannot start a
    # saved chat; the server refuses to create or import one; chats saved before
    # stay until the purge (USER_PERMISSIONS_CHAT_TEMPORARY_ENFORCED).
    temporaryEnforced: false
  oidc:
    # https://<idp>/.well-known/openid-configuration of the identity team's client.
    providerUrl: ""
    clientId: ""
    # ID-token claim carrying group names (not SIDs); synced on every login.
    groupClaim: groups
    # ID-token claim carrying roles; allowedRoles may sign in, adminRoles are
    # Open WebUI admins (comma-separated names). Both are required when enabled.
    rolesClaim: roles
    allowedRoles: ""
    adminRoles: ""
    # Space-separated scopes Open WebUI requests (OAUTH_SCOPES); must include
    # openid. offline_access: Open WebUI refreshes the session from a refresh
    # token; without one it deletes the session near expiry and may fall back to
    # an older session's token (Kind trial). The IdP must permit every scope.
    # AD FS: openid profile email allatclaims (docs/deploy.md).
    scopes: openid email profile groups offline_access
    # Claim with the user's e-mail (OAUTH_EMAIL_CLAIM): Open WebUI v0.13.4 refuses a
    # sign-in without it. AD FS usually: upn. Top-level claim names only.
    emailClaim: email
    # Claim with the display name (OAUTH_USERNAME_CLAIM); missing, the e-mail is used.
    # When the ID token lacks this or the e-mail claim, Open WebUI also calls userinfo.
    usernameClaim: name
    # Optional PEM bundle of the CA that issued the IdP's TLS certificate (an
    # enterprise CA, e.g. AD FS). Empty: the image's public trust stores only. Set:
    # rendered as ConfigMap rag-openwebui-idp-ca, and Open WebUI trusts the public
    # stores plus this CA (SSL_CERT_FILE, REQUESTS_CA_BUNDLE). Certificates only.
    caBundle: ""
  # IdP back channel (discovery, token, JWKS). NetworkPolicy cannot match DNS
  # names: list the IdP's CIDRs. Required when enabled.
  idpEgress:
    cidrs: []
    port: 443

# RWO block storage class for OpenObserve, ingest-work scratch and the
# feedback store.
# NFS refusal stays owned by shell preflight; schema additionally rejects
# nfs-looking names fail-closed.
storage:
  className: standard

# Explicit ingest operation (D3). Disabled by default so the steady-state
# release never owns a completed one-shot Job whose immutable fields would
# block later ingestion. Render explicitly, e.g.:
# helm template <release> charts/mainframe-rag --namespace <ns> -f release-values.yaml --set ingest.enabled=true --show-only templates/ingest-job.yaml
# then apply/replace the Job deliberately. Never a Helm hook.
ingest:
  enabled: false
  # Caller-supplied corpus PVC (read-only mount). Required when enabled.
  corpusPVC: ""
  workers: 4
  workSize: 100Gi
  # Explicit direct REST peers for placement evidence; never inferred from the Service.
  # Comma-separated non-secret URLs. Existing runtime parser/gate owns validation.
  peerUrls: ""
  reingest: false
  # Explicit approved removals (a publication operation). Entries accept
  # the backend alphabet (labels may carry '/', '|' and spaces); shell
  # preflight remains the owner for malformed combinations (D6).
  retireDocs: []
  # With retireDocs only (issue #1005): also approve revisions the live build
  # published and committed when the inventory lost them. Renders
  # --authorize-from-catalog; refused without retireDocs.
  authorizeFromCatalog: false
  contextualEnabled: false
  contextLlmBaseUrl: ""
  contextLlmModel: ""
  # Collection distribution policy (issue #360). Rendered as bare ints into
  # the Job; the complete-tuple W<=RF validation stays owned by
  # validate_collection_policy in shell (D6).
  collectionPolicy:
    shardNumber: 6
    replicationFactor: 3
    writeConsistencyFactor: 2
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "16"
      memory: 32Gi

# Optional pull secret name; empty renders `imagePullSecrets: []`.
pullSecret:
  name: ""

resources:
  # Agent defaults from the #1348 load measurement (image chats about 45 MiB
  # each in flight; 512Mi was OOM-killed). Sites resize with AGENT_* keys.
  agent:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  feedback:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # Open WebUI (#1074); sizing pending the #1073 trial measurement.
  openwebui:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
