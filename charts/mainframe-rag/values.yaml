# Default values for mainframe-rag.
# Operator contract: airgap.env remains the supported operator input for the
# deployment (D4). map_values.py produces the exact release
# values artifact from validated operator input; this file carries only
# checked-in defaults. No real registry hostname, credential, endpoint,
# corpus path or private namespace belongs here.
#
# Values expose operator/product decisions, not an arbitrary PodSpec (D5).
# SecurityContext, probe semantics, selector labels, stable ports and other
# protected implementation defaults stay in chart templates.

replicaCount: 2

# Total request deadline in seconds for the agent (REQUEST_DEADLINE_S, #843 D6
# 2026-10-23, 270 s so it stays strictly below the 300 s route, client and answer
# timeouts; handoff owned by #374): expiry is 504 deadline_exceeded instead
# of a silent route cut. 0 disables. Settings keeps 0 for local/CI (#843 D5).
# Admission limits are not part of this value.
requestDeadlineSeconds: 270

# Request admission (#374, agent REQUEST_MAX_CONCURRENT / REQUEST_QUEUE_MAX /
# REQUEST_QUEUE_WAIT_S). Deliberately unset: absent renders no env, so the
# application default (no limit) applies until a measured envelope is approved
# (#843 D4). A value of 0 is an explicit selection. Limits are per agent replica.
# requestMaxConcurrent: 0      # 0..1000
# requestQueueMax: 0           # 0..1000
# requestQueueWaitSeconds: 5   # 0..300

# Packed image identity. The tag is the full git SHA (deploy.sh fail-closes
# on empty/HEAD; the same rule is enforced by values.schema.json). The
# repository is the full registry path set by the generator, e.g.
# registry.example.internal/mainframe-rag/qdrant-pdf-rag-agent. The default
# below carries no real registry.
images:
  agent:
    repository: qdrant-pdf-rag-agent
    tag: "0000000000000000000000000000000000000000"
    pullPolicy: IfNotPresent
  # One-shot ingest image. The tag is the same packed SHA as the agent in a
  # real release; kept as a separate field so each image reference has one
  # owner (D5). The generator sets both tags from IMAGE_SHA.
  ingest:
    repository: qdrant-pdf-rag-ingest
    tag: "0000000000000000000000000000000000000000"
    pullPolicy: IfNotPresent
  # OpenObserve OSS (issue #956, ADR-0006), the bundled trace/metrics backend.
  # Digest-only: no tag; render fails while the digest is unset (the pin
  # lands through its own pin PR and the operator mapping).
  openobserve:
    repository: openobserve/openobserve
    pullPolicy: IfNotPresent
  # Stateless otelcol-contrib that scrapes the agent /metrics and forwards to
  # OpenObserve. Digest-only, same fail-closed rule.
  otelcol:
    repository: otel/opentelemetry-collector-contrib
    pullPolicy: IfNotPresent
  # OAuth proxy sidecar for the optional console Route (ADR-0004). Ref is the
  # internal retag (load.sh pushes the packed image under
  # <registry>/openshift4/ose-oauth-proxy:v4.14); digest pinned in images.txt.
  oauthProxy:
    repository: openshift4/ose-oauth-proxy
    tag: v4.14
    pullPolicy: IfNotPresent

# Single Qdrant release owner (D2). The chart derives the in-cluster URL
# (http://<release>:6333) and the chart-managed Secret name
# (<release>-apikey) from this one value so a rename cannot orphan one
# reference. The serving data key (read-only-api-key, issue #366) is a
# protected template default, not a value.
qdrantRelease: qdrant

models:
  embedding:
    baseUrl: http://vllm.inference.svc.cluster.local:8000/v1
    model: ibm-granite/granite-embedding-278m-multilingual
    revision: dryrun-rev-1
    dimension: 768
  reasoning:
    # Explicit opt-in for pronoun-only follow-ups; application default stays off.
    condenseEnabled: false
    # Empty model disables /v1/answer; when set, baseUrl is required.
    baseUrl: ""
    model: ""
    # Optional bounded app overrides (#706); absent keys preserve Settings
    # defaults (shown, #777). Explicit zero thinking reserves and stream: false
    # are retained. maxModelLen must not exceed the served model window.
    # maxModelLen: 32768
    # reservedOutputTokens: 2560
    # thinkingReserveTokensSimple: 8192
    # thinkingReserveTokensComplex: 8192
    # The efforts are set explicitly so a rendered pod carries them (#917,
    # maintainer decision 2026-10-23: medium on both routes; xhigh before).
    reasoningEffortSimple: medium
    reasoningEffortComplex: medium
    # Efforts the served template accepts; the console offers exactly these and
    # both efforts above must be members. Stock Qwen3.8 needs low,medium,xhigh.
    # reasoningEfforts: low,medium,xhigh
    # stream: true
  rerank:
    enabled: false
    baseUrl: ""
    model: BAAI/bge-reranker-v2-m3
    endpointOrder: score_first

# Single operator-created Secret read via secretKeyRef (D7), or empty for
# keyless deployments. Empty apiKeySecretKey retains the per-leg data keys;
# set it to reference one shared key for all model operations. No key material.
gateway:
  apiKeySecretName: ""
  apiKeySecretKey: ""
  # Optional complete trust bundle ConfigMap (key ca-bundle.crt) in the
  # release namespace; empty disables the mount. Matches wire_gateway_ca.
  caConfigMapName: ""

tracing:
  # Enabled with an empty endpoint renders the bundled OpenObserve and points
  # the agent at it. A set endpoint is the generic OTLP/HTTP escape hatch: an
  # external collector, no bundled backend. Disabled renders an empty
  # OTEL_EXPORTER_OTLP_ENDPOINT and no backend.
  enabled: true
  endpoint: ""
  # Optional deploy identity; empty renders an empty string (no attribute).
  deploymentEnvironment: ""
  # Optional service name; empty strips the entry entirely so the agent
  # default stands (a blank value would override it with "").
  serviceName: ""

# Bundled OpenObserve. Credentials are only ever a Secret reference: keys
# root-user-email, root-user-password, otlp-headers and metrics-auth (each
# header value is the full "Basic <b64>" form the consumer sends).
openobserve:
  credentialsSecretName: ""
  storage:
    size: 10Gi

metrics:
  # False renders METRICS_ENABLED="false" (/metrics 404s) and skips the
  # ServiceMonitor. True serves exposition and renders the monitor for UWM.
  enabled: false
  collector:
    # Metrics collector (otelcol-contrib -> OpenObserve). Null follows
    # metrics.enabled with the bundled OpenObserve; false skips it (platform
    # forwarding); true without both prerequisites is rejected.
    enabled: null
  serviceMonitor:
    # UWM ServiceMonitor for the agent /metrics (issue #529 OBS-2). Null
    # (default) follows metrics.enabled. Set false to serve exposition
    # without the monitor (e.g. platform-UWM scrape modes); setting true
    # while metrics.enabled is false is rejected (a monitor for a disabled
    # endpoint). Explicit values must be booleans, not truthy strings.
    enabled: null

# Operator console selection (issue #479). True preserves the existing
# default (UI_ENABLED="true", /ui served). False renders
# UI_ENABLED="false": the application serves its stable disabled contract
# for console form/stream/history/static entry points. Independent of
# route.enabled below: disabling the UI never removes OAuth/TLS/access
# controls, and turning the Route off is not a UI-off claim.
ui:
  enabled: true

# Optional console Route via the oauth-proxy sidecar (ADR-0004, issue #373).
# False keeps ClusterIP-only installs. True wires the sidecar, ServiceAccount,
# Service oauth port/serving-cert annotation and a reencrypt Route. The CA is
# the namespace service-CA bundle (non-secret generated value, D8); the
# cookie secret (rag-agent-oauth-cookie) is operator-created and checked by
# deploy.sh preflight, never a chart value (D7).
route:
  enabled: false
  timeoutSeconds: 300
  destinationCA: ""

# Ingress NetworkPolicy for the agent pods (issue #373). Default ON: the
# unauthenticated agent HTTP port (8080) is reachable only from this
# namespace, the monitoring namespaces (when metrics.enabled) and the
# namespaces listed in allowedNamespaces; the OAuth port (8443, route.enabled)
# is additionally reachable from the OpenShift router. Ingress only; Qdrant,
# Qdrant and the ingest Job are not selected. Policies are additive: whether a
# site's own policies widen this is site acceptance evidence, not a chart
# claim. enabled=false renders no policy (and allowedNamespaces must be empty).
# allowedNamespaces: DNS-1123 namespace names (matched by the immutable
# kubernetes.io/metadata.name label) that may also reach 8080.
networkPolicy:
  enabled: true
  allowedNamespaces: []

# Answer-feedback service (ADR-0005, issue #804). Default OFF: nothing below
# renders and the agent Deployment is unchanged. True renders a single-replica
# StatefulSet (the existing agent image, one uvicorn worker), a kept RWO claim
# rag-feedback-data, a ClusterIP Service and the agent-only NetworkPolicy
# rag-feedback-ingress, and wires FEEDBACK_ENABLED/URL/API_KEY into the agent.
# secretName names an operator-created Secret with data key service-token (the
# bearer token for both sides); never a chart value. Requires
# networkPolicy.enabled. Disabling removes the workload but KEEPS the claim and
# its content: nothing purges while disabled until the operator deletes the
# claim (docs/deploy.md). The purge schedule is protected in the service.
feedback:
  enabled: false
  secretName: ""
  storageSize: 10Gi
  retentionDays: 180

# RWO block storage class for OpenObserve, ingest-work scratch and the
# feedback store.
# NFS refusal stays owned by shell preflight; schema additionally rejects
# nfs-looking names fail-closed.
storage:
  className: standard

# Explicit ingest operation (D3). Disabled by default so the steady-state
# release never owns a completed one-shot Job whose immutable fields would
# block later ingestion. Render explicitly, e.g.:
# helm template <release> charts/mainframe-rag --namespace <ns> -f release-values.yaml --set ingest.enabled=true --show-only templates/ingest-job.yaml
# then apply/replace the Job deliberately. Never a Helm hook.
ingest:
  enabled: false
  # Caller-supplied corpus PVC (read-only mount). Required when enabled.
  corpusPVC: ""
  workers: 4
  workSize: 100Gi
  # Explicit direct REST peers for placement evidence; never inferred from the Service.
  # Comma-separated non-secret URLs. Existing runtime parser/gate owns validation.
  peerUrls: ""
  reingest: false
  # Explicit approved removals (a publication operation). Entries accept
  # the backend alphabet (labels may carry '/', '|' and spaces); shell
  # preflight remains the owner for malformed combinations (D6).
  retireDocs: []
  contextualEnabled: false
  contextLlmBaseUrl: ""
  contextLlmModel: ""
  # Collection distribution policy (issue #360). Rendered as bare ints into
  # the Job; the complete-tuple W<=RF validation stays owned by
  # validate_collection_policy in shell (D6).
  collectionPolicy:
    shardNumber: 6
    replicationFactor: 3
    writeConsistencyFactor: 2
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "16"
      memory: 32Gi

# Optional pull secret name; empty renders `imagePullSecrets: []`.
pullSecret:
  name: ""

resources:
  agent:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  feedback:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
