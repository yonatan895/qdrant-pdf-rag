# Jaeger Badger PVC (issue #83). Single-node RWO block volume; NFS refused
# by shell preflight and schema. 10Gi, 14-day span TTL in the config.
{{- if .Values.tracing.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-badger
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app: jaeger
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: 10Gi
{{- end }}
