{{/*
Metrics collector (issue #956, ADR-0006). Stateless: no PVC, no Service (it
serves nothing; its own telemetry is off). Same hardening as the other pods:
non-root, no fixed IDs, drop ALL, read-only root, seccomp RuntimeDefault.
*/}}
{{- if include "mainframe-rag.otelcolEnabled" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcol
  namespace: {{ .Release.Namespace }}
  labels:
    app: otelcol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otelcol
  template:
    metadata:
      labels:
        app: otelcol
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.pullSecret.name }}
      imagePullSecrets:
        - name: {{ .Values.pullSecret.name }}
      {{- else }}
      imagePullSecrets: []
      {{- end }}
      containers:
        - name: otelcol
          image: {{ include "mainframe-rag.otelcolImage" . }}
          imagePullPolicy: {{ .Values.images.otelcol.pullPolicy | default "IfNotPresent" }}
          args: ["--config", "/etc/otelcol-contrib/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: O2_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "mainframe-rag.openobserveSecretName" . }}
                  key: metrics-auth
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: otelcol-config
        - name: tmp
          emptyDir: {}
{{- end }}
