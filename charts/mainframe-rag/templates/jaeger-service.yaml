# Jaeger Service (issue #83). ClusterIP only. 4318 is OTLP/HTTP (the agent's
# only exporter transport); 16686 is the UI for port-forward; an optional OTLP
# gRPC intake follows tracing.jaeger.otlpGrpcPort (issue #744). No Route, ever.
{{- if include "mainframe-rag.jaegerEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    app: jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    {{- with include "mainframe-rag.jaegerOtlpGrpcPort" . }}
    - name: otlp-grpc
      port: {{ . }}
      targetPort: otlp-grpc
    {{- end }}
    - name: ui
      port: 16686
      targetPort: ui
{{- end }}
