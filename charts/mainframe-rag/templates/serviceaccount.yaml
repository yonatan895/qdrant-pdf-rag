# ServiceAccount for the oauth-proxy (ADR-0004, issue #373).
# Rendered only when route.enabled is true (ClusterIP-only installs have no
# external ingress identity). The redirect reference derives the OAuth
# callback from the Route without any hostname in git.
{{- if .Values.route.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-agent
  namespace: {{ .Release.Namespace }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"rag-agent"}}
{{- end }}
