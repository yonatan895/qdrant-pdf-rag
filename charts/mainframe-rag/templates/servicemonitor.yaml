# ServiceMonitor for UWM scrapes of the agent /metrics (issue #187).
# Rendered only when metrics.enabled is true. Selector + port name must track
# the agent Service (rag-agent, port http). ClusterIP only; no Route, ever.
{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rag-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: rag-agent
spec:
  selector:
    matchLabels:
      app: rag-agent
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
{{- end }}
