{{- if .Values.networkPolicy.enabled }}
# Ingress NetworkPolicy for the agent pods (issue #373). Agent-only and
# ingress-only: Qdrant, OpenObserve and the ingest Job are not selected and egress
# is untouched. Rendered unless networkPolicy.enabled is false. The pod
# selector, ports and peers track the Deployment (app: rag-agent), the Service
# ports (http 8080, oauth 8443) and the ServiceMonitor. Kubelet probes and the
# oauth-proxy -> 127.0.0.1:8080 hop are not pod-network ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rag-agent-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: rag-agent
spec:
  podSelector:
    matchLabels:
      app: rag-agent
  policyTypes:
    - Ingress
  ingress:
    # Same-namespace pods (ingest, debug pods, the agent replicas).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        {{- if .Values.route.enabled }}
        - protocol: TCP
          port: 8443
        {{- end }}
    {{- if .Values.route.enabled }}
    # The OpenShift router reaches only the OAuth port (the Route targets it).
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8443
    {{- end }}
    {{- if .Values.metrics.enabled }}
    # Monitoring scrapes /metrics on 8080 (ServiceMonitor or a platform-owned
    # scrape): the policy-group label OR the user-workload namespace by name.
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- with .Values.networkPolicy.allowedNamespaces }}
    # Operator-listed namespaces may reach the HTTP port only.
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
{{- end }}
