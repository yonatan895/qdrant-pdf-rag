# Agent Deployment with optional OAuth sidecar when route.enabled.
# Protected defaults (selectors, ports, probes, read-only Qdrant key,
# UI_ENABLED=true, oauth args/ports/volumes, resource defaults) stay here (D5).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mainframe-rag.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mainframe-rag.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mainframe-rag.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.route.enabled }}
      serviceAccountName: rag-agent
      {{- end }}
      {{- if .Values.pullSecret.name }}
      imagePullSecrets:
        - name: {{ .Values.pullSecret.name }}
      {{- else }}
      imagePullSecrets: []
      {{- end }}
      containers:
        - name: agent
          image: {{ include "mainframe-rag.agentImage" . }}
          imagePullPolicy: {{ .Values.images.agent.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: QDRANT_URL
              value: {{ include "mainframe-rag.qdrantUrl" . | quote }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  key: read-only-api-key
                  name: {{ include "mainframe-rag.qdrantSecretName" . }}
            - name: EMBED_BASE_URL
              value: {{ .Values.models.embedding.baseUrl | quote }}
            - name: EMBED_MODEL
              value: {{ .Values.models.embedding.model | quote }}
            - name: DENSE_DIM
              value: {{ .Values.models.embedding.dimension | quote }}
            - name: EMBED_MODEL_REVISION
              value: {{ .Values.models.embedding.revision | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.models.reasoning.baseUrl | quote }}
            - name: LLM_MODEL_REASONING
              value: {{ .Values.models.reasoning.model | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "mainframe-rag.otelEndpoint" . | quote }}
            - name: IMAGE_SHA
              value: {{ .Values.images.agent.tag | quote }}
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.tracing.deploymentEnvironment | quote }}
            {{- if .Values.tracing.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.tracing.serviceName | quote }}
            {{- end }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | toString | quote }}
            - name: CHAT_CONDENSE_ENABLED
              value: {{ .Values.models.reasoning.condenseEnabled | toString | quote }}
            - name: UI_ENABLED
              value: "true"
            - name: RERANK_ENABLED
              value: {{ .Values.models.rerank.enabled | toString | quote }}
            - name: RERANK_BASE_URL
              value: {{ .Values.models.rerank.baseUrl | quote }}
            - name: RERANK_MODEL
              value: {{ .Values.models.rerank.model | quote }}
            - name: RERANK_ENDPOINT_ORDER
              value: {{ .Values.models.rerank.endpointOrder | quote }}
            {{- if .Values.gateway.apiKeySecretName }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  key: llm-api-key
                  name: {{ .Values.gateway.apiKeySecretName }}
            - name: EMBED_API_KEY
              valueFrom:
                secretKeyRef:
                  key: embed-api-key
                  name: {{ .Values.gateway.apiKeySecretName }}
            - name: RERANK_API_KEY
              valueFrom:
                secretKeyRef:
                  key: rerank-api-key
                  name: {{ .Values.gateway.apiKeySecretName }}
            {{- end }}
            {{- if .Values.gateway.caConfigMapName }}
            - name: SSL_CERT_FILE
              value: /etc/gateway-ca/ca-bundle.crt
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.agent | nindent 12 }}
          {{- if .Values.gateway.caConfigMapName }}
          volumeMounts:
            - name: gateway-ca
              mountPath: /etc/gateway-ca
              readOnly: true
          {{- end }}
        {{- if .Values.route.enabled }}
        - name: oauth-proxy
          image: {{ include "mainframe-rag.oauthProxyImage" . }}
          imagePullPolicy: IfNotPresent
          args:
            - --provider=openshift
            - --https-address=:8443
            - --upstream=http://127.0.0.1:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/oauth/cookie-secret
            - --email-domain=*
            - --openshift-service-account=rag-agent
            - --skip-auth-regex=^/healthz.*$
          ports:
            - name: oauth
              containerPort: 8443
          volumeMounts:
            - name: oauth-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: oauth-cookie
              mountPath: /etc/oauth
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        {{- end }}
      {{- if or .Values.gateway.caConfigMapName .Values.route.enabled }}
      volumes:
        {{- if .Values.gateway.caConfigMapName }}
        - name: gateway-ca
          configMap:
            name: {{ .Values.gateway.caConfigMapName }}
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
        {{- end }}
        {{- if .Values.route.enabled }}
        - name: oauth-tls
          secret:
            secretName: rag-agent-tls
        - name: oauth-cookie
          secret:
            secretName: rag-agent-oauth-cookie
        {{- end }}
      {{- end }}
