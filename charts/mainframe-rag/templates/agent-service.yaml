# Agent Service (HTTP Service plus the
# openshift-ui oauth port when route.enabled).
# ClusterIP only; no Route for Qdrant, ever. Selector and port names must
# track the Deployment and the ServiceMonitor.
apiVersion: v1
kind: Service
metadata:
  name: rag-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mainframe-rag.labels" . | nindent 4 }}
  {{- if .Values.route.enabled }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: rag-agent-tls
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "mainframe-rag.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.route.enabled }}
    - name: oauth
      port: 8443
      targetPort: oauth
    {{- end }}
    - name: http
      port: 8080
      targetPort: http
