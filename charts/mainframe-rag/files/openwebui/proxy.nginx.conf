# Open WebUI allow-list proxy (ADR-0007 E1, #1074). One listener, TLS from the
# service-serving certificate, in front of Open WebUI on 127.0.0.1:8080 in the
# same pod. Maintainer decision 2026-10-24: v0.12.3 disables some features in
# the UI only, so every path the Docs pilot does not need is refused here with
# a fixed 403 before it reaches the app.
#
# The decision is made on $uri, nginx's DECODED and NORMALISED path (percent
# escapes decoded, dot segments resolved, slashes merged), which is what
# uvicorn routes on, so /api/v1/%66iles/ and /api/v1%2Ffiles/ are refused like
# /api/v1/files/. The request line is forwarded as the client sent it
# (proxy_pass has no URI part and nothing rewrites): nginx and uvicorn decide on
# the same path. Re-audit this list on every Open WebUI import (ADR-0007 P1,
# docs/deploy.md); a path the UI starts needing is added deliberately.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;
    merge_slashes on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Allow-list. Anything not matched is denied (default 0).
    map $uri $owui_allowed {
        default 0;
        # Single-page app shell and client routes (the API calls behind them
        # are checked below).
        ~^/$ 1;
        ~^/(c|auth|admin)(/|$) 1;
        ~^/(_app|static|themes)/ 1;
        ~^/(favicon\.png|favicon\.ico|manifest\.json|opensearch\.xml|robots\.txt)$ 1;
        # Health and sign-in.
        ~^/health(/db)?$ 1;
        ~^/oauth(/|$) 1;
        ~^/ws/socket\.io(/|$) 1;
        # Chat: config, models, the Pipe's completions, task stop.
        ~^/api/(config|version)$ 1;
        ~^/api/models(/|$) 1;
        ~^/api/chat/(completions|completed)$ 1;
        ~^/api/tasks(/|$) 1;
        # Account, history and admin (users, groups, models, the Pipe installer).
        ~^/api/v1/(auths|chats|users|models|groups|functions)(/|$) 1;
        ~^/api/v1/configs/banners$ 1;
        ~^/api/v1/(tools|prompts)/?$ 1;
    }

    map $http_upgrade $owui_connection {
        default upgrade;
        "" "";
    }

    upstream owui_upstream {
        server 127.0.0.1:8080;
        keepalive 8;
    }

    server {
        listen 8443 ssl;
        ssl_certificate /etc/tls/private/tls.crt;
        ssl_certificate_key /etc/tls/private/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1m;

        location / {
            if ($owui_allowed = 0) {
                return 403 "denied\n";
            }
            proxy_pass http://owui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $owui_connection;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
